<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi Lector">
<meta name="theme-color" content="#faf6f0">
<script src="sync.js"></script>
<title>読書 · Mi Lector</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --papel:#faf6f0; --tinta:#2b2622; --suave:#8a7f76; --linea:#e8dfd3;
  --acento:#b5523b; --acento2:#f6e4dd; --card:#ffffff;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --rbg:#ffffff; --rfg:#222222; --rline:rgba(0,0,0,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--papel);color:var(--tinta);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
body.reading{overflow:hidden}
.mincho{font-family:"Hiragino Mincho ProN","Yu Mincho","Iowan Old Style",Georgia,serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}

/* ---------- Cabecera ---------- */
header.top{position:sticky;top:0;z-index:5;background:rgba(250,246,240,.93);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:calc(var(--st) + 10px) 18px 10px;border-bottom:1px solid var(--linea)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.back{color:var(--acento);text-decoration:none;font-weight:600;font-size:15px;padding:6px 0}
h1{margin:6px 0 2px;font-size:22px;font-weight:600;display:flex;align-items:baseline;gap:10px}
h1 .kanji{font-size:32px;color:var(--acento);letter-spacing:2px}
h1 small{font-size:13px;color:var(--suave);font-weight:400;font-family:-apple-system,"Hiragino Sans",sans-serif}
.btn{border:0;background:var(--acento);color:#fff;border-radius:12px;padding:10px 15px;font-size:15px;font-weight:600;min-height:42px}
.btn.ghost{background:var(--card);color:var(--tinta);border:1px solid var(--linea)}
.btn.danger{color:#b3261e;border-color:#f0c9c5}
.btn.small{padding:7px 11px;min-height:36px;font-size:14px}
.btn:active{transform:scale(.97)}
.tabs,.chips{display:flex;gap:8px;overflow-x:auto;padding-top:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar,.chips::-webkit-scrollbar,.cont::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;border:1px solid var(--linea);background:var(--card);border-radius:999px;padding:8px 14px;font-size:14px;min-height:38px}
.tab.on{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.tab .cnt{opacity:.55;font-size:12px;margin-left:3px}
.chip{white-space:nowrap;border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--suave)}
.chip.on{background:var(--acento2);color:var(--acento);font-weight:600}
.tools{display:flex;gap:8px;margin-top:10px}
.search,select.sort{border:1px solid var(--linea);background:var(--card);border-radius:12px;padding:9px 12px;font-size:15px;min-height:40px}
.search{flex:1;min-width:0}
select.sort{max-width:42%}

/* ---------- Biblioteca ---------- */
main{padding:16px 18px calc(var(--sb) + 30px);max-width:1200px;margin:0 auto}
h2{font-size:15px;font-weight:600;color:var(--suave);margin:4px 0 12px;letter-spacing:.3px}
.cont{display:flex;gap:16px;overflow-x:auto;padding-bottom:12px;margin-bottom:12px;border-bottom:1px dashed var(--linea)}
.cont .card{width:112px;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:20px 16px}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:26px 22px}.cont .card{width:130px}}
.card{position:relative;cursor:pointer;min-width:0}
.cover{aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:#eee;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.08),0 8px 22px rgba(70,45,25,.10);transition:transform .15s}
.card:active .cover{transform:scale(.97)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.gen{width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:14px 12px 32px;color:#fff}
.gen b{font-size:15px;line-height:1.25;font-weight:600;word-break:break-word;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.gen span{font-size:11px;opacity:.85}
.gen .ic{font-size:26px}
.badge{position:absolute;left:7px;bottom:7px;background:rgba(255,255,255,.92);color:#333;border-radius:7px;font-size:10px;padding:3px 6px;font-weight:700;letter-spacing:.4px}
.more{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.92);font-size:18px;line-height:1;color:#333;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.card.lejos .cover > img,.card.lejos .cover > .gen{opacity:.45;filter:grayscale(.4)}
.far{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);z-index:2;background:rgba(255,255,255,.95);color:#333;padding:6px 8px;border-radius:9px;font-size:11px;font-weight:700;text-align:center;line-height:1.25;width:86%;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.done{position:absolute;top:7px;left:7px;background:#3f7d58;color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.bar{height:4px;background:var(--linea);border-radius:4px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acento);border-radius:4px}
.t{font-weight:600;font-size:14px;margin-top:6px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.a{font-size:12px;color:var(--suave);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;color:var(--suave);padding:50px 20px;line-height:1.6}
.empty .big{font-size:54px;color:var(--acento);display:block;margin-bottom:6px}
footer{margin-top:40px;font-size:12px;color:var(--suave);text-align:center;line-height:1.6}
.drop{position:fixed;inset:0;z-index:90;background:rgba(181,82,59,.12);border:3px dashed var(--acento);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--acento);font-weight:600;pointer-events:none}

/* ---------- Hojas / ventanas ---------- */
.sheet{position:fixed;inset:0;z-index:80;background:rgba(30,20,15,.35);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--card);color:var(--tinta);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 20px calc(var(--sb) + 20px);box-shadow:0 -10px 40px rgba(0,0,0,.15);animation:up .22s ease}
@media(min-width:700px){.sheet{align-items:center}.panel{border-radius:20px;padding-bottom:20px}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.panel h3{margin:0 0 14px;font-size:18px}
.panel label{display:block;font-size:13px;color:var(--suave);margin:12px 0 4px}
.panel input:not([type=range]),.panel select,.panel textarea{width:100%;border:1px solid var(--linea);border-radius:12px;padding:10px 12px;font-size:16px;background:#fff;color:var(--tinta);margin-top:4px}
.panel textarea{min-height:120px;resize:vertical;line-height:1.45}
.lbl{font-size:13px;color:var(--suave);margin:14px 0 6px}
.seg{display:flex;background:#f1ebe3;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 6px;font-size:14px;min-height:38px}
.seg button.on{background:#fff;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.opt{display:flex;align-items:center;gap:14px;width:100%;border:1px solid var(--linea);background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;text-align:left}
.opt .e{font-size:26px}
.opt b{display:block;font-size:15px}
.opt span{font-size:13px;color:var(--suave)}
.actions{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.info{font-size:12px;color:var(--suave);margin-top:12px;line-height:1.5}
.swatches{display:flex;gap:10px}
.sw{flex:1;border:2px solid transparent;border-radius:12px;padding:12px 6px;font-size:14px;min-height:48px}
.sw.on{border-color:var(--acento)}
.step{display:flex;align-items:center;gap:8px}
.step button{width:46px;height:40px;border:1px solid var(--linea);background:#fff;border-radius:10px;font-size:16px}
.step output{flex:1;text-align:center;font-weight:600}
.toc a{display:block;padding:11px 4px;border-bottom:1px solid var(--linea);color:var(--tinta);text-decoration:none;font-size:15px}
.toc a.on{color:var(--acento);font-weight:600}
.toc a small{float:right;color:var(--suave)}
.ptabs{display:flex;gap:6px;margin-bottom:14px}
.ptabs button{flex:1;border:1px solid var(--linea);background:#fff;border-radius:10px;padding:9px 4px;font-size:14px}
.ptabs button.on{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.hl{border-left:4px solid #ffd84d;padding:8px 10px;margin:0 0 10px;background:#fbf8f3;border-radius:0 10px 10px 0;cursor:pointer}
.hl q{display:block;font-family:"Iowan Old Style","Hiragino Mincho ProN",Georgia,serif;font-size:15px;line-height:1.4;quotes:"“" "”";display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.hl .nt{font-size:13px;margin-top:6px;color:#5b4636;white-space:pre-wrap}
.hl .mt{font-size:11px;color:var(--suave);margin-top:6px;display:flex;gap:8px;align-items:center}
.hl .mt button{border:0;background:transparent;font-size:15px;padding:2px 4px}
.dots{display:flex;gap:10px;margin:6px 0}
.dot{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--linea)}
.dot.on{box-shadow:0 0 0 2px var(--tinta)}

/* ---------- Lector ---------- */
#reader{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;background:var(--rbg);color:var(--rfg)}
#reader.open{display:flex}
.rbar{display:flex;align-items:center;gap:2px;padding:calc(var(--st) + 4px) 6px 4px;transition:opacity .25s;border-bottom:1px solid var(--rline)}
.rbar.bottom{border-bottom:0;border-top:1px solid var(--rline);padding:6px 12px calc(var(--sb) + 8px);gap:10px}
#reader.hide .rbar{opacity:0;pointer-events:none}
.ib{min-width:40px;height:42px;border:0;background:transparent;color:inherit;font-size:19px;border-radius:10px;padding:0 7px}
.ib:active,.ib.on{background:var(--rline)}
.ib.off{opacity:.35}
.rtitle{flex:1;min-width:0;text-align:center;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.8}
#stage{flex:1;position:relative;display:flex;min-height:0}
.gutter{width:28px;flex:none;border:0;background:transparent;color:inherit;opacity:.28;font-size:22px;padding:0}
.gutter:active{opacity:.7}
#viewer{flex:1;min-width:0;position:relative}
#epubBox{position:absolute;inset:0}
#pages{position:absolute;inset:0;overflow:auto;display:flex;-webkit-overflow-scrolling:touch;touch-action:pan-y pinch-zoom}
#pages.zoomed{touch-action:auto}
.spread{margin:auto;display:flex;padding:8px 0}
.col{margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:12px;padding:10px 0 40vh}
.pgw{position:relative;flex:none;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.15)}
.pgw .pg{display:block;width:100%;height:100%}
.ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#reader.drawing .ink{pointer-events:auto;cursor:crosshair}
#reader.drawing.dedo .ink{touch-action:none}
/* Leer en voz alta */
#ttsBar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:5;background:#2b2622;color:#fff;border-radius:18px;padding:10px 8px 6px;width:min(580px,calc(100% - 16px));box-shadow:0 8px 26px rgba(0,0,0,.3)}
#ttsCap{font-size:13px;opacity:.9;line-height:1.35;max-height:2.8em;overflow:hidden;padding:0 8px 8px;text-align:center;font-family:"Iowan Old Style","Hiragino Mincho ProN",Georgia,serif}
#ttsBar .tr{display:flex;justify-content:center;align-items:center;gap:2px;flex-wrap:wrap}
#ttsBar button{border:0;background:transparent;color:#fff;border-radius:11px;min-width:42px;height:40px;font-size:18px;padding:0 9px}
#ttsBar button.txt{font-size:13px;font-weight:600}
#ttsBar button.big{background:var(--acento);min-width:54px;font-size:20px}
#ttsBar button.on{background:rgba(255,255,255,.18)}
#reader.tts #selBar{bottom:112px}
.tts-on{background:rgba(181,82,59,.10)!important;border-radius:6px}
::highlight(tts){background-color:rgba(255,216,77,.6);color:inherit}
.vlist button{display:flex;width:100%;justify-content:space-between;align-items:center;border:1px solid var(--linea);background:#fff;border-radius:12px;padding:11px 12px;margin-bottom:8px;font-size:15px;text-align:left}
.vlist button.on{border-color:var(--acento);box-shadow:0 0 0 1px var(--acento)}
.vlist small{color:var(--suave);font-size:12px}
#reader.t-noche canvas.pg{filter:invert(.9) hue-rotate(180deg)}
#reader.t-sepia canvas.pg{filter:sepia(.35) brightness(.97)}
#reader.t-noche .pgw{box-shadow:none;background:#222}
input[type=range]{flex:1;accent-color:var(--acento);min-width:0}
#rLabel{font-size:12px;opacity:.7;white-space:nowrap;max-width:50%;overflow:hidden;text-overflow:ellipsis}
#rAuto{font-size:15px;min-width:auto;padding:0 10px;height:36px;border-radius:18px;border:1px solid var(--rline);white-space:nowrap}
#rAuto.on{background:var(--acento);color:#fff;border-color:var(--acento)}

/* Barras flotantes: selección y dibujo */
.fbar{position:absolute;left:50%;transform:translateX(-50%);z-index:4;background:#2b2622;color:#fff;border-radius:16px;padding:6px;display:flex;align-items:center;gap:4px;box-shadow:0 8px 26px rgba(0,0,0,.28);max-width:calc(100% - 16px);overflow-x:auto;scrollbar-width:none}
.fbar::-webkit-scrollbar{display:none}
#selBar{bottom:12px}
#drawBar{top:8px;flex-wrap:nowrap}
.fbar button{border:0;background:transparent;color:#fff;border-radius:11px;min-width:40px;height:40px;font-size:18px;padding:0 8px;flex:none;white-space:nowrap}
.fbar button.on{background:rgba(255,255,255,.18)}
.fbar .txt{font-size:13px;font-weight:600}
.fbar .c{width:30px;min-width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.85);padding:0;margin:0 2px}
.fbar .c.on{box-shadow:0 0 0 3px rgba(255,255,255,.45)}
.fbar .sep{width:1px;height:26px;background:rgba(255,255,255,.2);flex:none;margin:0 3px}
.fbar .w{display:flex;align-items:center;justify-content:center}
.fbar .w i{display:block;background:#fff;border-radius:50%}

/* ---------- Artículos ---------- */
#artBox{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;--fs:1;--lh:1.6;--ff:"Iowan Old Style","Hiragino Mincho ProN",Georgia,serif}
.art{max-width:720px;margin:0 auto;padding:26px 22px 45vh;font-family:var(--ff);font-size:calc(19px * var(--fs));line-height:var(--lh);word-wrap:break-word;-webkit-user-select:text;user-select:text}
.art h1.at{font-size:1.55em;line-height:1.2;margin:0 0 .4em}
.art .am{font-family:-apple-system,"Hiragino Sans",sans-serif;font-size:13px;opacity:.65;margin-bottom:1.6em;line-height:1.5}
.art .am a{color:inherit}
.art a{color:var(--rlink,#2a5db0)}
.art img{max-width:100%;height:auto;border-radius:8px;display:block;margin:0 auto}
.art figure{margin:1.4em 0}
.art figcaption{font-family:-apple-system,sans-serif;font-size:12px;opacity:.65;margin-top:6px;line-height:1.4}
.art blockquote{margin:1.2em 0;padding:.2em 1em;border-left:3px solid var(--acento);opacity:.9}
.art h2,.art h3{line-height:1.25;margin:1.5em 0 .5em}
.art table{border-collapse:collapse;font-size:.85em}.art td,.art th{border:1px solid var(--rline);padding:4px 6px}
#reader.t-noche .art img{opacity:.85}
mark.mi-hl{color:inherit;border-radius:3px;padding:0 1px;cursor:pointer}
.srcs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.src{border:1px solid var(--linea);background:var(--card);border-radius:12px;padding:9px 13px;font-size:14px;font-weight:600}
.src.add{color:var(--acento);font-weight:600}
.news a{display:flex;gap:10px;align-items:flex-start;padding:12px 2px;border-bottom:1px solid var(--linea);color:var(--tinta);text-decoration:none;font-size:15px;line-height:1.35}
.news a span{flex:1}
.news a b{flex:none;font-size:18px}
.news a.saved{opacity:.5}
code.bm{display:block;background:#f4efe8;border-radius:10px;padding:10px;font-size:11px;word-break:break-all;max-height:110px;overflow:auto;margin-top:8px}
ol.steps{padding-left:20px;line-height:1.55;font-size:14px}

/* ---------- Avisos ---------- */
#toasts{position:fixed;left:50%;bottom:calc(var(--sb) + 76px);transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:92vw}
.toast{background:#2b2622;color:#fff;border-radius:14px;padding:11px 16px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;gap:12px;align-items:center;animation:up .2s}
.toast button{border:0;background:var(--acento);color:#fff;border-radius:9px;padding:7px 10px;font-size:13px;font-weight:600}
#busy{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;background:rgba(250,246,240,.4)}
#busy div{background:#2b2622;color:#fff;border-radius:14px;padding:14px 20px;font-size:15px;display:flex;gap:10px;align-items:center}
#busy i{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header class="top">
  <div class="row">
    <a class="back" href="index.html">‹ Mi Agenda</a>
    <span class="sp"></span>
    <button class="btn" id="addBtn">＋ Añadir</button>
  </div>
  <h1 class="mincho"><span class="kanji">読書</span><span>Mi Lector <small>どくしょ</small></span></h1>
  <div class="tabs" id="tabs"></div>
  <div class="tools">
    <input id="q" class="search" type="search" placeholder="🔍 Buscar título o autor…" autocomplete="off">
    <select id="sort" class="sort">
      <option value="recientes">Recientes</option>
      <option value="titulo">Título A–Z</option>
      <option value="autor">Autor A–Z</option>
      <option value="progreso">Progreso</option>
    </select>
  </div>
  <div class="chips" id="states"></div>
</header>

<main>
  <section id="srcWrap" hidden>
    <h2>🗞️ Mis periódicos <span style="font-weight:400">· toca uno para ver sus titulares</span></h2>
    <div class="srcs" id="srcs"></div>
  </section>
  <section id="contWrap" hidden>
    <h2>📖 Seguir leyendo</h2>
    <div class="cont" id="cont"></div>
  </section>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden></div>
  <footer id="foot"></footer>
</main>

<!-- Lector -->
<div id="reader" aria-hidden="true">
  <div class="rbar">
    <button class="ib" id="rClose" aria-label="Volver a la biblioteca">‹ 書棚</button>
    <div class="rtitle" id="rTitle"></div>
    <button class="ib" id="rDraw" aria-label="Escribir con el lápiz" title="Escribir encima">✏️</button>
    <button class="ib off" id="rMark" aria-label="Marcador" title="Marcador">🔖</button>
    <button class="ib" id="rTts" aria-label="Escuchar" title="Leer en voz alta">🎧</button>
    <button class="ib" id="rToc" aria-label="Índice y subrayados" title="Índice, subrayados y marcadores">☰</button>
    <button class="ib" id="rSet" aria-label="Ajustes de lectura">Aa</button>
  </div>
  <div id="stage">
    <button class="gutter" id="gL" aria-label="Página anterior">‹</button>
    <div id="viewer">
      <div id="epubBox"></div>
      <div id="pages" hidden></div>
      <div id="artBox" hidden></div>
    </div>
    <button class="gutter" id="gR" aria-label="Página siguiente">›</button>
    <div class="fbar" id="selBar" hidden></div>
    <div class="fbar" id="drawBar" hidden></div>

/* =========================================================
   読書 Mi Lector

   Apple Pencil, marcadores, lectura automática y Mi Libreta.

const SHELVES = {

  apuntes:  {n:'Apuntes',  i:'📝'},
  revistas: {n:'Revistas', i:'🗞️'},

const KIND = {epub:'EPUB', pdf:'PDF', images:'IMÁGENES', link:'ENLACE', article:'ARTÍCULO'};

  {n:'La Dépêche', u:'https://www.ladepeche.fr/'},

};

/* Colores del subrayador (EPUB): relleno y tinta para Mi Libreta */

/* ---------- Ajustes guardados ---------- */

function store(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

});

/* ---------- Bases de datos (IndexedDB) ----------
   · «lector-datos»: lo que se sincroniza entre el iPad y el iPhone (sync.js):
       fichas de los libros, progreso, subrayados, notas, marcadores, dibujos y artículos.
   · «__lector-archivos»: los archivos pesados (EPUB, PDF, fotos). Se quedan en cada aparato
       (sync.js no toca las bases que empiezan por «__»).                                    */
const FF = String.fromCharCode(0xffff);
const sleep = ms => new Promise(r => setTimeout(r, ms));
let fileIds = new Set();
const DB = {
  db: null, fdb: null,
  async open(){
    this.db = await openIDB('lector-datos', 1, d => {
      if (!d.objectStoreNames.contains('items')) d.createObjectStore('items', {keyPath:'id'});
      if (!d.objectStoreNames.contains('ink')) d.createObjectStore('ink');
      if (!d.objectStoreNames.contains('art')) d.createObjectStore('art');
    });
    this.fdb = await openIDB('__lector-archivos', 1, d => {
      if (!d.objectStoreNames.contains('files')) d.createObjectStore('files');
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta');
    });
  },
  /* Mientras la sincronización aplica cambios, escribir da error: se reintenta */
  async tx(db, store, mode, fn){
    for (let i = 0; ; i++){
      try{ return await idbDo(db, store, mode, fn); }
      catch(e){ if (mode === 'readwrite' && i < 10 && (!e || e.name === 'AbortError' || /Sincronizando/.test(e.message || ''))){ await sleep(1200); continue; } throw e; }
    }
  },
  all(){ return this.tx(this.db, 'items', 'readonly', s => s.getAll()); },
  put(it){ return this.tx(this.db, 'items', 'readwrite', s => s.put(it)); },
  getArt(id){ return this.tx(this.db, 'art', 'readonly', s => s.get(id)); },
  putArt(id, html){ return this.tx(this.db, 'art', 'readwrite', s => s.put(html, id)); },
  async putFile(id, data){
    if (typeof data === 'string') return this.putArt(id, data);
    await this.tx(this.fdb, 'files', 'readwrite', s => s.put(data, id));
    fileIds.add(id);
  },
  getFile(id){ return this.tx(this.fdb, 'files', 'readonly', s => s.get(id)); },
  fileKeys(){ return this.tx(this.fdb, 'files', 'readonly', s => s.getAllKeys()); },
  getMeta(k){ return this.tx(this.fdb, 'meta', 'readonly', s => s.get(k)); },
  putMeta(k, v){ return this.tx(this.fdb, 'meta', 'readwrite', s => s.put(v, k)); },
  getInk(k){ return this.tx(this.db, 'ink', 'readonly', s => s.get(k)); },
  putInk(k, v){ return this.tx(this.db, 'ink', 'readwrite', s => (v && v.length) ? s.put(v, k) : s.delete(k)); },
  inkKeys(id){ return this.tx(this.db, 'ink', 'readonly', s => s.getAllKeys(IDBKeyRange.bound(id + ':', id + ':' + FF))); },
  async delFile(id){ await this.tx(this.fdb, 'files', 'readwrite', s => s.delete(id)); fileIds.delete(id); },
  async del(id){
    await this.tx(this.db, 'items', 'readwrite', s => s.delete(id));
    await this.tx(this.db, 'art', 'readwrite', s => s.delete(id));
    await this.tx(this.db, 'ink', 'readwrite', s => s.delete(IDBKeyRange.bound(id + ':', id + ':' + FF)));
    await this.delFile(id);
  }
};
const needsFile = it => it && (it.type === 'epub' || it.type === 'pdf' || it.type === 'images');
const isAway = it => needsFile(it) && !fileIds.has(it.id);

/* Mudanza desde la versión anterior («mi-lector», que guardaba todo junto).
   No se borra nada hasta que, en una visita posterior, se comprueba que todo está en su sitio nuevo. */
async function migrateOld(){
  try{
    if (indexedDB.databases){ const n = (await indexedDB.databases()).map(d => d.name); if (!n.includes('mi-lector')) return; }
  }catch(e){}
  const old = await new Promise(res => {
    let created = false;
    const r = indexedDB.open('mi-lector');
    r.onupgradeneeded = () => { created = true; try{ r.transaction.abort(); }catch(e){} };
    r.onsuccess = () => { if (created){ r.result.close(); res(null); } else res(r.result); };
    r.onerror = e => { try{ e.preventDefault(); }catch(x){} res(null); };
    r.onblocked = () => res(null);
  });
  if (!old) return;
  let added = 0, ok = true, oItems = [];
  try{
    const has = n => old.objectStoreNames.contains(n);
    oItems = has('items') ? await idbDo(old, 'items', 'readonly', s => s.getAll()) : [];
    const have = new Set(items.map(i => i.id));
    for (const it of oItems){
      try{
        if (!have.has(it.id)){ await DB.put(it); items.push(it); have.add(it.id); added++; }
        if (has('files')){
          const data = await idbDo(old, 'files', 'readonly', s => s.get(it.id));
          if (typeof data === 'string'){ if (!(await DB.getArt(it.id))) await DB.putArt(it.id, data); }
          else if (data && !fileIds.has(it.id)) await DB.putFile(it.id, data);
        }
      }catch(e){ ok = false; console.warn(e); }
    }
    if (has('ink')){
      const keys = await idbDo(old, 'ink', 'readonly', s => s.getAllKeys());
      for (const k of keys){
        try{ if (!(await DB.getInk(k))){ const v = await idbDo(old, 'ink', 'readonly', s => s.get(k)); if (v && v.length) await DB.putInk(k, v); } }
        catch(e){ ok = false; }
      }
    }
  }catch(e){ ok = false; console.warn(e); }
  try{ old.close(); }catch(e){}
  if (added) render();
  // ¿Se puede borrar ya la base antigua? Solo si una mudanza anterior ya terminó y todo sigue aquí
  try{
    const prev = await DB.getMeta('mudanza');
    const now = new Set(((await DB.all()) || []).map(i => i.id));
    const complete = ok && oItems.every(i => now.has(i.id));
    if (complete && prev && Date.now() - prev > 60000) indexedDB.deleteDatabase('mi-lector');
    else if (complete && !prev) await DB.putMeta('mudanza', Date.now());
  }catch(e){}
}

let items = [];

/* ---------- Avisos ---------- */
function toast(msg, action){
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span>${esc(msg)}</span>`;
  if (action){
    const b = document.createElement('button');
    b.textContent = action.label;
    b.onclick = () => { action.fn(); el.remove(); };
    el.appendChild(b);
  }
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), action ? 7000 : 3200);
}
function busy(txt){ $('#busyTxt').textContent = txt || 'Un momento…'; $('#busy').hidden = false; }
function unbusy(){ $('#busy').hidden = true; }

/* ---------- Hoja (ventana inferior) ---------- */
function sheet(html){

  s.hidden = false;
  return s.firstElementChild;
}
function closeSheet(){ $('#sheet').hidden = true; $('#sheet').innerHTML = ''; }

});

/* ---------- Biblioteca ---------- */
function count(k){ return k === 'todo' ? items.length : items.filter(i => i.shelf === k).length; }

function genCover(it){
  let h = 0; for (const ch of it.title || '') h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const c = COLORS[h % COLORS.length];
  return `<div class="gen mincho" style="background:linear-gradient(160deg,${c},${c}cc)">
    <span class="ic">${SHELVES[it.shelf]?.i || '📖'}</span>
    <b>${esc(it.title)}</b>
    <span>${esc(it.author || (it.url ? hostOf(it.url) : ''))}</span></div>`;
}
function hostOf(u){ try{ return new URL(u).hostname.replace(/^www\./, ''); }catch(e){ return ''; } }

function cardHTML(it){
  const pct = Math.round((it.progress || 0) * 100);
  const nh = (it.hl || []).length + Object.keys(it.pnotes || {}).length;
  const sub = [esc(it.author || (it.url ? hostOf(it.url) : '')), pct ? pct + '%' : '', nh ? '🖍️ ' + nh : ''].filter(Boolean).join(' · ');
  const away = isAway(it);
  return `<div class="card${away ? ' lejos' : ''}" data-id="${it.id}">
    <div class="cover">${away ? '<span class="far">📲 En tu otro aparato</span>' : ''}
      ${it.cover ? `<img src="${esc(it.cover)}" alt="" loading="lazy" onerror="this.remove()">` : genCover(it)}
      ${it.state === 'terminado' ? '<span class="done">✓</span>' : ''}
      <span class="badge">${KIND[it.type]}</span>
      <button class="more" data-more="${it.id}" aria-label="Opciones">⋯</button>
    </div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="t">${esc(it.title)}</div>
    <div class="a">${sub || '&nbsp;'}</div>
  </div>`;
}

function render(){
  store('lector-vista', {tab:view.tab, state:view.state, sort:view.sort});
  const tabs = [['todo', '✦ Todo'], ...Object.entries(SHELVES).map(([k, v]) => [k, `${v.i} ${v.n}`])];
  $('#tabs').innerHTML = tabs.map(([k, n]) =>
    `<button class="tab ${view.tab === k ? 'on' : ''}" data-tab="${k}">${n}<span class="cnt">${count(k)}</span></button>`).join('');
  $('#states').innerHTML = [['todos', 'Todos'], ...Object.entries(STATES)].map(([k, n]) =>
    `<button class="chip ${view.state === k ? 'on' : ''}" data-state="${k}">${n}</button>`).join('');
  $('#sort').value = view.sort;

  const q = norm(view.q);
  let list = items.filter(i =>
    (view.tab === 'todo' || i.shelf === view.tab) &&
    (view.state === 'todos' || i.state === view.state) &&
    (!q || norm(i.title + ' ' + (i.author || '')).includes(q)));
  const rec = i => i.lastRead || i.added || 0;
  const cmp = {
    recientes: (a, b) => rec(b) - rec(a),
    titulo: (a, b) => a.title.localeCompare(b.title, 'es', {numeric:true}),
    autor: (a, b) => (a.author || '~').localeCompare(b.author || '~', 'es') || a.title.localeCompare(b.title, 'es'),
    progreso: (a, b) => (b.progress || 0) - (a.progress || 0)
  }[view.sort] || ((a, b) => rec(b) - rec(a));
  list.sort(cmp);

  const showSrc = view.tab === 'noticias' && !q;
  $('#srcWrap').hidden = !showSrc;
  if (showSrc) $('#srcs').innerHTML = fuentes.map((f, i) => `<button class="src" data-src="${i}">${esc(f.n)}</button>`).join('')
    + `<button class="src add" data-src="edit">✎ Editar</button>`;
  const showCont = view.state === 'todos' && !q;
  const cont = showCont ? items.filter(i => i.state === 'leyendo' && (view.tab === 'todo' || i.shelf === view.tab))
                               .sort((a, b) => rec(b) - rec(a)).slice(0, 10) : [];
  $('#contWrap').hidden = cont.length === 0;
  $('#cont').innerHTML = cont.map(cardHTML).join('');
  $('#grid').innerHTML = list.map(cardHTML).join('');

  const empty = $('#empty');
  empty.hidden = list.length > 0;
  empty.innerHTML = items.length === 0
    ? `<span class="big mincho">読書</span>Tu biblioteca está vacía.<br>Toca <b>＋ Añadir</b> para importar tu primer libro (EPUB),<br>PDF de apuntes, revista escaneada o enlace de una noticia.`
    : `Aquí no hay nada con estos filtros.`;
  updateFoot();
}

async function updateFoot(){
  let txt = '📦 Los archivos se guardan en este aparato.';
  try{
    if (navigator.storage && navigator.storage.estimate){
      const e = await navigator.storage.estimate();
      txt += ` Espacio usado: ${fmtSize(e.usage || 0)}.`;
    }
  }catch(e){}
  const ids = new Set(items.map(i => i.id));
  const orph = items.length ? [...fileIds].filter(id => !ids.has(id)).length : 0;
  const away = items.filter(isAway).length;
  const synced = (() => { try{ return !!(window.MiAgendaSync && MiAgendaSync._dbg && (MiAgendaSync._dbg().cfg || {}).setup); }catch(e){ return false; } })();
  $('#foot').innerHTML = `${txt}<br>${synced ? '☁️ Progreso, subrayados, notas, marcadores y artículos se sincronizan con tu otro aparato.<br>' : ''}`
    + `${items.length} ${items.length === 1 ? 'elemento' : 'elementos'} en tu biblioteca${away ? ` · 📲 ${away} en tu otro aparato` : ''} · 読書 Mi Lector`
    + (orph ? `<br><button class="btn small ghost" id="orphBtn" style="margin-top:8px">🧹 Liberar espacio: ${orph} ${orph === 1 ? 'archivo' : 'archivos'} de libros borrados</button>` : '');
  if ($('#orphBtn')) $('#orphBtn').onclick = cleanOrphans;
}
function fmtSize(b){
  if (b < 1024 * 1024) return (b / 1024).toFixed(0) + ' KB';
  return (b / 1024 / 1024).toLocaleString('es', {maximumFractionDigits:1}) + ' MB';
}

  return {epub:'libros', pdf:'apuntes', images:'revistas', link:'noticias', article:'noticias'}[kind];
}
const cleanName = n => n.replace(/\.[^.]+$/, '').replace(/[_]+/g, ' ').replace(/\s+/g, ' ').trim();
const isImg = f => (f.type || '').startsWith('image/') || /\.(jpe?g|png|webp|heic|heif|gif)$/i.test(f.name);

async function importFiles(files){
  if (!DB.db){ toast('La biblioteca todavía se está cargando'); return; }
  busy('Importando…');
  try{ if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); }catch(e){}
  const imgs = files.filter(isImg).sort((a, b) => a.name.localeCompare(b.name, 'es', {numeric:true}));
  const others = files.filter(f => !isImg(f));
  let added = 0; const fails = []; let lastImg = null;
  for (const f of others){
    try{
      const ext = (f.name.split('.').pop() || '').toLowerCase();
      busy(`Importando «${cleanName(f.name).slice(0, 40)}»…`);
      if (ext === 'epub' || f.type === 'application/epub+zip') await addEpub(f);
      else if (ext === 'pdf' || f.type === 'application/pdf') await addPdf(f);
      else { fails.push(f.name); continue; }
      added++;
    }catch(err){ console.error(err); fails.push(f.name); }
  }
  if (imgs.length){
    try{ busy(`Preparando ${imgs.length} ${imgs.length === 1 ? 'imagen' : 'imágenes'}…`); lastImg = await addImages(imgs); added++; }
    catch(err){ console.error(err); fails.push('las imágenes'); }
  }
  unbusy(); render();
  const rel = items.filter(i => i.relinked); rel.forEach(i => delete i.relinked);
  added -= rel.length;
  if (added > 0) toast(added === 1 ? '✓ Añadido a tu biblioteca' : `✓ ${added} elementos añadidos`);
  if (rel.length) toast(`📲 ${rel.length === 1 ? '«' + rel[0].title + '» vinculado' : rel.length + ' libros vinculados'}: conservas tu progreso y tus subrayados`);
  if (fails.length) toast(`No he podido importar: ${fails.join(', ')}. Usa EPUB, PDF o imágenes.`);
  if (lastImg) openEdit(lastImg.id, true);
}

async function addItem(meta, data){
  // ¿Es un libro que ya está en la biblioteca (desde el otro aparato) pero sin archivo aquí? → se vincula
  if (needsFile(meta) && data !== undefined){
    const t = norm(meta.title);
    const twin = items.find(i => i.type === meta.type && isAway(i) && norm(i.title) === t);
    if (twin){ await DB.putFile(twin.id, data); twin.relinked = true; return twin; }
  }
  const it = Object.assign({id:uid(), state:'pendiente', progress:0, loc:null, added:Date.now(), lastRead:0, author:'', cover:null}, meta);
  if (data !== undefined) await DB.putFile(it.id, data);
  await DB.put(it);
  items.push(it);
  return it;
}

function thumb(src, w = 320){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      try{
        const s = Math.min(1, w / img.naturalWidth);
        const c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', .8));
      }catch(e){ res(null); }
    };
    img.onerror = () => res(null);
    img.src = src;
  });
}

async function addEpub(f){
  if (!window.ePub) throw new Error('Sin lector EPUB (¿sin internet?)');
  const buf = await f.arrayBuffer();
  const blob = new Blob([buf], {type:'application/epub+zip'});
  const book = ePub(buf.slice(0));
  let title = cleanName(f.name), author = '', cover = null;
  try{
    await book.ready;
    const md = await book.loaded.metadata;
    if (md.title) title = md.title;
    if (md.creator) author = md.creator;
    const url = await book.coverUrl();
    if (url) cover = await thumb(url);
  }catch(e){ console.warn(e); }
  try{ book.destroy(); }catch(e){}
  return addItem({type:'epub', title, author, cover, shelf:defShelf('epub'), size:f.size}, blob);
}

async function addPdf(f){
  if (!window.pdfjsLib) throw new Error('Sin lector PDF (¿sin internet?)');
  const buf = await f.arrayBuffer();
  const blob = new Blob([buf], {type:'application/pdf'});
  const pdf = await pdfjsLib.getDocument({data:buf.slice(0)}).promise;
  let title = cleanName(f.name), author = '', cover = null;
  try{
    const m = await pdf.getMetadata();
    const t = (m.info && m.info.Title || '').trim();
    if (t.length > 2 && !/\.(docx?|pdf|pptx?|indd)$|^untitled|^microsoft|^sin t[ií]tulo/i.test(t)) title = t;
    if (m.info && m.info.Author) author = m.info.Author.trim();
  }catch(e){}
  try{
    const page = await pdf.getPage(1);
    const v1 = page.getViewport({scale:1});
    const v = page.getViewport({scale:320 / v1.width});
    const c = document.createElement('canvas');
    c.width = Math.round(v.width); c.height = Math.round(v.height);
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    await page.render({canvasContext:ctx, viewport:v}).promise;
    cover = c.toDataURL('image/jpeg', .8);
    c.width = c.height = 0;
  }catch(e){ console.warn(e); }
  const pages = pdf.numPages;
  try{ pdf.destroy(); }catch(e){}
  return addItem({type:'pdf', title, author, cover, pages, shelf:defShelf('pdf'), size:f.size}, blob);
}

async function addImages(files){
  const blobs = [];
  for (const f of files) blobs.push(new Blob([await f.arrayBuffer()], {type:f.type || 'image/jpeg'}));
  const url = URL.createObjectURL(blobs[0]);
  const cover = await thumb(url);
  URL.revokeObjectURL(url);
  const size = blobs.reduce((s, b) => s + b.size, 0);
  return addItem({type:'images', title:cleanName(files[0].name), cover, pages:blobs.length, shelf:defShelf('images'), size}, blobs);
}

}

/* Descarga con el servicio de lectura limpia (primero solo <article>, luego la página entera) */
async function jina(url, sel){
  const h = {'Accept':'application/json', 'X-Remove-Selector':QUITAR};
  if (sel) h['X-Target-Selector'] = sel;
  const r = await fetch(JINA + url, {headers:h});
  if (!r.ok){ const e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
  const j = await r.json();
  return j && j.data;
}
/* Página completa (HTML) a través del servicio; con el idioma del periódico */
const READABILITY = 'https://cdn.jsdelivr.net/npm/@mozilla/readability@0.5.0/Readability.js';
async function jinaHtml(url){
  const loc = /\.fr$/.test(new URL(url).hostname) ? 'fr-FR' : 'es-ES';
  const r = await fetch(JINA + url, {headers:{'Accept':'application/json', 'X-Return-Format':'html', 'X-Locale':loc}});
  if (!r.ok){ const e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
  const d = ((await r.json()) || {}).data || {};
  const doc = new DOMParser().parseFromString(d.html || d.content || '', 'text/html');
  const b = doc.createElement('base'); b.href = d.finalUrl || d.url || url; doc.head.prepend(b);
  return {doc, data:d};
}
/* 1º Readability (como el modo lectura de Firefox); 2º plan B: texto en Markdown */
async function fetchArticle(url){
  try{
    await loadScript(READABILITY);
    const {doc, data} = await jinaHtml(url);
    const meta = data.metadata || {};
    const a = new Readability(doc).parse();
    const html = a && a.content ? sanitizeHtml(a.content) : '';
    const words = (new DOMParser().parseFromString(html, 'text/html').body.textContent || '').split(/\s+/).filter(Boolean).length;
    if (words >= 120) return {title:(a.title || data.title || '').trim(), html, url:data.finalUrl || data.url || url, site:a.siteName || meta['og:site_name'] || hostOf(url),
      author:(a.byline || meta.author || '').trim().replace(/^(par|por|by|de)\s+/i, '').slice(0, 120), published:data.publishedTime || a.publishedTime || meta['article:published_time'] || '', cover:meta['og:image'] || meta['twitter:image'] || null};
  }catch(e){ if (e.status === 403 || e.status === 451 || e.status === 429) throw e; console.warn(e); }
  const md = await fetchArticleMd(url);
  const meta = md.metadata || {};
  return {title:(md.title || '').trim(), html:await mdToHtml(md.content), url:md.url || url, site:meta['og:site_name'] || hostOf(md.url || url),
    author:meta.author || '', published:md.publishedTime || meta['article:published_time'] || '', cover:meta['og:image'] || meta['twitter:image'] || null};
}
async function fetchArticleMd(url){
  let a = null;
  try{ a = await jina(url, 'article'); }catch(e){ if (e.status === 403 || e.status === 451) throw e; }
  if (!a || !a.content || a.content.length < 700){
    const b = await jina(url, null);
    if (b && b.content && (!a || b.content.length > (a.content || '').length)) a = b;
  }
  if (!a || !a.content || a.content.trim().length < 150) throw new Error('vacío');
  return a;
}
async function downloadArticle(url, shelf, replaceItem){
  busy('Descargando el artículo…');

    const a = await fetchArticle(url);
    let html = a.html;

    if (cover && !/<img/i.test(html)) html = `<figure><img src="${esc(cover)}" alt=""></figure>` + html;
    unbusy();

}

function loadScript(src){
  return new Promise((res, rej) => {
    if ([...document.scripts].some(s => s.src === src)){ res(); return; }
    const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s);
  });
}
async function mdToHtml(md){
  await loadScript('https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js');
  return sanitizeHtml(marked.parse(md, {gfm:true, breaks:false}));
}
/* Deja solo lo que hace falta para leer: textos, títulos, listas, enlaces e imágenes */
const KEEP = new Set(['P','H1','H2','H3','H4','H5','H6','UL','OL','LI','BLOCKQUOTE','EM','STRONG','B','I','U','A','IMG','FIGURE','FIGCAPTION','BR','HR','TABLE','THEAD','TBODY','TR','TD','TH','CODE','PRE','SUB','SUP','SMALL','RUBY','RT','RP']);
const DROP = new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','FORM','INPUT','BUTTON','SELECT','TEXTAREA','NAV','ASIDE','FOOTER','HEADER','SVG','NOSCRIPT','VIDEO','AUDIO','CANVAS','DIALOG','TEMPLATE','LINK','META']);
function sanitizeHtml(html){
  const doc = new DOMParser().parseFromString('<div id="r">' + html + '</div>', 'text/html');
  const root = doc.getElementById('r');
  const walk = el => {
    for (const c of [...el.children]){
      const t = c.tagName.toUpperCase();
      if (DROP.has(t)){ c.remove(); continue; }
      walk(c);
      if (!KEEP.has(t)){ c.replaceWith(...c.childNodes); continue; }
      const keep = {};
      if (t === 'A'){ const h = c.getAttribute('href') || ''; if (/^https?:/i.test(h)) keep.href = h; }
      if (t === 'IMG'){
        const s = c.getAttribute('src') || c.getAttribute('data-src') || '';
        if (!/^(https?:|data:image\/)/i.test(s)){ c.remove(); continue; }
        keep.src = s; keep.alt = (c.getAttribute('alt') || '').replace(/^Image\s*\d+\s*:\s*/i, '');
      }
      for (const a of [...c.attributes]) c.removeAttribute(a.name);
      for (const [k, v] of Object.entries(keep)) c.setAttribute(k, v);
      if (t === 'A' && keep.href){ c.setAttribute('target', '_blank'); c.setAttribute('rel', 'noopener'); }
    }
  };
  walk(root);
  // Quitar párrafos que solo son listas de enlaces (etiquetas, «lee también»…)
  root.querySelectorAll('p, li').forEach(p => {
    const links = p.querySelectorAll('a'); const txt = p.textContent.trim();
    if (!txt){ if (!p.querySelector('img')) p.remove(); return; }
    let lt = 0; links.forEach(a => lt += a.textContent.trim().length);
    if ((links.length >= 2 && lt / txt.length > .75) || (links.length >= 3 && lt / txt.length > .45)) { p.remove(); return; }
    if (txt.length < 220 && /^(sur le même thème|à lire aussi|lire aussi|lire également|lee también|leer más|te puede interesar|más información|también te puede|relacionad|ver también|publicité|publicidad|abonnez-vous|suscríbete|cet article vous est offert|pour lire gratuitement|se connecter|vous n’êtes pas inscrit|vous n'êtes pas inscrit|ajouter au|écouter cet article|escuchar este artículo|compartir en|partager)/i.test(txt)) p.remove();
  });
  // Imagen sola en un párrafo → figura con pie de foto
  root.querySelectorAll('p').forEach(p => {
    const imgs = p.querySelectorAll('img');
    if (imgs.length === 1 && !p.textContent.trim()){
      const img = imgs[0], f = doc.createElement('figure'); f.appendChild(img);
      if (img.alt && img.alt.length > 12){ const fc = doc.createElement('figcaption'); fc.textContent = img.alt; f.appendChild(fc); }
      p.replaceWith(f);
    }
  });
  return root.innerHTML;
}
function textToHtml(t){
  return String(t).replace(/\r/g, '').split(/\n\s*\n|\n(?=\s*[A-ZÁÉÍÓÚÀÈÇ«“"—-])/).map(p => p.trim()).filter(Boolean)
    .map(p => `<p>${esc(p).replace(/\n/g, '<br>')}</p>`).join('');
}
async function saveArticle(d, replaceItem){
  const html = d.html || '';
  const plain = new DOMParser().parseFromString(html, 'text/html').body.textContent || '';
  const words = plain.split(/\s+/).filter(Boolean).length;
  const partial = /(la suite est réservée aux abonnés|il vous reste [\d.,]+ ?% de cet article|réservé aux abonnés|you have [\d.,]+% of this article left|contenido exclusivo para suscriptores|solo para suscriptores|hazte suscriptor para seguir leyendo|para seguir leyendo)/i.test(plain.slice(-1500));
  const meta = {type:'article', partial, title:d.title || 'Artículo', author:d.author || d.site || '', url:d.url || '', site:d.site || hostOf(d.url),
                published:d.published || '', cover:d.cover || null, words, size:html.length};
  if (replaceItem){
    Object.assign(replaceItem, meta);
    await DB.putFile(replaceItem.id, html); await DB.put(replaceItem);
    return replaceItem;
  }
  return addItem(Object.assign(meta, {shelf:d.shelf || defShelf('article')}), html);
}

/* Marcador de Safari: copia el artículo tal como lo ves (también con suscripción) */
function bookmarkletCode(){
  const js = `(()=>{try{const q=['article','[itemprop=articleBody]','main','[role=main]','#content','body'];let e;for(const s of q){e=document.querySelector(s);if(e&&e.innerText.trim().length>500)break}const c=e.cloneNode(true);c.querySelectorAll('script,style,iframe,noscript,form,button,nav,aside,footer,svg,video,[class*=share],[class*=related],[class*=newsletter],[class*=paywall],[class*=ad-],[id*=ad-]').forEach(x=>x.remove());c.querySelectorAll('img').forEach(i=>{const s=i.currentSrc||i.getAttribute('data-src')||i.src;if(s)i.setAttribute('src',s)});const m=p=>(document.querySelector('meta[property="'+p+'"],meta[name="'+p+'"]')||{}).content||'';const d={type:'milector-articulo',url:location.href,title:m('og:title')||document.title,site:m('og:site_name')||location.hostname,author:m('author'),published:m('article:published_time'),img:m('og:image'),html:c.innerHTML};const t=JSON.stringify(d);const ex=()=>{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;top:0;opacity:0';document.body.appendChild(a);a.focus();a.select();a.setSelectionRange(0,t.length);const ok=document.execCommand('copy');a.remove();if(!ok)throw 0};const fin=()=>alert('✓ Artículo copiado. Ahora abre Mi Lector › ＋ Añadir › Pegar artículo.');const no=()=>alert('No he podido copiarlo. Inténtalo otra vez.');if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(fin,()=>{try{ex();fin()}catch(z){no()}});else{try{ex();fin()}catch(z){no()}}}catch(x){alert('No he encontrado el artículo en esta página.')}})()`;
  return 'javascript:' + encodeURIComponent(js);
}

/* Mis periódicos: titulares de la portada */
function headlinesFromDoc(doc, src){
  const host = hostOf(src).replace(/^[^.]+\.(?=[^.]+\.[^.]+$)/, '');
  const srcEn = /\/en\//.test(src);
  const year = new Date().getFullYear();
  const seen = new Set(), out = [];
  for (const a of doc.querySelectorAll('a[href]')){
    let u; try{ u = new URL(a.getAttribute('href'), doc.baseURI); }catch(e){ continue; }
    u.hash = ''; const href = u.href;
    let title = (a.textContent || '').replace(/\s+/g, ' ').trim();
    if (title.length < 25 || title.length > 300 || seen.has(href)) continue;
    if (!u.hostname.endsWith(host)) continue;
    if (!srcEn && /\/en\//.test(u.pathname)) continue;
    if (/\.(jpe?g|png|webp|gif|svg|mp4)$/i.test(u.pathname)) continue;
    if (/\/(tag|tags|autor|author|auteur|abonnement|abonnements|newsletter|newsletters|suscripcion|subscribe|jeux|services|page|pages|videos?|faq|bons-plans[^/]*|codigos-descuento|code-promo[^/]*)\//i.test(u.pathname + '/')) continue;
    const segs = u.pathname.split('/').filter(Boolean);
    if (segs.length < 2 && !/\d{5,}/.test(u.pathname)) continue;
    if (!/\d{4}|\d{5,}|\.html?$|\.php$/.test(u.pathname)) continue;
    const ym = u.pathname.match(/(?:^|\/|-|_)(20\d\d)(?:\/|\d{4}|-|_)/);
    if (ym && +ym[1] < year - (new Date().getMonth() === 0 ? 1 : 0)) continue;
    let lock = false;
    title = title.replace(/^(article réservé aux abonnés|réservé aux abonnés|abonnés|exclusiva suscriptores|exclusiva para suscriptores|suscriptores|premium)\s*/i, () => { lock = true; return ''; })
                 .replace(/^Image \d+:\s*/i, '').replace(/^\d{1,2}[:h]\d{2}\s+/, '');
    if (title.length < 20) continue;
    seen.add(href); out.push({title:(lock ? '🔒 ' : '') + title, url:href});
    if (out.length >= 40) break;
  }
  return out;
}
function headlineLinks(md, src){
  const host = hostOf(src).replace(/^[^.]+\.(?=[^.]+\.[^.]+$)/, '');
  const srcEn = /\/en\//.test(src);
  const seen = new Set(), out = [];
  const re = /\[([^\[\]]{20,300})\]\((https?:\/\/[^)\s]+)(?:\s+"[^"]*")?\)/g;
  let m;
  while ((m = re.exec(md))){
    let title = m[1].replace(/!\[[^\]]*\]/g, '').replace(/[*_#`]/g, '').replace(/\s+/g, ' ').trim();
    const u = m[2].split('#')[0];
    if (title.length < 25 || seen.has(u)) continue;
    let x; try{ x = new URL(u); }catch(e){ continue; }
    if (!x.hostname.endsWith(host)) continue;
    if (!srcEn && /\/en\//.test(x.pathname)) continue;
    if (/\/(tag|tags|autor|author|auteur|abonnement|abonnements|newsletter|newsletters|suscripcion|subscribe|jeux|services|page|pages|videos?)\//i.test(x.pathname)) continue;
    const segs = x.pathname.split('/').filter(Boolean);
    if (segs.length < 2 && !/\d{5,}/.test(x.pathname)) continue;
    if (!/\d{4}|\d{5,}|\.html?$|\.php$/.test(x.pathname)) continue;
    seen.add(u); out.push({title, url:u});
    if (out.length >= 40) break;
  }
  return out;
}

  busy(`Abriendo ${f.n}…`);
  let list = [];
  try{ const {doc} = await jinaHtml(f.u); list = headlinesFromDoc(doc, f.u); }
  catch(e){ unbusy(); articleFailed(f.u, e); return; }
  unbusy();
  const saved = new Set(items.filter(i => i.url).map(i => i.url));
  sheet(`<h3>🗞️ ${esc(f.n)}</h3>
    ${list.length ? `<div class="info" style="margin-top:0">Toca un titular para guardarlo y leerlo.</div><div class="news">${list.map((h, i) => `<a href="#" data-h="${i}" class="${saved.has(h.url) ? 'saved' : ''}"><span>${esc(h.title)}</span><b>${saved.has(h.url) ? '✓' : '📥'}</b></a>`).join('')}</div>`
      : `<div class="info">No he encontrado titulares en la portada. Prueba más tarde o ábrela en Safari.</div>`}
    <div class="actions"><a class="btn ghost" href="${esc(f.u)}" target="_blank" rel="noopener" style="text-decoration:none">Abrir en Safari ↗</a><span class="sp"></span><button class="btn ghost" data-close>Cerrar</button></div>`);
  $('#sheet .panel').onclick = async e => {
    const a = e.target.closest('[data-h]'); if (!a) return; e.preventDefault();
    const h = list[+a.dataset.h];
    const ex = items.find(i => i.url === h.url && i.type === 'article');

    closeSheet();

  };
}

let dragN = 0;
window.addEventListener('dragenter', e => { if ([...(e.dataTransfer?.types || [])].includes('Files') && !$('#reader').classList.contains('open')){ dragN++; $('#drop').hidden = false; } });
window.addEventListener('dragleave', () => { dragN = Math.max(0, dragN - 1); if (!dragN) $('#drop').hidden = true; });

  e.preventDefault(); dragN = 0; $('#drop').hidden = true;

  if ($('#eNoCov')) $('#eNoCov').onclick = () => { newCover = null; $('#eInfo').textContent = 'Se quitará la portada al guardar.'; };
  if ($('#eReset')) $('#eReset').onclick = () => { reset = true; $('#eInfo').textContent = 'Volverá al principio al guardar (tus subrayados se quedan).'; };
  let armed = false;
  $('#eDel').onclick = async () => {

    await DB.del(id); items = items.filter(i => i.id !== id);

const R = {};
let saveT = null, rid = 0;

function saveSoon(){ clearTimeout(saveT); saveT = setTimeout(saveNow, 700); }
async function saveNow(){ clearTimeout(saveT); if (R.item){ try{ await DB.put(R.item); }catch(e){ console.warn(e); } } await flushInk(); }

async function touchItem(it){
  if (it.state === 'pendiente') it.state = 'leyendo';
  it.lastRead = Date.now();
  await DB.put(it);
}

async function openItem(id){
  const it = items.find(i => i.id === id); if (!it) return;
  if (it.type === 'link'){
    sheet(`<h3>${esc(it.title)}</h3><div class="info" style="margin-top:0">${esc(it.url)}</div>
      <div class="actions"><span class="sp"></span><button class="btn ghost" id="kOpen">🌐 Abrir en Safari</button><button class="btn" id="kDl">📥 Leer aquí (sin anuncios)</button></div>`);
    $('#kOpen').onclick = async () => { closeSheet(); window.open(it.url, '_blank', 'noopener'); await touchItem(it); render(); };
    $('#kDl').onclick = async () => { closeSheet(); const r = await downloadArticle(it.url, it.shelf, it); if (r){ render(); openItem(it.id); } };
    return;
  }
  if (isAway(it)){ relinkSheet(it); return; }
  busy('Abriendo…');
  let data;
  try{ data = it.type === 'article' ? await DB.getArt(id) : await DB.getFile(id); }catch(e){}
  if (!data){ unbusy(); if (needsFile(it)){ fileIds.delete(id); relinkSheet(it); } else toast('No encuentro el texto en este aparato'); return; }
  for (const k of Object.keys(R)) delete R[k];
  Object.assign(R, {item:it, kind:it.type, page:0, total:0, ended:false, toc:[], ink:{}, inkDirty:new Set(), undo:[]});
  const rd = $('#reader');
  rd.classList.add('open'); rd.classList.remove('hide', 'drawing'); rd.setAttribute('aria-hidden', 'false');
  document.body.classList.add('reading');
  $('#rTitle').textContent = it.title;
  $('#rDraw').hidden = it.type === 'epub' || it.type === 'article';
  $('#rTts').hidden = it.type === 'images';
  applyTheme(); updateDoble();
  try{
    $('#artBox').hidden = true; $('#pages').hidden = true; $('#epubBox').hidden = true;
    if (it.type === 'epub') await openEpub(data);
    else if (it.type === 'article') await openArticle(data);
    else if (it.type === 'pdf') await openPdf(data);
    else await openImages(data);
  }catch(e){
    console.error(e); unbusy();
    toast(window.ePub && window.pdfjsLib ? 'No he podido abrir este archivo' : 'Necesito internet para cargar el lector la primera vez');
    closeReader(); return;
  }
  unbusy();
  await touchItem(it);
  updateMarkBtn();
  try{ history.replaceState(null, '', '#' + id); }catch(e){}
}

async function closeReader(){
  autoStop(); stopDrawing(); ttsClose();
  await saveNow();
  if (R.obs) R.obs.disconnect();
  try{ R.rend && R.rend.destroy(); }catch(e){}
  try{ R.book && R.book.destroy(); }catch(e){}
  try{ R.pdf && R.pdf.destroy(); }catch(e){}
  (R.urls || []).forEach(u => URL.revokeObjectURL(u));
  freeCanvases();
  $('#pages').innerHTML = ''; $('#epubBox').innerHTML = ''; $('#artBox').innerHTML = '';
  $('#pages').onscroll = null; $('#artBox').onscroll = null; $('#artBox').hidden = true;
  hideSel();
  for (const k of Object.keys(R)) delete R[k];
  const rd = $('#reader');
  rd.classList.remove('open'); rd.setAttribute('aria-hidden', 'true');
  document.body.classList.remove('reading');
  closeSheet();
  try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){}
  render();
}
function freeCanvases(root){ (root || $('#pages')).querySelectorAll('canvas').forEach(c => { c.width = 0; c.height = 0; }); }

/* ----- Tema y doble página ----- */

/* ----- EPUB ----- */
async function openEpub(blob){
  if (!window.ePub) throw new Error('Sin epub.js');
  $('#epubBox').hidden = false; $('#pages').hidden = true;
  const buf = await blob.arrayBuffer();
  const book = ePub(buf); R.book = book;
  try{ await book.ready; R.rtl = (book.packaging && book.packaging.metadata && book.packaging.metadata.direction) === 'rtl'; }catch(e){}
  await makeRendition();
  book.loaded.navigation.then(n => { R.toc = flatToc(n.toc || []); updateLabel(); }).catch(() => {});
  setupSlider();
  book.locations.generate(1200).then(() => {
    if (R.book !== book) return;
    R.locReady = true;
    const loc = R.rend && R.rend.currentLocation();
    if (loc && loc.start) onRelocated(loc);
  }).catch(() => {});
}
function rendOpts(){
  return isScroll()
    ? {width:'100%', height:'100%', manager:'continuous', flow:'scrolled', allowScriptedContent:false}
    : {width:'100%', height:'100%', flow:'paginated', spread:R.double ? 'always' : 'none', minSpreadWidth:0, allowScriptedContent:false};
}
async function makeRendition(){
  if (R.rend){ try{ R.rend.destroy(); }catch(e){} $('#epubBox').innerHTML = ''; }
  const rend = R.book.renderTo('epubBox', rendOpts());
  R.rend = rend;
  for (const [k, t] of Object.entries(THEMES)){
    const st = {
      'html, body': {'background': t.bg + ' !important', 'color': t.fg + ' !important'},
      'a, a:link, a:visited': {'color': t.link + ' !important'},
      'img, svg, image': {'max-width': '100% !important'},
      '::selection': {'background': 'rgba(181,82,59,.28)'}
    };
    if (k !== 'blanco') st['body *'] = {'color': 'inherit !important', 'background-color': 'transparent !important'};
    rend.themes.register(k, st);
  }
  applyEpubStyle();
  rend.hooks.content.register(contents => {
    try{ const st = contents.document.createElement('style'); st.textContent = '.tts-on{background:rgba(181,82,59,.12)!important;border-radius:6px} ::highlight(tts){background-color:rgba(255,216,77,.6);color:inherit}'; contents.document.head.appendChild(st); }catch(e){}
    attachGestures(contents.document, true);
    contents.document.addEventListener('selectionchange', () => {
      clearTimeout(R.selT);
      R.selT = setTimeout(() => {
        let s = ''; try{ s = String(contents.window.getSelection() || '').trim(); }catch(e){}
        if (!s && R.sel && R.sel.contents === contents) hideSel();
      }, 350);
    });
  });
  rend.on('relocated', onRelocated);
  rend.on('keydown', onKey);
  rend.on('selected', onSelected);
  try{ await rend.display(R.item.loc || undefined); }
  catch(e){ await rend.display(); }
  (R.item.hl || []).forEach(paintHl);
}
function flatToc(list, lvl = 0, out = []){
  for (const t of list){
    out.push({label:(t.label || '').trim(), href:t.href, lvl});
    if (t.subitems && t.subitems.length && lvl < 3) flatToc(t.subitems, lvl + 1, out);
  }
  return out;
}
function applyEpubStyle(){
  const r = R.rend; if (!r) return;
  r.themes.select(ajustes.theme);
  r.themes.fontSize(ajustes.fontSize + '%');
  r.themes.override('line-height', String(ajustes.lh), true);
  r.themes.override('font-family', FONTS[ajustes.font] || '', !!FONTS[ajustes.font]);
}
function onRelocated(loc){
  if (!loc || !loc.start || !R.item) return;
  R.loc = loc;
  R.item.loc = loc.start.cfi;
  let p = R.item.progress || 0;
  if (R.locReady){ const v = R.book.locations.percentageFromCfi(loc.start.cfi); if (typeof v === 'number' && !isNaN(v)) p = v; }
  else if (typeof loc.start.percentage === 'number' && loc.start.percentage > 0) p = loc.start.percentage;
  if (loc.atEnd) p = 1;
  R.item.progress = p;
  updateLabel(); updateMarkBtn(); saveSoon();
  if (loc.atEnd) reachedEnd();
}
function chapterOf(href){
  if (!href || !R.toc) return '';
  const base = href.split('#')[0];
  for (const t of R.toc){
    const tb = (t.href || '').split('#')[0];
    if (tb && (tb.endsWith(base) || base.endsWith(tb))) return t.label;
  }
  return '';
}

function artFrac(){ const b = $('#artBox'); const max = b.scrollHeight - b.clientHeight; return max > 0 ? clamp(b.scrollTop / max, 0, 1) : 1; }
function onArtScroll(){
  if (!R.item || R.kind !== 'article') return;

  R.item.loc = f; R.item.progress = f > .985 ? 1 : f;

  if (f > .985) reachedEnd();
}
function artGoFrac(f){ const b = $('#artBox'); b.scrollTop = clamp(f, 0, 1) * (b.scrollHeight - b.clientHeight); }
function pointToOffset(root, node, off){
  const r = document.createRange(); r.setStart(root, 0);
  try{ r.setEnd(node, off); }catch(e){ return 0; }
  return r.toString().length;
}
function paintArtHl(h){
  const root = R.artRoot; if (!root || h.s == null) return;
  removeArtHl(h.id);
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const parts = []; let n = 0, t;
  while ((t = w.nextNode())){
    const L = t.nodeValue.length, a = Math.max(h.s, n), b = Math.min(h.e, n + L);
    if (a < b && t.nodeValue.slice(a - n, b - n).trim()) parts.push([t, a - n, b - n]);
    n += L; if (n >= h.e) break;
  }
  const col = (HL[h.color] || HL.amarillo).fill + '80';
  for (const [tn, a, b] of parts){
    let node = tn;
    if (a > 0) node = node.splitText(a);
    if (b - a < node.nodeValue.length) node.splitText(b - a);
    const m = document.createElement('mark');
    m.className = 'mi-hl'; m.dataset.id = h.id; m.style.background = col;
    node.parentNode.insertBefore(m, node); m.appendChild(node);
  }
}
function removeArtHl(id){
  const root = R.artRoot; if (!root) return;
  root.querySelectorAll(`mark.mi-hl[data-id="${id}"]`).forEach(m => m.replaceWith(...m.childNodes));
  root.normalize();
}

async function openPdf(blob){
  if (!window.pdfjsLib) throw new Error('Sin pdf.js');
  $('#epubBox').hidden = true; $('#pages').hidden = false;

async function loadPdfToc(){
  try{
    const ol = await R.pdf.getOutline(); if (!ol) return;
    const out = [];
    const walk = async (arr, lvl) => {
      for (const o of arr){
        let page = null;
        try{
          let d = o.dest;
          if (typeof d === 'string') d = await R.pdf.getDestination(d);
          if (Array.isArray(d) && d[0] != null) page = typeof d[0] === 'object' ? await R.pdf.getPageIndex(d[0]) : d[0];
        }catch(e){}
        out.push({label:o.title, page, lvl});
        if (o.items && o.items.length && lvl < 3) await walk(o.items, lvl + 1);
      }
    };
    await walk(ol, 0);
    R.toc = out;
  }catch(e){}
}

async function openImages(blobs){

/* ----- Páginas (PDF e imágenes) ----- */
function curSpread(){
  if (!R.double || R.total < 2) return [R.page];
  if (R.page === 0) return [0];               // portada sola, como una revista
  const s = R.page % 2 === 1 ? R.page : R.page - 1;
  return s + 1 < R.total ? [s, s + 1] : [s];
}
function normalizePage(){ R.page = curSpread()[0]; }
function fitScale(w, h, W, H){
  const z = ajustes.zoom || 1;
  return (ajustes.fit === 'ancho' || isScroll() ? W / w : Math.min(W / w, H / h)) * z;
}
async function pageSize(p){
  if (R.kind === 'pdf'){ const pg = await R.pdf.getPage(p + 1); const v = pg.getViewport({scale:1}); return [v.width, v.height, pg]; }
  const img = new Image(); img.src = R.urls[p];
  try{ await img.decode(); }catch(e){ await new Promise(r => { img.onload = img.onerror = r; }); }
  return [img.naturalWidth || 600, img.naturalHeight || 800, img];
}
/* Crea la página: fondo (PDF o imagen) + capa de tinta para el lápiz */
async function fillWrap(wrap, p, W, H){
  const [w, h, src] = await pageSize(p);
  const s = fitScale(w, h, W, H);
  const cw = Math.floor(w * s), ch = Math.floor(h * s);
  let base;
  if (R.kind === 'pdf'){
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    let rs = s * dpr;
    const maxPx = 14e6;                       // límite de memoria de Safari
    if (w * h * rs * rs > maxPx) rs = Math.sqrt(maxPx / (w * h));
    const vp = src.getViewport({scale:rs});
    base = document.createElement('canvas');
    base.width = Math.floor(vp.width); base.height = Math.floor(vp.height);
    const ctx = base.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, base.width, base.height);
    await src.render({canvasContext:ctx, viewport:vp}).promise;
  } else { base = src; base.alt = ''; }
  base.className = 'pg';
  const ink = document.createElement('canvas');
  ink.className = 'ink';
  const idpr = Math.min(window.devicePixelRatio || 1, 2);
  ink.width = Math.round(cw * idpr); ink.height = Math.round(ch * idpr);
  freeCanvases(wrap);
  wrap.innerHTML = '';
  wrap.style.width = cw + 'px'; wrap.style.height = ch + 'px';
  wrap.dataset.p = p;
  wrap.append(base, ink);
  attachInk(ink, p);
  await getInk(p);
  redrawInk(ink, p);
  return wrap;
}
async function renderPages(){
  if (R.kind !== 'pdf' && R.kind !== 'images') return;
  if (isScroll()) return renderScroll();
  if (R.obs){ R.obs.disconnect(); R.obs = null; }
  $('#pages').onscroll = null;
  const id = ++rid;
  const box = $('#pages');
  const W = box.clientWidth - 8, H = box.clientHeight - 16;
  const sp = curSpread();
  const slotW = R.double && R.total > 1 ? W / 2 : W;
  const wrap = document.createElement('div'); wrap.className = 'spread';
  for (const p of sp){
    const pw = document.createElement('div'); pw.className = 'pgw';
    await fillWrap(pw, p, slotW, H);
    if (id !== rid){ freeCanvases(wrap); freeCanvases(pw); return; }
    wrap.appendChild(pw);
  }
  freeCanvases();
  box.innerHTML = ''; box.appendChild(wrap);
  box.scrollTop = 0; box.scrollLeft = Math.max(0, (box.scrollWidth - box.clientWidth) / 2);
  box.classList.toggle('zoomed', box.scrollWidth > box.clientWidth + 2);
  const last = sp[sp.length - 1];
  R.item.loc = R.page;
  R.item.progress = R.total ? (last + 1) / R.total : 0;
  updateLabel(); updateMarkBtn(); saveSoon();
  if (last === R.total - 1 && R.total > 1) reachedEnd();
}
/* Modo scroll continuo: todas las páginas en columna, se dibujan al acercarse */
async function renderScroll(){
  const id = ++rid;
  const box = $('#pages');
  if (R.obs) R.obs.disconnect();
  freeCanvases(); box.innerHTML = '';
  box.classList.remove('zoomed');
  const W = box.clientWidth - 16, H = box.clientHeight;
  const [w0, h0] = await pageSize(0);
  if (id !== rid) return;
  const s0 = fitScale(w0, h0, W, H);
  const col = document.createElement('div'); col.className = 'col';
  for (let p = 0; p < R.total; p++){
    const pw = document.createElement('div'); pw.className = 'pgw'; pw.dataset.p = p;
    pw.style.width = Math.floor(w0 * s0) + 'px'; pw.style.height = Math.floor(h0 * s0) + 'px';
    col.appendChild(pw);
  }
  box.appendChild(col);
  R.wraps = [...col.children];
  R.obs = new IntersectionObserver(ents => {
    for (const e of ents){
      const pw = e.target, p = +pw.dataset.p;
      if (e.isIntersecting && !pw.dataset.f){ pw.dataset.f = '1'; fillWrap(pw, p, W, H).catch(() => { pw.dataset.f = ''; }); }
      else if (!e.isIntersecting && pw.dataset.f){ pw.dataset.f = ''; freeCanvases(pw); pw.innerHTML = ''; }
    }
  }, {root:box, rootMargin:'1500px 0px'});
  R.wraps.forEach(w => R.obs.observe(w));
  const target = R.wraps[R.page];
  box.scrollTop = target ? target.offsetTop - 10 : 0;
  let t = null;
  box.onscroll = () => { if (t) return; t = setTimeout(() => { t = null; onScrollPages(); }, 120); };
  onScrollPages();
}
function onScrollPages(){
  const box = $('#pages'); if (!R.wraps || !R.item) return;
  const y = box.scrollTop + box.clientHeight * .3;
  let lo = 0, hi = R.wraps.length - 1;
  while (lo < hi){ const m = (lo + hi + 1) >> 1; if (R.wraps[m].offsetTop <= y) lo = m; else hi = m - 1; }
  R.page = lo;
  const atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - box.clientHeight * .4 - 4;
  R.item.loc = R.page;
  R.item.progress = atEnd ? 1 : (R.page + 1) / R.total;
  updateLabel(); updateMarkBtn(); saveSoon();
  if (atEnd && R.total > 0) reachedEnd();
}

/* ----- Navegación ----- */
function next(){
  if (!R.item) return;
  if (R.kind === 'epub'){ R.rend && R.rend.next(); return; }
  if (R.kind === 'article'){ const b = $('#artBox'); if (artFrac() >= .995){ reachedEnd(true); autoStop(); return; } b.scrollBy({top:b.clientHeight * .9, behavior:'smooth'}); return; }
  if (isScroll()){ const b = $('#pages'); b.scrollBy({top:b.clientHeight * .9, behavior:'smooth'}); return; }
  const sp = curSpread(); const n = sp[sp.length - 1] + 1;
  if (n < R.total){ R.page = n; normalizePage(); renderPages(); }
  else { reachedEnd(true); autoStop(); }
}
function prev(){
  if (!R.item) return;
  if (R.kind === 'epub'){ R.rend && R.rend.prev(); return; }
  if (R.kind === 'article'){ const b = $('#artBox'); b.scrollBy({top:-b.clientHeight * .9, behavior:'smooth'}); return; }
  if (isScroll()){ const b = $('#pages'); b.scrollBy({top:-b.clientHeight * .9, behavior:'smooth'}); return; }
  const p = curSpread()[0] - 1;
  if (p >= 0){ R.page = p; normalizePage(); renderPages(); }
}
function goPage(p){
  R.page = clamp(p, 0, R.total - 1);
  if (isScroll() && R.wraps){ $('#pages').scrollTop = R.wraps[R.page].offsetTop - 10; return; }
  normalizePage(); renderPages();
}
const goLeft = () => R.rtl ? next() : prev();
const goRight = () => R.rtl ? prev() : next();

function reachedEnd(force){
  if (R.auto && R.kind !== 'epub' && R.kind !== 'article' && !isScroll()) autoStop();
  if (!R.item || R.item.state === 'terminado' || (R.ended && !force)) return;
  R.ended = true;
  const it = R.item;
  toast('¡Has llegado al final! 🎉', {label:'Marcar como terminado', fn: async () => {
    it.state = 'terminado'; it.progress = 1; await DB.put(it); toast('✓ Terminado. ¡Enhorabuena!');
  }});
}

function toggleBars(){ $('#reader').classList.toggle('hide'); }

/* Gestos: deslizar para pasar página, tocar para ocultar barras */
function attachGestures(target, isEpub){
  let sx = 0, sy = 0, st = 0, active = false;
  target.addEventListener('pointerdown', e => {
    if (!e.isPrimary) return;
    if (R.drawing && (e.pointerType !== 'touch' || ajustes.dedo)) { active = false; return; }
    sx = e.screenX; sy = e.screenY; st = Date.now(); active = true;
  }, {passive:true});
  target.addEventListener('pointercancel', () => { active = false; }, {passive:true});
  target.addEventListener('pointerup', e => {
    if (!active || !e.isPrimary) return; active = false;
    const dx = e.screenX - sx, dy = e.screenY - sy, dt = Date.now() - st;
    const zoomed = !isEpub && $('#pages').classList.contains('zoomed');
    if (!zoomed && !isScroll() && R.kind !== 'article' && Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4 && dt < 900){
      dx < 0 ? goRight() : goLeft(); return;
    }
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10 && dt < 450){
      if (e.target.closest && e.target.closest('a, mark.mi-hl')) return;
      const doc = isEpub ? target : document;
      const sel = doc.getSelection ? String(doc.getSelection()) : '';
      if (sel) return;
      if (isEpub || R.kind === 'article'){ if (R.sel) hideSel(); else toggleBars(); return; }
      if (R.drawing) return;
      const r = $('#viewer').getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width;
      if (x < .25) goLeft(); else if (x > .75) goRight(); else toggleBars();
    }
  }, {passive:true});
}
attachGestures($('#pages'), false);
$('#gL').addEventListener('click', goLeft);
$('#gR').addEventListener('click', goRight);
$('#rClose').addEventListener('click', closeReader);

function onKey(e){
  if (!$('#reader').classList.contains('open')) return;
  if (!$('#sheet').hidden){ if (e.key === 'Escape') closeSheet(); return; }
  if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName || '')) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' '){ e.preventDefault && e.preventDefault(); e.key === 'ArrowRight' ? goRight() : next(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault && e.preventDefault(); e.key === 'ArrowLeft' ? goLeft() : prev(); }
  else if (e.key === 'Escape'){ if (R.drawing) stopDrawing(); else closeReader(); }
  else if ((e.metaKey || e.ctrlKey) && e.key === 'z' && R.drawing){ e.preventDefault && e.preventDefault(); undoInk(); }
}
document.addEventListener('keydown', onKey);

/* ----- Barra de progreso ----- */
function setupSlider(){
  const s = $('#rSlider');
  if (R.kind === 'epub' || R.kind === 'article'){ s.min = 0; s.max = 1000; s.step = 1; }

function updateLabel(){
  const s = $('#rSlider'), l = $('#rLabel');

  if (R.kind === 'epub'){
    const pct = Math.round((R.item.progress || 0) * 100);
    s.value = Math.round((R.item.progress || 0) * 1000);
    s.disabled = !R.locReady;
    const loc = R.loc;
    const ch = loc ? chapterOf(loc.start.href) : '';
    const pg = !isScroll() && loc && loc.start.displayed ? ` · pág. ${loc.start.displayed.page}/${loc.start.displayed.total}` : '';
    l.textContent = `${ch ? ch + ' · ' : ''}${R.locReady ? pct + '%' : 'calculando…'}${pg}`;
  } else if (R.kind === 'article'){
    const f = R.item.progress || 0;
    s.value = Math.round(f * 1000); s.disabled = false;
    const left = R.item.words ? Math.round(R.item.words * (1 - f) / 230) : 0;
    l.textContent = `${Math.round(f * 100)}%${R.item.words ? ' · ' + (left ? `quedan ${left} min` : 'casi terminado') : ''}`;
  } else {
    const sp = isScroll() ? [R.page] : curSpread();
    s.value = sp[0] + 1; s.disabled = R.total < 2;
    const pages = sp.length > 1 ? `${sp[0] + 1}–${sp[1] + 1}` : `${sp[0] + 1}`;
    l.textContent = `Pág. ${pages} de ${R.total} · ${Math.round((R.item.progress || 0) * 100)}%`;
  }
}

/* ----- Marcadores ----- */
function currentMark(){
  const marks = R.item && R.item.marks || [];
  if (R.kind === 'article'){
    const b = $('#artBox'), f = artFrac(), span = b.scrollHeight > b.clientHeight ? b.clientHeight / (b.scrollHeight - b.clientHeight) / 2 : 1;
    return marks.find(m => Math.abs(+m.loc - f) <= span) || null;
  }
  if (R.kind === 'epub'){
    const loc = R.loc; if (!loc || !window.ePub) return null;
    const C = new ePub.CFI();
    return marks.find(m => { try{ return C.compare(m.loc, loc.start.cfi) >= 0 && C.compare(m.loc, loc.end.cfi) <= 0; }catch(e){ return false; } }) || null;
  }
  const sp = isScroll() ? [R.page] : curSpread();
  return marks.find(m => sp.includes(+m.loc)) || null;
}

$('#rMark').addEventListener('click', () => {
  if (!R.item) return;
