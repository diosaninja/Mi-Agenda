/* ----- Exportar ----- */
function exportBlocks(onlyNew){
  const it = R.item, out = [];
  if (isText()){
    (it.hl || []).slice().sort((a, b) => (a.pct || 0) - (b.pct || 0))
      .filter(h => !onlyNew || !h.exp)
      .forEach(h => out.push({ref:h, color:(HL[h.color] || HL.amarillo).ink,
        text:`“${h.text}”\n— ${h.ch ? h.ch + ' · ' : ''}${Math.round((h.pct || 0) * 100)}%${h.note ? '\n📝 ' + h.note : ''}`}));
  } else {
    const pn = it.pnotes || {};
    Object.keys(pn).map(Number).sort((a, b) => a - b).filter(p => !onlyNew || !pn[p].exp)
      .forEach(p => out.push({ref:pn[p], color:'#2B2A28', text:`Página ${p + 1}\n📝 ${pn[p].text}`}));
  }
  return out;
}
async function exportText(){
  const it = R.item;
  const bl = exportBlocks(false);
  if (!bl.length){ toast('Todavía no hay subrayados ni notas'); return ''; }
  return `📖 ${it.title}${it.author ? ' — ' + it.author : ''}\n${isText() ? 'Subrayados' : 'Notas'} · ${new Date().toLocaleDateString('es')}${it.url ? '\n' + it.url : ''}\n\n` + bl.map(b => b.text).join('\n\n');
}
function openIDB(name, ver, upg){
  return new Promise((res, rej) => {
    const r = indexedDB.open(name, ver);
    r.onupgradeneeded = () => upg && upg(r.result);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
function idbDo(db, st, mode, fn){
  return new Promise((res, rej) => {
    const t = db.transaction(st, mode); let out;
    const q = fn(t.objectStore(st)); if (q) q.onsuccess = () => { out = q.result; };
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
/* Escribe una libreta «📖 Título» en Mi Libreta (misma web, mismo aparato) */
async function exportToLibreta(){
  const it = R.item;
  const bl = exportBlocks(true);
  if (!bl.length){ toast(exportBlocks(false).length ? 'Ya está todo en Mi Libreta ✓' : 'Todavía no hay subrayados ni notas'); return; }
  try{
    const db = await openIDB('miLibreta', 1, d => ['nb', 'pg', 'files'].forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, {keyPath:'id'}); }));
    let nb = it.libNb ? await idbDo(db, 'nb', 'readonly', s => s.get(it.libNb)) : null;
    const now = Date.now();
    if (!nb){
      nb = {id:uid(), title:it.title, color:'#B5523B', sym:'📖', paper:'rayado', pc:'blanco', tags:['Lector'],
            pages:[], marks:[], fav:false, created:now, updated:now, last:0};
    }
    // Repartir los bloques en páginas de 1000 × 1414
    const cv = document.createElement('canvas').getContext('2d');
    const FS = 22, LH = FS * 1.35, X = 60, MW = 880, TOP = 70, BOTTOM = 1360;
    cv.font = `${FS}px "DM Sans",-apple-system,sans-serif`;
    const lines = t => { let n = 0; for (const para of t.split('\n')){ let line = '', c = 1; for (const w of para.split(/(\s+)/)){ const tt = line + w; if (cv.measureText(tt).width > MW && line.trim()){ c++; line = w.trimStart(); } else line = tt; } n += c; } return n; };
    const pages = []; let cur = null, y = 0;
    const newPg = () => { cur = {id:uid(), items:[]}; pages.push(cur); y = TOP; };
    newPg();
    const head = `${it.title}${it.author ? ' — ' + it.author : ''}\n${isText() ? 'Subrayados' : 'Notas'} del ${new Date().toLocaleDateString('es')}`;
    cur.items.push({id:uid(), type:'text', x:X, y, w:MW, text:head, size:30, color:'#B5523B', font:'serif'});
    y += 2 * 30 * 1.35 + 30;
    for (const b of bl){
      const h = lines(b.text) * LH;
      if (y + h > BOTTOM && cur.items.length) newPg();
      cur.items.push({id:uid(), type:'text', x:X, y, w:MW, text:b.text, size:FS, color:b.color, font:'ui'});
      y += h + 28;
    }
    for (const pg of pages){
      await idbDo(db, 'pg', 'readwrite', s => s.put({id:pg.id, nb:nb.id, paper:'rayado', pc:'blanco', w:1000, h:1414, bg:null, data:JSON.stringify({s:[], i:pg.items})}));
      nb.pages.push(pg.id);
    }
    nb.updated = now;
    await idbDo(db, 'nb', 'readwrite', s => s.put(nb));
    db.close();
    markSyncDirty('miLibreta');
    bl.forEach(b => { b.ref.exp = true; });
    it.libNb = nb.id; saveSoon();
    toast(`✓ ${bl.length} enviados a Mi Libreta («${it.title}»)`, {label:'Abrir Mi Libreta', fn: async () => { await saveNow(); location.href = 'libreta.html'; }});
    if (R.panelTab === 'subr' && !$('#sheet').hidden) openPanel('subr');
  }catch(e){ console.error(e); toast('No he podido escribir en Mi Libreta'); }
}
/* Avisar a la sincronización (sync.js) de que Mi Libreta ha cambiado */
function markSyncDirty(dbName){
  try{
    let has = false;
    for (let i = 0; i < localStorage.length; i++){ if ((localStorage.key(i) || '').startsWith('masync:')){ has = true; break; } }
    if (!has) return;
    const u = new TextEncoder().encode(dbName); let s = ''; for (const b of u) s += String.fromCharCode(b);
    const path = 'idb/' + btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '') + '.json';
    const d = JSON.parse(localStorage.getItem('masync:dirty') || '{}');
    d[path] = Date.now();
    localStorage.setItem('masync:dirty', JSON.stringify(d));
  }catch(e){}
}

/* =========================================================
   LÁPIZ: escribir encima de PDF e imágenes
   ========================================================= */
const inkKey = p => R.item.id + ':' + p;
async function getInk(p){
  if (!(p in R.ink)){ try{ R.ink[p] = (await DB.getInk(inkKey(p))) || []; }catch(e){ R.ink[p] = []; } }
  return R.ink[p];
}
let inkT = null;
function inkChanged(p){ R.inkDirty.add(p); clearTimeout(inkT); inkT = setTimeout(flushInk, 800); }
async function flushInk(){
  clearTimeout(inkT);
  if (!R.inkDirty || !R.item) return;
  const ps = [...R.inkDirty]; R.inkDirty.clear();
  for (const p of ps){ try{ await DB.putInk(inkKey(p), R.ink[p]); }catch(e){ console.warn(e); } }
}
function strokeWidth(s, W){ return s.w * W; }
function drawStroke(ctx, s, W, H){
  const T = TOOLS[s.t] || TOOLS.boli, pts = s.p;
  if (!pts || !pts.length) return;
  ctx.save();
  ctx.globalAlpha = T.a; ctx.strokeStyle = s.c; ctx.fillStyle = s.c;
  ctx.lineJoin = 'round'; ctx.lineCap = s.t === 'subrayador' ? 'square' : 'round';
  const bw = strokeWidth(s, W);
  if (pts.length === 1){ ctx.beginPath(); ctx.arc(pts[0][0] * W, pts[0][1] * H, bw / 2, 0, 7); ctx.fill(); ctx.restore(); return; }
  if (T.pressure){
    for (let i = 1; i < pts.length; i++){
      const a = pts[i - 1], b = pts[i];
      ctx.lineWidth = bw * (.45 + (b[2] ?? .5) * 1.1);
      ctx.beginPath(); ctx.moveTo(a[0] * W, a[1] * H); ctx.lineTo(b[0] * W, b[1] * H); ctx.stroke();
    }
  } else {
    ctx.lineWidth = bw;
    ctx.beginPath(); ctx.moveTo(pts[0][0] * W, pts[0][1] * H);
    for (let i = 1; i < pts.length - 1; i++){
      const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
      ctx.quadraticCurveTo(pts[i][0] * W, pts[i][1] * H, mx * W, my * H);
    }
    const l = pts[pts.length - 1]; ctx.lineTo(l[0] * W, l[1] * H);
    ctx.stroke();
  }
  ctx.restore();
}
function redrawInk(cv, p){
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, cv.width, cv.height);
  for (const s of (R.ink[p] || [])) drawStroke(ctx, s, cv.width, cv.height);
}
function attachInk(cv, p){
  // Con el Apple Pencil no se desplaza la página; con el dedo sí (salvo «dibujar con el dedo»)
  cv.addEventListener('touchstart', e => {
    if (!R.drawing) return;
    const t = e.touches[0];
    if (ajustes.dedo || (t && t.touchType === 'stylus')) e.preventDefault();
  }, {passive:false});
  let cur = null, rect = null;
  const pt = e => [clamp((e.clientX - rect.left) / rect.width, 0, 1), clamp((e.clientY - rect.top) / rect.height, 0, 1), e.pressure || .5];
  cv.addEventListener('pointerdown', e => {
    if (!R.drawing) return;
    if (e.pointerType === 'touch' && !ajustes.dedo) return;
    e.preventDefault();
    try{ cv.setPointerCapture(e.pointerId); }catch(x){}
    rect = cv.getBoundingClientRect();
    if (ajustes.tool === 'goma'){ cur = {erase:true, del:[]}; eraseAt(cv, p, pt(e), cur); return; }
    cur = {t:ajustes.tool, c:ajustes.inkColor[ajustes.tool] || '#2b2a28', w:TOOLS[ajustes.tool].w[ajustes.size] || TOOLS[ajustes.tool].w[1], p:[pt(e)]};
  });
  cv.addEventListener('pointermove', e => {
    if (!cur) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    if (cur.erase){ for (const ev of evs) eraseAt(cv, p, pt(ev), cur); return; }
    const ctx = cv.getContext('2d');
    for (const ev of evs){
      const q = pt(ev), last = cur.p[cur.p.length - 1];
      if (Math.abs(q[0] - last[0]) + Math.abs(q[1] - last[1]) < .0008) continue;
      cur.p.push(q);
      drawStroke(ctx, {...cur, p:[last, q]}, cv.width, cv.height);
    }
  });
  const end = () => {
    if (!cur) return;
    const c = cur; cur = null;

/* =========================================================
   LECTURA AUTOMÁTICA
   ========================================================= */
const SPEEDS = [8, 12, 17, 23, 30, 38, 48, 60, 75, 95];   // píxeles por segundo
function autoScrollEl(){
  if (R.kind === 'article') return $('#artBox');

  return $('#pages');
}
function autoLabel(){
  const b = $('#rAuto');

}
function autoStart(){
  if (!R.item) return;
  if (R.drawing) stopDrawing();
  if (T.open) ttsPause();
  R.auto = true;
  if (isScroll()){
    R.autoLast = performance.now(); R.acc = 0; R.stuck = 0;
    const step = t => {
      if (!R.auto) return;
      const el = autoScrollEl();
      const dt = Math.min(100, t - R.autoLast); R.autoLast = t;
      if (el && $('#sheet').hidden){
        R.acc += SPEEDS[ajustes.vel - 1] * dt / 1000;
        if (R.acc >= 1){
          const before = el.scrollTop; const n = Math.floor(R.acc);
          el.scrollTop += n; R.acc -= n;
          if (el.scrollTop === before){ R.stuck += dt; if (R.stuck > 2500){ autoStop(); reachedEnd(true); return; } } else R.stuck = 0;
        }
      }
      R.raf = requestAnimationFrame(step);
    };
    R.raf = requestAnimationFrame(step);
    toast(`▶︎ Scroll automático · velocidad ${ajustes.vel} (cámbiala en Aa)`);
  } else {
    R.autoT = setInterval(() => { if (!$('#sheet').hidden || R.sel) return; next(); }, ajustes.autoSec * 1000);
    toast(`▶︎ Pasaré la página cada ${ajustes.autoSec} s (cámbialo en Aa)`);
  }
  autoLabel();
}
function autoStop(){
  if (!R.auto){ autoLabel(); return; }
  R.auto = false; clearInterval(R.autoT); cancelAnimationFrame(R.raf);
  autoLabel();
}
$('#rAuto').addEventListener('click', () => R.auto ? autoStop() : autoStart());
function autoRestart(){ if (R.auto){ autoStop(); autoStart(); } }

const T = {open:false, playing:false, queue:[], i:0, token:0, lang:'es', langFixed:false, lastBlock:null, lastWin:null, empty:0};

function detectLang(sample){
  if (/[\u3040-\u30ff]/.test(sample)) return 'ja';
  const t = ' ' + String(sample).toLowerCase().replace(/[.,;:!?«»“”"()]/g, ' ') + ' ';

  const es = cnt(/ (el|los|las|que|una|del|por|con|para|es|y|se|lo|como|pero|más|muy) /g) + 3 * cnt(/[ñ¿¡]/g);
  const en = cnt(/ (the|and|of|to|is|that|with|for|was|this|are|you) /g);
  return fr > es && fr > en ? 'fr' : en > es && en > fr ? 'en' : 'es';

function voicesFor(lang){ return TTS_OK ? speechSynthesis.getVoices().filter(v => (v.lang || '').toLowerCase().replace('_', '-').startsWith(lang)) : []; }

    const pref = {es:'es-es', fr:'fr-fr', ja:'ja-jp', en:'en-gb'}[lang];
    const L = x => (x.lang || '').toLowerCase().replace('_', '-');
    v = vs.find(x => /premium|enhanced|mejorad|amélior|neural|natural/i.test(x.name) && L(x).startsWith(pref))
      || vs.find(x => L(x).startsWith(pref) && x.localService)
      || vs.find(x => L(x).startsWith(pref)) || vs.find(x => x.localService) || vs[0];

}
const segCache = {};
function sentences(text, lang){
  const out = [];

    const text = b.textContent;

/* Cola de frases según el tipo de archivo y dónde estás leyendo */
async function ttsBuild(fromSel){
  T.queue = []; T.i = 0;
  if (R.kind === 'article'){
    const root = R.artRoot, blocks = blocksOf(root);
    if (!T.langFixed) T.lang = detectLang(root.textContent.slice(0, 3000));
    let sb = null, so = null;
    if (fromSel && fromSel.art){ sb = closestBlock(fromSel.range.startContainer, root); if (sb) so = pointToOffset(sb, fromSel.range.startContainer, fromSel.range.startOffset); }
    if (!sb){ const br = $('#artBox').getBoundingClientRect(); sb = blocks.find(b => b.getBoundingClientRect().bottom > br.top + 30) || blocks[0]; }
    T.queue = itemsFromBlocks(blocks, sb, so);
  } else if (R.kind === 'epub'){
    const loc = R.rend.currentLocation();
    const conts = R.rend.getContents() || [];
    let c = conts.find(x => loc && loc.start && x.sectionIndex === loc.start.index) || conts[0];
    if (fromSel && fromSel.contents) c = fromSel.contents;
    if (!c) return;
    T.section = c.sectionIndex;
    const root = c.document.body, blocks = blocksOf(root);
    if (!T.langFixed){
      const ml = (R.book.packaging && R.book.packaging.metadata && R.book.packaging.metadata.language || '').slice(0, 2).toLowerCase();
      T.lang = LANGS[ml] ? ml : detectLang(root.textContent.slice(0, 3000));
    }
    let sb = null, so = null;
    if (fromSel && fromSel.contents){
      try{ const r = c.range(fromSel.cfi); sb = closestBlock(r.startContainer, root); if (sb) so = pointToOffset(sb, r.startContainer, r.startOffset); }catch(e){}
    } else if (loc && loc.start){
      try{ const r = c.range(loc.start.cfi); sb = closestBlock(r.startContainer, root) || null; }catch(e){}
    }
    T.queue = itemsFromBlocks(blocks, sb, so, {contents:c});
  } else if (R.kind === 'pdf'){
    const pages = isScroll() ? [R.page] : curSpread();
    for (const p of pages){
      let text = '';
      try{
        const pg = await R.pdf.getPage(p + 1); const tc = await pg.getTextContent();
        for (const it of tc.items) text += (it.str || '') + (it.hasEOL ? '\n' : (it.str && !/\s$/.test(it.str) ? ' ' : ''));
      }catch(e){}
      text = text.replace(/-\n(?=\p{Ll})/gu, '').replace(/\s+/g, ' ').trim();
      if (!T.langFixed && text.length > 40) T.lang = detectLang(text.slice(0, 3000));

}
function ttsLabels(){
  $('#ttsPlay').textContent = T.playing ? '⏸' : '▶︎';
  $('#ttsRate').textContent = String(ajustes.ttsRate || 1).replace('.', ',') + '×';
  $('#ttsVoice').textContent = '🗣️ ' + T.lang.toUpperCase();
  $('#ttsSleep').textContent = T.sleepAt ? '⏾ ' + Math.max(1, Math.round((T.sleepAt - Date.now()) / 60000)) + ' min' : '⏾';

function ttsUnmark(){

}
async function ttsShow(it){

  if (!it.block) return;
  if (T.lastBlock !== it.block){ ttsUnmark(); it.block.classList.add('tts-on'); T.lastBlock = it.block; }
  let r = null;
  try{ r = rangeIn(it.block, it.s, it.e); }catch(e){}
  try{
    const w = it.win; T.lastWin = w;
    if (r && w.CSS && w.CSS.highlights && w.Highlight) w.CSS.highlights.set('tts', new w.Highlight(r));
  }catch(e){}
  // Que la frase se vea: desplazar o pasar la página
  if (R.kind === 'article'){
    const box = $('#artBox'), br = box.getBoundingClientRect(), rr = (r || it.block).getBoundingClientRect();

function ttsSpeak(){

/* Fin de la cola: capítulo, página o artículo siguiente */
async function ttsAdvance(){

  if (R.kind === 'epub'){
    const next = R.book.spine.get((T.section ?? -1) + 1);
    if (!next){ ttsPause(); reachedEnd(true); toast('🎧 Fin del libro'); return; }
    try{ await R.rend.display(next.href); }catch(e){}
    if (tok !== T.token) return;
    const c = (R.rend.getContents() || []).find(x => x.sectionIndex === next.index);
    if (!c){ ttsPause(); return; }
    T.section = next.index;
    T.queue = itemsFromBlocks(blocksOf(c.document.body), null, null, {contents:c}); T.i = 0;
    if (!T.queue.length){ ttsAdvance(); return; }

    goPage(last + 1);

    if (tok !== T.token) return;

      T.empty++;
      if (T.empty >= 3){ ttsPause(); toast('Estas páginas son imágenes escaneadas: no tienen texto para leer en voz alta'); return; }

  else if (a === 'sleep'){
    const opts = [0, 15, 30, 45, 60];
    const cur = T.sleepAt ? Math.round((T.sleepAt - Date.now()) / 60000) : 0;
    const nxt = opts.find(m => m > cur + 1) || 0;
    clearTimeout(T.sleepT); T.sleepAt = 0;
    if (nxt){ T.sleepAt = Date.now() + nxt * 60000; T.sleepT = setTimeout(() => { ttsPause(); T.sleepAt = 0; ttsLabels(); toast('⏾ Lectura parada. ¡Buenas noches!'); }, nxt * 60000); toast(`⏾ Pararé de leer dentro de ${nxt} min`); }
    else toast('⏾ Temporizador quitado');
    ttsLabels();
  }
  else if (a === 'close') ttsClose();
});
function voiceSheet(){
  const draw = () => {
    const vs = voicesFor(T.lang), cur = pickVoice(T.lang);
    sheet(`<h3>🗣️ Voz e idioma</h3>
      <div class="lbl">Idioma del texto</div>
      <div class="seg" id="vL">${Object.entries(LANGS).map(([k, n]) => `<button data-l="${k}" class="${T.lang === k ? 'on' : ''}">${n}</button>`).join('')}</div>
      <div class="lbl">Voz</div>
      <div class="vlist" id="vV">${vs.length ? vs.map(v => `<button data-v="${esc(v.voiceURI)}" class="${cur && cur.voiceURI === v.voiceURI ? 'on' : ''}"><span>${esc(v.name)}</span><small>${esc(v.lang)}${/premium|enhanced|mejorad|amélior/i.test(v.name) ? ' · ✨ mejorada' : ''}</small></button>`).join('')
        : '<div class="info">No hay voces de este idioma en el aparato.</div>'}</div>
      <div class="info">✨ Para voces más naturales, en el iPad ve a <b>Ajustes › Accesibilidad › Contenido leído › Voces</b> y descarga una voz «mejorada» o «premium» (por ejemplo Mónica o Jorge en español, Amélie o Thomas en francés, Kyoko en japonés). Después aparecerá aquí.</div>
      <div class="actions"><button class="btn ghost" id="vTest">🔈 Probar</button><span class="sp"></span><button class="btn" data-close>Listo</button></div>`);
    $('#vL').onclick = e => { const b = e.target.closest('[data-l]'); if (!b) return; T.lang = b.dataset.l; T.langFixed = true; ttsLabels(); draw(); if (T.playing){ ttsPause(); ttsPlay(); } };
    $('#vV').onclick = e => { const b = e.target.closest('[data-v]'); if (!b) return; ajustes.ttsVoice = Object.assign({}, ajustes.ttsVoice, {[T.lang]:b.dataset.v}); saveAjustes(); draw(); if (T.playing){ ttsPause(); ttsPlay(); } };
    $('#vTest').onclick = () => {
      const u = new SpeechSynthesisUtterance({es:'Hola, así sonará tu lectura.', fr:'Bonjour, voici comment sonnera votre lecture.', ja:'こんにちは。読書を楽しみましょう。', en:'Hello, this is how your reading will sound.'}[T.lang]);
      const v = pickVoice(T.lang); if (v) u.voice = v; u.lang = v ? v.lang : T.lang; u.rate = ajustes.ttsRate || 1;
      const was = T.playing; if (was) ttsPause(); speechSynthesis.cancel(); speechSynthesis.speak(u);
    };
  };
  draw();
}

/* ----- Ajustes de lectura ----- */
$('#rSet').addEventListener('click', settingsSheet);
function settingsSheet(){
  const isE = isText(), isA = R.kind === 'article';
  const seg = (key, opts) => `<div class="seg" data-key="${key}">${opts.map(([v, n]) => `<button data-v="${v}" class="${String(ajustes[key]) === String(v) ? 'on' : ''}">${n}</button>`).join('')}</div>`;
  const p = sheet(`<h3>Aa Ajustes de lectura</h3>
    <div class="lbl">Papel</div>
    <div class="swatches">${Object.entries(THEMES).map(([k, t]) => `<button class="sw ${ajustes.theme === k ? 'on' : ''}" data-theme="${k}" style="background:${t.bg};color:${t.fg};border-color:${ajustes.theme === k ? '' : t.line}">${t.n}</button>`).join('')}</div>
    <div class="lbl">Modo de lectura</div>
    ${seg('modo', [['paginas', '📄 Páginas'], ['scroll', '📜 Scroll continuo']])}
    <div id="modoPag" ${isScroll() ? 'hidden' : ''}>
      <div ${isA ? 'hidden' : ''}><div class="lbl">Páginas</div>
      ${seg('doble', [['auto', 'Automático'], ['no', '1 página'], ['si', '2 páginas']])}
      <div class="info">Automático: 2 páginas con el iPad en horizontal.</div></div>
      <div class="lbl">▶︎ Pasar página sola cada</div>
      <div class="step"><button data-sec="-1">−</button><output id="secO">${ajustes.autoSec} s</output><button data-sec="1">+</button></div>
    </div>
    <div id="modoScr" ${isScroll() ? '' : 'hidden'}>
      <div class="lbl">▶︎ Velocidad del scroll automático</div>
      <div class="step"><button data-vel="-1">🐢</button><output id="velO">${ajustes.vel} / 10</output><button data-vel="1">🐇</button></div>
    </div>
    <div class="info">Pulsa ▶︎ abajo a la izquierda para empezar la lectura automática y ⏸ para pararla.</div>
    ${isE ? `
      <div class="lbl">Tamaño de letra</div>
      <div class="step"><button data-fs="-10">A−</button><output id="fsO">${ajustes.fontSize}%</output><button data-fs="10">A+</button></div>
      <div class="lbl">Tipo de letra</div>
      ${seg('font', [['original', 'Original'], ['serif', 'Serif'], ['sans', 'Sans']])}
      <div class="lbl">Interlineado</div>
      ${seg('lh', [[1.3, 'Junto'], [1.6, 'Normal'], [1.9, 'Amplio']])}
    ` : `
      <div class="lbl">Ajustar</div>
      ${seg('fit', [['pagina', 'Página entera'], ['ancho', 'Al ancho']])}
      <div class="lbl">Zoom</div>
      <div class="step"><button data-z="-0.25">−</button><output id="zO">${Math.round(ajustes.zoom * 100)}%</output><button data-z="0.25">+</button></div>
    `}
    <div class="actions"><span class="sp"></span><button class="btn" data-close>Listo</button></div>`);
  const SECS = [5, 10, 15, 20, 30, 45, 60, 90, 120, 180, 300];
  p.addEventListener('click', async e => {
    const th = e.target.closest('[data-theme]');
    if (th){
      ajustes.theme = th.dataset.theme; saveAjustes(); applyTheme();
      p.querySelectorAll('[data-theme]').forEach(b => { const t = THEMES[b.dataset.theme]; const on = b === th; b.classList.toggle('on', on); b.style.borderColor = on ? '' : t.line; });
      return;
    }
    const sb = e.target.closest('.seg [data-v]');
    if (sb){
      const key = sb.parentElement.dataset.key; let v = sb.dataset.v;
      if (key === 'lh') v = parseFloat(v);
      if (ajustes[key] === v) return;
      ajustes[key] = v; saveAjustes();
      [...sb.parentElement.children].forEach(b => b.classList.toggle('on', b === sb));
      if (key === 'modo'){
        $('#modoPag').hidden = isScroll(); $('#modoScr').hidden = !isScroll();
        const was = R.auto; autoStop();
        await changeModo();
        if (was) autoStart();
      }
      else if (key === 'doble') relayout(true);
      else if (key === 'fit') renderPages();
      else applyTextStyle();
      return;
    }
    const sec = e.target.closest('[data-sec]');
    if (sec){
      let i = SECS.indexOf(ajustes.autoSec); if (i < 0) i = 4;
      ajustes.autoSec = SECS[clamp(i + +sec.dataset.sec, 0, SECS.length - 1)];
      saveAjustes(); $('#secO').textContent = ajustes.autoSec + ' s'; autoRestart(); return;
    }
    const vel = e.target.closest('[data-vel]');
    if (vel){ ajustes.vel = clamp(ajustes.vel + +vel.dataset.vel, 1, 10); saveAjustes(); $('#velO').textContent = ajustes.vel + ' / 10'; autoLabel(); return; }
    const fs = e.target.closest('[data-fs]');
    if (fs){
      ajustes.fontSize = clamp(ajustes.fontSize + +fs.dataset.fs, 60, 220);
      saveAjustes(); $('#fsO').textContent = ajustes.fontSize + '%'; applyTextStyle(); return;
    }
    const z = e.target.closest('[data-z]');
    if (z){
      ajustes.zoom = clamp((ajustes.zoom || 1) + +z.dataset.z, .5, 4);
      saveAjustes(); $('#zO').textContent = Math.round(ajustes.zoom * 100) + '%'; renderPages();
    }
  });
}
async function changeModo(){
  if (!R.item) return;
  updateDoble();
  if (R.kind === 'article'){ updateLabel(); return; }
  if (R.kind === 'epub'){
    busy('Cambiando el modo…');
    try{ await makeRendition(); }catch(e){ console.error(e); }
    unbusy();
  } else {
    await renderPages();
  }
  updateLabel();
}

function relayout(force){
  if (!R.item) return;
  const was = R.double; updateDoble();
  if (R.kind === 'article') return;
  if (R.kind === 'epub'){
    if (!isScroll() && (force || was !== R.double)){ try{ R.rend.spread(R.double ? 'always' : 'none', 0); }catch(e){} }
  } else { if (!isScroll()) normalizePage(); renderPages(); }
}
let resT = null, lastW = innerWidth, lastH = innerHeight;
window.addEventListener('resize', () => {
  clearTimeout(resT);
  resT = setTimeout(() => {
    if (Math.abs(innerWidth - lastW) < 2 && Math.abs(innerHeight - lastH) < 60) return; // teclado, barras…
    lastW = innerWidth; lastH = innerHeight;
    relayout(false);
  }, 250);
});
document.addEventListener('visibilitychange', () => { if (document.hidden){ saveNow(); autoStop(); if (T.playing) ttsPause(); } });
window.addEventListener('pagehide', saveNow);

/* ---------- Inicio ---------- */
(async function init(){
  try{
    await DB.open();
    fileIds = new Set((await DB.fileKeys()) || []);
    items = (await DB.all()) || [];
  }catch(e){
    console.error(e);
    toast('No he podido abrir la biblioteca de este aparato');
  }
  render();
  await migrateOld().catch(e => console.warn(e));
  // Abrir directamente: lector.html?abrir=ID (desde el separador de libros) o #ID al volver
  const want = new URLSearchParams(location.search).get('abrir') || decodeURIComponent(location.hash.slice(1));
  if (want && items.some(i => i.id === want)) openItem(want);
  if (!window.ePub || !window.pdfjsLib) toast('Sin conexión: el lector necesita internet la primera vez que se abre');
})();
</script>
