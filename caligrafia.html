<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Cuaderno de Caligrafía</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&family=Nunito:wght@400;600;700;800&family=Andika&family=Dancing+Script&family=Caveat&family=Great+Vibes&family=Parisienne&family=Klee+One&family=Zen+Maru+Gothic:wght@400;500&family=Yuji+Syuku&family=Kosugi+Maru&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ece6da; --panel:#fbf8f2; --ink:#23263a; --muted:#77737f; --line:#e4dccd;
  --chip:#f2ede3; --accent:#b5543c; --accent-soft:#f5e3dc; --ok:#2f6f5e;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Nunito",system-ui,sans-serif;background:var(--bg);color:var(--ink);
  display:flex;flex-direction:column;overflow:hidden;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:inherit}
textarea,input[type=text]{-webkit-user-select:text;user-select:text}

/* ---------- barra superior ---------- */
.bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:8px 12px;
  background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:30}
.brand{display:flex;align-items:baseline;gap:6px;font-family:"Fraunces",serif;font-weight:600;font-size:19px;margin-right:4px;white-space:nowrap}
.brand small{font-family:"Klee One",serif;font-size:13px;color:var(--accent);font-weight:400}
.streak{font-family:"Nunito";font-size:12.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);
  padding:2px 8px;border-radius:99px;align-self:center}
.grp{display:flex;align-items:center;gap:3px;padding:3px;background:var(--chip);border-radius:13px}
.ib{min-width:40px;height:40px;border:0;background:transparent;border-radius:10px;display:grid;place-items:center;
  cursor:pointer;padding:0 6px;transition:background .15s,color .15s}
.ib:hover{background:#e7e0d2}
.ib.on{background:var(--ink);color:#fff}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ib:disabled{opacity:.35}
.tool{flex-direction:column;gap:1px;height:46px;min-width:52px}
.tool span{font-size:10px;font-weight:700;letter-spacing:.01em}
.sizewrap{display:flex;align-items:center;gap:8px;padding:0 8px;height:40px}
.sizewrap input{width:110px}
.dotprev{width:30px;height:30px;display:grid;place-items:center}
.dotprev i{display:block;border-radius:50%;background:var(--ink)}
.val{font-size:12px;font-weight:700;min-width:28px;color:var(--muted)}
.curcolor{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer;margin:0 4px}
.qc{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.12);cursor:pointer;padding:0}
.qc.on{box-shadow:0 0 0 2px var(--ink)}
.navlbl{font-size:13px;font-weight:700;min-width:76px;text-align:center}
.chipbtn{height:40px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:0 12px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px}
.chipbtn.on{background:var(--ok);border-color:var(--ok);color:#fff}
#btnExam.on,#btnCompare.on{background:#c0392b;border-color:#c0392b}
.so-stage{display:grid;place-items:center;margin:6px 0 10px}
.so-stage svg{width:250px;height:250px;background:#fffdf8;border:1.5px solid var(--line);border-radius:14px}
.so-ctrl{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
.so-chars{display:flex;flex-wrap:wrap;gap:5px;max-height:150px;overflow:auto;padding:2px}
.so-chars button{width:38px;height:38px;border:1.5px solid var(--line);background:#fff;border-radius:9px;font-family:'Klee One',serif;font-size:20px;cursor:pointer}
.so-chars button.on{border-color:var(--accent);background:var(--accent-soft)}
.so-info{text-align:center;font-weight:700;font-size:13px;color:var(--muted);margin-bottom:6px}
.save-pill{font-size:11.5px;color:var(--muted);margin-left:auto;display:flex;align-items:center;gap:5px;white-space:nowrap}
.save-pill i{width:8px;height:8px;border-radius:50%;background:#c9c2b4;display:inline-block}
.save-pill.ok i{background:var(--ok)} .save-pill.err i{background:var(--accent)} .save-pill.busy i{background:#d4a72c}
input[type=range]{accent-color:var(--accent)}

/* ---------- popover color ---------- */
.pop{position:absolute;z-index:50;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;
  box-shadow:0 18px 40px -12px rgba(40,30,20,.35);width:290px}
.pop h5{margin:0 0 10px;font-size:13px}
.palgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px}
.palgrid button{aspect-ratio:1;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15);cursor:pointer;position:relative;padding:0}
.palgrid button.on{box-shadow:0 0 0 2.5px var(--ink)}
.palgrid.edit button::after{content:"×";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;text-shadow:0 0 3px #000}
.poprow{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.poprow input[type=color]{width:44px;height:36px;border:0;padding:0;background:none;cursor:pointer}
.hidden{display:none!important}

/* ---------- layout ---------- */
main{flex:1;display:flex;min-height:0;position:relative}
aside{width:340px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;transition:margin-left .25s ease;z-index:20}
body:not(.panel-open) aside{margin-left:-341px}
@media (max-width:900px){
  aside{position:absolute;top:0;bottom:0;left:0;box-shadow:12px 0 30px -12px rgba(0,0,0,.3)}
}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 6px}
.tabs button{flex:1;border:0;background:none;padding:12px 2px 10px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;position:relative}
.tabs button.on{color:var(--ink);border-color:var(--accent)}
.tabs button .badge{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
#tabBody{overflow:auto;padding:6px 18px 60px;flex:1;-webkit-overflow-scrolling:touch}
#tabBody h4{font-family:"Fraunces",serif;font-weight:600;font-size:15px;margin:20px 0 10px}
.fld{margin-bottom:14px}
.fld label.l{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:6px}
.fld label.l b{color:var(--accent);font-weight:800}
.fld input[type=range]{width:100%}
select,textarea,.tin{width:100%;border:1.5px solid var(--line);border-radius:11px;background:#fff;padding:10px 11px;font-size:14px}
textarea{min-height:90px;resize:vertical}
.seg{display:flex;background:var(--chip);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 4px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;cursor:pointer;margin:6px 0 14px}
.chk input{width:18px;height:18px;accent-color:var(--accent);margin:1px 0 0}
.fontprev{margin-top:8px;padding:10px 12px;border-radius:11px;background:#fff;border:1px dashed var(--line);font-size:26px;line-height:1.3;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.btn{border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:10px 14px;font-weight:700;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--accent)}
.btn.block{width:100%}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:9px}
.link{border:0;background:none;color:var(--accent);font-weight:700;font-size:13px;padding:6px 0;cursor:pointer}
.note{font-size:12.5px;color:var(--muted);line-height:1.45}
.callout{background:var(--accent-soft);border-radius:12px;padding:12px;font-size:13px;line-height:1.45;margin:10px 0}
.callout.ok{background:#e3efe9}
.ptypes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.ptypes button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700}
.ptypes button.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.ptypes svg{width:100%;height:38px}
.pcolors{display:flex;gap:10px;flex-wrap:wrap}
.pcolors button{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);cursor:pointer}
.pcolors button.on{box-shadow:0 0 0 2.5px var(--accent)}
.list{display:flex;flex-direction:column;gap:8px}
.item{border:1.5px solid var(--line);background:#fff;border-radius:13px;padding:10px 12px}
.item.on{border-color:var(--accent)}
.item .t{font-weight:800;font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.item .m{font-size:12px;color:var(--muted);margin:2px 0 8px}
.item .a{display:flex;gap:6px;flex-wrap:wrap}
.fontitem .fp{font-size:24px;margin:4px 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{display:flex;gap:10px}
.stat div{flex:1;background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:10px;text-align:center}
.stat b{display:block;font-family:"Fraunces",serif;font-size:24px}
.stat span{font-size:11.5px;color:var(--muted)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* ---------- zona de trabajo ---------- */
.ws{flex:1;overflow:auto;touch-action:pan-x pan-y;padding:26px 24px 60px;-webkit-overflow-scrolling:touch}
.page{position:relative;margin:0 auto;aspect-ratio:1240/1754;border-radius:3px;overflow:hidden;background:#fff;
  box-shadow:0 1px 2px rgba(0,0,0,.08),0 18px 36px -14px rgba(60,40,20,.35)}
.page canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#live{touch-action:none;cursor:crosshair;-webkit-touch-callout:none}

/* ---------- diálogo / aviso ---------- */
.dlg{position:fixed;inset:0;background:rgba(35,38,58,.35);display:grid;place-items:center;z-index:100;padding:20px}
.dlgbox{background:#fff;border-radius:18px;padding:20px;width:min(420px,100%);box-shadow:0 30px 60px -20px rgba(0,0,0,.4);max-height:90vh;overflow:auto}
.dlgbox h3{margin:0 0 8px;font-family:"Fraunces",serif;font-weight:600}
.dlgbody{font-size:14px;line-height:1.5;color:#45434d}
.dlgbody img{max-width:100%;border:1px solid var(--line);border-radius:6px;margin-top:8px}
.dlgbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:120;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body class="panel-open">

<header class="bar">
  <button class="ib" id="btnPanel" title="Mostrar u ocultar panel">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <div class="brand">Caligrafía <small>書道ノート</small></div>
  <span class="streak hidden" id="streakPill"></span>

  <div class="grp" id="tools"></div>

  <div class="grp">
    <div class="sizewrap">
      <div class="dotprev"><i id="sizeDot"></i></div>
      <input type="range" id="size" min="1" max="60" step="0.5" aria-label="Grosor">
      <span class="val" id="sizeVal"></span>
    </div>
    <div class="sizewrap hidden" id="nibWrap" title="Ángulo de la pluma">
      <svg viewBox="0 0 24 24" width="18" height="18" style="stroke:currentColor;fill:none;stroke-width:1.7"><path d="M4 20h16M4 20L16 6"/></svg>
      <input type="range" id="nibAngle" min="0" max="90" step="1" style="width:80px" aria-label="Ángulo de la pluma">
      <span class="val" id="nibVal"></span>
    </div>
  </div>

  <div class="grp" style="padding:3px 8px 3px 3px">
    <button class="curcolor" id="btnColor" title="Paleta de color"></button>
    <div id="quickColors" style="display:flex;gap:6px"></div>
  </div>

  <div class="grp">
    <button class="ib" id="btnUndo" title="Deshacer"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="ib" id="btnRedo" title="Rehacer"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <button class="ib" id="btnClear" title="Borrar mi escritura de esta hoja"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
  </div>

  <div class="grp">
    <button class="ib" id="btnPrev" title="Hoja anterior"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <span class="navlbl" id="pageLbl"></span>
    <button class="ib" id="btnNext" title="Hoja siguiente"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>

  <div class="grp">
    <button class="ib" id="btnZoomOut" title="Alejar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M8 11h6M20 20l-4.5-4.5"/></svg></button>
    <button class="ib" id="btnZoomIn" title="Acercar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M8 11h6M11 8v6M20 20l-4.5-4.5"/></svg></button>
  </div>

  <a class="chipbtn hidden" id="backAgenda" href="./" style="text-decoration:none">← Mi Agenda</a>
  <button class="chipbtn" id="btnStroke" title="Ver el orden de los trazos (hiragana y katakana)"><span style="font-family:'Klee One',serif">書き順</span> Trazos</button>
  <button class="chipbtn" id="btnExam" title="Escribe de memoria y luego compara">🎯 Examen</button>
  <button class="chipbtn hidden" id="btnCompare" title="Muestra la forma correcta debajo de tu escritura">👁 Comparar</button>
  <button class="chipbtn" id="btnPenOnly" title="Ignora los dedos y la palma: solo dibuja el Apple Pencil o el ratón. Con un dedo te desplazas.">
    ✎ Solo lápiz
  </button>
  <span class="save-pill" id="savePill"><i></i><span>Preparando…</span></span>
</header>

<div class="pop hidden" id="colorPop">
  <h5>Paleta de color</h5>
  <div class="palgrid" id="palGrid"></div>
  <div class="poprow">
    <input type="color" id="colorPick" aria-label="Elegir color">
    <button class="btn sm" id="addColor">+ Añadir a mi paleta</button>
  </div>
  <label class="chk" style="margin:0 0 8px"><input type="checkbox" id="editPal"> Quitar colores (toca uno para eliminarlo)</label>
  <button class="link" id="resetPal">Restaurar paleta original</button>
</div>

<main>
  <aside id="panel">
    <nav class="tabs" id="tabs">
      <button data-tab="tpl">Plantilla</button>
      <button data-tab="paper">Papel</button>
      <button data-tab="fonts">Fuentes</button>
      <button data-tab="sheets">Hojas</button>
      <button data-tab="backup">Copia</button>
    </nav>
    <div id="tabBody"></div>
  </aside>

  <div class="ws" id="ws">
    <div class="page" id="page">
      <canvas id="paper" width="1240" height="1754"></canvas>
      <canvas id="ink" width="1240" height="1754"></canvas>
      <canvas id="live" width="1240" height="1754"></canvas>
    </div>
  </div>
</main>

<div class="dlg hidden" id="dlg"><div class="dlgbox"><h3 id="dlgTitle"></h3><div class="dlgbody" id="dlgBody"></div><div class="dlgbtns" id="dlgBtns"></div></div></div>
<div id="toast"></div>

<script>
(()=>{
"use strict";

const LOW='abcdefghijklmnñopqrstuvwxyz'.split('');
const HIRA=[...'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん'];

  const n=parseInt(h,16);const r=(n>>16)&255,g=(n>>8)&255,b=n&255;return (0.299*r+0.587*g+0.114*b)/255}
const isDark=h=>hexLum(h)<0.45;
function bufToB64(buf){const u=new Uint8Array(buf);let s='';const CH=0x8000;
  for(let i=0;i<u.length;i+=CH)s+=String.fromCharCode.apply(null,u.subarray(i,i+CH));return btoa(s)}
function b64ToBuf(b){const s=atob(b);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer}
function fontStack(fam){return `"${fam}", "Quicksand", "Klee One", sans-serif`}
function fontLabel(fam){const u=state.fonts.find(f=>f.family===fam);if(u)return u.name;
  const b=BUILTIN_FONTS.find(f=>f.family===fam);return b?b.label:fam}
function fmtDate(t){if(!t)return'—';const d=new Date(t);return d.toLocaleDateString('es-ES',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}
function withTimeout(p,ms){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),ms))])}

let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)}

/* =========================================================
   Guardado: este dispositivo (IndexedDB) + tu cuenta (db)
   ========================================================= */
let idb=null;
function idbOpen(){return new Promise((res,rej)=>{try{const r=indexedDB.open('cuaderno-caligrafia',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
function kv(mode,fn){return new Promise((res,rej)=>{try{const tx=idb.transaction('kv',mode);const st=tx.objectStore('kv');
  const r=fn(st);tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error)}catch(e){rej(e)}})}
const kvGet=k=>kv('readonly',st=>st.get(k));
const kvSet=(k,v)=>kv('readwrite',st=>st.put(v,k));
const kvDel=k=>kv('readwrite',st=>st.delete(k));

const mkDirty=()=>({state:false,sheets:new Set(),fonts:new Set(),del:new Set()});
const dirty={local:mkDirty(),cloud:mkDirty()};
let localTimer=null,cloudTimer=null;

function touch(kind,id){
  for(const d of [dirty.local,dirty.cloud]){
    d.state=true;
    if(kind==='sheet')d.sheets.add(id);
    if(kind==='font')d.fonts.add(id);
    if(kind==='del')d.del.add(id);
  }
  state.updatedAt=Date.now();
  clearTimeout(localTimer);localTimer=setTimeout(flushLocal,500);
  clearTimeout(cloudTimer);cloudTimer=setTimeout(flushCloud,2500);
  if(!cloud.ok)setPill(idb?'ok':'err',idb?'Guardado en este dispositivo':'Sin guardado: descarga una copia');
}
function markAll(d){d.state=true;state.sheets.forEach(s=>d.sheets.add(s.id));state.fonts.forEach(f=>d.fonts.add(f.id))}

async function flushLocal(){
  if(!idb)return;
  const d=dirty.local;const sh=[...d.sheets],fo=[...d.fonts],de=[...d.del];
  d.state=false;d.sheets.clear();d.fonts.clear();d.del.clear();
  try{
    await kvSet('state',JSON.stringify(state));
    for(const id of sh)if(state.sheets.some(s=>s.id===id))await kvSet('sheet-'+id,JSON.stringify(strokes[id]||[]));
    for(const id of fo)if(fontData[id])await kvSet('font-'+id,fontData[id]);
    for(const k of de)await kvDel(k);
  }catch(e){setPill('err','No se pudo guardar en el dispositivo')}
}

const cloud={ok:false,busy:false,again:false,col:null,stateDoc:null,blobs:{}};
const CHUNK=180000;
async function putBlob(key,str){
  const n=Math.max(1,Math.ceil(str.length/CHUNK));
  for(let i=0;i<n;i++)await cloud.col.doc(`b_${key}_${i}`).set({d:str.slice(i*CHUNK,(i+1)*CHUNK)});
  const old=cloud.blobs[key]||0;
  for(let i=n;i<old;i++)await cloud.col.doc(`b_${key}_${i}`).delete();
  cloud.blobs[key]=n;
}
async function getBlob(key,n){
  const parts=await Promise.all(Array.from({length:n},(_,i)=>cloud.col.doc(`b_${key}_${i}`).get()));
  return parts.map(p=>p.exists?(p.data().d||''):'').join('');
}
async function delBlob(key){const n=cloud.blobs[key]||0;for(let i=0;i<n;i++)await cloud.col.doc(`b_${key}_${i}`).delete();delete cloud.blobs[key]}

async function flushCloud(){
  if(!cloud.ok)return;
  if(cloud.busy){cloud.again=true;return}
  const d=dirty.cloud;
  if(!d.state&&!d.sheets.size&&!d.fonts.size&&!d.del.size)return;
  cloud.busy=true;
  const sh=[...d.sheets],fo=[...d.fonts],de=[...d.del];
  d.state=false;d.sheets.clear();d.fonts.clear();d.del.clear();
  setPill('busy','Guardando en tu cuenta…');
  try{
    for(const id of sh)if(state.sheets.some(s=>s.id===id))await putBlob('sheet-'+id,JSON.stringify(strokes[id]||[]));
    for(const id of fo)if(fontData[id])await putBlob('font-'+id,fontData[id]);
    for(const k of de)await delBlob(k);
    await cloud.stateDoc.set({updatedAt:state.updatedAt,json:JSON.stringify(state),blobs:cloud.blobs});
    setPill('ok','Guardado en tu cuenta · '+new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){
    sh.forEach(x=>d.sheets.add(x));fo.forEach(x=>d.fonts.add(x));de.forEach(x=>d.del.add(x));d.state=true;
    if(e&&e.code==='quota_exceeded')setPill('err','Tu espacio en la nube está lleno: descarga una copia');
    else if(e&&e.code==='revoked'){cloud.ok=false;setPill('ok','Guardado en este dispositivo')}
    else{setPill('err','No se pudo subir · reintentando');clearTimeout(cloudTimer);cloudTimer=setTimeout(flushCloud,8000)}
  }finally{
    cloud.busy=false;
    if(cloud.again){cloud.again=false;flushCloud()}
  }
}

function setPill(kind,text){const p=$('#savePill');p.className='save-pill '+kind;p.querySelector('span').textContent=text;
  if(state.settings.tab==='backup'){const s=$('#cloudStatus');if(s)s.textContent=text}}

async function getCap(name){
  for(let i=0;i<40;i++){if(window.claude&&typeof window.claude.use==='function'){try{return await window.claude.use(name)}catch(e){return null}}await sleep(100)}
  return null;
}

async function initCloud(){
  const [db,user]=await Promise.all([getCap('db'),getCap('user')]);
  if(!db||!user){setPill(idb?'ok':'err',idb?'Guardado en este dispositivo':'Sin guardado: descarga una copia');return}
  let id=null;try{id=await user.id()}catch(e){}
  if(!id){setPill('ok','Guardado en este dispositivo');return}
  cloud.col=db.collection('data/users/'+id);
  cloud.stateDoc=cloud.col.doc('state');
  try{
    setPill('busy','Conectando con tu cuenta…');
    const snap=await withTimeout(cloud.stateDoc.get(),10000);
    if(snap.exists){
      const d=snap.data();cloud.blobs={...(d.blobs||{})};
      if((d.updatedAt||0)>(state.updatedAt||0)&&d.json){
        setPill('busy','Cargando tus hojas…');
        const st=JSON.parse(d.json);const ns={},nf={};
        for(const s of st.sheets||[]){const k='sheet-'+s.id;if(cloud.blobs[k]){try{ns[s.id]=JSON.parse(await getBlob(k,cloud.blobs[k]))}catch(e){ns[s.id]=[]}}}
        for(const f of st.fonts||[]){const k='font-'+f.id;if(cloud.blobs[k])nf[f.id]=await getBlob(k,cloud.blobs[k])}
        if((d.updatedAt||0)>(state.updatedAt||0)){ // sigue siendo más reciente
          state=normalizeState(st);strokes=ns;fontData=nf;redoStack={};
          await registerAllFonts();
          markAll(dirty.local);flushLocal();
          renderAll();
        }
      }else markAll(dirty.cloud);
    }else markAll(dirty.cloud);
    cloud.ok=true;
    await flushCloud();
    if(!dirty.cloud.state)setPill('ok','Guardado en tu cuenta');
  }catch(e){
    setPill(idb?'ok':'err',idb?'Guardado en este dispositivo (sin conexión con tu cuenta)':'Sin guardado: descarga una copia');
  }
}

let downloads=null;

function normalizeState(s){
  const d=defaultState();
  const out={...d,...s,settings:{...d.settings,...(s.settings||{})}};
  out.settings.sizes={...DEFAULT_SIZES,...(out.settings.sizes||{})};
  if(!Array.isArray(out.settings.palette)||!out.settings.palette.length)out.settings.palette=DEFAULT_PALETTE.slice();
  out.sheets=(out.sheets||[]).map(x=>({...x,tpl:{...defaultTpl(),...x.tpl},paper:{...defaultPaper(),...x.paper}}));
  out.fonts=out.fonts||[];
  if(!out.sheets.length){const sh=newSheet();out.sheets=[sh];out.currentId=sh.id}
  if(!out.sheets.some(x=>x.id===out.currentId))out.currentId=out.sheets[0].id;
  return out;
}

async function registerFont(f){
  if(!fontData[f.id])return;
  try{const ff=new FontFace(f.family,b64ToBuf(fontData[f.id]));await ff.load();document.fonts.add(ff)}catch(e){console.warn('fuente',f.name,e)}
}
async function registerAllFonts(){for(const f of state.fonts)await registerFont(f)}

async function importFonts(files){
  for(const file of files){
    try{
      const buf=await file.arrayBuffer();
      const id=uid(),family='UF_'+id;
      const ff=new FontFace(family,buf);await ff.load();document.fonts.add(ff);
      const name=file.name.replace(/\.(ttf|otf|woff2?|ttc)$/i,'');
      state.fonts.push({id,name,family,size:buf.byteLength,added:Date.now()});
      fontData[id]=bufToB64(buf);
      touch('font',id);
      toast(`Fuente «${name}» añadida`);
      if(buf.byteLength>8e6)toast(`«${name}» es grande: la copia en tu cuenta puede tardar un poco`);
    }catch(e){toast(`No se pudo leer «${file.name}». ¿Es TTF, OTF o WOFF?`)}
  }
  renderTab();
}

/* =========================================================
   Plantilla y papel
   ========================================================= */
function getItems(t){
  const a=baseItems(t);if(!t.shuffle)return a;
  let sd=(t.seed||1)*9301+49297;const r=()=>(sd=(sd*16807)%2147483647)/2147483647;
  for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a;
}
function baseItems(t){
  switch(t.preset){
    case 'abc':return[...UP,...LOW];
    case 'upper':return UP.slice();
    case 'lower':return LOW.slice();
    case 'nums':return'0123456789'.split('');
    case 'hira':return HIRA.slice();
    case 'kata':return KATA.slice();
    default:
      if(t.mode==='chars')return[...(t.text||'').replace(/\s/g,'')];
      return(t.text||'').split('\n').map(x=>x.trim()).filter(Boolean);
  }
}
function geom(s){
  const t=s.tpl;const rows=clamp(Math.round(t.rows),4,40);const rowH=(H-M.t-M.b)/rows;
  const cols=t.cols>1?2:1;const colGap=cols>1?44:0;const colW=(W-M.l-M.r-colGap*(cols-1))/cols;
  return{rows,rowH,cols,colGap,colW,fs:rowH*t.size,slots:t.blankRow?Math.ceil(rows/2):rows}
}
const colX=(g,c)=>M.l+c*(g.colW+g.colGap);
const baseY=(g,r)=>M.t+r*g.rowH+g.rowH*0.74;
function capacity(s){const g=geom(s);return g.slots*g.cols}

function metrics(ctx,fs){
  const m=w=>ctx.measureText(w);
  let cap=m('H').actualBoundingBoxAscent||fs*0.7;
  let xh=m('x').actualBoundingBoxAscent||fs*0.48;
  let ds=m('gjpqy').actualBoundingBoxDescent||fs*0.22;
  return{cap,xh,ds};
}

function drawPaper(ctx,s,mt){
  const p=s.paper,g=geom(s);const dark=isDark(p.color);
  const base=dark?'255,255,255':'70,72,96';const a=p.lines;const lc=x=>`rgba(${base},${clamp(x,0,1)})`;
  ctx.save();ctx.fillStyle=p.color;ctx.fillRect(0,0,W,H);
  const x0=M.l,x1=W-M.r;
  const hline=(y,col,lw,dash)=>{ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.setLineDash(dash||[]);ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x1,y);ctx.stroke()};
  switch(p.type){
    case 'dots':{
      ctx.fillStyle=lc(a*1.7);const step=g.rowH*0.5;
      for(let r=0;r<g.rows;r++){const y=baseY(g,r);ctx.beginPath();
        for(let x=x0;x<=x1+0.5;x+=step){ctx.moveTo(x+2.4,y);ctx.arc(x,y,2.4,0,Math.PI*2)}ctx.fill()}
      break}
    case 'grid':{
      const step=g.rowH/2;ctx.lineWidth=1;
      const top=M.t,bot=M.t+g.rows*g.rowH;
      ctx.strokeStyle=lc(a*0.75);ctx.beginPath();
      for(let y=top;y<=bot+0.5;y+=step){ctx.moveTo(x0,y);ctx.lineTo(x1,y)}
      for(let x=x0;x<=x1+0.5;x+=step){ctx.moveTo(x,top);ctx.lineTo(x,bot)}
      ctx.stroke();break}
    case 'lines':{
      for(let r=0;r<g.rows;r++)hline(baseY(g,r),lc(a*1.2),1.6);
      ctx.strokeStyle=dark?'rgba(255,170,170,.35)':'rgba(205,90,90,.35)';ctx.lineWidth=1.5;ctx.beginPath();
      ctx.moveTo(x0-24,M.t-30);ctx.lineTo(x0-24,H-M.b+20);ctx.stroke();break}
    case 'guide':case 'slant':{
      for(let r=0;r<g.rows;r++){
        const y=baseY(g,r);
        hline(y-mt.cap,lc(a*0.7),1);
        hline(y-mt.xh,lc(a*0.9),1,[6,6]);
        hline(y,lc(a*1.4),1.8);
        hline(y+mt.ds,lc(a*0.55),1);
      }
      if(p.type==='slant'){
        const ang=clamp(p.slant,30,85)*Math.PI/180;const step=g.fs*0.9;
        ctx.save();ctx.beginPath();ctx.rect(x0,0,x1-x0,H);ctx.clip();
        ctx.strokeStyle=lc(a*0.4);ctx.lineWidth=1;ctx.setLineDash([]);ctx.beginPath();
        for(let r=0;r<g.rows;r++){const y=baseY(g,r);const hgt=mt.cap+mt.ds;const dx=hgt/Math.tan(ang);
          for(let x=x0-dx;x<=x1;x+=step){ctx.moveTo(x,y+mt.ds);ctx.lineTo(x+dx,y-mt.cap)}}
        ctx.stroke();ctx.restore();
      }
      break}
    case 'genko':{
      const n=Math.floor(g.colW/g.rowH);const sz=g.rowH*0.92,ins=(g.rowH-sz)/2;
      for(let c=0;c<g.cols;c++){const cx=colX(g,c);
        for(let r=0;r<g.rows;r++){const y=M.t+r*g.rowH+ins;
          for(let k=0;k<n;k++){const x=cx+k*g.rowH+ins;
            ctx.setLineDash([]);ctx.strokeStyle=lc(a*1.3);ctx.lineWidth=1.4;ctx.strokeRect(x,y,sz,sz);
            ctx.setLineDash([4,5]);ctx.strokeStyle=lc(a*0.6);ctx.lineWidth=1;ctx.beginPath();
            ctx.moveTo(x+sz/2,y);ctx.lineTo(x+sz/2,y+sz);ctx.moveTo(x,y+sz/2);ctx.lineTo(x+sz,y+sz/2);ctx.stroke()}}}
      break}
  }
  ctx.restore();
}

/* ---- orden de trazos (kana) ---- */
const kanaGeo={};
function kanaGeom(ch){
  if(kanaGeo[ch])return kanaGeo[ch];
  const NS='http://www.w3.org/2000/svg';let svg=$('#kvgMeasure');
  if(!svg){svg=document.createElementNS(NS,'svg');svg.id='kvgMeasure';svg.setAttribute('width','0');svg.setAttribute('height','0');
    svg.style.position='absolute';svg.style.left='-9999px';document.body.append(svg)}
  const out=KANA[ch].p.map(d=>{const el=document.createElementNS(NS,'path');el.setAttribute('d',d);svg.append(el);
    const L=el.getTotalLength();const a=el.getPointAtLength(Math.max(0,L-5)),b=el.getPointAtLength(L);el.remove();
    return{path:new Path2D(d),len:L,end:[b.x,b.y],dir:Math.atan2(b.y-a.y,b.x-a.x)}});
  return kanaGeo[ch]=out;
}
function drawKanaModel(ctx,ch,box,color){
  const geo=kanaGeom(ch);const sc=box.s/109;
  ctx.save();ctx.translate(box.x,box.y);ctx.scale(sc,sc);ctx.globalAlpha=1;
  ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=color;ctx.lineWidth=4;
  geo.forEach(o=>ctx.stroke(o.path));
  ctx.fillStyle='#c0392b';
  geo.forEach(o=>{ctx.save();ctx.translate(o.end[0],o.end[1]);ctx.rotate(o.dir);ctx.beginPath();
    ctx.moveTo(5,0);ctx.lineTo(-6.5,-6);ctx.lineTo(-6.5,6);ctx.closePath();ctx.fill();ctx.restore()});
  ctx.font='800 16px "Nunito", sans-serif';ctx.textAlign='left';ctx.textBaseline='alphabetic';
  KANA[ch].n.forEach((p,i)=>{ctx.lineWidth=3.5;ctx.strokeStyle='#fff';ctx.strokeText(i+1,p[0],p[1]);ctx.fillText(i+1,p[0],p[1])});
  ctx.restore();
}
function examPrompt(it){
  if(ROMAJI[it])return ROMAJI[it];
  if(/^[A-Za-zÑñ]$/.test(it))return it===it.toUpperCase()?it.toLowerCase():it.toUpperCase();
  return null;
}

function drawTemplate(ctx,s,items){
  const t=s.tpl,g=geom(s);
  let model=t.model;if(isDark(s.paper.color)&&isDark(model))model='#f4f1ea';
  ctx.save();ctx.font=`${g.fs}px ${fontStack(t.font)}`;
  const list=items.slice(t.offset,t.offset+g.slots*g.cols);
  const ex=state.settings.exam,cmp=ex&&state.settings.compare;const ACC='#c0392b';
  const glyph=(it,x,y,kind,box)=>{
    ctx.setLineDash([]);
    if(kind==='model'){
      if(ex&&!cmp){const pr=examPrompt(it);if(pr){ctx.save();ctx.globalAlpha=1;ctx.fillStyle=ACC;
        ctx.font=`700 ${Math.round(g.fs*(pr.length>2?0.42:0.52))}px "Nunito", sans-serif`;ctx.fillText(pr,x,y);ctx.restore();return}}
      if(t.strokeOrder&&KANA[it]&&box){drawKanaModel(ctx,it,box,model);return}
      ctx.globalAlpha=1;ctx.fillStyle=model;ctx.fillText(it,x,y);return}
    if(ex&&!cmp)return;
    if(cmp){ctx.globalAlpha=.42;ctx.fillStyle=ACC;ctx.fillText(it,x,y);ctx.globalAlpha=1;return}
    if(t.style==='gris'){ctx.globalAlpha=t.opacity;ctx.fillStyle=model;ctx.fillText(it,x,y)}
    else{
      const lw=Math.max(1.2,g.fs*(t.style==='punteado'?0.035:0.022));
      ctx.globalAlpha=Math.min(1,t.opacity*2.3);ctx.strokeStyle=model;ctx.lineWidth=lw;ctx.lineJoin='round';ctx.lineCap='round';
      if(t.style==='punteado')ctx.setLineDash([0.1,lw*2.4]);
      ctx.strokeText(it,x,y);
    }
    ctx.globalAlpha=1;
  };
  list.forEach((it,idx)=>{
    const c=Math.floor(idx/g.slots),j=idx%g.slots,r=t.blankRow?j*2:j;
    const cx=colX(g,c),cEnd=cx+g.colW;
    if(s.paper.type==='genko'){
      const n=Math.floor(g.colW/g.rowH);ctx.textAlign='center';ctx.textBaseline='middle';
      const cy=M.t+r*g.rowH+g.rowH/2+g.fs*0.03;
      for(let k=0;k<n;k++){const x=cx+k*g.rowH+g.rowH/2;
        const bs=g.rowH*0.84;
        if(k===0)glyph(it,x,cy,'model',{x:x-bs/2,y:cy-g.fs*0.03-bs/2,s:bs});else if(t.repeats===0||k<=t.repeats)glyph(it,x,cy,'trace')}
    }else{
      ctx.textAlign='left';ctx.textBaseline='alphabetic';
      const y=baseY(g,r);let x=cx+g.rowH*0.1;
      const w=ctx.measureText(it).width;const adv=w+g.fs*0.3;
      glyph(it,x,y,'model',{x:x+w/2-g.fs*0.55,y:y-g.fs*0.98,s:g.fs*1.1});x+=adv;let k=0;
      while(x+w<=cEnd&&(t.repeats===0||k<t.repeats)){glyph(it,x,y,'trace');x+=adv;k++}
    }
  });
  ctx.restore();
}

const paperCanvas=$('#paper'),paperCtx=paperCanvas.getContext('2d');
let paperToken=0,paperTimer=null;
function paintPaper(ctx,s){
  const items=getItems(s.tpl);const g=geom(s);
  ctx.save();ctx.font=`${g.fs}px ${fontStack(s.tpl.font)}`;const mt=metrics(ctx,g.fs);ctx.restore();
  drawPaper(ctx,s,mt);drawTemplate(ctx,s,items);
}
async function renderPaper(){
  const tok=++paperToken;const s=cur();if(!s)return;
  paintPaper(paperCtx,s); // primero con lo que haya cargado

   ========================================================= */
const inkCanvas=$('#ink'),inkCtx=inkCanvas.getContext('2d');
const live=$('#live'),liveCtx=live.getContext('2d');
const tmp=document.createElement('canvas');tmp.width=W;tmp.height=H;const tctx=tmp.getContext('2d');
const grain=(()=>{const c=document.createElement('canvas');c.width=c.height=96;const x=c.getContext('2d');
  const id=x.createImageData(96,96);let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  for(let i=0;i<96*96;i++){const v=rnd();id.data[i*4+3]=v<0.5?0:Math.round((v-0.5)*2*200)}
  x.putImageData(id,0,0);return tctx.createPattern(c,'repeat')})();

function widthOf(t,s,p){switch(t){case'pencil':return s*(0.4+1.2*p);case'pen':return s*(0.55+0.9*p);
  case'marker':return s*(0.85+0.3*p);case'nib':return s*(0.55+0.9*p);default:return s}}

function drawSeg(ctx,st,i){
  const a=st.p;const X=k=>a[k*3],Y=k=>a[k*3+1],P=k=>a[k*3+2]/100;
  const col=st.t==='eraser'?'#000':st.c;
  ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineCap='round';ctx.lineJoin='round';
  if(st.t==='nib'){
    const ang=(st.a==null?40:st.a)*Math.PI/180;const j=i===0?0:i-1;
    const w0=widthOf('nib',st.s,P(j))/2,w1=widthOf('nib',st.s,P(i))/2;
    const cx=Math.cos(ang),cy=-Math.sin(ang);
    ctx.beginPath();ctx.moveTo(X(j)+cx*w0,Y(j)+cy*w0);ctx.lineTo(X(i)+cx*w1,Y(i)+cy*w1);
    ctx.lineTo(X(i)-cx*w1,Y(i)-cy*w1);ctx.lineTo(X(j)-cx*w0,Y(j)-cy*w0);ctx.closePath();ctx.fill();
    ctx.lineWidth=Math.max(1,st.s*0.1);ctx.beginPath();ctx.moveTo(X(j),Y(j));ctx.lineTo(X(i),Y(i));ctx.stroke();
    return;
  }
  if(i===0){const w=widthOf(st.t,st.s,P(0));ctx.beginPath();ctx.arc(X(0),Y(0),w/2,0,Math.PI*2);ctx.fill();return}
  ctx.lineWidth=widthOf(st.t,st.s,(P(i-1)+P(i))/2);
  const sx=i>=2?(X(i-2)+X(i-1))/2:X(i-1),sy=i>=2?(Y(i-2)+Y(i-1))/2:Y(i-1);
  ctx.beginPath();ctx.moveTo(sx,sy);ctx.quadraticCurveTo(X(i-1),Y(i-1),(X(i-1)+X(i))/2,(Y(i-1)+Y(i))/2);ctx.stroke();
}
function drawTail(ctx,st){
  const a=st.p,n=a.length/3;if(n<2||st.t==='nib')return;
  const X=k=>a[k*3],Y=k=>a[k*3+1];
  ctx.lineWidth=widthOf(st.t,st.s,a[(n-1)*3+2]/100);ctx.strokeStyle=st.t==='eraser'?'#000':st.c;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo((X(n-2)+X(n-1))/2,(Y(n-2)+Y(n-1))/2);ctx.lineTo(X(n-1),Y(n-1));ctx.stroke();
}
function bbox(st){
  const a=st.p;let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(let i=0;i<a.length;i+=3){x0=Math.min(x0,a[i]);x1=Math.max(x1,a[i]);y0=Math.min(y0,a[i+1]);y1=Math.max(y1,a[i+1])}
  const pad=st.s*1.8+4;x0=Math.max(0,Math.floor(x0-pad));y0=Math.max(0,Math.floor(y0-pad));
  x1=Math.min(W,Math.ceil(x1+pad));y1=Math.min(H,Math.ceil(y1+pad));return{x:x0,y:y0,w:x1-x0,h:y1-y0}
}
function renderStroke(ctx,st){
  if(st.t==='clear'){ctx.clearRect(0,0,W,H);return}
  const n=st.p.length/3;if(!n)return;
  if(st.t==='eraser'){ctx.save();ctx.globalCompositeOperation='destination-out';for(let i=0;i<n;i++)drawSeg(ctx,st,i);drawTail(ctx,st);ctx.restore();return}
  if(st.t==='pen'||st.t==='nib'){ctx.save();for(let i=0;i<n;i++)drawSeg(ctx,st,i);drawTail(ctx,st);ctx.restore();return}
  const b=bbox(st);if(b.w<=0||b.h<=0)return;
  tctx.clearRect(b.x,b.y,b.w,b.h);
  for(let i=0;i<n;i++)drawSeg(tctx,st,i);drawTail(tctx,st);
  if(st.t==='pencil'){tctx.save();tctx.globalCompositeOperation='destination-out';tctx.globalAlpha=.6;tctx.fillStyle=grain;tctx.fillRect(b.x,b.y,b.w,b.h);tctx.restore()}
  ctx.save();ctx.globalAlpha=TOOLS[st.t].alpha;if(st.t==='marker')ctx.globalCompositeOperation='multiply';

}
function redrawInk(){
  inkCtx.clearRect(0,0,W,H);const arr=strokes[state.currentId]||[];
  let start=0;for(let i=arr.length-1;i>=0;i--)if(arr[i].t==='clear'){start=i+1;break}
  for(let i=start;i<arr.length;i++)renderStroke(inkCtx,arr[i]);

/* ---- puntero ---- */
let curSt=null,pan=null,pinch=null;const touches=new Map();
function startPinch(){
  const [a,b]=[...touches.values()];const r=$('#page').getBoundingClientRect();
  const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
  pinch={d0:Math.hypot(a.x-b.x,a.y-b.y)||1,z0:state.settings.zoom,fx:(mx-r.left)/r.width,fy:(my-r.top)/r.height};
}
function movePinch(){
  const [a,b]=[...touches.values()];const ws=$('#ws'),pg=$('#page');
  const d=Math.hypot(a.x-b.x,a.y-b.y);const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
  state.settings.zoom=clamp(pinch.z0*d/pinch.d0,0.5,4);applyZoom();
  const r=pg.getBoundingClientRect();
  ws.scrollLeft+=(r.left+pinch.fx*r.width)-mx;
  ws.scrollTop+=(r.top+pinch.fy*r.height)-my;
}
function cancelStroke(){
  if(!curSt)return;const wasEraser=curSt.t==='eraser';curSt=null;
  liveCtx.clearRect(0,0,W,H);if(wasEraser)redrawInk();
}
function toXY(e){const r=live.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
function addPoint(e){
  const[x,y]=toXY(e);let p=e.pointerType==='pen'?e.pressure:0.5;if(!p||p<0.05)p=e.pointerType==='pen'?0.15:0.5;
  const a=curSt.p,n=a.length/3;
  if(n&&Math.hypot(a[(n-1)*3]-x,a[(n-1)*3+1]-y)<0.8)return;
  a.push(Math.round(x*2)/2,Math.round(y*2)/2,Math.round(p*100));
  const i=a.length/3-1;
  if(curSt.t==='eraser'){inkCtx.save();inkCtx.globalCompositeOperation='destination-out';drawSeg(inkCtx,curSt,i);inkCtx.restore()}
  else drawSeg(liveCtx,curSt,i);

live.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;

    touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
    try{live.setPointerCapture(e.pointerId)}catch(_){}
    if(touches.size>=2){if(curSt&&curSt.isTouch)cancelStroke();pan=null;startPinch();return}
  }
  closePop();
  if(window.innerWidth<=900&&document.body.classList.contains('panel-open')){document.body.classList.remove('panel-open');return}
  if(state.settings.penOnly&&e.pointerType==='touch'){
    const ws=$('#ws');pan={id:e.pointerId,x:e.clientX,y:e.clientY,sl:ws.scrollLeft,st:ws.scrollTop};return}
  if(curSt)return;
  e.preventDefault();
  try{live.setPointerCapture(e.pointerId)}catch(_){}
  const t=state.settings.tool;
  curSt={t,c:state.settings.color,s:state.settings.sizes[t],p:[],id:e.pointerId,isTouch:e.pointerType==='touch'};
  if(t==='nib')curSt.a=state.settings.nibAngle;
  live.style.opacity=(t==='pencil'||t==='marker')?TOOLS[t].alpha:1;

});
live.addEventListener('pointermove',e=>{
  if(e.pointerType==='touch'&&touches.has(e.pointerId)){const t=touches.get(e.pointerId);t.x=e.clientX;t.y=e.clientY;
    if(pinch){if(touches.size>=2)movePinch();return}}
  if(pan&&e.pointerId===pan.id){const ws=$('#ws');ws.scrollLeft=pan.sl-(e.clientX-pan.x);ws.scrollTop=pan.st-(e.clientY-pan.y);return}
  if(!curSt||e.pointerId!==curSt.id)return;

function endStroke(e){

  if(st.t!=='eraser')renderStroke(inkCtx,st);
  const id=state.currentId;(strokes[id]=strokes[id]||[]).push(st);redoStack[id]=[];

  }[type];

function readVal(el){if(el.type==='checkbox')return el.checked;if(el.type==='range'||el.type==='number')return parseFloat(el.value);return el.value}
function setTpl(k,v){
  const s=cur();s.tpl[k]=v;
  if(k==='preset'){
    const P=PRESETS[v];Object.assign(s.tpl,P.set);s.tpl.offset=0;
    if(P.paper)s.paper.type=P.paper;else if(s.paper.type==='genko')s.paper.type='dots';
    if(!P.set.font&&['Klee One','Zen Maru Gothic','Kosugi Maru','Yuji Syuku'].includes(s.tpl.font))s.tpl.font='Quicksand';
    if(!P.set.size)s.tpl.size=.62;
    if(s.autoName)s.name=P.name;
    renderTab();
  }
  if(k==='font'){const fp=$('#fontPrev');if(fp)fp.style.fontFamily=fontStack(v)}
  const lb=document.querySelector(`[data-lbl="${k}"]`);if(lb&&FMT[k])lb.textContent=FMT[k](v);
  s.updated=Date.now();schedulePaper();updateOverflow();touch('state');
}
function setPaper(k,v){
  const s=cur();s.paper[k]=v;
  const lb=document.querySelector(`[data-lbl="${k}"]`);if(lb&&FMT[k])lb.textContent=FMT[k](v);

}
function openSheet(id){state.currentId=id;redrawInk();renderPaper();updatePageLbl();renderTab();touch('state');$('#ws').scrollTop=0}

$('#tabBody').addEventListener('input',e=>{

$('#tabBody').addEventListener('click',async e=>{
  const sb=e.target.closest('.seg button');
  if(sb){const sg=sb.parentElement;const k=sg.dataset.seg;let v=sb.dataset.v;if(k==='cols')v=+v;
    sg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===sb));
    sg.dataset.attr==='p'?setPaper(k,v):setTpl(k,v);return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,v=b.dataset.v,s=cur();
  switch(act){
    case 'gofonts':state.settings.tab='fonts';renderTab();break;
    case 'reshuffle':s.tpl.seed=Math.floor(Math.random()*1e6)+1;schedulePaper();touch('state');break;
    case 'continue':{
      const total=getItems(s.tpl).length,cap=capacity(s);let off=s.tpl.offset+cap;
      let idx=state.sheets.indexOf(s);const base=s.name.replace(/ \(\d+\)$/,'');let k=Math.floor(s.tpl.offset/cap)+2;
      while(off<total){const ns=newSheet(`${base} (${k})`,{...s.tpl,offset:off},s.paper);state.sheets.splice(++idx,0,ns);off+=cap;k++}
      updatePageLbl();updateOverflow();touch('state');toast('Hojas creadas. Pasa de hoja con las flechas ›');break}
    case 'ptype':s.paper.type=v;renderTab();schedulePaper();touch('state');break;
    case 'pcolor':s.paper.color=v;renderTab();schedulePaper();touch('state');break;
    case 'paperAll':state.sheets.forEach(x=>x.paper={...s.paper});touch('state');toast('Papel aplicado a todas las hojas');break;
    case 'useFont':s.tpl.font=v;schedulePaper();touch('state');toast(`Usando «${fontLabel(v)}»`);break;
    case 'delFont':{
      const f=state.fonts.find(x=>x.id===v);if(!f)break;
      if(!await confirmDlg('¿Eliminar tipografía?',`Se quitará «${esc(f.name)}». Las hojas que la usaban pasarán a Quicksand.`,'Eliminar'))break;
      state.fonts=state.fonts.filter(x=>x.id!==v);delete fontData[v];
      state.sheets.forEach(x=>{if(x.tpl.font===f.family)x.tpl.font='Quicksand'});
      touch('del','font-'+v);renderTab();renderPaper();break}
    case 'newSame':{const ns=newSheet(s.name.replace(/ \(\d+\)$/,'').replace(/ · .*$/,'')+' · '+new Date().toLocaleDateString('es-ES',{day:'numeric',month:'short'}),s.tpl,s.paper);
      ns.autoName=false;state.sheets.splice(state.sheets.indexOf(s)+1,0,ns);openSheet(ns.id);toast('Hoja nueva lista para practicar');break}
    case 'newBlank':{const ns=newSheet();state.sheets.push(ns);openSheet(ns.id);break}
    case 'open':openSheet(v);break;
    case 'rename':{
      const sh=state.sheets.find(x=>x.id===v);let val=sh.name;
      const r=await dialog({title:'Renombrar hoja',html:`<input class="tin" id="renIn" value="${esc(sh.name)}" maxlength="60">`,
        onOpen:b=>{const i=b.querySelector('#renIn');i.focus();i.select()},
        buttons:[{label:'Cancelar',value:null},{label:'Guardar',primary:true,onClick:()=>{val=$('#renIn').value.trim()||sh.name;return val}}]});
      if(r){sh.name=r;sh.autoName=false;touch('state');renderTab()}break}
    case 'dup':{
      const sh=state.sheets.find(x=>x.id===v);const ns=newSheet(sh.name+' (copia)',sh.tpl,sh.paper);ns.autoName=false;
      strokes[ns.id]=JSON.parse(JSON.stringify(strokes[sh.id]||[]));
      state.sheets.splice(state.sheets.indexOf(sh)+1,0,ns);touch('sheet',ns.id);renderTab();updatePageLbl();toast('Hoja duplicada');break}
    case 'up':{const i=state.sheets.findIndex(x=>x.id===v);if(i>0){const[x]=state.sheets.splice(i,1);state.sheets.splice(i-1,0,x);touch('state');renderTab();updatePageLbl()}break}
    case 'del':{
      const sh=state.sheets.find(x=>x.id===v);
      if(!await confirmDlg('¿Eliminar hoja?',`«${esc(sh.name)}» y lo que has escrito en ella se borrarán. Esto no se puede deshacer.`,'Eliminar'))break;
      const i=state.sheets.indexOf(sh);state.sheets.splice(i,1);delete strokes[v];delete redoStack[v];touch('del','sheet-'+v);
      if(!state.sheets.length)state.sheets.push(newSheet());
      if(state.currentId===v)openSheet(state.sheets[Math.max(0,i-1)].id);else{renderTab();updatePageLbl()}
      break}
    case 'backup':downloadBackup();break;
    case 'png':exportPNG(true);break;
    case 'pngTpl':exportPNG(false);break;
  }
});

/* =========================================================
   Copia de seguridad y exportación
   ========================================================= */
async function saveFile(filename,data,okMsg){
  if(downloads){
    try{await downloads.save({filename,data});if(okMsg)toast(okMsg);return true}
    catch(e){if(e&&e.code==='declined'){toast('Descarga cancelada');return false}}
  }
  if(!window.claude){ // fuera de Claude (p. ej. en Netlify): descarga normal
    try{const blob=data instanceof Blob?data:new Blob([data]);const url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),5000);if(okMsg)toast(okMsg);return true}catch(e){}
  }
  return null; // no disponible
}
async function downloadBackup(){
  const json=JSON.stringify({app:'cuaderno-caligrafia',v:1,exportedAt:new Date().toISOString(),state,strokes,fonts:fontData});
  const name=`caligrafia-copia-${dkey(new Date())}.json`;
  const r=await saveFile(name,new Blob([json],{type:'application/json'}),'Copia descargada ✓');
  if(r){state.settings.lastBackup=Date.now();touch('state');renderTab();return}
  if(r===false)return;
  await dialog({title:'Copia de seguridad',
    html:`Aquí no se puede descargar el archivo directamente. Pulsa <b>Copiar</b> y pégalo en una nota o en un archivo de texto llamado <i>${name}</i>.<br><span class="note">Tamaño: ${(json.length/1024).toFixed(0)} KB</span>`,
    buttons:[{label:'Cerrar',value:false},{label:'Copiar',primary:true,onClick:()=>{
      navigator.clipboard.writeText(json).then(()=>{state.settings.lastBackup=Date.now();touch('state');toast('Copia copiada al portapapeles ✓')}).catch(()=>toast('No se pudo copiar'))}}]});
}
async function restoreFrom(file){
  let data;
  try{data=JSON.parse(await file.text())}catch(e){toast('Ese archivo no es una copia válida');return}
  if(!data||data.app!=='cuaderno-caligrafia'||!data.state){toast('Ese archivo no es una copia de este cuaderno');return}
  const n=(data.state.sheets||[]).length;
  if(!await confirmDlg('¿Restaurar la copia?',`La copia del <b>${esc(String(data.exportedAt||'').slice(0,10))}</b> tiene ${n} hoja(s) y ${(data.state.fonts||[]).length} tipografía(s).<br><br>Sustituirá lo que tienes ahora en el cuaderno.`,'Restaurar'))return;
  const oldSheets=state.sheets.map(s=>s.id),oldFonts=state.fonts.map(f=>f.id);
  state=normalizeState(data.state);strokes=data.strokes||{};fontData=data.fonts||{};redoStack={};
  oldSheets.filter(id=>!state.sheets.some(s=>s.id===id)).forEach(id=>touch('del','sheet-'+id));
  oldFonts.filter(id=>!state.fonts.some(f=>f.id===id)).forEach(id=>touch('del','font-'+id));
  await registerAllFonts();
  markAll(dirty.local);markAll(dirty.cloud);touch('state');
  renderAll();toast('Copia restaurada ✓');
}
async function exportPNG(withInk){
  const s=cur();const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.drawImage(paperCanvas,0,0);if(withInk)x.drawImage(inkCanvas,0,0);
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  const fname=(s.name.replace(/[\\/:*?"<>|]+/g,'-')||'hoja')+(withInk?'':' (plantilla)')+'.png';
  const r=await saveFile(fname,blob,'Imagen guardada ✓');
  if(r!==null)return;
  const url=URL.createObjectURL(blob);
  await dialog({title:'Tu imagen',html:`Mantén pulsada la imagen y elige <b>Guardar en Fotos</b> o <b>Compartir</b>.<img src="${url}" alt="Hoja">`,buttons:[{label:'Cerrar',primary:true}]});
  URL.revokeObjectURL(url);
}

/* =========================================================
   Visor del orden de trazos
   ========================================================= */
function openStrokeOrder(){
  const s=cur();let chars=[...new Set(getItems(s.tpl).filter(c=>KANA[c]))];
  let set=chars.length?'tpl':'hira';
  const listFor=k=>k==='tpl'?chars:(k==='hira'?HIRA:KATA);
  let ch=listFor(set)[0],shown=0,timer=null;
  const NS='http://www.w3.org/2000/svg';
  const html=`<div class="seg" id="soSet" style="margin-bottom:10px">
      ${chars.length?'<button data-v="tpl">Esta hoja</button>':''}<button data-v="hira">Hiragana</button><button data-v="kata">Katakana</button></div>
    <div class="so-info" id="soInfo"></div>
    <div class="so-stage"><svg id="soSvg" viewBox="0 0 109 109"></svg></div>
    <div class="so-ctrl"><button class="btn sm" id="soPrev">◀ Trazo</button><button class="btn sm primary" id="soPlay">▶ Ver animación</button><button class="btn sm" id="soNext">Trazo ▶</button></div>
    <div class="so-chars" id="soChars"></div>
    <p class="note" style="margin:10px 0 0">Datos de orden de trazos: KanjiVG (CC BY-SA). Disponible para hiragana y katakana.</p>`;
  const stop=()=>{clearTimeout(timer);timer=null;const b=$('#soPlay');if(b)b.textContent='▶ Ver animación'};
  const draw=(animate)=>{
    const svg=$('#soSvg');if(!svg)return;const d=KANA[ch];
    svg.innerHTML=`<path d="M54.5 2v105M2 54.5h105" stroke="#e8dfd0" stroke-dasharray="3 3" fill="none"/>`;
    d.p.forEach((pd,i)=>{const bg=document.createElementNS(NS,'path');bg.setAttribute('d',pd);
      bg.setAttribute('style','fill:none;stroke:#e9e4da;stroke-width:5;stroke-linecap:round;stroke-linejoin:round');svg.append(bg)});
    d.p.forEach((pd,i)=>{if(i>=shown)return;const el=document.createElementNS(NS,'path');el.setAttribute('d',pd);
      el.setAttribute('style',`fill:none;stroke:${i===shown-1?'#b5543c':'#23263a'};stroke-width:5;stroke-linecap:round;stroke-linejoin:round`);
      svg.append(el);
      if(animate&&i===shown-1){const L=el.getTotalLength();el.style.strokeDasharray=L;el.style.strokeDashoffset=L;
        el.getBoundingClientRect();el.style.transition=`stroke-dashoffset ${Math.max(.35,L/90)}s ease-in-out`;el.style.strokeDashoffset=0}});
    d.n.forEach((p,i)=>{if(i>=shown)return;const t=document.createElementNS(NS,'text');t.setAttribute('x',p[0]);t.setAttribute('y',p[1]);
      t.setAttribute('style','font:800 9px Nunito,sans-serif;fill:#b5543c;paint-order:stroke;stroke:#fff;stroke-width:2.5');t.textContent=i+1;svg.append(t)});
    $('#soInfo').textContent=`${ch}  ·  ${ROMAJI[ch]||''}  ·  ${d.p.length} ${d.p.length===1?'trazo':'trazos'}${shown<d.p.length?`  ·  trazo ${shown} de ${d.p.length}`:''}`;
  };
  const pick=c=>{stop();ch=c;shown=KANA[c].p.length;draw(false);
    document.querySelectorAll('#soChars button').forEach(b=>b.classList.toggle('on',b.dataset.c===c))};
  const fillChars=()=>{$('#soChars').innerHTML=listFor(set).map(c=>`<button data-c="${c}" class="${c===ch?'on':''}">${c}</button>`).join('');
    document.querySelectorAll('#soSet button').forEach(b=>b.classList.toggle('on',b.dataset.v===set))};
  const play=()=>{const n=KANA[ch].p.length;
    if(timer){stop();return}
    shown=0;draw(false);$('#soPlay').textContent='❚❚ Pausa';
    const tick=()=>{if(shown>=n){stop();return}shown++;draw(true);
      const L=kanaGeom(ch)[shown-1].len;timer=setTimeout(tick,Math.max(350,L/90*1000)+350)};
    timer=setTimeout(tick,250)};
  dialog({title:'Orden de trazos · 書き順',html,buttons:[{label:'Cerrar',primary:true,onClick:()=>{stop()}}],onOpen:()=>{
    fillChars();pick(ch);
    $('#soSet').onclick=e=>{const b=e.target.closest('button');if(!b)return;set=b.dataset.v;ch=listFor(set)[0];fillChars();pick(ch)};
    $('#soChars').onclick=e=>{const b=e.target.closest('[data-c]');if(b)pick(b.dataset.c)};
    $('#soPlay').onclick=play;
    $('#soPrev').onclick=()=>{stop();shown=Math.max(0,shown-1);draw(false)};
    $('#soNext').onclick=()=>{stop();const n=KANA[ch].p.length;if(shown>=n)shown=0;shown++;draw(true)};
  }});
}

  $('#size').addEventListener('change',()=>touch('state'));
  $('#nibAngle').addEventListener('input',e=>{state.settings.nibAngle=+e.target.value;updateToolbar()});
  $('#nibAngle').addEventListener('change',()=>touch('state'));
  $('#quickColors').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(b)setColor(b.dataset.c)});
  $('#btnColor').onclick=e=>{e.stopPropagation();$('#colorPop').classList.contains('hidden')?openPop():closePop()};
  $('#palGrid').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(!b)return;const i=+b.dataset.i;
    if($('#editPal').checked){if(state.settings.palette.length>1){state.settings.palette.splice(i,1);renderPal();updateToolbar();touch('state')}}
    else setColor(state.settings.palette[i])});
  $('#colorPick').addEventListener('input',e=>setColor(e.target.value));
  $('#addColor').onclick=()=>{const c=state.settings.color;if(!state.settings.palette.includes(c)){state.settings.palette.unshift(c);if(state.settings.palette.length>24)state.settings.palette.pop()}renderPal();updateToolbar();touch('state');toast('Color añadido a tu paleta')};
  $('#editPal').onchange=renderPal;
  $('#resetPal').onclick=()=>{state.settings.palette=DEFAULT_PALETTE.slice();renderPal();updateToolbar();touch('state')};
  document.addEventListener('pointerdown',e=>{if(!e.target.closest('#colorPop')&&!e.target.closest('#btnColor'))closePop()});
  $('#btnUndo').onclick=undo;$('#btnRedo').onclick=redo;$('#btnClear').onclick=clearInk;
  $('#btnPrev').onclick=()=>{const i=state.sheets.findIndex(s=>s.id===state.currentId);if(i>0)openSheet(state.sheets[i-1].id)};
  $('#btnNext').onclick=()=>{const i=state.sheets.findIndex(s=>s.id===state.currentId);if(i<state.sheets.length-1)openSheet(state.sheets[i+1].id)};
  $('#btnZoomIn').onclick=()=>zoomStep(1);$('#btnZoomOut').onclick=()=>zoomStep(-1);
  $('#btnPenOnly').onclick=()=>{state.settings.penOnly=!state.settings.penOnly;updateToolbar();touch('state');
    toast(state.settings.penOnly?'Solo lápiz: los dedos desplazan la hoja':'Los dedos también dibujan')};
  $('#btnExam').onclick=()=>{const st=state.settings;st.exam=!st.exam;st.compare=false;updateToolbar();renderPaper();touch('state');
    if(st.exam)toast(cur().tpl.preset==='hira'||cur().tpl.preset==='kata'?'Examen: escribe el kana de cada rōmaji. Luego pulsa Comparar':'Examen: escribe de memoria, sin calco. Luego pulsa Comparar')};
  $('#btnCompare').onclick=()=>{state.settings.compare=!state.settings.compare;updateToolbar();renderPaper();touch('state')};
  $('#btnStroke').onclick=openStrokeOrder;
  if(/netlify\.app$|github\.io$/.test(location.hostname)){$('#backAgenda').classList.remove('hidden')}
  window.addEventListener('resize',()=>applyZoom());
  document.addEventListener('keydown',e=>{
    if(e.target.matches('input,textarea,select'))return;
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}
    const map={p:'pencil',r:'marker',b:'pen',c:'nib',g:'eraser'};if(!e.metaKey&&!e.ctrlKey&&map[e.key])setTool(map[e.key]);
  });
}

async function init(){
  buildTools();bindToolbar();
  if(window.innerWidth<=900)document.body.classList.remove('panel-open');
  try{idb=await idbOpen()}catch(e){idb=null}
  if(idb){
    try{
      const raw=await kvGet('state');
      if(raw){
        state=normalizeState(JSON.parse(raw));
        for(const s of state.sheets){const r=await kvGet('sheet-'+s.id);strokes[s.id]=r?JSON.parse(r):[]}
        for(const f of state.fonts){const r=await kvGet('font-'+f.id);if(r)fontData[f.id]=r}
      }
    }catch(e){console.warn(e)}
  }
  if(!state.sheets.length){state=normalizeState(state);state.updatedAt=0}
  await registerAllFonts();
  renderAll();
  setPill(idb?'ok':'err',idb?'Guardado en este dispositivo':'Sin guardado: descarga una copia');
  document.fonts.ready.then(()=>renderPaper());
  getCap('downloads').then(d=>{downloads=d});
  initCloud();
}
init();
})();
</script>
</body>
</html>
