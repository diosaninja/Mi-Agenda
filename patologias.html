<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<script src="sync.js"></script>
<script src="tiempo.js" data-area="medicina" data-app="patologias"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Patologías">
<meta name="theme-color" content="#2b7a73">
<title>Mis Patologías y Vademécum</title>
<style>
:root{
  --accent:#2b7a73; --accent2:#4fb0a5; --accent-soft:#e2f2ef;
  --bg:#f2f4f0; --card:#ffffff; --ink:#1f2b2a; --muted:#73807e; --line:#dde5e2;
  --radius:16px; --shadow:0 2px 10px rgba(20,50,45,.08);
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;font-size:16px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- INICIO ---------- */
#home{height:100%;overflow:auto;padding:calc(var(--safe-top) + 14px) 18px calc(var(--safe-bottom) + 30px)}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1100px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:700;letter-spacing:-.4px}
.brand svg{width:34px;height:34px}
.search{flex:1;min-width:180px;max-width:360px;margin-left:auto;display:flex;align-items:center;gap:6px;
  background:var(--card);border-radius:12px;padding:9px 12px;box-shadow:var(--shadow)}
.search input{border:0;outline:0;flex:1;background:none;min-width:0}
.tabs{display:flex;gap:6px;max-width:1100px;margin:16px auto 6px;overflow-x:auto;padding-bottom:4px}
.tab{padding:9px 16px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);white-space:nowrap;font-weight:600;color:var(--muted)}
.tab.on{background:var(--accent);color:#fff}
.panel{max-width:1100px;margin:14px auto 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:6px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:14px;color:var(--muted)}
.chip.on{background:var(--accent-soft);border-color:var(--accent2);color:var(--accent);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px}
.nb{position:relative;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;text-align:left;display:flex;flex-direction:column}
.nb .cover{height:190px;position:relative;background:#fff;overflow:hidden;border-bottom:1px solid var(--line)}
.nb .cover img{width:100%;height:100%;object-fit:cover;object-position:top}
.nb .spine{position:absolute;left:0;top:0;bottom:0;width:14px}
.nb .cover .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;opacity:.9}
.nb .info{padding:10px 12px 12px}
.nb .t{font-weight:700;font-size:15px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.nb .m{font-size:12px;color:var(--muted);margin-top:4px}
.nb .dots{position:absolute;right:6px;top:6px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:var(--shadow);font-size:18px;line-height:30px}
.nb.new{align-items:center;justify-content:center;min-height:250px;border:2px dashed #bfdcd6;background:transparent;box-shadow:none;color:var(--accent);font-weight:700;gap:8px}
.nb.new .plus{font-size:40px;line-height:1}
.list{display:flex;flex-direction:column;gap:10px}
.row{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;display:flex;align-items:center;gap:12px}
.row .ic{width:42px;height:42px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:none}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tx small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tx p{margin:4px 0 0;font-size:14px;color:#4b5a58}
.btn{padding:9px 14px;border-radius:11px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:14px;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.dan{color:#c0392b}
.btn.sm{padding:6px 10px;font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:22px 0 8px;font-weight:700}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h3{margin:0 0 6px;font-size:17px}
.card p{margin:4px 0 10px;color:#4b5a58;font-size:14px;line-height:1.45}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.switch input{width:22px;height:22px;accent-color:var(--accent)}

/* ---------- MODAL ---------- */
#modal{position:fixed;inset:0;background:rgba(15,35,32,.35);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.sheet{background:#fff;border-radius:20px;max-width:560px;width:100%;max-height:calc(100% - 20px);overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.sheet.wide{max-width:980px;height:calc(100% - 20px);display:flex;flex-direction:column}
.sheet h2{margin:0 0 14px;font-size:20px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fdfbfa;outline-color:var(--accent2)}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw button.on{box-shadow:0 0 0 2px var(--ink)}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.acts .sp{flex:1}
.papers{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.paperopt{border:2px solid var(--line);border-radius:12px;padding:6px;text-align:center;font-size:13px;background:#fff}
.paperopt.on{border-color:var(--accent);background:var(--accent-soft)}
.paperopt canvas{width:100%;height:auto;border-radius:6px;display:block;margin-bottom:4px;border:1px solid #eee}
.menu{display:flex;flex-direction:column;gap:4px}
.menu button{text-align:left;padding:12px 14px;border-radius:12px;font-weight:500}
.menu button:hover,.menu button:active{background:var(--accent-soft)}
.menu button.dan{color:#c0392b}
.viewer{flex:1;min-height:0;border:1px solid var(--line);border-radius:12px;overflow:auto;background:#f3f0ee;display:flex;align-items:flex-start;justify-content:center}
.viewer iframe{width:100%;height:100%;border:0;background:#fff}
.viewer img{max-width:100%;height:auto}
#toast{position:fixed;left:50%;bottom:calc(var(--safe-bottom) + 24px);transform:translateX(-50%);background:#1f2b2a;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:200;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}

/* ---------- EDITOR ---------- */
#editor{position:fixed;inset:0;display:flex;flex-direction:column;background:#e9e4e1;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ebar{display:flex;align-items:center;gap:4px;padding:calc(var(--safe-top) + 6px) 8px 6px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
.ebar .ib{min-width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;padding:0 8px;white-space:nowrap}
.ebar .ib:active,.ebar .ib:hover{background:var(--accent-soft)}
.ebar .ib.txt{font-size:14px;font-weight:600}
.etitle{font-weight:700;flex:1;min-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px}
.pnum{font-size:13px;color:var(--muted);white-space:nowrap;min-width:54px;text-align:center}
.ib:disabled{opacity:.3}
.toolbar{display:flex;align-items:center;gap:4px;padding:6px 8px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.tool{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;position:relative}
.tool svg{width:26px;height:26px}
.tool.on{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent2)}
.tool .tip{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:16px;height:4px;border-radius:2px}
.sep{width:1px;height:30px;background:var(--line);margin:0 4px;flex:none}
.col{width:28px;height:28px;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px #d8cfcf}
.col.on{box-shadow:0 0 0 2px var(--ink)}
.colpick{width:30px;height:30px;border-radius:50%;overflow:hidden;flex:none;position:relative;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);box-shadow:0 0 0 1px #d8cfcf}
.colpick input{opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.sz{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.sz i{display:block;border-radius:50%;background:var(--ink)}
.sz.on{background:var(--accent-soft)}
.range{width:110px;flex:none;accent-color:var(--accent)}
.textbar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:#f6fbfa;border-bottom:1px solid var(--line);overflow-x:auto}
.textbar select{border:1px solid var(--line);border-radius:9px;padding:6px 8px;background:#fff;max-width:200px}
.textbar input[type=number]{width:64px;border:1px solid var(--line);border-radius:9px;padding:6px 8px}
.textbar .fb{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:700}
#scroller{flex:1;overflow:auto;position:relative;-webkit-overflow-scrolling:touch}
#pageWrap{position:relative;margin:16px auto 40px;box-shadow:0 4px 24px rgba(20,50,45,.18);background:#fff}
#pageWrap canvas{position:absolute;left:0;top:0}
#cInk{pointer-events:none}
#cLive{touch-action:none}
#itemsLayer{position:absolute;left:0;top:0;transform-origin:0 0}
#editor[data-mode=draw] #itemsLayer,#editor[data-mode=draw] #itemsLayer *{pointer-events:none}
#editor[data-mode=items] #cLive{pointer-events:none}
#editor[data-mode=items][data-tool=text] #itemsLayer{cursor:text}
.item{position:absolute;touch-action:none}
.item img{width:100%;height:100%;display:block;-webkit-user-drag:none;user-select:none}
.item.text .tx{outline:none;white-space:pre-wrap;word-wrap:break-word;line-height:1.3;min-height:1.3em;padding:2px 4px}
.item.text .tx[contenteditable=true]{-webkit-user-select:text;user-select:text;cursor:text;background:rgba(255,255,255,.35)}
.item.sel{outline:2px dashed var(--accent2);outline-offset:3px}
.item .h{position:absolute;width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:none;align-items:center;justify-content:center;font-size:18px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.3);touch-action:none}
.item.sel .h{display:flex}
.item .h-res{right:-20px;bottom:-20px;cursor:nwse-resize}
.item .h-del{right:-20px;top:-20px;background:#fff;color:#c0392b}
.item .h-move{left:calc(50% - 17px);top:-48px;background:#fff;color:var(--accent);cursor:move;font-size:20px}
.item.text{min-width:80px}
.vgrid{columns:2 380px;column-gap:14px}
.vgrid .card{break-inside:avoid;-webkit-column-break-inside:avoid}
.vtable{width:100%;border-collapse:collapse;font-size:15px}
.vtable td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
.vtable td:first-child{color:#4b5a58;width:50%}
.vtable td:nth-child(2){font-weight:600}
.vtable tr.ed{cursor:pointer}.vtable tr.ed:hover{background:#f1f8f6}
.vhead{display:flex;align-items:center;gap:8px}.vhead h3{flex:1}
.fc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:14px;overflow:auto;min-height:0}
.fc .q{font-size:24px;font-weight:650;white-space:pre-wrap;max-width:720px;line-height:1.35}
.fc .a{font-size:20px;color:var(--accent);white-space:pre-wrap;max-width:720px;border-top:2px dashed var(--line);padding-top:16px;line-height:1.4}
.fc img{max-width:100%;max-height:42vh;border-radius:10px;box-shadow:var(--shadow)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:4px 0 6px}.prog i{display:block;height:100%;background:var(--accent)}
.lv{display:inline-flex;gap:3px;vertical-align:middle}.lv i{width:8px;height:8px;border-radius:50%;background:var(--line)}.lv i.on{background:var(--accent2)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:12px 16px;min-width:120px}
.stat b{display:block;font-size:26px;color:var(--accent)}.stat span{font-size:13px;color:var(--muted)}
.big{font-size:17px;padding:14px 22px;border-radius:14px}
.marks{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.mark{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:8px 12px;font-size:14px;text-align:left;border-left:4px solid var(--accent)}
.mark small{display:block;color:var(--muted);font-size:12px}
.ib.marked{color:var(--accent);background:var(--accent-soft)}
#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  #printArea img{width:100%;display:block;page-break-after:always;break-after:page}
}
@media (max-width:600px){
  .ebar .hide-s{display:none}
  .nb .cover{height:150px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
}
/* ---------- patologías y vademécum ---------- */
.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent);margin:2px 3px 2px 0;white-space:nowrap}
button.tag{cursor:pointer;font-size:13px;padding:5px 11px}
.tag.g{background:#e3f4e7;color:#2e7d43}.tag.y{background:#fff3d6;color:#8a6200}.tag.r{background:#fde9e6;color:#b03a2e}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.fcard{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:6px;border-top:5px solid var(--accent2)}
.fcard b{font-size:16px;line-height:1.25}.fcard small{color:var(--muted);font-size:12.5px}
.fcard p{margin:0;font-size:14px;color:#4b5a58;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.fview{overflow:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.fsec{border-top:1px solid var(--line);padding:11px 2px}
.fsec h4{margin:0 0 5px;font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent)}
.fsec>div{line-height:1.55;font-size:15.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.alert{background:#fff6e5;border:1px solid #f1d39a;border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0;line-height:1.45}
.alert.r{background:#fdeeeb;border-color:#f1b9b0}
.pick{display:flex;flex-wrap:wrap;gap:6px;max-height:190px;overflow:auto;padding:8px;border:1px solid var(--line);border-radius:10px;background:#fbfdfc}
.pick label{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:500;color:var(--ink)}
.pick input{accent-color:var(--accent);width:18px;height:18px;margin:0}
.qopt{display:block;width:100%;text-align:left;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:16px;margin-bottom:8px;line-height:1.35}
.qopt.ok{background:#e3f4e7;border-color:#7cc08a}.qopt.no{background:#fdeeeb;border-color:#ee9a92}
.qclue{background:var(--accent-soft);border-radius:12px;padding:14px 16px;font-size:16.5px;line-height:1.5}
.sheet.quiz{max-width:720px}
.pficha{display:none}
@media print{.pficha{display:block;font-family:Georgia,serif;color:#000;padding:10mm}.pficha h1{margin:0;font-size:24pt}.pficha .sub{color:#555;margin:2mm 0 6mm}.pficha h3{font-family:-apple-system,Arial,sans-serif;font-size:10.5pt;text-transform:uppercase;letter-spacing:.5px;color:#2b7a73;margin:5mm 0 1mm}.pficha p{margin:0;font-size:11.5pt;line-height:1.45}}
@media (max-width:600px){.two{grid-template-columns:1fr;gap:0}.fgrid{grid-template-columns:1fr}.stats .stat{flex:1 1 28%;min-width:0;padding:10px 12px}.stats .stat b{font-size:22px}}
</style>
</head>
<body>

<!-- ================= INICIO ================= -->
<main id="home">
  <div class="top">
    <a href="index.html" class="btn sm" style="text-decoration:none;color:var(--accent)" title="Volver a Mi Agenda">‹ Mi Agenda</a>
    <div class="brand">
      <svg viewBox="0 0 64 64"><rect x="4" y="4" width="56" height="56" rx="16" fill="#2b7a73"/><path fill="#fff" d="M26 14h12v12h12v12H38v12H26V38H14V26h12z"/><g transform="rotate(-40 46 46)"><rect x="36" y="41" width="22" height="10" rx="5" fill="#f2b84b" stroke="#fff" stroke-width="2.4"/><path d="M47 41v10" stroke="#fff" stroke-width="2.4"/></g></svg>
      Mis Patologías
    </div>
    <label class="search">🔍<input id="q" type="search" placeholder="Buscar patologías, fármacos, libretas…"></label>
  </div>
  <nav class="tabs">
    <button class="tab on" data-tab="patologias">🩺 Patologías</button>
    <button class="tab" data-tab="vademecum">💊 Vademécum</button>
    <button class="tab" data-tab="libretas">📓 Libretas</button>
    <button class="tab" data-tab="repaso">🃏 Repaso y quiz</button>
    <button class="tab" data-tab="valores">🧪 Valores normales</button>
    <button class="tab" data-tab="archivos">📎 Apuntes y archivos</button>
    <button class="tab" data-tab="enlaces">🔗 Enlaces</button>
    <button class="tab" data-tab="ajustes">⚙️ Ajustes</button>
  </nav>
  <section class="panel" id="panel"></section>
</main>

<!-- ================= EDITOR ================= -->
<section id="editor" class="hidden" data-mode="draw" data-tool="pencil">
  <header class="ebar">
    <button class="ib txt" id="eBack">‹ Libretas</button>
    <div class="etitle" id="eTitle"></div>
    <button class="ib" id="pPrev" title="Página anterior">◀</button>
    <span class="pnum" id="pNum"></span>
    <button class="ib" id="pNext" title="Página siguiente">▶</button>
    <button class="ib" id="pAdd" title="Nueva página">＋📄</button>
    <button class="ib" id="bMark" title="Marcador en esta página">🔖</button>
    <span class="sep"></span>
    <button class="ib" id="bUndo" title="Deshacer (⌘Z)">↶</button>
    <button class="ib" id="bRedo" title="Rehacer (⌘⇧Z)">↷</button>
    <span class="sep hide-s"></span>
    <button class="ib hide-s" id="bZoomOut" title="Alejar">−</button>
    <button class="ib txt hide-s" id="bZoomFit" title="Ajustar">100%</button>
    <button class="ib hide-s" id="bZoomIn" title="Acercar">＋</button>
    <button class="ib txt" id="bPaper">Papel</button>
    <button class="ib" id="bMore" title="Más">⋯</button>
  </header>
  <div class="toolbar" id="toolbar"></div>
  <div class="textbar hidden" id="textbar">
    <select id="tFont"></select>
    <input type="number" id="tSize" min="8" max="160" step="1" title="Tamaño">
    <button class="fb" data-cmd="bold">B</button>
    <button class="fb" data-cmd="italic"><i>I</i></button>
    <button class="fb" data-cmd="underline"><u>U</u></button>
    <button class="fb" data-cmd="insertUnorderedList" title="Lista">•</button>
    <span style="font-size:13px;color:var(--muted);white-space:nowrap">Toca la hoja para escribir con el teclado</span>
  </div>
  <div id="scroller">
    <div id="pageWrap">
      <canvas id="cPaper"></canvas>

function toast(msg,ms=2600){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.add('hidden'),ms)}
function pickFile(sel){return new Promise(res=>{const i=$(sel);i.value='';i.onchange=()=>res([...i.files]);i.click()})}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
async function shareOrDownload(blob,name){
  const file=new File([blob],name,{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return}catch(e){if(e.name==='AbortError')return}}
  downloadBlob(blob,name);
}

function blobToDataURL(b){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)})}
function abToB64(ab){const u=new Uint8Array(ab);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
function b64ToAb(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer}

/* =========================================================
   BASE DE DATOS (IndexedDB) — todo se guarda en el dispositivo
   ========================================================= */
const DB={
  db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('miPatologias',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  req(mode,fn){return new Promise((res,rej)=>{const tx=this.db.transaction('kv',mode);const st=tx.objectStore('kv');const r=fn(st);tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error)})},
  get(k){return this.req('readonly',s=>s.get(k))},
  set(k,v){return this.req('readwrite',s=>s.put(v,k))},
  del(k){return this.req('readwrite',s=>s.delete(k))},
  keys(){return this.req('readonly',s=>s.getAllKeys())},
  clear(){return this.req('readwrite',s=>s.clear())}
};

/* =========================================================
   PAPEL
   ========================================================= */
function drawPaper(ctx,page,bgImg){
  const {w,h}=page, t=TINTS[page.tint]||TINTS.blanco;
  ctx.fillStyle=t.bg;ctx.fillRect(0,0,w,h);
  if(bgImg){ctx.drawImage(bgImg,0,0,w,h);return}
  const hl=(y,c,lw=1,x0=0,x1=w)=>{ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x1,y);ctx.stroke()};
  const vl=(x,c,lw=1,y0=0,y1=h)=>{ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.beginPath();ctx.moveTo(x,y0);ctx.lineTo(x,y1);ctx.stroke()};
  switch(page.paper){
    case 'rayado':
      for(let y=110;y<h-30;y+=36)hl(y,t.line,1.1);
      vl(90,t.margin,1.6);break;
    case 'cuadricula':
      for(let x=25;x<w;x+=25)vl(x,t.line,1);for(let y=25;y<h;y+=25)hl(y,t.line,1);break;
    case 'milimetrado':
      for(let x=0;x<w;x+=10)vl(x,t.line,x%50===0?1.3:.5);for(let y=0;y<h;y+=10)hl(y,t.line,y%50===0?1.3:.5);break;
    case 'puntos':
      ctx.fillStyle=t.line;
      for(let x=25;x<w;x+=25)for(let y=25;y<h;y+=25){ctx.beginPath();ctx.arc(x,y,1.8,0,Math.PI*2);ctx.fill()}break;
    case 'ecg':
      for(let x=0;x<=w;x+=8)if(x%40)vl(x,t.ecg1,.8);for(let y=0;y<=h;y+=8)if(y%40)hl(y,t.ecg1,.8);
      for(let x=0;x<=w;x+=40)vl(x,t.ecg2,1.4);for(let y=0;y<=h;y+=40)hl(y,t.ecg2,1.4);break;
    case 'cornell':{
      const top=110,cue=Math.round(w*.28),sum=h-Math.round(h*.18);
      for(let y=top+36;y<sum;y+=36)hl(y,t.line,1,cue,w);
      hl(top,t.margin,2);vl(cue,t.margin,2,top,sum);hl(sum,t.margin,2);
      ctx.fillStyle=t.txt;ctx.font='600 17px -apple-system,sans-serif';
      ctx.fillText('Tema · Fecha',24,70);ctx.fillText('Ideas clave / preguntas',18,top+28);
      ctx.fillText('Notas',cue+18,top+28);ctx.fillText('Resumen',24,sum+30);break}
  }
}

/* =========================================================
   TRAZOS
   ========================================================= */
function tracePath(ctx,p){
  const n=p.length/3;ctx.beginPath();ctx.moveTo(p[0],p[1]);
  if(n===1){ctx.lineTo(p[0]+.01,p[1]);return}
  if(n===2){ctx.lineTo(p[3],p[4]);return}
  for(let i=1;i<n-1;i++){const x=p[i*3],y=p[i*3+1],nx=p[i*3+3],ny=p[i*3+4];ctx.quadraticCurveTo(x,y,(x+nx)/2,(y+ny)/2)}
  ctx.lineTo(p[(n-1)*3],p[(n-1)*3+1]);
}
function drawStroke(ctx,s){
  const p=s.pts,n=p.length/3;if(!n)return;
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=s.color;
  if(s.tool==='highlighter'){
    ctx.globalAlpha=.36;ctx.lineCap=s.line?'butt':'round';ctx.lineWidth=s.size;tracePath(ctx,p);ctx.stroke();
  }else if(s.tool==='pencil'&&n>2&&!s.line){
    let px=p[0],py=p[1];
    for(let i=1;i<n-1;i++){
      const x=p[i*3],y=p[i*3+1],nx=(x+p[i*3+3])/2,ny=(y+p[i*3+4])/2,pr=p[i*3+2];
      ctx.lineWidth=s.size*(.3+pr*1.25);ctx.beginPath();ctx.moveTo(px,py);ctx.quadraticCurveTo(x,y,nx,ny);ctx.stroke();px=nx;py=ny;
    }
    ctx.lineWidth=s.size*(.3+p[(n-1)*3+2]*1.25);ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(p[(n-1)*3],p[(n-1)*3+1]);ctx.stroke();
  }else{
    ctx.lineWidth=s.size;tracePath(ctx,p);ctx.stroke();
  }
  ctx.restore();
}
function drawAllStrokes(ctx,strokes){
  for(const s of strokes)if(s.tool==='highlighter')drawStroke(ctx,s);
  for(const s of strokes)if(s.tool!=='highlighter')drawStroke(ctx,s);
}

/* =========================================================
   COMPONER PÁGINA COMO IMAGEN (miniaturas, exportar, imprimir)
   ========================================================= */
function htmlToLines(html){
  const d=document.createElement('div');
  d.innerHTML=String(html||'').replace(/<br\s*\/?>/gi,'\n').replace(/<\/(div|p|li)>/gi,'\n').replace(/<li>/gi,'• ');
  return d.textContent.replace(/\n$/,'').split('\n');
}
async function composePage(page,scale=1.5){
  const c=document.createElement('canvas');c.width=Math.round(page.w*scale);c.height=Math.round(page.h*scale);
  const ctx=c.getContext('2d');ctx.scale(scale,scale);
  let bg=null;if(page.bg){try{bg=await loadImage(page.bg)}catch(e){}}
  drawPaper(ctx,page,bg);
  for(const it of page.items){
    if(it.type==='img'){try{const im=await loadImage(it.src);ctx.drawImage(im,it.x,it.y,it.w,it.h)}catch(e){}}
    else if(it.type==='text'){
      ctx.fillStyle=it.color;ctx.font=`${it.size}px ${it.font}`;ctx.textBaseline='top';
      const lh=it.size*1.3;let y=it.y+2;
      for(const raw of htmlToLines(it.html)){
        const words=raw.split(' ');let line='';
        for(const wd of words){const test=line?line+' '+wd:wd;if(ctx.measureText(test).width>it.w-8&&line){ctx.fillText(line,it.x+4,y);y+=lh;line=wd}else line=test}
        ctx.fillText(line,it.x+4,y);y+=lh;
      }
    }
  }
  drawAllStrokes(ctx,page.strokes);
  return c;
}

function cardForm(c,preset={}){
  const isNew=!c;let img=c?c.img:(preset.img||null);
  const s=modal(`<h2>${isNew?'Nueva tarjeta':'Editar tarjeta'}</h2>
    <div class="field"><label>Pregunta (anverso)</label><textarea id="cF" rows="3" placeholder="Ej.: ¿Criterios diagnósticos de la diabetes?">${esc(c?c.front:'')}</textarea></div>
    <div class="field"><label>Imagen en la pregunta (opcional: un esquema, una radiografía…)</label>
      <div id="cImgBox">${img?`<img src="${img}" style="max-width:100%;max-height:200px;border-radius:10px;display:block;margin-bottom:6px">`:''}</div>
      <div class="bar" style="margin:0"><button class="btn sm" id="cImgAdd">${img?'Cambiar imagen':'＋ Añadir imagen'}</button>${img?'<button class="btn sm dan" id="cImgDel">Quitar imagen</button>':''}</div></div>
    <div class="field"><label>Respuesta (reverso)</label><textarea id="cB" rows="4">${esc(c?c.back:'')}</textarea></div>
    <div class="field"><label>Tema</label><input id="cT" list="temasDL" value="${esc(c?c.tema:(preset.tema||ui.tema||''))}">${temaDatalist()}</div>
    ${!isNew?`<p style="font-size:13px;color:var(--muted)">Nivel ${c.box}/5 · ${c.ok||0} aciertos · ${c.fail||0} fallos</p>`:''}
    <div class="acts">${!isNew?'<button class="btn dan" id="cDel">Eliminar</button><button class="btn" id="cRes">Reiniciar nivel</button>':''}<span class="sp"></span><button class="btn" id="cX">Cancelar</button>${isNew?'<button class="btn" id="cOkMore">Guardar y otra</button>':''}<button class="btn pri" id="cOk">Guardar</button></div>`);
  const refreshImg=()=>{$('#cImgBox').innerHTML=img?`<img src="${img}" style="max-width:100%;max-height:200px;border-radius:10px;display:block;margin-bottom:6px">`:'';$('#cImgAdd').textContent=img?'Cambiar imagen':'＋ Añadir imagen';const d=$('#cImgDel');if(d)d.style.display=img?'':'none'};
  $('#cImgAdd').onclick=async()=>{const [f]=await pickFile('#fileImg');if(f){img=await shrinkImage(f,1400);refreshImg()}};
  if($('#cImgDel'))$('#cImgDel').onclick=()=>{img=null;refreshImg()};
  $('#cX').onclick=closeModal;
  const doSave=async(again)=>{
    const front=$('#cF').value.trim(),back=$('#cB').value.trim(),tema=$('#cT').value.trim();
    if(!front&&!img)return toast('Escribe la pregunta o añade una imagen');
    if(isNew)state.cards.unshift({id:uid(),front,back,tema,img,box:0,due:Date.now(),created:Date.now(),ok:0,fail:0,lastWrong:false});
    else Object.assign(c,{front,back,tema,img});
    await saveCards();
    if(again){if(!$('#home').classList.contains('hidden'))renderHome();cardForm(null,{tema});toast('Tarjeta guardada',1200)}else{closeModal();if(!$('#home').classList.contains('hidden'))renderHome();else toast('Tarjeta creada en Repaso')}
  };
  $('#cOk').onclick=()=>doSave(false);
  if($('#cOkMore'))$('#cOkMore').onclick=()=>doSave(true);
  if(!isNew){
    $('#cDel').onclick=async()=>{if(!confirm('¿Eliminar esta tarjeta?'))return;state.cards=state.cards.filter(x=>x!==c);await saveCards();closeModal();renderHome()};
    $('#cRes').onclick=async()=>{c.box=0;c.due=Date.now();await saveCards();closeModal();renderHome()};
  }
  setTimeout(()=>$('#cF').focus(),50);
}
function study(mode){
  const now=Date.now();
  let pool=state.cards.filter(c=>!ui.tema||c.tema===ui.tema);
  if(mode==='due')pool=pool.filter(c=>c.due<=now);else if(mode==='fail')pool=pool.filter(c=>c.lastWrong);
  if(!pool.length)return toast('No hay tarjetas para repasar');
  const queue=pool.sort(()=>Math.random()-.5),total=queue.length,again=new Set(),res={ok:0,fail:0};let done=0;
  const show=()=>{
    if(!queue.length){
      markStudy();
      modal(`<h2>¡Sesión terminada! 🎉</h2><div class="stats"><div class="stat"><b>${res.ok}</b><span>Acertadas</span></div><div class="stat"><b>${res.fail}</b><span>Falladas</span></div></div>
        <p style="color:#4b5a58">${res.fail?'Las falladas te esperan en «Repasar falladas». ':'¡Todo acertado! '}Las acertadas volverán cuando toque.</p>
        <div class="acts"><button class="btn pri" id="sEnd">Cerrar</button></div>`);
      $('#sEnd').onclick=()=>{closeModal();renderHome()};$('#modal')._onclose=renderHome;return;
    }
    const c=queue[0];
    const s=modal(`<div style="display:flex;align-items:center;gap:10px"><b style="flex:1">${esc(c.tema||'Repaso')}</b><span style="font-size:13px;color:var(--muted)">${done} / ${total}${again.size?' · repetir: '+again.size:''}</span><button class="btn sm" id="sX">Salir</button></div>
      <div class="prog"><i style="width:${Math.round(done/total*100)}%"></i></div>
      <div class="fc">${c.img?`<img src="${c.img}">`:''}${c.front?`<div class="q">${esc(c.front)}</div>`:''}<div class="a hidden" id="sA">${esc(c.back||'(sin respuesta)')}</div></div>
      <div class="acts" id="sBtns"><span class="sp"></span><button class="btn pri big" id="sShow">Ver respuesta</button><span class="sp"></span></div>`,'wide');
    $('#sX').onclick=()=>{closeModal();renderHome()};
    $('#sShow').onclick=()=>{
      $('#sA').classList.remove('hidden');
      $('#sBtns').innerHTML=`<button class="btn big dan" id="sNo" style="flex:1">❌ No la sabía</button><button class="btn big pri" id="sYes" style="flex:1">✅ La sabía</button>`;
      $('#sNo').onclick=()=>answer(false);$('#sYes').onclick=()=>answer(true);
    };
    const answer=async ok=>{
      queue.shift();
      if(ok){c.box=Math.min(5,(again.has(c.id)?0:c.box)+1);c.due=Date.now()+INTERVALS[c.box]*DAY;c.lastWrong=false;c.ok=(c.ok||0)+1;res.ok++;done++;again.delete(c.id)}
      else{c.box=0;c.due=Date.now();c.lastWrong=true;c.fail=(c.fail||0)+1;res.fail++;if(!again.has(c.id)){again.add(c.id);queue.push(c)}else done++}
      await saveCards();show();
    };
  };
  show();
}

/* ---------- Archivos ---------- */
async function uploadFiles(){
  const files=await pickFile('#fileAny');if(!files.length)return;
  const s=modal(`<h2>Subir ${files.length} archivo(s)</h2><div class="field"><label>Tema</label><input id="uTe" list="temasDL" placeholder="Opcional">${temaDatalist()}</div>
    <div class="acts"><button class="btn" id="uX">Cancelar</button><button class="btn pri" id="uOk">Subir</button></div>`);
  $('#uX').onclick=closeModal;
  $('#uOk').onclick=async()=>{
    const tema=$('#uTe').value.trim();closeModal();toast('Guardando…');
    for(const f of files){const id=uid();await DB.set('filedata:'+id,await f.arrayBuffer());state.files.unshift({id,name:f.name,type:f.type||'',size:f.size,date:Date.now(),tema})}
    await saveFiles();renderHome();toast('Archivos guardados');
  };
}
async function fileBlob(f){const ab=await DB.get('filedata:'+f.id);return new Blob([ab],{type:f.type||'application/octet-stream'})}
const isPdf=f=>/pdf/i.test(f.type)||/\.pdf$/i.test(f.name);
const isImg=f=>/^image\//.test(f.type)||/\.(png|jpe?g|gif|webp|heic)$/i.test(f.name);
async function openFile(id){
  const f=state.files.find(x=>x.id===id);if(!f)return;
  const blob=await fileBlob(f),url=URL.createObjectURL(blob);
  const s=modal(`<h2 style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name)}</h2>
    <div class="viewer">${isPdf(f)?`<iframe src="${url}"></iframe>`:isImg(f)?`<img src="${url}">`:`<div class="empty">Vista previa no disponible.<br>Usa «Descargar / compartir» para abrirlo con otra app.</div>`}</div>
    <div class="acts"><button class="btn dan" id="vDel">Eliminar</button><span class="sp"></span>
    <button class="btn" id="vTab">Abrir aparte</button><button class="btn" id="vDl">Descargar / compartir</button>
    ${isPdf(f)||isImg(f)?'<button class="btn pri" id="vNb">✏️ Convertir en libreta</button>':''}<button class="btn" id="vX">Cerrar</button></div>`,'wide');
  $('#modal')._onclose=()=>setTimeout(()=>URL.revokeObjectURL(url),60000);
  $('#vX').onclick=closeModal;

/* ---------- PDF → páginas (pdf.js) ---------- */
async function loadPdfJs(){
  if(window.pdfjsLib)return;
  await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=res;s.onerror=()=>rej(new Error('necesitas conexión a internet la primera vez'));document.head.appendChild(s)});
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}
async function pdfToPages(ab){
  toast('Preparando PDF…',60000);await loadPdfJs();
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(ab.slice(0))}).promise;const pages=[];
  for(let i=1;i<=pdf.numPages;i++){
    toast(`Convirtiendo página ${i} de ${pdf.numPages}…`,60000);
    const pg=await pdf.getPage(i),vp0=pg.getViewport({scale:1}),vp=pg.getViewport({scale:1600/vp0.width});
    const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);
    await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    pages.push(newPage({w:1000,h:Math.round(1000*vp0.height/vp0.width),paper:'blanco',bg:c.toDataURL('image/jpeg',.85)}));
  }
  toast(`PDF convertido: ${pages.length} páginas`);return pages;
}
async function imageToPage(blob){
  const src=await shrinkImage(blob,1800);const im=await loadImage(src);
  return newPage({w:1000,h:Math.round(1000*im.naturalHeight/im.naturalWidth),paper:'blanco',bg:src});
}
async function shrinkImage(blob,max=1600){
  const url=URL.createObjectURL(blob);
  try{
    const im=await loadImage(url);let {naturalWidth:w,naturalHeight:h}=im;
    const k=Math.min(1,max/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    return /png|gif|webp/.test(blob.type)?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.88);
  }finally{URL.revokeObjectURL(url)}
}

/* ---------- tarjetas automáticas desde una ficha ---------- */
async function autoCards(o,fields,tema){
  const skip=['notas'];let n=0;
  for(const [k,l] of fields){
    if(skip.includes(k)||!o[k])continue;
    const src=o.id+':'+k;const lab=l.replace(/ ✨$/,'').replace(/\s*\(.*\)$/,'');
    const ex=state.cards.find(c=>c.src===src);
    if(ex){if(ex.back!==o[k]){ex.back=o[k];ex.front=`${o.name}\n¿${lab}?`}continue}
    state.cards.unshift({id:uid(),front:`${o.name}\n¿${lab}?`,back:o[k],tema:tema||'',img:null,box:0,due:Date.now(),created:Date.now(),ok:0,fail:0,lastWrong:false,src});n++;
  }
  await saveCards();writeSummary();
  toast(n?`${n} tarjeta(s) nuevas en Repaso 🃏`:'Las tarjetas de esta ficha ya estaban creadas (las he actualizado)',2600);
}

/* ---------- comprobador de interacciones ---------- */
function interactionChecker(pre){
  let sel=new Set(pre||[]);
  const draw=()=>{
    const ds=[...sel].map(drugById).filter(Boolean);
    const out=[];
    const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
    for(let i=0;i<ds.length;i++)for(let j=i+1;j<ds.length;j++){
      const a=ds[i],b=ds[j];
      const marked=(a.interWith||[]).includes(b.id)||(b.interWith||[]).includes(a.id);
      const ta=norm(a.inter),tb=norm(b.inter);
      const lines=[],glines=[];
      const findLines=(txt,who,other)=>String(txt||'').split('\n').forEach(l=>{const n=norm(l);
        if(n.includes(norm(other.name)))lines.push(`<b>${esc(who.name)}:</b> ${esc(l)}`);
        else if(other.grupo&&n.includes(norm(other.grupo)))glines.push(`<b>${esc(who.name)}:</b> ${esc(l)} <span class="tag y">menciona el grupo «${esc(other.grupo)}»: revisa si se aplica a ${esc(other.name)}</span>`)});
      findLines(a.inter,a,b);findLines(b.inter,b,a);
      const same=a.grupo&&a.grupo===b.grupo;
      if(marked||lines.length||glines.length||same)out.push(`<div class="alert ${marked||lines.length?'r':''}"><b>${esc(a.name)} + ${esc(b.name)}</b>${marked?' · <span class="tag r">marcada en tus fichas</span>':''}${same?' · <span class="tag y">mismo grupo: posible duplicidad</span>':''}
        ${lines.length||glines.length?`<div style="margin-top:6px">${[...lines,...glines].join('<br>')}</div>`:''}</div>`);
    }
    $('#iRes').innerHTML=ds.length<2?'<div class="empty" style="padding:20px">Elige dos o más fármacos.</div>'
      :(out.length?out.join(''):'<div class="alert" style="background:#e6f4ea;border-color:#9fd3aa">No hay interacciones apuntadas en tus fichas entre estos fármacos.</div>')
       +`<div class="h2">Interacciones de cada uno</div>${ds.map(d=>`<div class="fsec"><h4>${esc(d.name)}</h4><div>${d.inter?nl(d.inter):'<span style="color:var(--muted)">Sin apuntar</span>'}</div></div>`).join('')}`;
  };
  modal(`<div style="display:flex;align-items:center;gap:10px"><h2 style="margin:0;flex:1">⚠️ Comprobar interacciones</h2><button class="btn" id="iX">Cerrar</button></div>
    <p style="font-size:13px;color:var(--muted);margin:6px 0 10px">Compara solo lo que tienes apuntado en tu vademécum. Es una ayuda para estudiar: no sustituye a una base de datos de interacciones ni a la ficha técnica.</p>
    <div class="pick" id="iPick" style="max-height:150px">${[...state.drugs].sort(byName).map(d=>`<label><input type="checkbox" value="${d.id}" ${sel.has(d.id)?'checked':''}>${esc(d.name)}</label>`).join('')}</div>
    <div class="fview" id="iRes" style="margin-top:10px"></div>`,'wide');
  $('#iX').onclick=closeModal;
  $$('#iPick input').forEach(i=>i.onchange=()=>{i.checked?sel.add(i.value):sel.delete(i.value);draw()});
  draw();
}

const QUIZ={
  farm:[['mec','¿Qué fármaco es?','Mecanismo de acción'],['ind','¿Qué fármaco tiene estas indicaciones?','Indicaciones'],['ea','¿De qué fármaco son estos efectos adversos?','Efectos adversos'],['grupo','¿A qué grupo pertenece?','Grupo farmacológico']],
  pato:[['clin','¿Qué patología es?','Clínica'],['def','¿Qué patología es?','Definición'],['diag','¿A qué patología corresponde este diagnóstico?','Diagnóstico'],['drug','¿Qué fármaco de tu vademécum se usa en…?','Tratamiento']]
};
function quizMenu(kind){
  const opts=QUIZ[kind].map(([k,q,l])=>{const n=quizPool(kind,k).length;return `<button class="qopt" data-qk="${k}" ${n<2?'disabled style="opacity:.45"':''}><b>${l}</b><br><small style="color:var(--muted)">${n<2?'Necesitas al menos 2 fichas con este dato':n+' preguntas posibles'}</small></button>`}).join('');
  modal(`<h2>🎯 Quiz de ${kind==='farm'?'fármacos':'patologías'}</h2><p style="font-size:14px;color:var(--muted);margin-top:-6px">Se hace con tus propias fichas. Elige qué quieres practicar:</p>${opts}
    <button class="qopt" data-qk="mix"><b>🔀 Mezclado</b></button>
    <div class="acts"><button class="btn" id="qX">Cancelar</button></div>`);
  $('#qX').onclick=closeModal;
  $$('[data-qk]').forEach(b=>b.onclick=()=>runQuiz(kind,b.dataset.qk));
}
function quizPool(kind,k){
  if(kind==='farm')return k==='grupo'?state.drugs.filter(d=>d.grupo):state.drugs.filter(d=>d[k]);
  if(k==='drug')return state.diseases.filter(d=>(d.drugs||[]).some(drugById));
  return state.diseases.filter(d=>d[k]);
}
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function makeQuestion(kind,k){
  const pool=quizPool(kind,k);if(pool.length<2)return null;
  const item=pool[Math.floor(Math.random()*pool.length)];const def=QUIZ[kind].find(x=>x[0]===k);
  if(kind==='farm'&&k==='grupo'){
    const groups=[...new Set([...state.drugs.map(d=>d.grupo).filter(Boolean),...GRUPOS])].filter(g=>g!==item.grupo);
    return{q:def[1],clue:item.name,label:'Fármaco',right:item.grupo,opts:shuffle([item.grupo,...shuffle(groups).slice(0,3)]),ref:item,refKind:'farm'};
  }
  if(k==='drug'){
    const good=(item.drugs||[]).map(drugById).filter(Boolean);const right=good[Math.floor(Math.random()*good.length)];
    const wrong=shuffle(state.drugs.filter(d=>!(item.drugs||[]).includes(d.id))).slice(0,3);
    if(!wrong.length)return null;
    return{q:def[1],clue:item.name,label:'Patología',right:right.name,opts:shuffle([right.name,...wrong.map(w=>w.name)]),ref:item,refKind:'pato'};
  }
  const others=shuffle((kind==='farm'?state.drugs:state.diseases).filter(x=>x!==item)).slice(0,3);
  let clue=item[k];if(clue.length>420)clue=clue.slice(0,420)+'…';
  const rx=new RegExp(item.name.split(/\s+/)[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  return{q:def[1],clue:clue.replace(rx,'▢▢▢'),label:def[2],right:item.name,opts:shuffle([item.name,...others.map(o=>o.name)]),ref:item,refKind:kind};
}
function runQuiz(kind,mode,total=10){
  const keys=mode==='mix'?QUIZ[kind].map(x=>x[0]).filter(k=>quizPool(kind,k).length>=2):[mode];
  if(!keys.length)return toast('Necesitas más fichas para el quiz');
  let n=0,ok=0;const wrong=[];
  const next=()=>{
    if(n>=total){
      markStudy();
      modal(`<h2>Quiz terminado 🎉</h2><div class="stats"><div class="stat"><b>${ok}/${total}</b><span>Aciertos</span></div><div class="stat"><b>${Math.round(ok/total*100)}%</b><span>Nota</span></div></div>
        ${wrong.length?`<div class="h2">Para repasar</div>${[...new Map(wrong.map(w=>[w.ref.id,w])).values()].map(w=>`<button class="tag r" data-rv="${w.ref.id}" data-rk="${w.refKind}">${esc(w.ref.name)}</button>`).join(' ')}`:'<p>¡Perfecto, todo acertado! ✨</p>'}
        <div class="acts"><button class="btn" id="qAg">Otra vez</button><button class="btn pri" id="qEnd">Cerrar</button></div>`);
      $('#qEnd').onclick=()=>{closeModal();renderHome()};$('#qAg').onclick=()=>runQuiz(kind,mode,total);
      $$('[data-rv]').forEach(b=>b.onclick=()=>b.dataset.rk==='farm'?drugView(drugById(b.dataset.rv)):diseaseView(disById(b.dataset.rv)));
      return;
    }
    let Q=null;for(let t=0;t<12&&!Q;t++)Q=makeQuestion(kind,keys[Math.floor(Math.random()*keys.length)]);
    if(!Q)return toast('No hay suficientes datos para el quiz');
    modal(`<div style="display:flex;align-items:center;gap:10px"><b style="flex:1">🎯 Pregunta ${n+1} de ${total}</b><span style="font-size:13px;color:var(--muted)">✅ ${ok}</span><button class="btn sm" id="qX">Salir</button></div>
      <div class="prog"><i style="width:${n/total*100}%"></i></div>
      <div class="h2" style="margin-top:12px">${esc(Q.label)}</div><div class="qclue">${nl(Q.clue)}</div>
      <div style="font-weight:700;margin:12px 0 8px">${esc(Q.q)}</div>
      ${Q.opts.map(o=>`<button class="qopt" data-o="${esc(o)}">${esc(o)}</button>`).join('')}
      <div class="acts hidden" id="qNext"><span class="sp"></span><button class="btn pri big" id="qGo">Siguiente ›</button></div>`,'quiz');
    $('#qX').onclick=()=>{closeModal();renderHome()};
    $$('.qopt').forEach(b=>b.onclick=()=>{
      if(!$('#qNext').classList.contains('hidden'))return;
      const good=b.dataset.o===Q.right;if(good)ok++;else wrong.push(Q);
      $$('.qopt').forEach(x=>{if(x.dataset.o===Q.right)x.classList.add('ok');else if(x===b)x.classList.add('no')});
      $('#qNext').classList.remove('hidden');n++;
      $('#qGo').onclick=next;
    });
  };
  next();
}

/* ---------- Guardar / deshacer ---------- */
let saveT=null;

async function flushSave(){
  clearTimeout(saveT);saveT=null;if(!ed.page||!ed.nb)return;
  await DB.set('page:'+ed.page.id,ed.page);ed.nb.updated=Date.now();await saveNotebooks();

const snap=()=>({strokes:ed.page.strokes.slice(),items:ed.page.items.map(i=>({...i}))});
function pushUndo(){ed.undo.push(snap());if(ed.undo.length>60)ed.undo.shift();ed.redo=[];updateUndoBtns()}
function restore(s){ed.page.strokes=s.strokes;ed.page.items=s.items;ed.sel=null;renderInk();renderItems();refreshToolbar();save()}
function undo(){if(ed.editing)stopEditing();if(!ed.undo.length)return;ed.redo.push(snap());restore(ed.undo.pop());updateUndoBtns()}
function redo(){if(ed.editing)stopEditing();if(!ed.redo.length)return;ed.undo.push(snap());restore(ed.redo.pop());updateUndoBtns()}
function updateUndoBtns(){$('#bUndo').disabled=!ed.undo.length;$('#bRedo').disabled=!ed.redo.length}

/* ---------- Dibujo ---------- */
let cur=null,panning=false,rafId=0;const ptrs=new Map();
function toLogical(e){const r=cLive.getBoundingClientRect();return{x:(e.clientX-r.left)/ed.scale,y:(e.clientY-r.top)/ed.scale,p:e.pointerType==='pen'?(e.pressure||.5):.5}}
cLive.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(e.pointerType==='pen'&&!state.settings.penSeen){state.settings.penSeen=true;state.settings.fingerPan=true;saveSettings();toast('Apple Pencil detectado: ahora el dedo desplaza la página y el Pencil dibuja')}
  if(cur&&cur.pointerType==='pen'&&e.pointerType==='touch')return; // ignorar la palma
  try{cLive.setPointerCapture(e.pointerId)}catch(_){}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,type:e.pointerType});
  const touchCount=[...ptrs.values()].filter(p=>p.type==='touch').length;
  const pan=ed.tool==='hand'||(e.pointerType==='touch'&&(state.settings.fingerPan||touchCount>=2));
  if(pan){if(cur&&cur.pointerType==='touch'){if(cur.eraser&&!cur.changed)ed.undo.pop();cur=null;clearLive()}panning=true;return}
  if(cur)return;
  const pt=toLogical(e);
  if(ed.tool==='eraser'){pushUndo();cur={eraser:true,id:e.pointerId,pointerType:e.pointerType,changed:false};eraseAt(pt);drawEraserCursor(pt);return}
  const t=toolCfg[ed.tool]?ed.tool:ed.lastPen,cfg=toolCfg[t];
  cur={id:e.pointerId,pointerType:e.pointerType,s:{tool:t,color:cfg.color,size:cfg.size,pts:[pt.x,pt.y,pt.p],line:ed.ruler||undefined}};
  if(ed.ruler)cur.s.pts.push(pt.x,pt.y,pt.p);
  queueLive();
});
cLive.addEventListener('pointermove',e=>{
  if(panning&&ptrs.has(e.pointerId)&&(!cur||cur.id!==e.pointerId)){
    const t=ptrs.get(e.pointerId),n=[...ptrs.values()].filter(p=>ed.tool==='hand'||p.type==='touch').length||1;
    sc.scrollLeft-=(e.clientX-t.x)/n;sc.scrollTop-=(e.clientY-t.y)/n;t.x=e.clientX;t.y=e.clientY;return;
  }
  if(!cur){if(ed.tool==='eraser'&&e.pointerType!=='touch'){clearLive();drawEraserCursor(toLogical(e))}return}
  if(e.pointerId!==cur.id)return;
  const evs=(e.getCoalescedEvents&&e.getCoalescedEvents())||[];const list=evs.length?evs:[e];
  if(cur.eraser){for(const ev of list)eraseAt(toLogical(ev));clearLive();drawEraserCursor(toLogical(e));return}
  const P=cur.s.pts;
  if(cur.s.line){
    const pt=toLogical(e),x0=P[0],y0=P[1];let dx=pt.x-x0,dy=pt.y-y0;
    const len=Math.hypot(dx,dy),ang=Math.atan2(dy,dx),step=Math.PI/4,snapA=Math.round(ang/step)*step;
    if(Math.abs(ang-snapA)<.07){dx=Math.cos(snapA)*len;dy=Math.sin(snapA)*len}
    P[3]=x0+dx;P[4]=y0+dy;P[5]=pt.p;
  }else{
    for(const ev of list){const pt=toLogical(ev),lx=P[P.length-3],ly=P[P.length-2];if(Math.hypot(pt.x-lx,pt.y-ly)<.6)continue;P.push(pt.x,pt.y,pt.p)}
  }
  queueLive();
});
function endPointer(e){
  ptrs.delete(e.pointerId);if(!ptrs.size)panning=false;
  if(!cur||e.pointerId!==cur.id)return;
  if(cur.eraser){if(!cur.changed){ed.undo.pop();updateUndoBtns()}else save();cur=null;clearLive();return}
  const s=cur.s;cur=null;cancelAnimationFrame(rafId);clearLive();
  pushUndo();ed.page.strokes.push(s);drawAllStrokesIncremental(s);save();
}
cLive.addEventListener('pointerup',endPointer);
cLive.addEventListener('pointercancel',endPointer);
cLive.addEventListener('pointerleave',e=>{if(!cur&&ed.tool==='eraser')clearLive()});
function drawAllStrokesIncremental(s){if(s.tool==='highlighter')renderInk();else drawStroke(xInk,s)}
function queueLive(){cancelAnimationFrame(rafId);rafId=requestAnimationFrame(()=>{clearLive();if(cur&&cur.s)drawStroke(xLive,cur.s)})}
function drawEraserCursor(pt){const r=toolCfg.eraser.size/2;xLive.save();xLive.strokeStyle='rgba(120,120,120,.8)';xLive.lineWidth=1.5/ed.scale;xLive.fillStyle='rgba(255,255,255,.35)';xLive.beginPath();xLive.arc(pt.x,pt.y,r,0,Math.PI*2);xLive.fill();xLive.stroke();xLive.restore()}
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-(ax+t*dx),py-(ay+t*dy))}
function eraseAt(pt){
  const r=toolCfg.eraser.size/2,S=ed.page.strokes;let removed=false;
  for(let j=S.length-1;j>=0;j--){
    const s=S[j],p=s.pts,n=p.length/3,lim=r+s.size/2;let hit=false;
    if(n===1)hit=Math.hypot(pt.x-p[0],pt.y-p[1])<lim;
    else for(let i=1;i<n;i++){if(segDist(pt.x,pt.y,p[i*3-3],p[i*3-2],p[i*3],p[i*3+1])<lim){hit=true;break}}
    if(hit){S.splice(j,1);removed=true}
  }
  if(removed){cur.changed=true;renderInk()}
}

/* ---------- Elementos: imágenes y textos ---------- */
function renderItems(){
  // si estamos escribiendo en un cuadro, lo conservamos al redibujar
  const editId=ed.editing&&ed.editing.isConnected!==undefined?(ed.editing.closest('.item')||{}).dataset?.id:null;
  layer.innerHTML='';
  for(const it of ed.page.items){
    const el=document.createElement('div');el.className='item '+(it.type==='text'?'text':'img')+(ed.sel===it?' sel':'');el.dataset.id=it.id;
    el.style.left=it.x+'px';el.style.top=it.y+'px';el.style.width=it.w+'px';
    if(it.type==='img'){el.style.height=it.h+'px';const im=document.createElement('img');im.src=it.src;im.draggable=false;el.appendChild(im)}
    else{const tx=document.createElement('div');tx.className='tx';tx.innerHTML=it.html||'';tx.contentEditable='false';el.appendChild(tx);styleText(el,it)}
    const k=1/ed.scale,h=`style="transform:scale(${k});transform-origin:center"`;
    el.insertAdjacentHTML('beforeend',`<div class="h h-move" ${h} title="Mover">✥</div><div class="h h-del" ${h} title="Borrar">✕</div><div class="h h-res" ${h} title="Cambiar tamaño">⤡</div>`);
    layer.appendChild(el);
  }
  if(editId){
    const el=layer.querySelector(`.item[data-id="${editId}"]`);
    if(el){const tx=el.querySelector('.tx');ed.editing=tx;tx.contentEditable='true';tx.oninput=syncEditing;
      if(document.activeElement!==tx){tx.focus({preventScroll:true});caretEnd(tx)}}
    else ed.editing=null;
  }
}
function styleText(el,it){const tx=el.querySelector('.tx');tx.style.fontFamily=it.font;tx.style.fontSize=it.size+'px';tx.style.color=it.color;tx.style.minHeight=it.h?it.h+'px':''}
function caretEnd(tx){try{const r=document.createRange();r.selectNodeContents(tx);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r)}catch(e){}}
const itemEl=it=>layer.querySelector(`.item[data-id="${it.id}"]`);
function selectItem(it){
  ed.sel=it;$$('#itemsLayer .item').forEach(el=>el.classList.toggle('sel',!!it&&el.dataset.id===it.id));refreshToolbar();
}
function visibleCenter(){const r=wrap.getBoundingClientRect(),sr=sc.getBoundingClientRect();
  return{x:Math.max(40,Math.min(ed.page.w-40,((sr.left+sr.width/2)-r.left)/ed.scale)),y:Math.max(40,Math.min(ed.page.h-40,((sr.top+sr.height/2)-r.top)/ed.scale))}}

layer.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.item');
  if(!el){return}
  const it=ed.page.items.find(i=>i.id===el.dataset.id);if(!it)return;
  const cls=e.target.classList;
  if(cls.contains('h-del')){e.preventDefault();e.stopPropagation();pushUndo();
    if(ed.editing&&ed.editing.closest('.item')===el)ed.editing=null;
    ed.page.items=ed.page.items.filter(i=>i!==it);ed.sel=null;renderItems();refreshToolbar();save();return}
  const handle=cls.contains('h-res')?'res':cls.contains('h-move')?'move':null;
  if(!handle){
    if(ed.editing&&ed.editing.closest('.item')===el)return; // escribiendo: dejar colocar el cursor
    if(ed.tool==='text'&&it.type==='text'){selectItem(it);startEditing(it);return}
    if(ed.editing)stopEditing();
  }
  // asas (mover / tamaño): funcionan siempre, incluso mientras escribes, sin cerrar el teclado
  e.preventDefault();e.stopPropagation();
  if(ed.sel!==it)selectItem(it);
  const resize=handle==='res';
  const el0=itemEl(it);
  const sx=e.clientX,sy=e.clientY,ox=it.x,oy=it.y,ow=it.w,oh=it.h||(el0?el0.offsetHeight:40),before=snap();let moved=false;
  const mv=ev=>{
    ev.preventDefault();
    const elx=itemEl(it);if(!elx)return; // se busca cada vez por si la hoja se ha redibujado
    const dx=(ev.clientX-sx)/ed.scale,dy=(ev.clientY-sy)/ed.scale;if(Math.abs(dx)+Math.abs(dy)>1)moved=true;
    if(resize){
      if(it.type==='img'){const nw=Math.max(30,ow+dx);it.w=nw;it.h=nw*oh/ow;elx.style.height=it.h+'px'}
      else{it.w=Math.max(80,Math.min(ed.page.w-it.x,ow+dx));it.h=Math.max(it.size*1.4,Math.min(ed.page.h-it.y,oh+dy));elx.querySelector('.tx').style.minHeight=it.h+'px'}
      elx.style.width=it.w+'px';
    }else{
      it.x=Math.max(-it.w+40,Math.min(ed.page.w-40,ox+dx));it.y=Math.max(0,Math.min(ed.page.h-30,oy+dy));
      elx.style.left=it.x+'px';elx.style.top=it.y+'px';
    }
  };
  const up=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
    if(moved){ed.undo.push(before);ed.redo=[];updateUndoBtns();save()}};
  window.addEventListener('pointermove',mv,{passive:false});window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
});
layer.addEventListener('dblclick',e=>{const el=e.target.closest('.item.text');if(!el)return;const it=ed.page.items.find(i=>i.id===el.dataset.id);if(it){selectItem(it);startEditing(it)}});
layer.addEventListener('click',e=>{
  if(e.target!==layer)return;
  if(ed.editing){stopEditing();selectItem(null);return}
  if(ed.tool==='text'){
    const r=wrap.getBoundingClientRect(),c=toolCfg.text;
    let x=(e.clientX-r.left)/ed.scale,y=(e.clientY-r.top)/ed.scale;
    // cuadro amplio: si tocas cerca del borde derecho, se desplaza a la izquierda para que quepa
    const w=Math.min(620,ed.page.w-80);
    x=Math.max(30,Math.min(x-4,ed.page.w-w-30));y=Math.max(10,y-c.size*.6);
    pushUndo();const it={id:uid(),type:'text',x,y,w,h:Math.round(c.size*3),html:'',font:c.font,size:c.size,color:c.color};
    ed.page.items.push(it);renderItems();selectItem(it);startEditing(it,true);
  }else selectItem(null);
});
function startEditing(it,fresh){
  const el=itemEl(it);if(!el)return;const tx=el.querySelector('.tx');
  if(!fresh&&ed.editing!==tx){ed.undo.push(snap());ed.redo=[];updateUndoBtns()}

}
function syncEditing(){if(!ed.editing)return;const id=ed.editing.closest('.item').dataset.id;const it=ed.page.items.find(i=>i.id===id);if(it){it.html=ed.editing.innerHTML;save()}}

  const id=tx.closest('.item').dataset.id,it=ed.page.items.find(i=>i.id===id);
  if(it){it.html=tx.innerHTML;if(!tx.textContent.trim()&&!/<img/i.test(it.html)){ed.page.items=ed.page.items.filter(i=>i!==it);if(ed.sel===it)ed.sel=null;renderItems();refreshToolbar()}}
  save();
}
$('#tFont').onchange=e=>{toolCfg.text.font=e.target.value;saveTools();if(ed.sel&&ed.sel.type==='text'){ed.sel.font=e.target.value;const el=itemEl(ed.sel);if(el)el.querySelector('.tx').style.fontFamily=e.target.value;save()}};
$('#tSize').onchange=e=>{const v=Math.max(8,Math.min(160,+e.target.value||28));setSize(v)};
$$('#textbar .fb').forEach(b=>{b.addEventListener('pointerdown',e=>e.preventDefault());b.onclick=()=>{if(!ed.editing){toast('Toca dentro de un texto para darle formato',1600);return}document.execCommand(b.dataset.cmd);syncEditing()}});

async function addImageSrc(src,natural){

    const url=prompt('Pega la dirección de la imagen:');closeModal();if(!url)return;
    try{const r=await fetch(url);if(!r.ok)throw 0;await addImageBlob(await r.blob())}
    catch(e){try{const im=await loadImage(url);await addImageSrc(url,{w:im.naturalWidth,h:im.naturalHeight});toast('Imagen enlazada (necesita internet para verse)')}catch(_){toast('No se pudo cargar esa imagen. Prueba a guardarla y subirla desde Fotos.')}}
  };
  $('#imC').onclick=async()=>{
    closeModal();
    try{const items=await navigator.clipboard.read();for(const ci of items){const t=ci.types.find(t=>t.startsWith('image/'));if(t){await addImageBlob(await ci.getType(t));return}}toast('No hay ninguna imagen copiada')}
    catch(e){toast('Usa ⌘V o mantén pulsado y «Pegar»')}
  };
}
document.addEventListener('paste',async e=>{
  if($('#editor').classList.contains('hidden')||!$('#modal').classList.contains('hidden'))return;
  const items=[...(e.clipboardData?.items||[])];const img=items.find(i=>i.type.startsWith('image/'));
  if(img){e.preventDefault();await addImageBlob(img.getAsFile());return}
  if(ed.editing){e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'))}
});
sc.addEventListener('dragover',e=>e.preventDefault());
sc.addEventListener('drop',async e=>{
  e.preventDefault();const files=[...(e.dataTransfer?.files||[])];
  for(const f of files){if(f.type.startsWith('image/'))await addImageBlob(f);else if(isPdf(f))await insertPdfPages(await f.arrayBuffer())}
  if(!files.length){const url=e.dataTransfer.getData('text/uri-list')||e.dataTransfer.getData('text/plain');if(url&&/^https?:/.test(url)){try{const im=await loadImage(url);await addImageSrc(url,{w:im.naturalWidth,h:im.naturalHeight})}catch(_){}}}
});

/* ---------- Páginas ---------- */
$('#pPrev').onclick=()=>loadPage(ed.idx-1);
$('#pNext').onclick=()=>loadPage(ed.idx+1);
$('#pAdd').onclick=async()=>{
  await flushSave();const c=ed.page;
  const p=newPage({paper:c.bg?'rayado':c.paper,tint:c.tint,w:c.bg?1000:c.w,h:c.bg?1414:c.h});
  await DB.set('page:'+p.id,p);ed.nb.pages.splice(ed.idx+1,0,p.id);await saveNotebooks();await loadPage(ed.idx+1);toast('Página nueva añadida',1400);
};
async function insertPdfPages(ab){
  try{const pages=await pdfToPages(ab);await flushSave();
    for(let i=0;i<pages.length;i++){await DB.set('page:'+pages[i].id,pages[i]);ed.nb.pages.splice(ed.idx+1+i,0,pages[i].id)}
    await saveNotebooks();await loadPage(ed.idx+1);
  }catch(e){toast('No se pudo importar el PDF: '+(e.message||e))}
}
$('#eBack').onclick=closeEditor;
$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;
function setZoom(z){
  const cx=(sc.scrollLeft+sc.clientWidth/2)/Math.max(1,wrap.offsetWidth),cy=(sc.scrollTop+sc.clientHeight/2)/Math.max(1,wrap.offsetHeight);
  ed.zoom=Math.max(.5,Math.min(3,Math.round(z*100)/100));layout();
  sc.scrollLeft=cx*wrap.offsetWidth-sc.clientWidth/2;sc.scrollTop=cy*wrap.offsetHeight-sc.clientHeight/2;
}
$('#bZoomIn').onclick=()=>setZoom(ed.zoom+.25);
$('#bZoomOut').onclick=()=>setZoom(ed.zoom-.25);
$('#bZoomFit').onclick=()=>setZoom(1);
let rzT,lastW=0;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(!ed.page||$('#editor').classList.contains('hidden'))return;const w=sc.clientWidth;if(Math.abs(w-lastW)<2)return;lastW=w;layout()},150)});

$('#bPaper').onclick=()=>{
  const p=ed.page;let paper=p.paper,tint=p.tint;
  const s=modal(`<h2>Papel</h2>
    ${p.bg?'<p style="font-size:14px;color:var(--muted)">Esta página es un PDF o una imagen importada: el papel solo cambia en las páginas normales.</p>':''}
    <div class="papers" id="pp">${PAPERS.map(([k,n])=>`<button class="paperopt ${k===paper?'on':''}" data-p="${k}"><canvas width="120" height="150"></canvas>${n}</button>`).join('')}</div>
    <div class="field" style="margin-top:14px"><label>Color del papel</label><div class="sw" id="pt">${Object.entries(TINTS).map(([k,t])=>`<button data-t="${k}" title="${t.n}" style="background:${t.bg}" class="${k===tint?'on':''}"></button>`).join('')}</div></div>
    ${!p.bg?`<div class="field"><label>Orientación</label><select id="po"><option value="v" ${p.h>p.w?'selected':''}>Vertical</option><option value="h" ${p.w>p.h?'selected':''}>Horizontal</option></select></div>`:''}
    <label class="switch"><span>Aplicar a todas las páginas de la libreta</span><input type="checkbox" id="pall"></label>
    <div class="acts"><button class="btn" id="pX">Cancelar</button><button class="btn pri" id="pOk">Aplicar</button></div>`);
  const drawPrev=()=>s.querySelectorAll('.paperopt').forEach(b=>{const c=b.querySelector('canvas'),x=c.getContext('2d');x.setTransform(120/1000,0,0,150/1414,0,0);drawPaper(x,{w:1000,h:1414,paper:b.dataset.p,tint})});
  drawPrev();
  s.querySelectorAll('.paperopt').forEach(b=>b.onclick=()=>{paper=b.dataset.p;s.querySelectorAll('.paperopt').forEach(x=>x.classList.toggle('on',x===b))});
  s.querySelectorAll('#pt button').forEach(b=>b.onclick=()=>{tint=b.dataset.t;s.querySelectorAll('#pt button').forEach(x=>x.classList.toggle('on',x===b));drawPrev()});
  $('#pX').onclick=closeModal;
  $('#pOk').onclick=async()=>{
    const orient=$('#po')?$('#po').value:null,all=$('#pall').checked;closeModal();
    const apply=pg=>{if(!pg.bg){pg.paper=paper;if(orient){const big=Math.max(pg.w,pg.h),sm=Math.min(pg.w,pg.h);pg.w=orient==='h'?big:sm;pg.h=orient==='h'?sm:big}}pg.tint=tint};
    apply(ed.page);await flushSave();
    if(all)for(const id of ed.nb.pages){if(id===ed.page.id)continue;const pg=await DB.get('page:'+id);if(pg){apply(pg);await DB.set('page:'+id,pg)}}
    layout();
  };
};

$('#bMore').onclick=()=>{
  modal(`<h2>${esc(ed.nb.title)}</h2><div class="menu">
    <button id="mExp">🖼️ Exportar esta página como imagen</button>
    <button id="mPrint">🖨️ Imprimir o guardar la libreta en PDF</button>
    <button id="mCard">🃏 Crear tarjeta de repaso con esta página</button>
    ${Object.entries(TEMPLATES).map(([k,t])=>`<button data-tpl="${k}">＋ Página de plantilla: ${t.n}</button>`).join('')}
    <button id="mPdf">📄 Importar un PDF aquí (para escribir encima)</button>
    <button id="mDup">⧉ Duplicar esta página</button>
    <button id="mEdit">✏️ Cambiar título, tema o color</button>
    <button id="mClr" class="dan">🧹 Borrar todo lo dibujado en esta página</button>
    <button id="mDel" class="dan">🗑️ Eliminar esta página</button></div>
    <div class="acts"><button class="btn" id="mX">Cerrar</button></div>`);
  $('#mX').onclick=closeModal;
  $('#mExp').onclick=async()=>{closeModal();if(ed.editing)stopEditing();const c=await composePage(ed.page,2);c.toBlob(b=>shareOrDownload(b,`${ed.nb.title} - pág ${ed.idx+1}.png`),'image/png')};
  $('#mPrint').onclick=async()=>{
    closeModal();if(ed.editing)stopEditing();await flushSave();toast('Preparando…',30000);
    const pa=$('#printArea');pa.innerHTML='';
    for(const id of ed.nb.pages){const pg=await DB.get('page:'+id);if(!pg)continue;const c=await composePage(pg,1.6);const im=document.createElement('img');im.src=c.toDataURL('image/jpeg',.9);pa.appendChild(im)}
    toast('Elige «Guardar en Archivos» o la impresora',2500);setTimeout(()=>window.print(),400);
  };
  $('#mCard').onclick=async()=>{closeModal();if(ed.editing)stopEditing();const c=await composePage(ed.page,1);cardForm(null,{img:c.toDataURL('image/jpeg',.82),tema:ed.nb.tema})};
  $$('[data-tpl]').forEach(b=>b.onclick=()=>{closeModal();addTemplatePage(b.dataset.tpl)});
  $('#mPdf').onclick=async()=>{closeModal();const [f]=await pickFile('#filePdf');if(f)await insertPdfPages(await f.arrayBuffer())};
  $('#mDup').onclick=async()=>{closeModal();await flushSave();const cp=JSON.parse(JSON.stringify(ed.page));cp.id=uid();await DB.set('page:'+cp.id,cp);ed.nb.pages.splice(ed.idx+1,0,cp.id);await saveNotebooks();await loadPage(ed.idx+1);toast('Página duplicada',1400)};
  $('#mEdit').onclick=()=>{closeModal();notebookForm(ed.nb)};
  $('#mClr').onclick=()=>{closeModal();if(!ed.page.strokes.length)return;pushUndo();ed.page.strokes=[];renderInk();save();toast('Borrado (puedes deshacer con ↶)')};
  $('#mDel').onclick=async()=>{
    closeModal();if(!confirm('¿Eliminar esta página?'))return;
    if(ed.nb.pages.length===1){pushUndo();ed.page.strokes=[];ed.page.items=[];renderInk();renderItems();save();toast('Era la única página: la he dejado en blanco');return}
    const id=ed.nb.pages[ed.idx];await DB.del('page:'+id);ed.nb.pages.splice(ed.idx,1);ed.nb.marks=ed.nb.marks.filter(m=>m.pageId!==id);await saveNotebooks();ed.page=null;await loadPage(Math.min(ed.idx,ed.nb.pages.length-1));
  };
};
window.addEventListener('afterprint',()=>{$('#printArea').innerHTML=''});

/* ---------- Atajos de teclado ---------- */
document.addEventListener('keydown',e=>{
  if($('#editor').classList.contains('hidden')||!$('#modal').classList.contains('hidden'))return;
  const tag=(e.target.tagName||'').toLowerCase();const typing=ed.editing||tag==='input'||tag==='select'||tag==='textarea';
  const mod=e.metaKey||e.ctrlKey;
  if(mod&&e.key.toLowerCase()==='z'&&!typing){e.preventDefault();e.shiftKey?redo():undo();return}
  if(e.key==='Escape'){if(ed.editing)stopEditing();else selectItem(null);return}
  if(typing||mod)return;
  if((e.key==='Backspace'||e.key==='Delete')&&ed.sel){pushUndo();ed.page.items=ed.page.items.filter(i=>i!==ed.sel);ed.sel=null;renderItems();refreshToolbar();save();return}
  const map={p:'pencil',m:'marker',h:'highlighter',e:'eraser',t:'text',v:'move'};
  const k=e.key.toLowerCase();
  if(map[k])setTool(map[k]);
  else if(k==='r')$('#tRuler').click();
  else if(e.key==='ArrowRight'&&ed.idx<ed.nb.pages.length-1)loadPage(ed.idx+1);
  else if(e.key==='ArrowLeft'&&ed.idx>0)loadPage(ed.idx-1);
});
document.addEventListener('keydown',e=>{ // repaso con teclado: espacio = ver respuesta, 1 = no la sabía, 2 = la sabía
  if(e.target.closest&&e.target.closest('input,textarea'))return;
  const show=$('#sShow'),no=$('#sNo'),yes=$('#sYes');
  if(show&&(e.key===' '||e.key==='Enter')){e.preventDefault();show.click()}
  else if(no&&e.key==='1')no.click();else if(yes&&(e.key==='2'||e.key===' '))(e.preventDefault(),yes.click());
});
window.addEventListener('pagehide',()=>{flushSave()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushSave()});

   ICONO PARA LA PANTALLA DE INICIO
   ========================================================= */
(function makeIcon(){
  const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
  x.fillStyle='#2b7a73';x.fillRect(0,0,180,180);x.scale(180/64,180/64);
  x.fillStyle='#fff';x.fill(new Path2D('M26 12h12v13h13v12H38v13H26V37H13V25h13z'));
  x.save();x.translate(46,47);x.rotate(-0.7);x.fillStyle='#f2b84b';x.strokeStyle='#fff';x.lineWidth=2.4;
  x.beginPath();x.roundRect?x.roundRect(-11,-5,22,10,5):x.rect(-11,-5,22,10);x.fill();x.stroke();x.beginPath();x.moveTo(0,-5);x.lineTo(0,5);x.stroke();x.restore();
  const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');document.head.appendChild(l);
})();

  try{
    await DB.open();await loadState();
    const h=(location.hash||'').slice(1);if(h&&$(`.tab[data-tab="${h}"]`)){ui.tab=h;$$('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab===h))}
