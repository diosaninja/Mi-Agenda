<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<script src="sync.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi Libreta">
<meta name="theme-color" content="#F8F4ED">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Mi Libreta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600;700&family=Klee+One:wght@400;600&display=swap">
<style>
:root{
  --ivory:#F8F4ED; --paper:#FFFDF8; --sand:#EDE5D8; --beige:#DCCDB7; --sage:#A3B19B; --sage-d:#6F8068;
  --rose:#D9B5AE; --rose-d:#B98A82; --stone:#8F8A83; --stone-l:#C9C4BC; --ink:#38332E; --ink-2:#5E5750;
  --desk:#E9E2D6; --line:rgba(56,51,46,.12); --shadow:0 10px 30px rgba(60,45,30,.14),0 2px 6px rgba(60,45,30,.08);
  --ui:"DM Sans",-apple-system,"Helvetica Neue",sans-serif; --display:"Cormorant Garamond","Didot",Georgia,serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--desk);color:var(--ink);font-family:var(--ui);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;touch-action:manipulation}
input,textarea,select,[contenteditable=true]{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
.hidden{display:none!important}
.fin{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0}
.screen{position:fixed;inset:0;display:flex;flex-direction:column}
svg{stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Biblioteca ---------- */
#home{background:radial-gradient(1200px 600px at 20% -10%,#F6F1E8 0%,var(--desk) 60%)}
.lib-head{display:flex;align-items:center;gap:12px;padding:calc(16px + var(--safe-t)) 24px 8px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:38px;font-weight:600;letter-spacing:.5px;margin-right:auto;line-height:1}
.brand small{display:block;font-family:var(--ui);font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--stone);font-weight:500;margin-top:6px}
.search{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:999px;padding:0 14px;height:44px;min-width:200px;flex:0 1 280px}
.search input{border:0;background:none;outline:none;font-size:15px;width:100%}
.search svg{width:18px;height:18px;color:var(--stone)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;background:rgba(255,255,255,.8);border:1px solid var(--line);font-size:15px;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.sage{background:var(--sage-d);color:#fff;border-color:var(--sage-d)}
.btn.danger{background:#A65E55;color:#fff;border-color:#A65E55}
.btn.small{height:36px;padding:0 14px;font-size:14px}
.btn svg{width:20px;height:20px}
.htabs{display:flex;gap:6px;padding:4px 24px 6px;overflow-x:auto}
.htabs button{padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.6);border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--ink-2);white-space:nowrap}
.htabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.lib-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 24px calc(40px + var(--safe-b));touch-action:pan-y}
.sec{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--stone);margin:20px 0 14px;font-weight:600;display:flex;align-items:center;gap:12px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:26px 22px}
.nbc{position:relative;display:flex;flex-direction:column;gap:8px;text-align:left}
.cover{position:relative;width:100%;aspect-ratio:1000/1414;border-radius:6px 12px 12px 6px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:18px}
.cover:active{transform:scale(.97)}
.cover .spine{position:absolute;left:0;top:0;bottom:0;width:13px;background:rgba(0,0,0,.14)}
.cover .spine::after{content:"";position:absolute;right:-3px;top:0;bottom:0;width:3px;background:rgba(255,255,255,.18)}
.cover .lbl{background:rgba(255,253,248,.92);color:var(--ink);border-radius:6px;padding:10px 12px;font-family:var(--display);font-size:20px;font-weight:600;line-height:1.1;text-align:center;max-width:100%;word-break:break-word;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.cover .sym{font-size:34px;margin-bottom:12px;font-family:"Klee One",serif;line-height:1}
.cover .fav{position:absolute;right:10px;top:8px;font-size:16px}
.nbc .meta{font-size:12px;color:var(--stone);padding-left:4px}
.nbc .dots{position:absolute;right:6px;bottom:30px;width:34px;height:34px;border-radius:50%;background:rgba(255,253,248,.95);box-shadow:var(--shadow);font-size:18px;line-height:32px;text-align:center}
.nbc.new .cover{background:transparent;border:2px dashed var(--stone-l);box-shadow:none;color:var(--sage-d);font-weight:600;gap:8px}
.nbc.new .cover b{font-size:40px;font-weight:400}
.rows{display:flex;flex-direction:column;gap:10px}
.rowc{display:flex;align-items:center;gap:12px;background:rgba(255,253,248,.85);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.rowc .ic{width:44px;height:44px;border-radius:10px;background:var(--sand);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.rowc .tx{flex:1;min-width:0}
.rowc .tx b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowc .tx small{color:var(--stone)}
.empty{text-align:center;color:var(--stone);padding:40px 10px;line-height:1.5}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}

/* ---------- Editor ---------- */
#editor{background:var(--desk)}
.ed-top{display:flex;align-items:center;gap:4px;padding:calc(6px + var(--safe-t)) 8px 6px;background:rgba(255,253,248,.94);border-bottom:1px solid var(--line);z-index:30;min-height:52px}
.ed-title{font-family:var(--display);font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:26vw;padding:0 6px}
.pnav{display:flex;align-items:center;gap:2px;font-size:14px;color:var(--ink-2);white-space:nowrap}
.pnav span{min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
.ed-actions{display:flex;align-items:center;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none;flex:0 1 auto;min-width:0}
.ed-actions::-webkit-scrollbar{display:none}
.ib{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--ink-2);position:relative}
.ib svg{width:22px;height:22px}
.ib:active{background:var(--sand)}
.ib.on{background:var(--ink);color:#fff}
.ib.rec{color:#B23A48}
.ib .star{font-size:19px}
.sepv{width:1px;height:24px;background:var(--line);margin:0 4px;flex:none}
.ed-main{flex:1;display:flex;min-height:0;position:relative}
.vp-wrap{position:relative;flex:1;min-width:0;min-height:0}
#vp{position:absolute;inset:0;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
#pageBox{position:relative;box-shadow:0 8px 28px rgba(60,45,30,.18),0 1px 4px rgba(60,45,30,.1);border-radius:3px;overflow:hidden;background:#fff}
#pageBox canvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#imgLayer,#itemLayer{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
#itemsBox{position:absolute;inset:0}
.it{position:absolute}
.it.text .tx{outline:none;white-space:pre-wrap;word-break:break-word;line-height:1.35;min-height:1.35em;padding:0}
body[data-tool=texto] .it.text{pointer-events:auto}
body[data-tool=texto] .it.text .tx{cursor:text;background:rgba(163,177,155,.10);border-radius:4px}
body[data-tool=texto] .it.text .tx:empty::before{content:"Escribe…";opacity:.35}
.it.img img{width:100%;height:100%;display:block;pointer-events:none;border-radius:2px}
.pill{pointer-events:auto;display:inline-flex;align-items:center;gap:10px;padding:8px 18px;border-radius:999px;background:rgba(255,253,248,.95);border:2px solid rgba(56,51,46,.16);font-size:22px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.1);color:#38332E;font-family:var(--ui)}
.pill b{color:var(--sage-d)}
.it.sel{outline:calc(2px * var(--inv,1)) dashed var(--sage-d);outline-offset:calc(5px * var(--inv,1))}
.chip-x,.chip-rs{position:absolute;pointer-events:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);touch-action:none}
.chip-x{width:calc(34px * var(--inv,1));height:calc(34px * var(--inv,1));right:calc(-24px * var(--inv,1));top:calc(-24px * var(--inv,1));background:#A65E55;font-size:calc(18px * var(--inv,1))}
.chip-rs{width:calc(28px * var(--inv,1));height:calc(28px * var(--inv,1));right:calc(-18px * var(--inv,1));bottom:calc(-18px * var(--inv,1));background:var(--sage-d);border:calc(3px * var(--inv,1)) solid #fff}
#selBox{position:absolute;border:calc(2px * var(--inv,1)) dashed var(--sage-d);background:rgba(163,177,155,.08);pointer-events:auto;touch-action:none;border-radius:calc(6px * var(--inv,1))}
#selBox .chip-rs{right:calc(-16px * var(--inv,1));bottom:calc(-16px * var(--inv,1))}
.ruler{position:absolute;width:800px;height:84px;margin-left:-400px;margin-top:-42px;background:rgba(244,240,232,.82);border:1.5px solid rgba(56,51,46,.38);border-radius:8px;pointer-events:auto;touch-action:none;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.ruler .tk{position:absolute;left:0;right:0;top:0;height:30px;background:
  repeating-linear-gradient(90deg,rgba(56,51,46,.75) 0 1.5px,transparent 1.5px 47.62px) 0 0/100% 28px no-repeat,
  repeating-linear-gradient(90deg,rgba(56,51,46,.55) 0 1.5px,transparent 1.5px 23.81px) 0 0/100% 19px no-repeat,
  repeating-linear-gradient(90deg,rgba(56,51,46,.4) 0 1px,transparent 1px 4.762px) 0 0/100% 11px no-repeat}
.ruler .rb{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center}
.ruler .rb button,.ruler .rb span{height:38px;min-width:42px;padding:0 10px;border-radius:19px;background:rgba(255,255,255,.9);border:1px solid rgba(56,51,46,.2);font-size:20px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.ruler .rb span{background:none;border:0;font-weight:700;min-width:60px}

/* Barra de herramientas */
#tools{position:absolute;left:50%;bottom:calc(10px + var(--safe-b));transform:translateX(-50%);display:flex;align-items:center;gap:3px;padding:6px 8px;background:rgba(255,253,248,.97);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);max-width:calc(100% - 14px);overflow-x:auto;z-index:20;scrollbar-width:none;touch-action:pan-x}
#tools::-webkit-scrollbar{display:none}
.tb{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink-2);position:relative}
.tb svg{width:23px;height:23px}
.tb.on{background:var(--ink);color:#fff}
.tb .mk{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:14px;height:3px;border-radius:2px}
.tb .em{position:absolute;right:2px;top:1px;font-size:9px;font-weight:700}
.tsep{width:1px;height:26px;background:var(--line);margin:0 3px;flex:none}
.sz{width:30px;height:40px;display:flex;align-items:center;justify-content:center;flex:none;border-radius:10px;color:var(--ink)}
.sz i{display:block;border-radius:50%;background:currentColor}
.sz.on{background:var(--sand)}
.szt{height:34px;padding:0 9px;border-radius:10px;font-size:13px;font-weight:600;flex:none;color:var(--ink-2)}
.szt.on{background:var(--sand);color:var(--ink)}
.sw{width:28px;height:28px;border-radius:50%;flex:none;margin:0 2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.sw.on{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink)}
.sw.add{display:flex;align-items:center;justify-content:center;background:conic-gradient(#e66,#ec6,#6c6,#6ce,#66e,#c6e,#e66);color:#fff;font-weight:700;font-size:18px}

/* Panel al lado */
#side{width:44%;min-width:280px;max-width:72%;border-left:1px solid var(--line);background:var(--paper);display:flex;flex-direction:column;order:2;position:relative;min-height:0}
#sideGrip{position:absolute;left:-7px;top:0;bottom:0;width:14px;cursor:col-resize;z-index:5;touch-action:none}
#sideGrip::after{content:"";position:absolute;left:5px;top:50%;width:4px;height:44px;margin-top:-22px;border-radius:2px;background:var(--stone-l)}
#sideBody{flex:1;min-height:0;display:flex;flex-direction:column}
@media (max-width:760px){
  .ed-main{flex-direction:column}
  #side{width:auto;max-width:none;min-width:0;height:46%;order:0;border-left:0;border-bottom:1px solid var(--line)}
  #sideGrip{left:0;right:0;top:auto;bottom:-7px;width:auto;height:14px;cursor:row-resize}
  #sideGrip::after{left:50%;top:5px;width:44px;height:4px;margin:0 0 0 -22px}
  .ed-title{max-width:30vw;font-size:19px}
  .brand{font-size:32px}
}
.viewer{display:flex;flex-direction:column;flex:1;min-height:0}
.vbar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--ivory)}
.vbar .vn{flex:1;min-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:14px}
.vb{height:34px;padding:0 11px;border-radius:17px;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:500;white-space:nowrap}
.vb.pri{background:var(--sage-d);color:#fff;border-color:var(--sage-d)}
.vpg{font-size:13px;color:var(--stone);font-variant-numeric:tabular-nums}
.pdfs{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px;background:#E4DED3;touch-action:pan-x pan-y}
.pslot{width:calc(100% * var(--pz,1));margin:0 auto 12px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.pslot canvas{width:100%;height:auto;display:block}
.epw{flex:1;position:relative;min-height:0;background:#fff}
.eparea{position:absolute;inset:0 44px}
.epn{position:absolute;top:50%;margin-top:-30px;width:40px;height:60px;border-radius:12px;font-size:30px;color:var(--stone)}
.epn.prev{left:2px}.epn.next{right:2px}
.vwrap{flex:1;background:#111;display:flex;align-items:center;justify-content:center;min-height:0}
.vwrap video,.vwrap iframe,.vwrap>div{width:100%;height:100%;border:0}
.vbar select{height:34px;border-radius:17px;border:1px solid var(--line);background:#fff;padding:0 8px;max-width:170px;font-size:13px}
.side-list{flex:1;overflow:auto;padding:14px}
.side-list h3{font-family:var(--display);font-size:24px;margin:0 0 4px}
.side-list p.hint{font-size:13px;color:var(--stone);margin:0 0 12px;line-height:1.45}

/* Modal */
#modal{position:fixed;inset:0;background:rgba(40,30,20,.32);display:flex;align-items:center;justify-content:center;z-index:100;padding:12px}
.sheet{background:var(--paper);border-radius:20px;max-width:560px;width:100%;max-height:calc(100% - 8px);overflow:auto;padding:20px 20px calc(18px + var(--safe-b));box-shadow:var(--shadow);-webkit-overflow-scrolling:touch}
.sheet.wide{max-width:1000px}
.sheet.full{max-width:none;height:100%;padding:0;display:flex;flex-direction:column;overflow:hidden}
.sheet h2{font-family:var(--display);font-size:28px;margin:0 0 12px;font-weight:600}
.sheet p{line-height:1.5;color:var(--ink-2)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label{font-size:12px;font-weight:600;color:var(--stone);text-transform:uppercase;letter-spacing:1.4px}
.field input[type=text],.field input[type=url],.field input[type=number],.field select{height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:0 12px;font-size:16px;outline:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.cchip{width:36px;height:36px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.cchip.on{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink)}
.tchip{min-width:40px;height:38px;padding:0 10px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:20px;font-family:"Klee One",serif}
.tchip.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end;margin-top:14px}
.ppgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px}
.ppc{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--ink-2);text-align:center;line-height:1.2}
.ppc canvas{width:84px;height:119px;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.ppc.on canvas{box-shadow:0 0 0 3px var(--sage-d)}
.ppc.on{color:var(--ink);font-weight:600}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px}
.pgc{display:flex;flex-direction:column;gap:6px;align-items:center}
.pgc .th{width:100%;aspect-ratio:1000/1414;background:#fff;border-radius:4px;box-shadow:0 1px 5px rgba(0,0,0,.15);overflow:hidden;position:relative}
.pgc .th canvas{width:100%;height:100%;display:block;object-fit:contain}
.pgc.cur .th{box-shadow:0 0 0 3px var(--sage-d)}
.pgc .th .mk{position:absolute;right:6px;top:4px;font-size:16px}
.pgc .pa{display:flex;gap:2px}
.pgc .pa button{width:30px;height:30px;border-radius:8px;font-size:14px;background:#fff;border:1px solid var(--line)}
.pgc small{color:var(--stone)}
.menu{display:flex;flex-direction:column;gap:6px}
.menu button{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:16px}
.menu button span.e{font-size:22px;width:28px;text-align:center}
.menu button small{display:block;color:var(--stone);font-size:12.5px;margin-top:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.seg button{padding:8px 12px;font-size:14px}
.seg button.on{background:var(--ink);color:#fff}
.prog{height:8px;border-radius:4px;background:var(--sand);overflow:hidden;margin:10px 0}
.prog i{display:block;height:100%;width:0;background:var(--sage-d);transition:width .2s}

/* Flotantes */
#toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.float{position:fixed;z-index:60;background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
#dict,#rec{left:50%;transform:translateX(-50%);top:calc(64px + var(--safe-t));display:flex;flex-direction:column;gap:6px;padding:10px 14px;max-width:min(560px,94vw);min-width:260px}
#rec{top:calc(64px + var(--safe-t))}
#dict .dl{display:flex;align-items:center;gap:8px}
#dict .live{font-size:14px;color:var(--stone);font-style:italic;min-height:18px}
.dotrec{width:12px;height:12px;border-radius:50%;background:#B23A48;animation:pul 1s infinite;flex:none}
@keyframes pul{50%{opacity:.3}}

#calc .ch b{flex:1;font-family:var(--display);font-size:20px}

#calc .keys button{height:48px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:20px}
#calc .keys button.op{background:var(--sand)}
#calc .keys button.eq{background:var(--sage-d);color:#fff;grid-column:span 2}
#calc .hist{max-height:84px;overflow:auto;padding:0 12px 6px;font-size:13px;color:var(--stone)}
#calc .hist div{padding:3px 0;border-bottom:1px dashed var(--line)}
#calc .med{padding:10px 12px 12px;max-height:60vh;overflow:auto;touch-action:pan-y}
#calc .med h4{margin:10px 0 6px;font-size:14px}
#calc .med .mr{display:flex;gap:6px;margin-bottom:6px}
#calc .med input,#calc .med select{width:100%;height:38px;border-radius:10px;border:1px solid var(--line);padding:0 8px;font-size:15px;background:#fff}

#calc .cfoot button{flex:1;height:36px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:500}

<script>
'use strict';
/* ================= Utilidades ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const r1=v=>Math.round(v*10)/10, r2=v=>Math.round(v*100)/100;
function debounce(f,ms){let t;const d=()=>{clearTimeout(t);t=setTimeout(f,ms)};d.flush=()=>{clearTimeout(t);f()};return d;}
function toast(m,ms=2600){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),ms);}
function fmtT(s){s=Math.max(0,Math.round(s||0));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0');}
function fmtSize(b){return b>1048576?(b/1048576).toFixed(1).replace('.',',')+' MB':Math.max(1,Math.round(b/1024))+' KB';}
function fmtDate(t){return new Date(t).toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'});}
function hexRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255];}
function lum(h){const[r,g,b]=hexRgb(h);return(r*299+g*587+b*114)/255000;}
const scripts={};
function loadScript(src){return scripts[src]||(scripts[src]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>{delete scripts[src];rej(new Error('No se pudo cargar'))};document.head.appendChild(s);}));}
function ytId(u){const m=String(u).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/))([\w-]{11})/);return m?m[1]:null;}
async function shareOrDownload(blob,name){
  try{const f=new File([blob],name,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return;}}catch(e){if(e&&e.name==='AbortError')return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
}

/* ================= Base de datos ================= */
const DB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('miLibreta',1);r.onupgradeneeded=()=>{const d=r.result;['nb','pg','files'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})});};r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error);});},
  req(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  get(s,k){return this.req(this.db.transaction(s).objectStore(s).get(k))},
  all(s){return this.req(this.db.transaction(s).objectStore(s).getAll())},
  async put(s,v){for(let i=0;i<8;i++){try{return await this.req(this.db.transaction(s,'readwrite').objectStore(s).put(v))}catch(e){await sleep(1200)}}toast('⚠️ No se pudo guardar. Inténtalo otra vez.')},
  async del(s,k){for(let i=0;i<8;i++){try{return await this.req(this.db.transaction(s,'readwrite').objectStore(s).delete(k))}catch(e){await sleep(1200)}}}
};

/* ================= Ajustes ================= */
const SKEY='milibreta.v1', PKEY='milibreta.pos';
const DEF={palette:['#2B2A28','#5E5750','#B23A48','#C9733D','#C9A24D','#6F8068','#3F6E8C','#7A5C99','#E8A0B4','#FFFFFF'],
  hl:['#FFE45C','#9BE58F','#7FD3F7','#F7A1C4','#FFB46B','#C9A7F5'],
  tool:'boli',size:{lapiz:1,boli:1,rotulador:1,pincel:1,subrayador:1,goma:2,texto:1},
  color:{lapiz:'#5E5750',boli:'#2B2A28',rotulador:'#3F6E8C',pincel:'#2B2A28',subrayador:'#FFE45C',texto:'#2B2A28'},
  font:'ui',eraseMode:'trazo',finger:'auto',penSeen:false,shapes:true,lang:'es-ES',fit:'ancho',sideW:44,sideH:46,calcHist:[],epubFs:100,calcPos:null};
let S;try{S=JSON.parse(localStorage.getItem(SKEY)||'{}')}catch(e){S={}}
S=Object.assign({},DEF,S);S.size=Object.assign({},DEF.size,S.size);S.color=Object.assign({},DEF.color,S.color);
function saveS(){try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){}}
let POS;try{POS=JSON.parse(localStorage.getItem(PKEY)||'{}')}catch(e){POS={}}
const savePos=debounce(()=>{try{localStorage.setItem(PKEY,JSON.stringify(POS))}catch(e){}},800);

/* ================= Herramientas ================= */
const TOOLS={
  lapiz:{n:'Lápiz',sizes:[1.2,2,3,4.5,6.5]},
  boli:{n:'Boli',sizes:[1.6,2.4,3.4,4.8,7]},
  rotulador:{n:'Rotulador',sizes:[4,6,9,13,18]},
  pincel:{n:'Pincel',sizes:[5,9,14,20,28]},
  subrayador:{n:'Subrayador',sizes:[12,18,26,34,44]},
  goma:{n:'Goma',sizes:[8,14,22,32,46]},
  lazo:{n:'Lazo (seleccionar)'},texto:{n:'Texto',sizes:[20,28,38,52]},mano:{n:'Mano (mover)'}
};
const PEN_TOOLS=['lapiz','boli','rotulador','pincel','subrayador'];
const ICON={
  lapiz:'<path d="M16.5 3.5l4 4L8 20l-5 1 1-5z"/><path d="M14 6l4 4"/><path d="M4.2 16.2l3.6 3.6"/>',
  boli:'<path d="M14.5 4.5l5 5L9 20H4v-5z"/><path d="M12.5 6.5l5 5"/>',
  rotulador:'<path d="M9 15l-4 4v2h2l4-4"/><path d="M9 15l6-6 4 4-6 6z"/><path d="M15 9l2-2a2.8 2.8 0 0 1 4 4l-2 2"/>',
  pincel:'<path d="M19 3c1.2 1.2.8 3-1.2 5L11 15l-2.5-2.5L15.3 5.6C17 4 18.3 2.3 19 3z"/><path d="M8 13c-2.2.2-3.6 2-3.8 4.6-.1 1.2-.6 2.4-1.2 3.4 3.6 0 7.4-1.4 7.6-5.2"/>',
  subrayador:'<path d="M9 11l-5 5v3h6l2-2"/><path d="M9 11l5-7 6 6-7 5z"/>',
  goma:'<path d="M7 20h12"/><path d="M5.5 14.5l8-8a2 2 0 0 1 2.8 0l3.2 3.2a2 2 0 0 1 0 2.8L13 19H8.5z"/><path d="M10 10l5.5 5.5"/>',
  lazo:'<path d="M7 15c-3-1.5-4-3.5-4-5.5C3 6 7 3 12 3s9 3 9 6.5S17 16 12 16c-1.3 0-2.5-.2-3.6-.5" stroke-dasharray="2.6 2.4"/><path d="M8.4 15.5c-.9 1.5-.4 3.5 1.6 5.5"/>',
  texto:'<path d="M5 7V4h14v3"/><path d="M12 4v16"/><path d="M9 20h6"/>',
  mano:'<path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12"/><path d="M11 11.5v-7a1.5 1.5 0 0 1 3 0v7"/><path d="M14 11.5V6a1.5 1.5 0 0 1 3 0v8c0 4-2.5 7-6.5 7-2.6 0-4.3-1.3-5.6-3.4L3.3 15a1.6 1.6 0 0 1 2.6-1.8L8 15.5"/>',
  regla:'<path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/>',
  undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>',
  redo:'<path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/>'
};
const FONTS={ui:'"DM Sans",-apple-system,sans-serif',serif:'"Cormorant Garamond",Georgia,serif',jp:'"Klee One","Hiragino Sans",serif'};
function wAt(t,w,pr){switch(t){case'lapiz':return w*(0.5+0.8*pr);case'boli':return w*(0.75+0.5*pr);case'rotulador':return w*(0.9+0.2*pr);case'pincel':return w*(0.08+1.15*Math.pow(pr,1.3));default:return w;}}

/* ================= Papeles ================= */
const PAPERS=[['liso','Liso'],['rayado','Rayado'],['ancho','Rayado ancho'],['margen','Rayado con margen'],['cuad5','Cuadrícula 5 mm'],['cuad10','Cuadrícula 1 cm'],['puntos','Puntos'],['cornell','Cornell'],['genkou','Genkō yōshi 原稿'],['pentagrama','Pentagrama'],['iso','Isométrico'],['hex','Hexagonal']];
const PCOL={blanco:['#FFFDF8','rgba(70,100,140,.27)','rgba(200,80,80,.5)','Blanco'],crema:['#F7F0E0','rgba(120,95,60,.27)','rgba(190,90,70,.5)','Crema'],
  rosa:['#FBEEEA','rgba(150,90,90,.25)','rgba(190,80,90,.5)','Rosa'],salvia:['#EEF2EA','rgba(80,110,80,.27)','rgba(170,90,80,.5)','Salvia'],
  gris:['#ECEBE8','rgba(60,60,60,.22)','rgba(190,80,80,.45)','Gris'],oscuro:['#2E2B28','rgba(255,255,255,.17)','rgba(255,140,140,.5)','Oscuro'],negro:['#141414','rgba(255,255,255,.15)','rgba(255,120,120,.45)','Negro']};
function drawPaper(x,type,W,H,pc,lw=1){
  const[bg,ln,acc]=PCOL[pc]||PCOL.blanco;x.fillStyle=bg;x.fillRect(0,0,W,H);x.strokeStyle=ln;x.fillStyle=ln;x.lineWidth=lw;
  const hl=(y,a=0,b=W)=>{x.beginPath();x.moveTo(a,y);x.lineTo(b,y);x.stroke()},vl=(X,a=0,b=H)=>{x.beginPath();x.moveTo(X,a);x.lineTo(X,b);x.stroke()};
  const grid=s=>{for(let X=s;X<W;X+=s)vl(X);for(let y=s;y<H;y+=s)hl(y)};
  const dr=1.7*Math.max(1,lw*.8);
  switch(type){
    case'rayado':for(let y=120;y<H-30;y+=34)hl(y);break;
    case'ancho':for(let y=130;y<H-30;y+=46)hl(y);break;
    case'margen':for(let y=130;y<H-30;y+=34)hl(y);x.strokeStyle=acc;vl(110);break;
    case'cuad5':grid(23.81);break;
    case'cuad10':grid(47.62);break;
    case'puntos':for(let y=23.81;y<H;y+=23.81)for(let X=23.81;X<W;X+=23.81){x.beginPath();x.arc(X,y,dr,0,7);x.fill();}break;
    case'cornell':{x.lineWidth=lw*1.6;hl(150);vl(290,150,H-300);hl(H-300);x.lineWidth=lw;for(let y=184;y<H-310;y+=34)hl(y,290,W);
      x.font='600 15px "DM Sans",sans-serif';x.fillText('IDEAS CLAVE',24,176);x.fillText('NOTAS',310,176);x.fillText('RESUMEN',24,H-276);x.fillText('TEMA · FECHA',24,40);break;}
    case'genkou':{const c=46,g=16,cols=Math.floor((W-80+g)/(c+g)),sx=(W-(cols*(c+g)-g))/2,rows=Math.floor((H-120)/c),sy=(H-rows*c)/2;
      for(let i=0;i<cols;i++){const X=sx+i*(c+g);vl(X,sy,sy+rows*c);vl(X+c,sy,sy+rows*c);for(let r=0;r<=rows;r++)hl(sy+r*c,X,X+c);}
      x.save();x.globalAlpha=.45;x.setLineDash([3,4]);for(let i=0;i<cols;i++){const X=sx+i*(c+g);vl(X+c/2,sy,sy+rows*c);for(let r=0;r<rows;r++)hl(sy+r*c+c/2,X,X+c);}x.restore();break;}
    case'pentagrama':for(let y=120;y+48<H-40;y+=110)for(let i=0;i<5;i++)hl(y+i*12,60,W-60);break;
    case'iso':{const s=34,t=Math.tan(Math.PI/6);x.save();x.globalAlpha=.8;for(let X=0;X<W;X+=s*0.866)vl(X);for(let b=-W;b<H+W;b+=s){x.beginPath();x.moveTo(0,b);x.lineTo(W,b+W*t);x.stroke();x.beginPath();x.moveTo(0,b);x.lineTo(W,b-W*t);x.stroke();}x.restore();break;}
    case'hex':{const r=24,w=Math.sqrt(3)*r;for(let row=0,y=r;y<H+r;row++,y+=1.5*r)for(let X=(row%2?w/2:0);X<W+w;X+=w){x.beginPath();for(let k=0;k<6;k++){const a=Math.PI/180*(60*k-30);const px=X+r*Math.cos(a),py=y+r*Math.sin(a);k?x.lineTo(px,py):x.moveTo(px,py);}x.closePath();x.stroke();}break;}
  }
}

/* ================= Trazos ================= */
const grainC={};
function grain(x,color){if(!grainC[color]){const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');const[r,gg,b]=hexRgb(color);const im=g.createImageData(64,64);
  for(let i=0;i<im.data.length;i+=4){im.data[i]=r;im.data[i+1]=gg;im.data[i+2]=b;im.data[i+3]=Math.random()<.1?0:165+Math.random()*90;}g.putImageData(im,0,0);grainC[color]=c;}
  return x.createPattern(grainC[color],'repeat');}
function tracePath(x,p,a,b){x.moveTo(p[a*3],p[a*3+1]);for(let i=a+1;i<b;i++){const mx=(p[i*3]+p[i*3+3])/2,my=(p[i*3+1]+p[i*3+4])/2;x.quadraticCurveTo(p[i*3],p[i*3+1],mx,my);}x.lineTo(p[b*3],p[b*3+1]);}
function drawStroke(x,s){
  const p=s.p,n=p.length/3;if(!n)return;x.save();x.lineCap='round';x.lineJoin='round';
  if(s.t==='subrayador'){x.globalAlpha=.38;x.strokeStyle=x.fillStyle=s.c;x.lineWidth=s.w;x.lineCap='butt';
    if(n===1){x.fillRect(p[0]-s.w*.3,p[1]-s.w/2,s.w*.6,s.w);}else{x.beginPath();tracePath(x,p,0,n-1);x.stroke();}x.restore();return;}
  const st=s.t==='lapiz'?grain(x,s.c):s.c;x.strokeStyle=st;x.fillStyle=st;
  if(n===1){x.beginPath();x.arc(p[0],p[1],wAt(s.t,s.w,p[2])/2,0,7);x.fill();x.restore();return;}
  const ch=s.t==='lapiz'?4:1;
  for(let a=0;a<n-1;a+=ch){const b=Math.min(n-1,a+ch);const mid=Math.min(n-1,Math.round((a+b)/2));x.lineWidth=wAt(s.t,s.w,p[mid*3+2]);x.beginPath();
    if(ch===1){const sx=a===0?p[0]:(p[a*3-3]+p[a*3])/2,sy=a===0?p[1]:(p[a*3-2]+p[a*3+1])/2;x.moveTo(sx,sy);
      if(b===n-1){x.quadraticCurveTo(p[a*3],p[a*3+1],p[b*3],p[b*3+1]);}else{x.quadraticCurveTo(p[a*3],p[a*3+1],(p[a*3]+p[b*3])/2,(p[a*3+1]+p[b*3+1])/2);}}
    else tracePath(x,p,a,b);
    x.stroke();}
  x.restore();}
function bbox(s){if(s._b)return s._b;const p=s.p;let a=1e9,b=1e9,c=-1e9,d=-1e9;for(let i=0;i<p.length;i+=3){if(p[i]<a)a=p[i];if(p[i]>c)c=p[i];if(p[i+1]<b)b=p[i+1];if(p[i+1]>d)d=p[i+1];}return s._b=[a,b,c,d];}
function distSeg(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=clamp(t,0,1);return Math.hypot(px-ax-t*dx,py-ay-t*dy);}
function hitStroke(s,x,y,r){const b=bbox(s),pad=r+s.w;if(x<b[0]-pad||x>b[2]+pad||y<b[1]-pad||y>b[3]+pad)return false;const p=s.p,n=p.length/3,lim=r+s.w/2;
  if(n===1)return Math.hypot(x-p[0],y-p[1])<lim;for(let i=0;i<n-1;i++)if(distSeg(x,y,p[i*3],p[i*3+1],p[i*3+3],p[i*3+4])<lim)return true;return false;}
function cutStroke(s,x,y,r){const b=bbox(s),pad=r+s.w;if(x<b[0]-pad||x>b[2]+pad||y<b[1]-pad||y>b[3]+pad)return s;const p=s.p,n=p.length/3,lim=r+s.w*.3;
  const runs=[];let cr=[],cut=false;for(let i=0;i<n;i++){if(Math.hypot(p[i*3]-x,p[i*3+1]-y)>lim)cr.push(p[i*3],p[i*3+1],p[i*3+2]);else{cut=true;if(cr.length)runs.push(cr);cr=[];}}
  if(!cut)return s;if(cr.length)runs.push(cr);return runs.filter(q=>q.length>=6).map(q=>({t:s.t,c:s.c,w:s.w,p:q}));}
const repl=(k,v)=>k&&k[0]==='_'?undefined:v;

/* Formas perfectas */
function densify(pts,pr){const o=[];for(let i=0;i<pts.length-1;i++){const[a,b]=pts[i],[c,d]=pts[i+1];const L=Math.hypot(c-a,d-b),n=Math.max(1,Math.ceil(L/4));for(let k=0;k<n;k++)o.push(r1(a+(c-a)*k/n),r1(b+(d-b)*k/n),pr);}const l=pts[pts.length-1];o.push(r1(l[0]),r1(l[1]),pr);return o;}
function recog(s){const p=s.p,n=p.length/3;if(n<6)return null;let L=0,pr=0,a=1e9,b=1e9,c=-1e9,d=-1e9;
  for(let i=0;i<n;i++){const X=p[i*3],Y=p[i*3+1];pr+=p[i*3+2];if(i)L+=Math.hypot(X-p[i*3-3],Y-p[i*3-2]);a=Math.min(a,X);c=Math.max(c,X);b=Math.min(b,Y);d=Math.max(d,Y);}pr=r2(pr/n);
  const x0=p[0],y0=p[1],x1=p[n*3-3],y1=p[n*3-2],ch=Math.hypot(x1-x0,y1-y0);
  if(ch>20){let md=0;for(let i=0;i<n;i++)md=Math.max(md,Math.abs((x1-x0)*(y0-p[i*3+1])-(x0-p[i*3])*(y1-y0))/ch);if(md<Math.max(5,ch*.05)&&L<ch*1.2)return densify([[x0,y0],[x1,y1]],pr);}
  const bw=c-a,bh=d-b;if(Math.max(bw,bh)<24||Math.min(bw,bh)<10)return null;if(ch>.3*Math.max(bw,bh))return null;
  const cx=(a+c)/2,cy=(b+d)/2,rx=bw/2,ry=bh/2;let eE=0,rE=0;
  for(let i=0;i<n;i++){const X=p[i*3],Y=p[i*3+1];eE+=Math.abs(Math.hypot((X-cx)/rx,(Y-cy)/ry)-1);rE+=Math.min(Math.abs(X-a),Math.abs(X-c),Math.abs(Y-b),Math.abs(Y-d))/Math.min(rx,ry);}eE/=n;rE/=n;
  if(eE<rE&&eE<.2){let RX=rx,RY=ry;if(Math.abs(rx-ry)/Math.max(rx,ry)<.12)RX=RY=(rx+ry)/2;const m=Math.max(40,Math.ceil(Math.PI*(RX+RY)/4));const pts=[];for(let k=0;k<=m;k++){const t=k/m*Math.PI*2;pts.push([cx+RX*Math.cos(t),cy+RY*Math.sin(t)]);}return densify(pts,pr);}
  if(rE<.13)return densify([[a,b],[c,b],[c,d],[a,d],[a,b]],pr);return null;}

function newPage(nbId,paper,pc,w=1000,h=1414,bg=null){return{id:uid(),nb:nbId,paper:paper||'rayado',pc:pc||'blanco',w,h,bg,strokes:[],items:[]};}
function serPage(pg){return{id:pg.id,nb:pg.nb,paper:pg.paper,pc:pg.pc,w:pg.w,h:pg.h,bg:pg.bg||null,data:JSON.stringify({s:pg.strokes,i:pg.items},repl)};}
function desPage(r){let o={s:[],i:[]};try{if(r.data)o=JSON.parse(r.data)}catch(e){}return{id:r.id,nb:r.nb,paper:r.paper,pc:r.pc,w:r.w||1000,h:r.h||1414,bg:r.bg||null,strokes:o.s||[],items:o.i||[]};}
async function loadPage(id){if(pageCache.has(id))return pageCache.get(id);const r=await DB.get('pg',id);const pg=r?desPage(r):newPage(cur.nb&&cur.nb.id);pg.id=id;pageCache.set(id,pg);return pg;}
const savePageNow=()=>{if(cur.page)DB.put('pg',serPage(cur.page));if(cur.nb){cur.nb.updated=Date.now();DB.put('nb',cur.nb);}};
const savePage=debounce(savePageNow,500);

/* Archivos */
async function saveFile(blob,name,kind,extra={}){const f=Object.assign({id:uid(),name,kind,mime:blob?blob.type:'',blob:blob||null,size:blob?blob.size:0,added:Date.now()},extra);await DB.put('files',f);FILES.push(f);
  if(blob&&blob.size>25*1048576)toast('Guardado. Ojo: pesa más de 25 MB y no se pasará al otro aparato.',4200);return f;}
const urlCache=new Map(),imgCache=new Map();
async function getURL(id){if(urlCache.has(id))return urlCache.get(id);let f=FILES.find(x=>x.id===id);if(!f){f=await DB.get('files',id);if(f)FILES.push(f);}if(!f||!f.blob)return null;const u=URL.createObjectURL(f.blob);urlCache.set(id,u);return u;}
function getImg(id){if(imgCache.has(id))return imgCache.get(id);const p=getURL(id).then(u=>u?new Promise(res=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src=u;}):null);imgCache.set(id,p);return p;}
async function deleteFile(id){FILES=FILES.filter(f=>f.id!==id);const u=urlCache.get(id);if(u)URL.revokeObjectURL(u);urlCache.delete(id);imgCache.delete(id);await DB.del('files',id);}
function pageFileRefs(pg){const s=new Set();if(pg.bg)s.add(pg.bg);for(const it of pg.items)if((it.type==='img'||it.type==='audio')&&it.file)s.add(it.file);return s;}
async function cleanupFiles(cands,exceptPageIds){if(!cands.size)return;const all=await DB.all('pg');const used=new Set();for(const r of all){if(exceptPageIds.has(r.id))continue;const pg=pageCache.get(r.id)||desPage(r);pageFileRefs(pg).forEach(x=>used.add(x));}
  for(const id of cands){const f=FILES.find(x=>x.id===id);if(!used.has(id)&&f&&(f.kind==='pdfpage'||f.kind==='img'||f.kind==='audio'))await deleteFile(id);}}

  $$('[data-close]',sh).forEach(b=>b.onclick=closeModal);m.onclick=e=>{if(e.target===m&&!m._lock)closeModal();};return sh;}
function closeModal(){const m=$('#modal');if(m._onclose){const f=m._onclose;m._onclose=null;f();}m.classList.add('hidden');m.innerHTML='';m._lock=false;}
function ask(msg,ok='Aceptar',danger=false){return new Promise(res=>{const sh=openModal(`<h2>${esc(msg.t||'¿Seguro?')}</h2><p>${esc(msg.m||'')}</p><div class="row end"><button class="btn" data-c>Cancelar</button><button class="btn ${danger?'danger':'primary'}" data-ok>${esc(ok)}</button></div>`);

function prompt2(title,val='',ph=''){return new Promise(res=>{const sh=openModal(`<h2>${esc(title)}</h2><div class="field"><input type="text" id="pIn" value="${esc(val)}" placeholder="${esc(ph)}"></div><div class="row end"><button class="btn" data-c>Cancelar</button><button class="btn primary" data-ok>Guardar</button></div>`);

  <button data-a="edit"><span class="e">✎</span>Editar nombre, portada y papel</button>
  <button data-a="fav"><span class="e">⭐</span>${nb.fav?'Quitar de favoritas':'Añadir a favoritas'}</button>
  <button data-a="dup"><span class="e">⧉</span>Duplicar libreta</button>
  <button data-a="pdf"><span class="e">📕</span>Exportar en PDF</button>
  <button data-a="del" style="color:#A65E55"><span class="e">🗑</span>Borrar libreta</button></div><div class="row end"><button class="btn" data-close>Cerrar</button></div>`);
  sh.onclick=async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
    if(a==='open'){closeModal();openNotebook(id);}
    if(a==='edit')nbDialog(nb);
    if(a==='fav'){nb.fav=!nb.fav;await saveNb(nb);closeModal();renderHome();}
    if(a==='dup'){closeModal();toast('Duplicando…');const n={...nb,id:uid(),title:nb.title+' (copia)',pages:[],marks:[],fav:false,created:Date.now()};
      for(const pid of nb.pages){const pg=await loadPage(pid);const c=desPage(serPage(pg));c.id=uid();c.nb=n.id;await DB.put('pg',serPage(c));n.pages.push(c.id);}await saveNb(n);NB.push(n);renderHome();toast('Libreta duplicada');}
    if(a==='pdf'){closeModal();exportPDF(nb);}
    if(a==='del'){if(await ask({t:'¿Borrar «'+nb.title+'»?',m:'Se borran sus '+nb.pages.length+' páginas en todos tus aparatos. Los PDF y vídeos de Archivos se quedan. No se puede deshacer.'},'Borrar libreta',true)){
      const cands=new Set();for(const pid of nb.pages){const pg=await loadPage(pid);pageFileRefs(pg).forEach(x=>cands.add(x));}
      const ids=new Set(nb.pages);for(const pid of nb.pages){await DB.del('pg',pid);pageCache.delete(pid);}await DB.del('nb',nb.id);NB=NB.filter(n=>n!==nb);await cleanupFiles(cands,ids);renderHome();toast('Libreta borrada');}}};
}

/* ================= EDITOR ================= */
async function openNotebook(id,idx){const nb=NB.find(n=>n.id===id);if(!nb)return;closeModal();cur.nb=nb;sessionStorage.setItem('ml-open',id);
  home.classList.add('hidden');editor.classList.remove('hidden');$('#eTitle').textContent=nb.title;renderTools();
  await goPage(idx??clamp(nb.last||0,0,nb.pages.length-1),true);}
async function closeEditor(){finishActs();savePage.flush();stopDict();cur.page=null;cur.nb=null;sessionStorage.removeItem('ml-open');destroySide();$('#side').classList.add('hidden');side.open=false;$('#calc').classList.add('hidden');
  editor.classList.add('hidden');home.classList.remove('hidden');renderHome();}
async function goPage(i,first){if(!cur.nb)return;finishActs();if(!first)savePage.flush();i=clamp(i,0,cur.nb.pages.length-1);cur.idx=i;
  const pg=await loadPage(cur.nb.pages[i]);cur.page=pg;cur.undo=[];cur.redo=[];clearSel();cur.selItem=null;cur.lastText=null;
  if(cur.nb.last!==i){cur.nb.last=i;DB.put('nb',cur.nb);}
  $('#pNum').textContent=(i+1)+' / '+cur.nb.pages.length;$('#pPrev').disabled=i===0;$('#pNext').style.opacity=1;updMark();layout();}
function updMark(){const on=(cur.nb.marks||[]).includes(cur.page.id);$('#aMark .star').textContent=on?'★':'☆';$('#aMark').style.color=on?'#C9A24D':'';}

/* Vista, zoom y tamaño */
function computeK(){const W=cur.page.w,H=cur.page.h;const k=view.base*view.z*(window.devicePixelRatio||1);return Math.min(k,Math.sqrt(6.5e6/(W*H)));}
function layout(keep){if(!cur.page)return;const W=cur.page.w,H=cur.page.h,vw=vp.clientWidth||300,vh=vp.clientHeight||300;
  let base=(vw-24)/W;if(S.fit==='pagina')base=Math.min(base,(vh-90)/H);base=Math.max(base,.08);
  if(keep&&view.base){const f=base/view.base;view.tx*=1;view.ty*=1;view.z=view.z;}
  view.base=base;if(!keep){view.z=1;view.tx=(vw-W*base)/2;view.ty=12;}
  pageBox.style.width=W*base+'px';pageBox.style.height=H*base+'px';
  for(const l of[imgLayer,itemLayer]){l.style.width=W+'px';l.style.height=H+'px';l.style.transform=`scale(${base})`;}
  clampView();applyView(true);renderAll();}
function clampView(){const W=cur.page.w*view.base*view.z,H=cur.page.h*view.base*view.z,vw=vp.clientWidth,vh=vp.clientHeight;
  const lx=Math.min(20,vw-W-20),hx=Math.max(20,vw-W-20),ly=Math.min(12,vh-H-90),hy=Math.max(12,vh-H-90);
  if(W<=vw-24)view.tx=clamp(view.tx,lx,hx);else view.tx=clamp(view.tx,vw-W-20,20);view.ty=clamp(view.ty,Math.min(ly,12),Math.max(hy,12));}
function applyView(noHi){stage.style.transform=`translate(${view.tx}px,${view.ty}px) scale(${view.z})`;itemLayer.style.setProperty('--inv',1/(view.base*view.z));if(!noHi)schedHi();}
const schedHi=debounce(()=>{if(!cur.page)return;const k=computeK();if(Math.abs(k-view.k)/view.k>.12){sizeCanvases();renderInk();renderBg();}},220);
function sizeCanvases(){const W=cur.page.w,H=cur.page.h,k=computeK();view.k=k;for(const c of[cBg,cInk,cLive]){c.width=Math.max(1,Math.round(W*k));c.height=Math.max(1,Math.round(H*k));}}
function renderAll(){sizeCanvases();renderInk();renderItems();renderRuler();renderBg();}
let bgTok=0;
async function renderBg(){const pg=cur.page,tok=++bgTok,k=view.k;xBg.setTransform(k,0,0,k,0,0);drawPaper(xBg,pg.paper,pg.w,pg.h,pg.pc,1);
  if(pg.bg){const im=await getImg(pg.bg);if(tok!==bgTok||!im)return;xBg.setTransform(k,0,0,k,0,0);xBg.drawImage(im,0,0,pg.w,pg.h);}}
function renderInk(){const k=view.k;xInk.setTransform(1,0,0,1,0,0);xInk.clearRect(0,0,cInk.width,cInk.height);xInk.setTransform(k,0,0,k,0,0);
  const st=cur.page.strokes;for(const s of st)if(s.t==='subrayador')drawStroke(xInk,s);for(const s of st)if(s.t!=='subrayador')drawStroke(xInk,s);}
let inkRaf=0;function reqInk(){if(!inkRaf)inkRaf=requestAnimationFrame(()=>{inkRaf=0;renderInk();});}
let liveRaf=0;function reqLive(){if(!liveRaf)liveRaf=requestAnimationFrame(()=>{liveRaf=0;drawLive();});}
function drawLive(){const k=view.k;xLive.setTransform(1,0,0,1,0,0);xLive.clearRect(0,0,cLive.width,cLive.height);if(!act)return;xLive.setTransform(k,0,0,k,0,0);
  if(act.kind==='draw')drawStroke(xLive,act.s);
  else if(act.kind==='lasso'){const p=act.pts;if(p.length<2)return;xLive.save();xLive.strokeStyle='#6F8068';xLive.lineWidth=2/(view.base*view.z);xLive.setLineDash([8/(view.base*view.z),6/(view.base*view.z)]);xLive.fillStyle='rgba(163,177,155,.10)';
    xLive.beginPath();xLive.moveTo(p[0][0],p[0][1]);for(const q of p)xLive.lineTo(q[0],q[1]);xLive.closePath();xLive.fill();xLive.stroke();xLive.restore();}
  else if(act.kind==='erase'&&act.pt){xLive.save();xLive.strokeStyle='rgba(56,51,46,.6)';xLive.lineWidth=1.5/(view.base*view.z);xLive.beginPath();xLive.arc(act.pt.x,act.pt.y,TOOLS.goma.sizes[S.size.goma],0,7);xLive.stroke();xLive.restore();}}
function visCenter(){const vr=vp.getBoundingClientRect(),r=pageBox.getBoundingClientRect(),W=cur.page.w,H=cur.page.h;
  return{x:clamp((vr.left+vr.width/2-r.left)*W/r.width,40,W-40),y:clamp((vr.top+vr.height*.38-r.top)*H/r.height,40,H-80)};}
function toPage(e){const r=pageBox.getBoundingClientRect();const pr=e.pointerType==='pen'?(e.pressure||.5):.5;return{x:(e.clientX-r.left)*cur.page.w/r.width,y:(e.clientY-r.top)*cur.page.h/r.height,p:pr};}

/* Deshacer */
const snapshot=()=>JSON.stringify({s:cur.page.strokes,i:cur.page.items},repl);
function pushUndo(){cur.undo.push(snapshot());if(cur.undo.length>60)cur.undo.shift();cur.redo=[];}
function restore(str){const o=JSON.parse(str);cur.page.strokes=o.s;cur.page.items=o.i;clearSel();cur.selItem=null;renderInk();renderItems();savePage();}
function undo(){if(!cur.undo.length)return toast('Nada que deshacer');cur.redo.push(snapshot());restore(cur.undo.pop());}
function redo(){if(!cur.redo.length)return toast('Nada que rehacer');cur.undo.push(snapshot());restore(cur.redo.pop());}

/* ================= Entrada: lápiz, dedo, ratón ================= */
let act=null,gest=null;const ptrs=new Map();
const fingerDraws=()=>S.finger==='si'||(S.finger==='auto'&&!S.penSeen);
vp.addEventListener('pointerdown',onDown);vp.addEventListener('pointermove',onMove);vp.addEventListener('pointerup',onUp);vp.addEventListener('pointercancel',onUp);
vp.addEventListener('lostpointercapture',e=>{if(ptrs.has(e.pointerId))onUp(e);});
vp.addEventListener('contextmenu',e=>e.preventDefault());
function touchPts(){return[...ptrs.values()].filter(p=>p.t==='touch');}
function onDown(e){if(!cur.page)return;if(e.__skip){return;}if(e.pointerType==='mouse'&&e.button!==0)return;
  if(e.pointerType==='pen'&&!S.penSeen){S.penSeen=true;saveS();}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,t:e.pointerType});try{vp.setPointerCapture(e.pointerId)}catch(x){}
  if(e.pointerType==='touch'&&touchPts().length>=2){if(act&&act.type==='touch')cancelAct();startGesture();return;}
  if(act&&e.pointerType==='pen'&&act.type==='touch')cancelAct();
  if(act)return;
  if(document.activeElement&&document.activeElement.isContentEditable&&cur.tool!=='texto')document.activeElement.blur();
  if(e.pointerType==='touch'&&(!fingerDraws()||cur.tool==='mano')&&cur.tool!=='texto'&&!(cur.tool==='mano'&&hitItem(e))){startPan(e);return;}
  const pt=toPage(e);let tool=cur.tool;if(e.pointerType==='pen'&&(e.buttons&32))tool='goma';
  if(tool==='mano'){const it=hitItem(e);if(it)startMoveItem(e,it);else{selectItem(null);startPan(e);}return;}
  if(tool==='texto'){act={kind:'tap',ptr:e.pointerId,type:e.pointerType,pt,cx:e.clientX,cy:e.clientY};return;}
  if(tool==='lazo'){clearSel();act={kind:'lasso',ptr:e.pointerId,type:e.pointerType,pts:[[pt.x,pt.y]]};return;}
  if(tool==='goma'){act={kind:'erase',ptr:e.pointerId,type:e.pointerType,snap0:snapshot(),changed:false,pt:null};eraseAt(pt);return;}
  startDraw(e,pt,tool);}
function onMove(e){const p=ptrs.get(e.pointerId);if(!p)return;p.x=e.clientX;p.y=e.clientY;
  if(gest){updGesture();return;}if(!act||act.ptr!==e.pointerId)return;
  if(act.kind==='pan'){view.tx=act.tx+e.clientX-act.x;view.ty=act.ty+e.clientY-act.y;clampView();applyView();return;}
  if(act.kind==='moveItem'){moveItem(e);return;}
  const evs=(e.getCoalescedEvents&&e.getCoalescedEvents().length)?e.getCoalescedEvents():[e];
  if(act.kind==='draw'){moveDraw(evs);return;}
  if(act.kind==='lasso'){for(const ev of evs){const q=toPage(ev),l=act.pts[act.pts.length-1];if(Math.hypot(q.x-l[0],q.y-l[1])>3)act.pts.push([q.x,q.y]);}reqLive();return;}
  if(act.kind==='erase'){for(const ev of evs)eraseAt(toPage(ev));return;}}
function onUp(e){if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  if(gest){if(touchPts().length<2){gest=null;schedHi();}return;}
  if(!act||act.ptr!==e.pointerId)return;const a=act;
  if(a.kind==='draw')finishDraw();else if(a.kind==='lasso'){act=null;drawLive();finishLasso(a.pts);}
  else if(a.kind==='erase'){act=null;drawLive();if(a.changed){cur.undo.push(a.snap0);if(cur.undo.length>60)cur.undo.shift();cur.redo=[];savePage();}}
  else if(a.kind==='tap'){act=null;if(Math.hypot(e.clientX-a.cx,e.clientY-a.cy)<12)createText(a.pt);}
  else if(a.kind==='moveItem'){act=null;if(a.moved){cur.undo.push(a.u);cur.redo=[];savePage();}}
  else act=null;}
function cancelAct(){if(act&&act.hold)clearTimeout(act.hold);if(act&&act.kind==='erase'&&act.changed){restore(act.snap0);}act=null;drawLive();}
function finishActs(){if(act&&act.kind==='draw')finishDraw();act=null;gest=null;ptrs.clear();}
function startPan(e){act={kind:'pan',ptr:e.pointerId,type:e.pointerType,x:e.clientX,y:e.clientY,tx:view.tx,ty:view.ty};}
function startGesture(){const[a,b]=touchPts();if(!b)return;gest={d0:Math.hypot(a.x-b.x,a.y-b.y)||1,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,z0:view.z,tx0:view.tx,ty0:view.ty};act=null;drawLive();}
function updGesture(){const[a,b]=touchPts();if(!b)return;const vr=vp.getBoundingClientRect();const d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
  const z=clamp(gest.z0*d/gest.d0,.5,6),f=z/gest.z0;view.z=z;view.tx=(mx-vr.left)-((gest.mx-vr.left)-gest.tx0)*f;view.ty=(my-vr.top)-((gest.my-vr.top)-gest.ty0)*f;clampView();applyView();}
vp.addEventListener('wheel',e=>{if(!cur.page)return;e.preventDefault();const vr=vp.getBoundingClientRect();
  if(e.ctrlKey||e.metaKey){const z0=view.z,z=clamp(z0*Math.exp(-e.deltaY*.01),.5,6),f=z/z0,mx=e.clientX-vr.left,my=e.clientY-vr.top;view.z=z;view.tx=mx-(mx-view.tx)*f;view.ty=my-(my-view.ty)*f;}
  else{view.tx-=e.deltaX;view.ty-=e.deltaY;}clampView();applyView();},{passive:false});
/* Gestos de Safari en Mac (pellizco en el trackpad) */
document.addEventListener('gesturestart',e=>e.preventDefault());

/* Dibujar */
function startDraw(e,pt,tool){const s={t:tool,c:S.color[tool]||'#2B2A28',w:TOOLS[tool].sizes[S.size[tool]??1],p:[]};
  const snap=rulerSnap(pt,s.w,tool);let q=pt;if(snap){const j=proj(snap,pt);q={x:j.x,y:j.y,p:pt.p};}
  s.p.push(r1(q.x),r1(q.y),r2(q.p));act={kind:'draw',ptr:e.pointerId,type:e.pointerType,s,lx:q.x,ly:q.y,snap,hold:0,shaped:false};armShape();reqLive();}
function moveDraw(evs){if(act.shaped)return;for(const ev of evs){const raw=toPage(ev);let x,y;
    if(act.snap){const j=proj(act.snap,raw);x=j.x;y=j.y;}else{const a=act.type==='touch'?.5:.65;x=act.lx+(raw.x-act.lx)*a;y=act.ly+(raw.y-act.ly)*a;}
    const dx=x-act.lx,dy=y-act.ly,d2=dx*dx+dy*dy;if(d2<.5)continue;act.s.p.push(r1(x),r1(y),r2(raw.p));act.lx=x;act.ly=y;if(d2>4)armShape();}reqLive();}
function armShape(){if(!S.shapes||!act||act.snap)return;clearTimeout(act.hold);const a=act;a.hold=setTimeout(()=>{if(act===a&&!a.shaped){const r=recog(a.s);if(r){a.s.p=r;a.shaped=true;delete a.s._b;reqLive();}}},600);}
function finishDraw(){const a=act;act=null;clearTimeout(a.hold);if(!a.s.p.length){drawLive();return;}
  pushUndo();cur.page.strokes.push(a.s);if(a.s.t==='subrayador')renderInk();else{xInk.setTransform(view.k,0,0,view.k,0,0);drawStroke(xInk,a.s);}drawLive();savePage();}
/* Goma */
function eraseAt(pt){const r=TOOLS.goma.sizes[S.size.goma??2];const prev=act.pt;const steps=prev?Math.max(1,Math.ceil(Math.hypot(pt.x-prev.x,pt.y-prev.y)/(r/2))):1;let ch=false;
  for(let k=1;k<=steps;k++){const x=prev?prev.x+(pt.x-prev.x)*k/steps:pt.x,y=prev?prev.y+(pt.y-prev.y)*k/steps:pt.y;
    if(S.eraseMode==='trazo'){const st=cur.page.strokes;for(let i=st.length-1;i>=0;i--)if(hitStroke(st[i],x,y,r)){st.splice(i,1);ch=true;}}
    else{const out=[];for(const s of cur.page.strokes){const res=cutStroke(s,x,y,r);if(res===s)out.push(s);else{ch=true;out.push(...res);}}cur.page.strokes=out;}}
  act.pt=pt;if(ch){act.changed=true;reqInk();}reqLive();}

/* ================= Lazo y selección ================= */
function inPoly(x,y,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const[xi,yi]=poly[i],[xj,yj]=poly[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c;}return c;}
function itemRect(it){const el=itemEls[it.id];if(!el)return{x:it.x,y:it.y,w:it.w||100,h:it.h||40};return{x:it.x,y:it.y,w:el.offsetWidth,h:el.offsetHeight};}
function finishLasso(poly){if(poly.length<3)return;const ss=[],its=[];
  for(const s of cur.page.strokes){const p=s.p,n=p.length/3;let inn=0;const stp=Math.max(1,Math.floor(n/40));let tot=0;for(let i=0;i<n;i+=stp){tot++;if(inPoly(p[i*3],p[i*3+1],poly))inn++;}if(inn/tot>=.5)ss.push(s);}
  for(const it of cur.page.items){const r=itemRect(it);if(inPoly(r.x+r.w/2,r.y+r.h/2,poly))its.push(it);}
  if(!ss.length&&!its.length){toast('No hay nada dentro del lazo');return;}cur.sel={strokes:ss,items:its};showSel();}
function selBBox(){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const s of cur.sel.strokes){const q=bbox(s),h=s.w/2;a=Math.min(a,q[0]-h);b=Math.min(b,q[1]-h);c=Math.max(c,q[2]+h);d=Math.max(d,q[3]+h);}
  for(const it of cur.sel.items){const r=itemRect(it);a=Math.min(a,r.x);b=Math.min(b,r.y);c=Math.max(c,r.x+r.w);d=Math.max(d,r.y+r.h);}return{x:a-8,y:b-8,w:c-a+16,h:d-b+16};}
let selBox=null;
function showSel(){if(!selBox){selBox=document.createElement('div');selBox.id='selBox';selBox.innerHTML='<div class="chip-rs"></div>';selBox.addEventListener('pointerdown',selDown);}
  itemLayer.appendChild(selBox);placeSel();$('#selN').textContent=(cur.sel.strokes.length+cur.sel.items.length)+' elemento(s)';$('#selMenu').classList.remove('hidden');}
function placeSel(){const b=selBBox();cur.sel.b=b;Object.assign(selBox.style,{left:b.x+'px',top:b.y+'px',width:b.w+'px',height:b.h+'px'});}
function clearSel(){cur.sel=null;if(selBox)selBox.remove();$('#selMenu').classList.add('hidden');}
function selDown(e){e.__skip=true;e.stopPropagation();e.preventDefault();if(!cur.sel)return;const scale=e.target.classList.contains('chip-rs');pushUndo();
  const o={x:e.clientX,y:e.clientY,b:{...cur.sel.b},sp:cur.sel.strokes.map(s=>({p:s.p.slice(),w:s.w})),ip:cur.sel.items.map(it=>({x:it.x,y:it.y,w:it.w,h:it.h,size:it.size}))};
  try{selBox.setPointerCapture(e.pointerId)}catch(x){}
  const mv=ev=>{const k=view.base*view.z,dx=(ev.clientX-o.x)/k,dy=(ev.clientY-o.y)/k;
    if(!scale){cur.sel.strokes.forEach((s,i)=>{const p=o.sp[i].p;for(let j=0;j<p.length;j+=3){s.p[j]=r1(p[j]+dx);s.p[j+1]=r1(p[j+1]+dy);}delete s._b;});
      cur.sel.items.forEach((it,i)=>{it.x=o.ip[i].x+dx;it.y=o.ip[i].y+dy;});}
    else{const f=Math.max(.15,Math.max((o.b.w+dx)/o.b.w,(o.b.h+dy)/o.b.h)),ox=o.b.x,oy=o.b.y;
      cur.sel.strokes.forEach((s,i)=>{const p=o.sp[i].p;for(let j=0;j<p.length;j+=3){s.p[j]=r1(ox+(p[j]-ox)*f);s.p[j+1]=r1(oy+(p[j+1]-oy)*f);}s.w=r2(o.sp[i].w*f);delete s._b;});
      cur.sel.items.forEach((it,i)=>{const q=o.ip[i];it.x=ox+(q.x-ox)*f;it.y=oy+(q.y-oy)*f;if(q.w)it.w=q.w*f;if(q.h)it.h=q.h*f;if(q.size)it.size=Math.round(q.size*f);});}
    reqInk();cur.sel.items.forEach(updItemEl);placeSel();};
  const up=()=>{selBox.removeEventListener('pointermove',mv);selBox.removeEventListener('pointerup',up);selBox.removeEventListener('pointercancel',up);placeSel();savePage();};
  selBox.addEventListener('pointermove',mv);selBox.addEventListener('pointerup',up);selBox.addEventListener('pointercancel',up);}
$('#selMenu').addEventListener('pointerdown',e=>e.preventDefault());
$('#selMenu').onclick=e=>{const b=e.target.closest('[data-s]');if(!b||!cur.sel)return;const a=b.dataset.s;
  if(a==='ok')clearSel();
  if(a==='color'){const t=PEN_TOOLS.includes(cur.tool)?cur.tool:'boli';recolorSel(S.color[t]);toast('Color cambiado. Elige otro color en la barra para cambiarlo de nuevo.');}
  if(a==='del'){pushUndo();const ss=new Set(cur.sel.strokes),ii=new Set(cur.sel.items);cur.page.strokes=cur.page.strokes.filter(s=>!ss.has(s));cur.page.items=cur.page.items.filter(i=>!ii.has(i));clearSel();renderInk();renderItems();savePage();}

function paperModal(mode){const s={paper:mode==='add'?(cur.nb.paper||cur.page.paper):cur.page.paper,pc:mode==='add'?(cur.nb.pc||cur.page.pc):cur.page.pc};
  const sh=openModal(`<h2>${mode==='add'?'Añadir página':'Papel'}</h2><div class="field"><label>Tipo de papel</label>${paperGridHTML(s.paper)}</div>
   <div class="field"><label>Color del papel</label>${colorChips(s.pc)}</div>
   <label class="row" style="margin:4px 0 8px;font-size:15px"><input type="checkbox" id="ppDef" style="width:20px;height:20px;accent-color:var(--sage-d)"> Usarlo por defecto en las páginas nuevas de esta libreta</label>
   ${cur.page.bg&&mode!=='add'?'<p style="font-size:13px">Esta página es de un PDF: el papel se ve debajo, en los bordes.</p>':''}
   <div class="row end"><button class="btn" data-close>Cancelar</button>${mode==='add'?'<button class="btn primary" data-ap="add">Añadir página</button>':'<button class="btn" data-ap="all">Toda la libreta</button><button class="btn primary" data-ap="one">Esta página</button>'}</div>`,'wide');
  paintPaperGrid(sh,s.pc);
  sh.onclick=async e=>{const t=e.target.closest('button');if(!t)return;
    if(t.dataset.pp){s.paper=t.dataset.pp;$$('[data-pp]',sh).forEach(x=>x.classList.toggle('on',x===t));}
    if(t.dataset.pc){s.pc=t.dataset.pc;$$('[data-pc]',sh).forEach(x=>x.classList.toggle('on',x===t));paintPaperGrid(sh,s.pc);}
    if(t.dataset.ap){if($('#ppDef',sh).checked){cur.nb.paper=s.paper;cur.nb.pc=s.pc;await saveNb(cur.nb);}closeModal();
      if(t.dataset.ap==='add')return addPage(s.paper,s.pc);
      if(t.dataset.ap==='one'){cur.page.paper=s.paper;cur.page.pc=s.pc;renderBg();savePage();}
      if(t.dataset.ap==='all'){savePage.flush();for(const pid of cur.nb.pages){const pg=await loadPage(pid);pg.paper=s.paper;pg.pc=s.pc;await DB.put('pg',serPage(pg));}renderBg();toast('Papel cambiado en toda la libreta');}}};}
async function pagesModal(){savePage.flush();const nb=cur.nb;
  const sh=openModal(`<h2>Páginas · ${esc(nb.title)}</h2><div class="pgrid" id="pgG"></div><div class="row end"><button class="btn" id="pgAdd">+ Página al final</button><button class="btn primary" data-close>Cerrar</button></div>`,'wide');
  const draw=()=>{const g=$('#pgG',sh);g.innerHTML=nb.pages.map((pid,i)=>`<div class="pgc${i===cur.idx?' cur':''}" data-i="${i}"><div class="th">${(nb.marks||[]).includes(pid)?'<span class="mk">⭐</span>':''}</div><small>${i+1}</small>
    <div class="pa"><button data-a="up" title="Mover antes">↑</button><button data-a="down" title="Mover después">↓</button><button data-a="dup" title="Duplicar">⧉</button><button data-a="del" title="Borrar">🗑</button></div></div>`).join('');
    (async()=>{for(const el of $$('.pgc',g)){if(!sh.isConnected)return;const pg=await loadPage(nb.pages[+el.dataset.i]);const c=await pageCanvas(pg,.2);el.querySelector('.th').prepend(c);}})();};
  draw();$('#pgAdd',sh).onclick=async()=>{closeModal();addPage(nb.paper||cur.page.paper,nb.pc||cur.page.pc,nb.pages.length-1);};
  $('#pgG',sh).onclick=async e=>{const card=e.target.closest('.pgc');if(!card)return;const i=+card.dataset.i,b=e.target.closest('[data-a]');
    if(!b){closeModal();return goPage(i);}const a=b.dataset.a,P=nb.pages,curId=cur.page.id;
    if(a==='up'&&i>0){[P[i-1],P[i]]=[P[i],P[i-1]];}
    if(a==='down'&&i<P.length-1){[P[i+1],P[i]]=[P[i],P[i+1]];}
    if(a==='dup'){const pg=await loadPage(P[i]);const c=desPage(serPage(pg));c.id=uid();pageCache.set(c.id,c);await DB.put('pg',serPage(c));P.splice(i+1,0,c.id);}
    if(a==='del'){if(P.length===1)return toast('La libreta necesita al menos una página');if(!await ask({t:'¿Borrar la página '+(i+1)+'?',m:'Se borra con todo lo que tiene. No se puede deshacer.'},'Borrar',true))return pagesModal();
      const pid=P[i],pg=await loadPage(pid);P.splice(i,1);nb.marks=(nb.marks||[]).filter(x=>x!==pid);await DB.del('pg',pid);pageCache.delete(pid);await saveNb(nb);await cleanupFiles(pageFileRefs(pg),new Set([pid]));
      const ni=P.indexOf(curId);await goPage(ni>=0?ni:Math.min(i,P.length-1));return pagesModal();}
    await saveNb(nb);cur.idx=P.indexOf(curId);$('#pNum').textContent=(cur.idx+1)+' / '+P.length;draw();};}

async function insertImage(file,inp){if(!file||!cur.page)return;inp.value='';try{const bmp=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=URL.createObjectURL(file);});
  const m=1600,sc=Math.min(1,m/Math.max(bmp.naturalWidth,bmp.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(bmp.naturalWidth*sc);c.height=Math.round(bmp.naturalHeight*sc);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);URL.revokeObjectURL(bmp.src);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.87));const f=await saveFile(blob,file.name||'Imagen','img');const w=Math.min(480,cur.page.w-80),h=w*c.height/c.width;const pt=visCenter();

/* PDF -> páginas */
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
async function loadPdf(){await loadScript(PDFJS+'pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';}
async function pdfToPages(file){const m=$('#modal');const sh=openModal(`<h2>Preparando el PDF…</h2><p id="pP">Cargando</p><div class="prog"><i id="pB"></i></div><p style="font-size:13px">No cierres la libreta mientras tanto.</p>`);m._lock=true;
  try{await loadPdf();const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;const N=pdf.numPages,ids=[],name=file.name.replace(/\.pdf$/i,'');
    if(N>200){closeModal();return toast('Este PDF tiene '+N+' páginas: es demasiado para escribir encima. Ábrelo «al lado».',5000);}
    for(let i=1;i<=N;i++){$('#pP',sh).textContent='Página '+i+' de '+N;const pg=await pdf.getPage(i);const v0=pg.getViewport({scale:1}),sc=1500/v0.width,v=pg.getViewport({scale:sc});
      const c=document.createElement('canvas');c.width=Math.round(v.width);c.height=Math.round(v.height);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:x,viewport:v}).promise;
      const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.86));c.width=c.height=1;const f=await saveFile(blob,name+' · pág. '+i,'pdfpage');
      const p=newPage(cur.nb.id,'liso','blanco',1000,Math.round(1000*v0.height/v0.width),f.id);pageCache.set(p.id,p);await DB.put('pg',serPage(p));ids.push(p.id);$('#pB',sh).style.width=(i/N*100)+'%';}
    cur.nb.pages.splice(cur.idx+1,0,...ids);await saveNb(cur.nb);m._lock=false;closeModal();await goPage(cur.idx+1);toast('✍️ '+N+' páginas añadidas. ¡Ya puedes escribir encima!');}
  catch(err){m._lock=false;closeModal();toast('No se pudo abrir el PDF (¿hay conexión a internet?)',4000);}}

const side={open:false,ctl:null,src:null};

function applySideSize(){const s=$('#side');if(innerWidth<=760){s.style.width='';s.style.height=S.sideH+'%';}else{s.style.height='';s.style.width=S.sideW+'%';}}

function sideList(){destroySide();const b=$('#sideBody');const fl=FILES.filter(f=>['pdf','epub','video','yt'].includes(f.kind)).sort((a,c)=>c.added-a.added);
  b.innerHTML=`<div class="side-list"><h3>Consultar al lado</h3><p class="hint">Lee un PDF o un libro, o mira un vídeo mientras tomas apuntes. Con 📍 dejas en la página un enlace a la hoja o al minuto exacto.</p>
   <div class="bar"><button class="btn small" data-a="doc">📄 Abrir PDF o EPUB</button><button class="btn small" data-a="yt">▶️ YouTube</button><button class="btn small" data-a="vid">🎞 Vídeo</button><button class="btn small" data-a="x">✕ Cerrar</button></div>
   <div class="rows">${fl.map(f=>`<div class="rowc" data-f="${f.id}"><div class="ic">${kindIcon(f.kind)}</div><div class="tx"><b>${esc(f.name)}</b><small>${kindName(f.kind)}${POS[f.id]&&f.kind==='pdf'?' · pág. '+POS[f.id]:''}</small></div></div>`).join('')||'<div class="empty">Aún no hay archivos. Los PDF y EPUB se eligen desde la app Archivos (iCloud Drive, Google Drive…).</div>'}</div></div>`;
  b.onclick=e=>{const a=e.target.closest('[data-a]');if(a){const v=a.dataset.a;if(v==='doc')pickDoc('lado');if(v==='yt')ytDialog();if(v==='vid')pickVid();if(v==='x')toggleSide(false);return;}
    const r=e.target.closest('[data-f]');if(r)openSideSource({file:r.dataset.f});};}
async function openSideSource(src,opt={}){if(!side.open){side.open=true;$('#side').classList.remove('hidden');$('#aSide').classList.add('on');applySideSize();layout();}
  const key=JSON.stringify(src);if(side.src===key&&side.ctl&&side.ctl.seek){side.ctl.seek(opt);return;}
  destroySide();side.src=key;const b=$('#sideBody');b.onclick=null;side.ctl=await makeViewer(b,src,{...opt,onBack:sideList,onPin:pinInfo});}
function pinInfo(i){if(!cur.page)return;if(i.kind==='video')addItem({type:'vtime',src:i.src,t:i.t,label:i.name});else addItem({type:'file',file:i.file,name:i.name,page:i.page,cfi:i.cfi});toast('📍 Apuntado en la página');}
async function openReader(src){const sh=openModal('<div id="rdBox" class="viewer" style="flex:1;min-height:0"></div>','full');const m=$('#modal');let ctl=null;m._onclose=()=>{if(ctl&&ctl.destroy)try{ctl.destroy()}catch(e){}};

    const k=/^\d$/.test(e.key)?e.key:map[e.key];if(k){e.preventDefault();calcKey(k);return;}}
  if(editor.classList.contains('hidden')||ed||!$('#modal').classList.contains('hidden'))return;
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();}
  else if(e.key==='ArrowRight')$('#pNext').click();else if(e.key==='ArrowLeft'&&cur.idx>0)goPage(cur.idx-1);});

/* ================= Exportar ================= */
function wrapLines(x,text,maxW){const out=[];for(const para of String(text||'').split('\n')){let line='';for(const w of para.split(/(\s+)/)){const t=line+w;if(x.measureText(t).width>maxW&&line.trim()){out.push(line.trimEnd());line=w.trimStart();}else line=t;}out.push(line);}return out;}
async function pageCanvas(pg,k){const W=pg.w,H=pg.h,c=document.createElement('canvas');c.width=Math.max(1,Math.round(W*k));c.height=Math.max(1,Math.round(H*k));const x=c.getContext('2d');x.setTransform(k,0,0,k,0,0);
  drawPaper(x,pg.paper,W,H,pg.pc,Math.max(1,.6/k));if(pg.bg){const im=await getImg(pg.bg);if(im)x.drawImage(im,0,0,W,H);}
  for(const it of pg.items)if(it.type==='img'){const im=await getImg(it.file);if(im)x.drawImage(im,it.x,it.y,it.w,it.h);}
  for(const s of pg.strokes)if(s.t==='subrayador')drawStroke(x,s);for(const s of pg.strokes)if(s.t!=='subrayador')drawStroke(x,s);
  for(const it of pg.items){if(it.type==='text'){x.font=`${it.size}px ${FONTS[it.font]||FONTS.ui}`;x.fillStyle=it.color;x.textBaseline='top';const lh=it.size*1.35;wrapLines(x,it.text,it.w).forEach((l,i)=>x.fillText(l,it.x,it.y+i*lh+it.size*.15));}
    else if(it.type!=='img'){const tmp=document.createElement('div');tmp.innerHTML=pillHTML(it);const t=tmp.textContent.trim();x.font=`22px ${FONTS.ui}`;const w=x.measureText(t).width+40;
      x.fillStyle='rgba(255,253,248,.96)';x.strokeStyle='rgba(56,51,46,.2)';x.lineWidth=2;x.beginPath();x.roundRect?x.roundRect(it.x,it.y,w,44,22):x.rect(it.x,it.y,w,44);x.fill();x.stroke();x.fillStyle='#38332E';x.textBaseline='middle';x.fillText(t,it.x+20,it.y+23);}}
  return c;}
async function exportPDF(nb){if(cur.nb===nb)savePage.flush();const m=$('#modal');const sh=openModal(`<h2>Exportando «${esc(nb.title)}»</h2><p id="eP">Preparando…</p><div class="prog"><i id="eB"></i></div>`);m._lock=true;
  try{await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');const{jsPDF}=window.jspdf;let doc=null;
    for(let i=0;i<nb.pages.length;i++){$('#eP',sh).textContent='Página '+(i+1)+' de '+nb.pages.length;const pg=await loadPage(nb.pages[i]);const c=await pageCanvas(pg,1.6);const data=c.toDataURL('image/jpeg',.88);c.width=c.height=1;
      const w=595.28,h=w*pg.h/pg.w,o=h>=w?'p':'l';if(!doc)doc=new jsPDF({unit:'pt',format:[w,h],orientation:o});else doc.addPage([w,h],o);doc.addImage(data,'JPEG',0,0,w,h);$('#eB',sh).style.width=((i+1)/nb.pages.length*100)+'%';await sleep(0);}
    const blob=doc.output('blob');m._lock=false;closeModal();await shareOrDownload(blob,nb.title+'.pdf');}
  catch(e){m._lock=false;closeModal();toast('No se pudo exportar (hace falta internet la primera vez)',4000);}}

window.addEventListener('resize',debounce(()=>{if(cur.page){if(side.open)applySideSize();layout(true);}},150));
document.addEventListener('visibilitychange',()=>{if(document.hidden){savePage.flush();}});
window.addEventListener('pagehide',()=>savePage.flush());
(async()=>{try{await DB.open();NB=await DB.all('nb');FILES=await DB.all('files');}catch(e){toast('No se pudo abrir el almacén de la libreta');}
  document.body.dataset.tool=cur.tool;renderHome();
  const last=sessionStorage.getItem('ml-open');if(last&&NB.find(n=>n.id===last))openNotebook(last);
  else if(!NB.length){/* primera vez: libreta de ejemplo */const n={id:uid(),title:'Mis apuntes',color:'#6F8068',sym:'📓',paper:'rayado',pc:'blanco',tags:[],pages:[],marks:[],fav:false,created:Date.now(),updated:Date.now(),last:0};
    const pg=newPage(n.id,'rayado','blanco');n.pages.push(pg.id);await DB.put('pg',serPage(pg));await DB.put('nb',n);NB.push(n);renderHome();}
})();
