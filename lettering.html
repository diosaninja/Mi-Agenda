<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lettering">
<meta name="theme-color" content="#f3f0eb">
<title>Lettering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f0eb;--panel:rgba(255,255,255,.94);--solid:#fff;--ink:#2b2a28;--muted:#8a857d;--line:#e6e1d8;--accent:#c2697a;--accentSoft:#f6e4e7;--shadow:0 8px 30px rgba(60,40,30,.13);--r:18px}
body.dark{--bg:#1b1a1c;--panel:rgba(42,41,44,.95);--solid:#2a292c;--ink:#f1ede8;--muted:#a29c94;--line:#3c3a3e;--accentSoft:#4a2f35}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;font-size:15px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
#viewport{position:fixed;inset:0;touch-action:none;overflow:hidden}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;box-shadow:0 12px 40px rgba(40,30,20,.18);background:#fff}
#stage>canvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#stage img.ref{position:absolute;pointer-events:none;max-width:none}
#selFloat{position:absolute;pointer-events:none;transform-origin:50% 50%}
#selBox{position:absolute;pointer-events:none;border:1.5px dashed var(--accent);transform-origin:50% 50%;background:rgba(194,105,122,.05)}
/* barras */
.bar{position:fixed;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);border-radius:var(--r);z-index:10}
#topbar{top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;height:52px;display:flex;align-items:center;gap:6px;padding:0 8px;overflow-x:auto;scrollbar-width:none}
#topbar::-webkit-scrollbar{display:none}
.tb{height:40px;min-width:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 9px;white-space:nowrap;flex:none}
.tb:active,.tb.on{background:var(--accentSoft);color:var(--accent)}
.tb:disabled{opacity:.3}
.tb small{font-size:13px}
.logo{font-family:"Dancing Script",cursive;font-size:26px;color:var(--accent);padding:0 6px;flex:none}
#titleBtn{max-width:220px;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:15px}
.sep{width:1px;height:26px;background:var(--line);flex:none;margin:0 2px}
.grow{flex:1;min-width:6px}
#tools{left:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;padding:6px;gap:2px;max-height:calc(100vh - 170px);overflow-y:auto;scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
#tools button{width:44px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative}
#tools button.on{background:var(--accent);color:#fff}
#tools .tsep{height:1px;background:var(--line);margin:4px 6px}
#colors{right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;padding:8px 6px;gap:7px;max-height:calc(100vh - 170px);overflow-y:auto;scrollbar-width:none;width:52px}
#colors::-webkit-scrollbar{display:none}
.cur{width:38px;height:38px;border-radius:50%;border:3px solid var(--solid);box-shadow:0 0 0 1.5px var(--line),0 2px 6px rgba(0,0,0,.15);flex:none}
.dot{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);flex:none}
.dot.on{box-shadow:0 0 0 2px var(--solid),0 0 0 4px var(--accent)}
.gradbadge{width:30px;height:8px;border-radius:4px;flex:none}
#toolopts,#selbar{left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:14px;padding:8px 16px;max-width:calc(100vw - 150px);overflow-x:auto;scrollbar-width:none;min-height:56px}
#toolopts::-webkit-scrollbar{display:none}
.oname{font-weight:600;white-space:nowrap}
.ctl{display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--muted);min-width:110px}
.ctl span b{color:var(--ink);font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;width:120px;height:26px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--solid);box-shadow:0 1px 4px rgba(0,0,0,.3);margin-top:-9px}
.seg{display:flex;background:var(--line);border-radius:10px;padding:2px;flex:none}
.seg button{padding:6px 10px;border-radius:8px;font-size:13px;white-space:nowrap}
.seg button.on{background:var(--solid);box-shadow:0 1px 3px rgba(0,0,0,.12)}
#preview{width:150px;height:44px;flex:none}
#selbar button{display:flex;flex-direction:column;align-items:center;font-size:11px;gap:2px;padding:2px 4px;white-space:nowrap}
#selbar .ok{background:var(--accent);color:#fff;border-radius:10px;padding:6px 12px;font-size:14px;flex-direction:row}
/* popover */
#pop{position:fixed;top:calc(72px + env(safe-area-inset-top));right:12px;width:350px;max-width:calc(100vw - 24px);max-height:calc(100vh - 160px);overflow-y:auto;padding:16px;z-index:20;-webkit-overflow-scrolling:touch}
#pop h3{margin:0 0 12px;font-size:17px}
.sub{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 7px}
.row{display:flex;align-items:center;gap:10px;margin:6px 0;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 11px;border-radius:999px;background:var(--line);font-size:13.5px;display:flex;align-items:center;gap:6px}
.chip.on{background:var(--accent);color:#fff}
.chip i{width:14px;height:14px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.b{padding:8px 12px;border-radius:11px;background:var(--line);font-size:13.5px}
.b.pri{background:var(--accent);color:#fff}
.b.danger{color:#c0392b}
.well{position:relative;width:36px;height:36px;border-radius:50%;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);flex:none;display:inline-block}
.well.big{width:52px;height:52px}
.well input{position:absolute;inset:-10px;width:200%;height:200%;opacity:0;cursor:pointer}
.hex{width:92px;padding:7px 9px;border-radius:10px;border:1px solid var(--line);background:var(--solid);text-transform:uppercase}
.cname{font-size:13px;color:var(--muted)}
.gradprev{flex:1;height:14px;border-radius:7px;min-width:60px}
.swgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.sw{display:block;width:100%;aspect-ratio:1;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);position:relative}
.sw.on{box-shadow:0 0 0 2px var(--solid),0 0 0 4px var(--accent)}
.swgrid.named{grid-template-columns:repeat(4,1fr)}
.swgrid.named .sw{aspect-ratio:auto;height:46px}
.swn{font-size:10.5px;color:var(--muted);text-align:center;margin-top:3px;line-height:1.2}
.editing .sw::after{content:"×";position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#c0392b;color:#fff;font-size:15px;line-height:19px;text-align:center}
.switch{position:relative;width:44px;height:26px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:13px;transition:.2s}
.switch span::before{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::before{transform:translateX(18px)}
select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--solid);width:100%}
/* capas */
.lrow{display:flex;align-items:center;gap:8px;padding:6px;border-radius:12px;margin-bottom:4px}
.lrow.on{background:var(--accentSoft)}
.lrow canvas{width:38px;height:50px;border-radius:5px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);flex:none}
.lrow .ln{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .ln small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.ib{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.ib.off{opacity:.35}
/* referencia flotante */
#refFloat{position:fixed;left:80px;top:90px;width:300px;padding:8px;z-index:15}
#refFloat .hd{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted);padding:0 4px 6px;cursor:move;touch-action:none}
#refFloat img{width:100%;border-radius:10px;display:block}
/* modal galería */
#modal{position:fixed;inset:0;background:rgba(20,15,10,.35);z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}
#modal .box{background:var(--solid);border-radius:22px;box-shadow:var(--shadow);width:min(860px,100%);max-height:calc(100vh - 40px);overflow-y:auto;padding:20px}
#modal h2{margin:0 0 14px;font-size:21px;display:flex;align-items:center;justify-content:space-between}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{border-radius:14px;background:var(--bg);padding:8px;display:flex;flex-direction:column;gap:6px}
.card.cur2{box-shadow:0 0 0 2px var(--accent)}
.card .th{aspect-ratio:3/4;border-radius:9px;background:#fff center/contain no-repeat;box-shadow:inset 0 0 0 1px var(--line)}
.card .tt{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .dd{font-size:12px;color:var(--muted)}
.card .acts{display:flex;gap:4px}
.card .acts button{flex:1;padding:6px 0;border-radius:9px;background:var(--line);font-size:12.5px}
.newcard{border:2px dashed var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--accent);font-weight:600;min-height:200px}
.field{margin:10px 0}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
.field input[type=text]{width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--bg)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:rgba(30,28,26,.88);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:40;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.help li{margin:6px 0;line-height:1.35}
@media (max-width:700px){#titleBtn,.logo,.hidesm{display:none}#toolopts,#selbar{max-width:calc(100vw - 24px);bottom:calc(8px + env(safe-area-inset-bottom))}#tools,#colors{top:calc(50% - 20px)}}
</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>

<header id="topbar" class="bar">
  <button class="tb" id="backBtn" title="Volver a Mi Agenda"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg><small class="hidesm">Agenda</small></button>
  <span class="logo">Lettering</span>
  <button class="tb" id="titleBtn" title="Cambiar nombre">Sin título</button>
  <div class="grow"></div>
  <button class="tb" id="undoBtn" title="Deshacer"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></svg></button>
  <button class="tb" id="redoBtn" title="Rehacer"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 000 10h3"/></svg></button>
  <button class="tb" id="zoomBtn" title="Ajustar a la pantalla"><small>100%</small></button>
  <span class="sep"></span>
  <button class="tb" data-pop="layers" title="Capas"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/><path d="M3 17.5l9 5 9-5" opacity=".5"/></svg><small class="hidesm">Capas</small></button>
  <button class="tb" data-pop="paper" title="Papel"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9 12h7M9 16h7"/></svg><small class="hidesm">Papel</small></button>
  <button class="tb" data-pop="ref" title="Referencia"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg><small class="hidesm">Referencia</small></button>
  <button class="tb" id="linksBtn" title="Mis Enlaces"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/></svg><small class="hidesm">Enlaces</small></button>
  <span class="sep"></span>
  <button class="tb" id="galleryBtn" title="Mis trabajos"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/></svg></button>
  <button class="tb" data-pop="export" title="Exportar"><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/></svg></button>
  <button class="tb" data-pop="menu" title="Ajustes"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
</header>

<nav id="tools" class="bar"></nav>
<aside id="colors" class="bar"></aside>
<div id="toolopts" class="bar"></div>
<div id="selbar" class="bar" hidden></div>
<div id="pop" class="bar" hidden></div>
<div id="refFloat" class="bar" hidden><div class="hd" id="refHd"><span>Referencia · arrastra para mover</span><button class="ib" id="refFloatClose"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><img id="refFloatImg" alt=""></div>
<div id="modal" hidden></div>
<div id="toast"></div>
<input type="file" id="fileImg" accept="image/*" hidden>
<input type="file" id="filePal" accept=".json,application/json,text/plain" hidden>

<script>
'use strict';
/* =========================================================
   Lettering · app web para Mi Agenda
   ========================================================= */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function normHex(h){if(typeof h!=='string')return null;h=h.trim();if(h[0]!=='#')h='#'+h;if(/^#[0-9a-f]{3}$/i.test(h))h='#'+h.slice(1).split('').map(c=>c+c).join('');return /^#[0-9a-f]{6}$/i.test(h)?h.toLowerCase():null}
function hexToRgb(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]}
function rgbToHex(r,g,b){return'#'+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('')}
const cssC=c=>`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;
const cssA=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)}

/* ---------- Datos fijos ---------- */
const FORMATS={
  a4v:{n:'A4 vertical',w:1240,h:1754}, a4h:{n:'A4 horizontal',w:1754,h:1240},
  a5v:{n:'A5 vertical · portada bujo',w:874,h:1240}, a5h:{n:'A5 horizontal',w:1240,h:874},
  sq:{n:'Cuadrado · Instagram',w:1350,h:1350}, wall:{n:'Wallpaper iPhone',w:1080,h:2340}, ipad:{n:'Wallpaper iPad',w:1640,h:2360}
};
const TEXTURES={blanco:{n:'Blanco',c:'#ffffff'},crema:{n:'Pergamino',c:'#f4ead3'},acuarela:{n:'Acuarela',c:'#fbf9f4'},kraft:{n:'Kraft',c:'#c8a57a'},washi:{n:'Washi',c:'#f2ede2'},negra:{n:'Pizarra negra',c:'#262829',dark:true}};
const PATTERNS={liso:'Liso',cuad:'Cuadrícula',puntos:'Puntos',pautado:'Pautado lettering',genko:'Genkō yōshi',kanji:'Cuadrícula kanji'};
const ICON={
 pencil:'<path d="M4 20l1.5-5L15 5.5a2.1 2.1 0 013 3L8.5 18 4 20z"/><path d="M13.5 7l3 3"/>',
 marker:'<path d="M14.5 3.5l6 6-8.5 8.5H6v-6z"/><path d="M6 18l-2.5 2.5"/><path d="M11 7l6 6"/>',
 brush:'<path d="M19 3c1.2 1.2.8 3-1.2 5L11 15l-2.5-2.5L15.3 5.6C17 4 18.3 2.3 19 3z"/><path d="M8 13c-2.2.2-3.6 2-3.8 4.6-.1 1.2-.6 2.4-1.2 3.4 3.6 0 7.4-1.4 7.6-5.2"/>',
 water:'<path d="M12 3c3.3 4.3 5.5 7 5.5 9.7a5.5 5.5 0 01-11 0C6.5 10 8.7 7.3 12 3z"/><path d="M9.5 13.5a2.6 2.6 0 002.5 2.5"/>',
 chalk:'<path d="M5 15.5l9.5-9.5 3.5 3.5L8.5 19z"/><path d="M14.5 6l1.5-1.5 3.5 3.5L18 9.5"/><path d="M4 21h.01M7 21h.01M3 18h.01"/>',
 nib:'<path d="M12 22v-9"/><path d="M6.5 9.5L12 3l5.5 6.5-2.8 7.5H9.3z"/><circle cx="12" cy="11.5" r="1.2"/>',
 fude:'<path d="M14 3l7 7-5 2.5L11.5 8z"/><path d="M11.5 8C7 9 4.3 13.4 3 21c7.6-1.3 12-4 13-8.5"/><path d="M7 17l2.5-2.5"/>',
 hl:'<path d="M9 14l7.5-10.5 4 3L13 17z"/><path d="M9 14l-1.2 4.2L13 17"/><path d="M3.5 21h10"/>',
 eraser:'<path d="M8 20h12"/><path d="M4.6 15.4l9-9a2 2 0 012.8 0l3.2 3.2a2 2 0 010 2.8L13 19H8.2z"/><path d="M9 11l5 5"/>',
 lasso:'<ellipse cx="12" cy="9" rx="8" ry="5.2" stroke-dasharray="3 2.6"/><path d="M7.3 13c-1.2 2 .2 4 2 4 1.6 0 1.8 2 .2 4"/>',
 picker:'<path d="M16.6 3.6a2.1 2.1 0 013 3L17 9.2 14.8 7z"/><path d="M15.6 8.4l-9 9L4 20l2.6-2.6"/><path d="M13 6l5 5"/>',
 eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
 eyeoff:'<path d="M3 3l18 18"/><path d="M10.6 5.1A9.6 9.6 0 0112 5c6.4 0 10 7 10 7a17 17 0 01-3 3.9M6.4 6.4A17 17 0 002 12s3.6 7 10 7a9.4 9.4 0 004.6-1.2"/>',
 lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/>',

/* ---------- Vista: zoom y desplazamiento ---------- */
function applyView(){stage.style.transform=`translate(${view.tx}px,${view.ty}px) scale(${view.s})`;$('#zoomBtn').innerHTML=`<small>${Math.round(view.s*100)}%</small>`;if(sel)updSelCSS()}
function fitView(){const vw=innerWidth,vh=innerHeight,side=vw<700?62:78,top=78,bottom=84;const aw=vw-side*2,ah=vh-top-bottom;const s=Math.min(aw/DW,ah/DH);view.s=s;view.tx=(vw-DW*s)/2;view.ty=top+(ah-DH*s)/2;applyView()}
function zoomAt(cx,cy,ns){ns=clamp(ns,.08,8);const px=(cx-view.tx)/view.s,py=(cy-view.ty)/view.s;view.s=ns;view.tx=cx-px*ns;view.ty=cy-py*ns;applyView()}
const toDoc=e=>({x:(e.clientX-view.tx)/view.s,y:(e.clientY-view.ty)/view.s});

/* ---------- Entrada: Apple Pencil, dedos, ratón ---------- */

const touchList=()=>[...pointers.entries()].filter(([,p])=>p.type==='touch');
vp.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});

vp.addEventListener('contextmenu',e=>e.preventDefault());

window.addEventListener('pointercancel',onUp);

function onDown(e){

 try{vp.setPointerCapture(e.pointerId)}catch(_){}
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,type:e.pointerType});
 if(e.pointerType==='pen'&&!settings.penOnly){settings.penOnly=true;saveSettings();toast('Apple Pencil detectado ✏️ · con el dedo mueves y haces zoom')}

  const n=touchList().length;
  if(n>=2){if(drawing&&drawing.type==='touch')cancelDrawing();if(lasso&&lasso.type==='touch'){lasso=null;clearOverlayAll()}selDrag=null;refDrag=null;
   if(!gesture)startGesture();else gesture.maxN=Math.max(gesture.maxN,n);return}

 }

 const pt=toDoc(e);
 if(refMove&&doc.ref&&doc.ref.mode==='calcar'){refDrag={pid:e.pointerId,x0:pt.x,y0:pt.y,rx:doc.ref.x,ry:doc.ref.y};return}
 if(sel){if(hitSel(pt)){selDrag={pid:e.pointerId,x0:pt.x,y0:pt.y,tx:sel.tx,ty:sel.ty};return}commitSel()}

}
function onMove(e){

 if(pan&&pan.pid===e.pointerId){view.tx=pan.tx0+e.clientX-pan.x0;view.ty=pan.ty0+e.clientY-pan.y0;applyView();return}
 if(drawing&&drawing.pid===e.pointerId){e.preventDefault();feed(e);return}
 const pt=toDoc(e);
 if(lasso&&lasso.pid===e.pointerId){lasso.pts.push([pt.x,pt.y]);drawLasso();return}
 if(eraseHit&&eraseHit.pid===e.pointerId){hitErase(pt);return}
 if(selDrag&&selDrag.pid===e.pointerId){sel.tx=selDrag.tx+pt.x-selDrag.x0;sel.ty=selDrag.ty+pt.y-selDrag.y0;updSelCSS();return}
 if(refDrag&&refDrag.pid===e.pointerId){doc.ref.x=refDrag.rx+pt.x-refDrag.x0;doc.ref.y=refDrag.ry+pt.y-refDrag.y0;renderRef();return}
}
function onUp(e){

 else if(lasso&&lasso.pid===e.pointerId)endLasso();
 else if(eraseHit&&eraseHit.pid===e.pointerId)endEraseHit();
 else if(selDrag&&selDrag.pid===e.pointerId)selDrag=null;
 else if(refDrag&&refDrag.pid===e.pointerId){refDrag=null;markDirty()}
 if(pan&&pan.pid===e.pointerId)pan=null;
 if(gesture&&touchList().length===0){if(!gesture.moved&&performance.now()-gesture.t0<350&&e.type!=='pointercancel'){if(gesture.maxN>=3)redo();else undo()}gesture=null}

function startGesture(){const t=touchList(),a=t[0][1],b=t[1][1];gesture={d0:Math.hypot(a.x-b.x,a.y-b.y)||1,mx0:(a.x+b.x)/2,my0:(a.y+b.y)/2,s0:view.s,tx0:view.tx,ty0:view.ty,t0:performance.now(),moved:false,maxN:t.length};pan=null}

vp.addEventListener('wheel',e=>{e.preventDefault();if(e.ctrlKey||e.metaKey)zoomAt(e.clientX,e.clientY,view.s*Math.exp(-e.deltaY*.01));else{view.tx-=e.deltaX;view.ty-=e.deltaY;applyView()}},{passive:false});

function startTool(e,pt){

 if(!L.visible){toast('La capa «'+L.name+'» está oculta');return}
 if(L.locked){toast('La capa «'+L.name+'» está bloqueada 🔒');return}
 if(tool==='lasso'){lasso={pid:e.pointerId,type:e.pointerType,pts:[[pt.x,pt.y]]};ov.cv.style.opacity=1;ov.cv.style.mixBlendMode='normal';return}

function pushPt(d,x,y,p){const q=[Math.round(x*10)/10,Math.round(y*10)/10,Math.round(p*100)/100];d.s.pts.push(q);growBB(d.s,q);d.r.add(q)}

function clearOverlayAll(){const c=ov.ctx;c.save();c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,ov.cv.width,ov.cv.height);c.restore()}

/* goma de trazo entero */
function distSeg(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=clamp(t,0,1);return Math.hypot(px-ax-t*dx,py-ay-t*dy)}

  if(pt.x<b[0]-r||pt.x>b[2]+r||pt.y<b[1]-r||pt.y>b[3]+r)continue;
  let hit=false;
  if(s.tool==='img')hit=true;
  else{const tol=r+s.size*.4;const P=s.pts;if(P.length===1)hit=Math.hypot(pt.x-P[0][0],pt.y-P[0][1])<tol;else for(let j=1;j<P.length&&!hit;j++)if(distSeg(pt.x,pt.y,P[j-1][0],P[j-1][1],P[j][0],P[j][1])<tol)hit=true}

/* cuentagotas */
function pickColor(pt){
 const px=Math.floor(pt.x*R),py=Math.floor(pt.y*R);if(px<0||py<0||pt.x>DW||pt.y>DH)return;
 let hex=null;
 for(let i=doc.layers.length-1;i>=0&&!hex;i--){const L=doc.layers[i];if(!L.visible)continue;const d=LC.get(L.id).ctx.getImageData(px,py,1,1).data;if(d[3]>16)hex=rgbToHex(d[0],d[1],d[2])}

/* ---------- Lazo y selección ---------- */
let sel=null;
function drawLasso(){clearOverlayAll();const c=ov.ctx,P=lasso.pts;if(P.length<2)return;c.setTransform(R,0,0,R,0,0);c.save();c.setLineDash([6/view.s,5/view.s]);c.lineWidth=1.6/view.s;c.strokeStyle='#c2697a';c.fillStyle='rgba(194,105,122,.06)';c.beginPath();c.moveTo(P[0][0],P[0][1]);for(const q of P)c.lineTo(q[0],q[1]);c.closePath();c.fill();c.stroke();c.restore()}

 const P=lasso.pts;lasso=null;clearOverlayAll();if(P.length<3)return;
 const L=activeLayer(),ids=new Set();
 for(const s of L.strokes){let pts=s.tool==='img'?[[(s.bb[0]+s.bb[2])/2,(s.bb[1]+s.bb[3])/2]]:s.pts;const step=Math.max(1,Math.floor(pts.length/40));let n=0,k=0;for(let i=0;i<pts.length;i+=step){n++;if(inPoly(pts[i][0],pts[i][1],P))k++}if(n&&k/n>=.5)ids.add(s.id)}
 if(!ids.size){toast('No hay trazos dentro del lazo en la capa «'+L.name+'»');return}

}
function liftSel(L,ids){
 const chosen=L.strokes.filter(s=>ids.has(s.id));
 const bb=[1e9,1e9,-1e9,-1e9];for(const s of chosen){bb[0]=Math.min(bb[0],s.bb[0]);bb[1]=Math.min(bb[1],s.bb[1]);bb[2]=Math.max(bb[2],s.bb[2]);bb[3]=Math.max(bb[3],s.bb[3])}
 bb[0]=Math.max(bb[0],-DW);bb[1]=Math.max(bb[1],-DH);bb[2]=Math.min(bb[2],DW*2);bb[3]=Math.min(bb[3],DH*2);

 for(let i=firstIdx+1;i<L.strokes.length&&!needImg;i++){const s=L.strokes[i];if(s.tool==='eraser'&&!ids.has(s.id)&&s.bb[0]<bb[2]&&s.bb[2]>bb[0]&&s.bb[1]<bb[3]&&s.bb[3]>bb[1])needImg=true}

 const w=bb[2]-bb[0],h=bb[3]-bb[1],cv=document.createElement('canvas');cv.width=Math.max(1,Math.ceil(w*R));cv.height=Math.max(1,Math.ceil(h*R));cv.id='selFloat';

 Object.assign(selBoxEl.style,{left:bb[0]+'px',top:bb[1]+'px',width:w+'px',height:h+'px'});selBoxEl.hidden=false;

function updSelCSS(){if(!sel)return;const t=`translate(${sel.tx}px,${sel.ty}px) rotate(${sel.rot}rad) scale(${sel.sc})`;sel.cv.style.transform=t;selBoxEl.style.transform=t;selBoxEl.style.borderWidth=(1.6/view.s/sel.sc)+'px'}
function selMatrix(S){const[x0,y0,x1,y1]=S.bb,cx=(x0+x1)/2,cy=(y0+y1)/2,a=Math.cos(S.rot)*S.sc,b=Math.sin(S.rot)*S.sc;return[a,b,-b,a,cx+S.tx-(a*cx-b*cy),cy+S.ty-(b*cx+a*cy)]}

function endSelUI(){selBoxEl.hidden=true;$('#selbar').hidden=true;$('#toolopts').hidden=false}
function commitSel(){

 const L=S.L,ident=S.tx===0&&S.ty===0&&S.rot===0&&S.sc===1;

function showSelBar(){

 b.onclick=ev=>{const a=ev.target.closest('button')?.dataset.a;if(!a||!sel)return;
  if(a==='rl')sel.rot-=Math.PI/12;if(a==='rr')sel.rot+=Math.PI/12;if(a==='sm')sel.sc/=1.1;if(a==='sp')sel.sc*=1.1;updSelCSS();
  if(a==='ok')commitSel();

  if(a==='dup'){const L=sel.L,old=[...sel.ids];commitSel();const src=L.strokes.filter(s=>old.includes(s.id)||false);

  if(a==='add'){if(p.colors.some(c=>c.hex===settings.color)){toast('Ese color ya está en la paleta');return}let name='';if(named)name=(prompt('Nombre del color (opcional)','')||'').trim();p.colors.push(name?{hex:settings.color,name}:{hex:settings.color});savePalettes();toast('Color añadido a «'+p.name+'»')}
  if(a==='edit')palEdit=!palEdit;
  if(a==='new'){const n=prompt('Nombre de la nueva paleta','Mi paleta');if(!n||!n.trim())return;const np={id:uid(),name:n.trim().slice(0,30),colors:[{hex:settings.color}]};palettes.push(np);settings.palette=np.id;saveSettings();savePalettes();toast('Paleta creada con el color actual')}
  if(a==='ren'){const n=prompt('Nuevo nombre',p.name);if(n&&n.trim()){p.name=n.trim().slice(0,30);savePalettes()}}
  if(a==='del'){if(palettes.length<=1){toast('Debe quedar al menos una paleta');return}if(!confirm('¿Borrar la paleta «'+p.name+'»?'))return;palettes=palettes.filter(x=>x!==p);settings.palette=palettes[0].id;saveSettings();savePalettes()}
  if(a==='exp')exportPalettes();
  if(a==='imp'){$('#filePal').click();return}
  if(a==='reset'){if(!confirm('¿Añadir de nuevo las paletas originales? Tus paletas propias se conservan.'))return;const def=defaultPalettes();for(const d of def){const i=palettes.findIndex(x=>x.id===d.id);if(i>=0)palettes[i]=d;else palettes.push(d)}savePalettes()}
  renderColorStrip();popPalette(el)});
}
function exportPalettes(){
 const data={app:'Lettering',version:1,exported:new Date().toISOString(),palettes:palettes.map(p=>({name:p.name,colors:p.colors.map(c=>c.name?{hex:c.hex,name:c.name}:{hex:c.hex})}))};
 const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='paletas-lettering.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Paletas exportadas');
}
function parsePalettes(text,fname){
 const out=[],isCol=x=>typeof x==='string'?!!normHex(x):(x&&typeof x==='object'&&!!normHex(x.hex||x.color||x.colour||x.value||x.c||''));
 const toCol=x=>typeof x==='string'?{hex:normHex(x)}:(()=>{const h=normHex(x.hex||x.color||x.colour||x.value||x.c);const n=x.name||x.nombre||x.jp||x.n||x.label;return n?{hex:h,name:String(n).slice(0,40)}:{hex:h}})();
 const walk=(node,name,depth)=>{if(depth>6||node==null)return;
  if(Array.isArray(node)){const cols=node.filter(isCol);if(cols.length&&cols.length>=node.length/2){out.push({name:name||'Importada',colors:cols.map(toCol)});return}node.forEach((n,i)=>walk(n,name?name+' '+(i+1):null,depth+1));return}
  if(typeof node==='object'){const nm=node.name||node.nombre||node.title||node.titulo||name;let used=false;
   for(const k of ['colors','colores','swatches','paleta','palette']){if(Array.isArray(node[k])){walk(node[k],nm,depth+1);used=true}}
   if(!used)for(const[k,v]of Object.entries(node))if(typeof v==='object')walk(v,Array.isArray(v)?k:nm,depth+1)}};
 try{walk(JSON.parse(text),null,0)}catch(e){const hx=text.match(/#[0-9a-fA-F]{6}\b/g);if(hx)out.push({name:fname,colors:[...new Set(hx.map(normHex))].map(h=>({hex:h}))})}
 return out.filter(p=>p.colors.length).map(p=>({id:uid(),name:String(p.name).slice(0,30),colors:p.colors}));
}
$('#filePal').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const fr=new FileReader();fr.onload=()=>{const list=parsePalettes(String(fr.result),f.name.replace(/\.\w+$/,''));if(!list.length){toast('No encontré colores en ese archivo');return}
 for(const p of list){if(palettes.some(x=>x.name===p.name))p.name+=' (imp.)';palettes.push(p)}savePalettes();settings.palette=list[0].id;saveSettings();renderColorStrip();if(popName==='palette')openPop('palette',true);toast(list.length+' paleta(s) importada(s)')};fr.readAsText(f)};

/* ---------- Exportar ---------- */
let exportFile=null,expOpts={paper:true,guides:false};
function compose(scale=1,o=expOpts){
 const c=document.createElement('canvas');c.width=Math.round(DW*R*scale);c.height=Math.round(DH*R*scale);const x=c.getContext('2d');
 if(o.paper)x.drawImage(paper.cv,0,0,c.width,c.height);if(o.guides)x.drawImage(guides.cv,0,0,c.width,c.height);
 for(const L of doc.layers){if(!L.visible)continue;x.globalAlpha=L.opacity;x.drawImage(LC.get(L.id).cv,0,0,c.width,c.height)}x.globalAlpha=1;return c;
}
const safeName=()=>(doc.title||'lettering').replace(/[\\/:*?"<>|]+/g,'').trim()||'lettering';
function prepExport(){exportFile=null;commitSel();compose().toBlob(b=>{exportFile=new File([b],safeName()+'.png',{type:'image/png'});const st=$('#expState');if(st)st.textContent='Imagen lista ('+Math.round(b.size/1024)+' KB)'},'image/png')}
function popExport(el){
 el.innerHTML=`<h3>Exportar</h3>
  <div class="row"><label class="switch"><input type="checkbox" id="eP" ${expOpts.paper?'checked':''}><span></span></label> Incluir el papel (sin él, fondo transparente)</div>
  <div class="row"><label class="switch"><input type="checkbox" id="eG" ${expOpts.guides?'checked':''}><span></span></label> Incluir las guías</div>
  <p class="cname" id="expState">Preparando imagen…</p>
  <div class="btns"><button class="b pri" id="eShare">Compartir · Guardar en Fotos</button><button class="b" id="eDl">Descargar PNG</button></div>`;
 prepExport();
 el.querySelector('#eP').onchange=e=>{expOpts.paper=e.target.checked;prepExport()};
 el.querySelector('#eG').onchange=e=>{expOpts.guides=e.target.checked;prepExport()};
 el.querySelector('#eShare').onclick=async()=>{if(!exportFile){toast('Un segundo, se está preparando…');return}
  if(navigator.canShare&&navigator.canShare({files:[exportFile]})){try{await navigator.share({files:[exportFile],title:doc.title})}catch(e){}}else dl()};
 const dl=()=>{if(!exportFile){toast('Un segundo, se está preparando…');return}const a=document.createElement('a');a.href=URL.createObjectURL(exportFile);a.download=exportFile.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};
 el.querySelector('#eDl').onclick=dl;
}

function popMenu(el){
 el.innerHTML=`<h3>Ajustes</h3>
  <div class="row"><label class="switch"><input type="checkbox" id="mDark" ${settings.dark?'checked':''}><span></span></label> Modo oscuro</div>
  <div class="row"><label class="switch"><input type="checkbox" id="mPen" ${settings.penOnly?'checked':''}><span></span></label> Solo el Apple Pencil dibuja (el dedo mueve y hace zoom)</div>
  <div class="sub">Gestos</div>
  <ul class="help cname" style="padding-left:18px;margin:0">
   <li><b>Pellizcar</b> con dos dedos: zoom. <b>Arrastrar</b> con dos dedos: mover la hoja.</li>
   <li><b>Toque con dos dedos</b>: deshacer. <b>Con tres dedos</b>: rehacer.</li>
   <li>El <b>brush pen</b> y el <b>pincel japonés</b> responden a la presión: aprieta al bajar y suelta al subir.</li>
   <li>Pulsa el <b>%</b> de arriba para ajustar la hoja a la pantalla.</li>
   <li>En el Mac: ⌘Z deshacer, ⇧⌘Z rehacer, barra espaciadora + arrastrar para moverte.</li>
  </ul>
  <p class="cname">Todo se guarda solo en este aparato.</p>`;
 el.querySelector('#mDark').onchange=e=>{settings.dark=e.target.checked;saveSettings();document.body.classList.toggle('dark',settings.dark)};
 el.querySelector('#mPen').onchange=e=>{settings.penOnly=e.target.checked;saveSettings()};
}

/* ---------- Galería de trabajos ---------- */
async function openGallery(){
 commitSel();await saveNow();closePop();
 const metas=(await DB.all('meta')).sort((a,b)=>b.updated-a.updated);
 const m=$('#modal');m.hidden=false;
 m.innerHTML=`<div class="box"><h2>Mis trabajos <button class="ib" id="gClose">${'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>'}</button></h2>
  <div class="ggrid"><button class="newcard" id="gNew"><span style="font-size:30px">＋</span>Nuevo trabajo</button>
  ${metas.map(x=>`<div class="card ${x.id===doc.id?'cur2':''}" data-id="${x.id}"><div class="th" style="background-image:url('${x.thumb||''}')"></div><div class="tt">${esc(x.title)}</div><div class="dd">${new Date(x.updated).toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'})} · ${esc((FORMATS[x.format]||{}).n||'')}</div><div class="acts"><button data-a="open">Abrir</button><button data-a="dup">Duplicar</button><button data-a="del">Borrar</button></div></div>`).join('')}</div></div>`;
 m.onclick=async e=>{if(e.target===m||e.target.closest('#gClose')){m.hidden=true;return}
  if(e.target.closest('#gNew')){newWorkDialog();return}
  const card=e.target.closest('.card');if(!card)return;const id=card.dataset.id,a=e.target.dataset.a||'open';
  if(a==='open'){if(id!==doc.id)await openWork(id);m.hidden=true}
  if(a==='dup'){const w=await DB.get('works',id);if(!w)return;const n=JSON.parse(JSON.stringify(w));n.id=uid();n.title=w.title+' (copia)';n.created=n.updated=Date.now();await DB.put('works',n);const mt=await DB.get('meta',id);await DB.put('meta',{...mt,id:n.id,title:n.title,updated:n.updated});openGallery()}
  if(a==='del'){if(!confirm('¿Borrar este trabajo para siempre? No se puede recuperar.'))return;await DB.del('works',id);await DB.del('meta',id);if(id===doc.id){const rest=(await DB.all('meta')).sort((a,b)=>b.updated-a.updated);if(rest.length)await openWork(rest[0].id,true);else{await loadDoc(newDoc(),true)}}openGallery()}
 };
}
function newWorkDialog(){
 const m=$('#modal');let fmt='a4v',tex='blanco',pat='pautado';
 const draw=()=>{m.innerHTML=`<div class="box" style="width:min(520px,100%)"><h2>Nuevo trabajo <button class="ib" id="nClose"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h2>
  <div class="field"><label>Nombre</label><input type="text" id="nTitle" placeholder="Ej.: Frase del mes"></div>
  <div class="field"><label>Formato</label><div class="chips" id="nF">${Object.entries(FORMATS).map(([k,f])=>`<button class="chip ${k===fmt?'on':''}" data-v="${k}">${f.n}</button>`).join('')}</div></div>
  <div class="field"><label>Textura</label><div class="chips" id="nT">${Object.entries(TEXTURES).map(([k,t])=>`<button class="chip ${k===tex?'on':''}" data-v="${k}"><i style="background:${t.c}"></i>${t.n}</button>`).join('')}</div></div>
  <div class="field"><label>Guías</label><div class="chips" id="nP">${Object.entries(PATTERNS).map(([k,n])=>`<button class="chip ${k===pat?'on':''}" data-v="${k}">${n}</button>`).join('')}</div></div>
  <div class="btns" style="justify-content:flex-end"><button class="b pri" id="nOk">Crear</button></div></div>`;
  const keep=m.querySelector('#nTitle');keep.value=titleV;keep.oninput=()=>titleV=keep.value};
 let titleV='';draw();
 m.onclick=async e=>{if(e.target===m||e.target.closest('#nClose')){openGallery();return}const b=e.target.closest('.chip');
  if(b){const g=b.parentNode.id;if(g==='nF')fmt=b.dataset.v;if(g==='nT')tex=b.dataset.v;if(g==='nP')pat=b.dataset.v;draw();return}
  if(e.target.id==='nOk'){await saveNow();await loadDoc(newDoc({title:titleV.trim()||undefined,format:fmt,tex,pat}),true);m.hidden=true;toast('Trabajo nuevo creado')}};
}
async function openWork(id,skipSave){if(!skipSave)await saveNow();const w=await DB.get('works',id);if(w)await loadDoc(w,false)}
async function loadDoc(d,isNew){
 commitSel();doc=d;IMG.clear();await preloadImgs(doc);refMove=false;undoStack=[];redoStack=[];updUndo();
 setupStage();fitView();$('#titleBtn').textContent=doc.title;LS.set('lt-current',doc.id);if(isNew)await saveNow();
}

/* ---------- Guardado automático ---------- */
let dirty=false,saveT=null;
function markDirty(){dirty=true;clearTimeout(saveT);saveT=setTimeout(saveNow,1500)}
async function saveNow(){
 clearTimeout(saveT);if(!doc||!DB.db)return;
 if(!dirty){const has=await DB.get('meta',doc.id).catch(()=>null);if(has)return}
 dirty=false;doc.updated=Date.now();
 try{
  const c=compose(Math.min(1,260/(DW*R)),{paper:true,guides:false});const thumb=c.toDataURL('image/jpeg',.72);c.width=0;
  await DB.put('works',doc);await DB.put('meta',{id:doc.id,title:doc.title,format:doc.format,updated:doc.updated,thumb});
  updateStats();
 }catch(e){console.error(e);toast('No se pudo guardar: '+e.message)}
}
// Resumen para el Dashboard y Mi Agenda (misma web)
async function updateStats(){
 try{const metas=await DB.all('meta');const ld=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');const days=new Set(LS.get('lt-days',[]));days.add(ld(new Date()));const arr=[...days].sort().slice(-400);LS.set('lt-days',arr);
  let streak=0;const d=new Date();for(;;){const k=ld(d);if(days.has(k)){streak++;d.setDate(d.getDate()-1)}else break}
  LS.set('lt-stats',{works:metas.length,lastTitle:doc.title,lastUpdated:doc.updated,streak,daysPracticed:arr.length});}catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveNow()});
window.addEventListener('pagehide',()=>saveNow());

/* ---------- Botones de arriba ---------- */
$('#undoBtn').onclick=undo;$('#redoBtn').onclick=redo;
$('#zoomBtn').onclick=fitView;
$('#galleryBtn').onclick=openGallery;
$('#titleBtn').onclick=()=>{const v=prompt('Nombre del trabajo',doc.title);if(v&&v.trim()){doc.title=v.trim().slice(0,60);$('#titleBtn').textContent=doc.title;markDirty()}};
async function goTo(url){commitSel();dirty=true;await saveNow();location.href=url}
const goLinks=()=>goTo('enlaces.html');
$('#linksBtn').onclick=goLinks;
$('#backBtn').onclick=()=>goTo('index.html');
window.addEventListener('keydown',e=>{
 if(e.target.matches('input,select,textarea'))return;
 if(e.code==='Space'){spaceDown=true;e.preventDefault()}
 const mod=e.metaKey||e.ctrlKey;
 if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
 if(mod)return;
 const map={p:'pencil',m:'marker',b:'brush',w:'water',t:'chalk',n:'nib',f:'fude',h:'hl',e:'eraser',l:'lasso',i:'picker'};
 if(map[e.key])setTool(map[e.key]);
 if(e.key==='Escape'){closePop();if(sel)commitSel()}
 if(e.key==='0')fitView();
});
window.addEventListener('keyup',e=>{if(e.code==='Space')spaceDown=false});
let rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(fitView,150)});

/* ---------- Inicio ---------- */
(async function init(){
 document.body.classList.toggle('dark',!!settings.dark);
 renderTools();renderToolOpts();renderColorStrip();updUndo();
 try{await DB.open()}catch(e){toast('Este navegador no permite guardar')}
 let d=null;const cur=LS.get('lt-current',null);
 if(DB.db&&cur)d=await DB.get('works',cur).catch(()=>null);
 if(!d&&DB.db){const metas=(await DB.all('meta')).sort((a,b)=>b.updated-a.updated);if(metas.length)d=await DB.get('works',metas[0].id)}
 await loadDoc(d||newDoc(),!d);
})();
</script>
