<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script src="sync.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mis Viajes">
<meta name="theme-color" content="#efe4cc">
<title>Mis Viajes · 旅の手帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#efe4cc; --paper2:#e6d7b8; --card:#fbf5e6; --ink:#3a2e24; --soft:#7d6b58; --line:#d8c5a2;
  --acc:#7a2531; --gold:#b08d45; --navy:#22344f; --red:#a8323a; --blue:#2f4f7f; --green:#3f6b4a;
  --tc:#7a2531; --r:14px; --shadow:0 2px 8px rgba(70,50,25,.12);
  --serif:"Playfair Display",Georgia,"Hiragino Mincho ProN",serif;
  --type:"Special Elite","American Typewriter","Courier New",monospace;
  --hand:"Caveat","Bradley Hand","Segoe Print",cursive;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Segoe UI",sans-serif}
body{background:var(--paper);
  background-image:radial-gradient(ellipse at 20% 0%,rgba(255,250,235,.7),transparent 60%),radial-gradient(ellipse at 90% 100%,rgba(160,120,60,.12),transparent 55%),
  repeating-linear-gradient(0deg,rgba(120,90,50,.025) 0 1px,transparent 1px 3px);
  background-attachment:fixed;padding-bottom:calc(84px + env(safe-area-inset-bottom));min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
input,select,textarea{border:1px solid var(--line);background:#fffaf0;border-radius:10px;padding:8px 10px;font-size:16px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px;line-height:1.45}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--tc);flex:none}
input[type=color]{padding:2px;height:38px}
label.f{display:block;font-size:13px;color:var(--soft);margin:10px 0 4px;font-family:var(--type);letter-spacing:.3px}
.wrap{max-width:1060px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:30;background:rgba(239,228,204,.93);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px dashed var(--line);padding-top:env(safe-area-inset-top)}
.top{display:flex;align-items:center;gap:8px;padding:10px 0}
.back{text-decoration:none;color:var(--soft);font-size:14px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:var(--card);white-space:nowrap}
.title{flex:1;font-family:var(--serif);font-size:21px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title small{font-family:var(--type);font-size:12px;color:var(--soft);font-weight:400;margin-left:6px;letter-spacing:1px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:15px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn.pri{background:var(--tc);color:#fdf6e6;border-color:var(--tc)}
.btn.dark{background:var(--ink);color:#fdf6e6;border-color:var(--ink)}
.btn.danger{color:var(--red);border-color:#e3b9b1}
.btn.sm{padding:5px 11px;font-size:14px}
.btn.ic{padding:7px 10px;min-width:38px;justify-content:center}
.btn:disabled{opacity:.45}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--soft);font-size:14px}
.empty{color:var(--soft);text-align:center;padding:30px 10px;font-size:15px;font-family:var(--type)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);position:relative}
h2{font-family:var(--serif);font-size:20px;margin:24px 0 10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h2 .jp,.jp{font-family:var(--type);font-size:12px;color:var(--soft);font-weight:400;letter-spacing:1px}
h3{font-family:var(--serif);font-size:17px;margin:0 0 8px}
.type{font-family:var(--type)}
.hand{font-family:var(--hand)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--tc);color:#fdf6e6;border-color:var(--tc)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.stars{color:var(--gold);letter-spacing:1px;white-space:nowrap}
.stars .off{color:#d8c9aa}
.stars.ed span{cursor:pointer;font-size:22px}

/* barra inferior */
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(251,245,230,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.bot .in{display:flex;max-width:640px;margin:0 auto}
nav.bot button{flex:1;border:none;background:none;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--soft);font-family:var(--type)}
nav.bot button .e{font-size:21px;line-height:1.2;filter:sepia(.35)}
nav.bot button.on{color:var(--acc)}
nav.bot button.on .e{filter:none;transform:scale(1.08)}

/* portada pasaporte */
.passport{background:linear-gradient(135deg,#6e1f2a,#4f1520);color:#e9cf8f;border-radius:16px;padding:20px 22px;margin-top:16px;display:flex;gap:18px;align-items:center;box-shadow:0 6px 18px rgba(60,20,20,.25),inset 0 0 0 2px rgba(233,207,143,.25);position:relative;overflow:hidden}
.passport::after{content:"";position:absolute;inset:8px;border:1px solid rgba(233,207,143,.35);border-radius:10px;pointer-events:none}
.passport .globe{font-size:46px;width:72px;height:72px;border:2px solid #e9cf8f;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;filter:sepia(1) saturate(2) hue-rotate(-10deg)}
.passport .pt{font-family:var(--type);letter-spacing:4px;font-size:12px;opacity:.85}
.passport .pn{font-family:var(--serif);font-size:28px;font-weight:700;letter-spacing:1px;color:#f3dca2}
.passport .ps{font-size:13px;opacity:.85;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;margin-top:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--serif);font-size:24px;line-height:1.1;color:var(--tc)}
.stat span{font-family:var(--type);font-size:11.5px;color:var(--soft);letter-spacing:.5px}
.countdown{display:flex;align-items:center;gap:16px;margin-top:14px;border-left:5px solid var(--tc);cursor:pointer}
.countdown .num{font-family:var(--serif);font-size:44px;font-weight:700;color:var(--tc);line-height:1}
.countdown .lb{font-family:var(--type);font-size:12px;color:var(--soft);letter-spacing:1px}
.memory{margin-top:14px;background:#fff8e8;border:1px dashed var(--gold);cursor:pointer}
.memory .mh{font-family:var(--hand);font-size:24px;color:var(--acc);line-height:1.1}
.memory .ph{display:flex;gap:8px;margin-top:8px;overflow-x:auto}
.memory .ph img{width:76px;height:76px;object-fit:cover;border:4px solid #fff;box-shadow:var(--shadow);flex:none;background:var(--paper2)}

/* tarjetas de viaje */
.trip{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);cursor:pointer;overflow:hidden;position:relative;display:flex;flex-direction:column}
.trip .cv{height:150px;background:var(--paper2) center/cover no-repeat;position:relative;filter:sepia(.25) saturate(.95)}
.trip .cv.noimg{display:flex;align-items:center;justify-content:center;font-size:52px;background:repeating-linear-gradient(45deg,var(--paper2) 0 10px,#e0cfac 10px 20px)}
.trip .bd{padding:12px 14px 14px;border-top:4px solid var(--c,var(--tc))}
.trip .nm{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.2}
.trip .fl{font-size:18px;letter-spacing:2px}
.trip .dt{font-family:var(--type);font-size:12.5px;color:var(--soft);margin-top:2px}
.trip .tag{position:absolute;top:10px;left:10px;background:rgba(251,245,230,.92);border-radius:999px;padding:3px 10px;font-size:12px;font-family:var(--type)}
.pm{position:absolute;right:10px;bottom:48px;width:86px;height:86px;transform:rotate(-14deg);opacity:.85;pointer-events:none}
.newtrip{border:2px dashed var(--line);background:transparent;border-radius:var(--r);min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--soft);font-family:var(--type);font-size:15px}
.newtrip b{font-size:40px;color:var(--tc);font-family:var(--serif)}
.favstrip{display:flex;gap:14px;overflow-x:auto;padding:6px 4px 14px}

/* polaroid */
.pol{background:#fffdf7;padding:8px 8px 30px;box-shadow:0 3px 10px rgba(60,40,20,.2);position:relative;cursor:pointer;transition:transform .15s}
.pol img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--paper2);filter:sepia(.08)}
.pol .cap{position:absolute;left:6px;right:6px;bottom:3px;font-family:var(--hand);font-size:19px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.pol .fv{position:absolute;top:2px;right:6px;font-size:18px;color:var(--gold);text-shadow:0 0 3px #fff}
.pol:hover{transform:rotate(0) scale(1.03)!important}
.polgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 16px;padding:10px 4px}
.favstrip .pol{width:150px;flex:none}

/* viaje */
.thead{margin:14px 0 4px;border-radius:16px;overflow:hidden;position:relative;min-height:170px;background:var(--tc) center/cover no-repeat;color:#fff8e6;display:flex;align-items:flex-end;box-shadow:var(--shadow)}
.thead::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(40,25,10,.05),rgba(40,25,10,.72));}
.thead .in{position:relative;padding:16px 18px;width:100%}
.thead .nm{font-family:var(--serif);font-size:30px;font-weight:700;line-height:1.1;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.thead .meta{font-family:var(--type);font-size:13px;opacity:.95;margin-top:4px}
.thead .cd{position:absolute;top:12px;right:12px;background:rgba(251,245,230,.94);color:var(--ink);border-radius:999px;padding:4px 12px;font-family:var(--type);font-size:13px}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none;position:sticky;top:calc(57px + env(safe-area-inset-top));z-index:20;background:linear-gradient(var(--paper) 80%,transparent)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--card);border-radius:10px 10px 4px 4px;padding:7px 12px;font-size:14px;white-space:nowrap}
.tab.on{background:var(--tc);color:#fdf6e6;border-color:var(--tc)}
.sec{margin-top:14px}
.day{margin-bottom:14px}
.wth{display:flex;gap:2px;flex-wrap:wrap;margin:-2px 0 4px}
.wth button{border:none;background:none;font-size:19px;padding:3px 5px;border-radius:8px;filter:grayscale(.7);opacity:.55}
.wth button.on{background:#f3e6c8;filter:none;opacity:1}
.day .dh{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.day .dh b{font-family:var(--serif);font-size:18px;color:var(--tc)}
.day .dh span{font-family:var(--type);font-size:13px;color:var(--soft)}
.moods{display:flex;gap:4px}
.moods button{border:1px solid transparent;background:none;font-size:22px;border-radius:10px;padding:2px 4px;filter:grayscale(.8);opacity:.6}
.moods button.on{filter:none;opacity:1;border-color:var(--line);background:#fff8e8}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:64px;height:64px;object-fit:cover;border:3px solid #fff;box-shadow:var(--shadow);cursor:pointer;background:var(--paper2)}
.plan{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dotted var(--line)}
.plan:last-child{border-bottom:none}
.plan .tm{font-family:var(--type);font-size:13px;color:var(--tc);min-width:46px;padding-top:2px}
.plan .tx{flex:1}
.plan.done .tx{text-decoration:line-through;color:var(--soft)}
.plan .bk{font-size:12px;color:var(--soft)}
.linkish{color:var(--blue);text-decoration:underline;word-break:break-all}

/* tickets */
.ticket{display:flex;background:#fbf1d9;border-radius:10px;position:relative;box-shadow:var(--shadow);min-height:118px;cursor:pointer;
  background-image:repeating-linear-gradient(90deg,rgba(120,80,40,.04) 0 2px,transparent 2px 6px)}
.ticket::before,.ticket::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:var(--paper);right:84px}
.ticket::before{top:-11px}.ticket::after{bottom:-11px}
.ticket .main{flex:1;padding:12px 14px;border-right:2px dashed #cdb48a;min-width:0}
.ticket .stub{width:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px;text-align:center}
.ticket .stub .em{font-size:30px}
.ticket .stub small{font-family:var(--type);font-size:11px;color:var(--soft)}
.ticket .k{font-family:var(--type);font-size:11px;letter-spacing:2px;color:var(--red);text-transform:uppercase}
.ticket .t{font-family:var(--serif);font-size:18px;font-weight:700;line-height:1.2;margin:2px 0;overflow:hidden;text-overflow:ellipsis}
.ticket .r{font-family:var(--type);font-size:13px;color:var(--ink)}
.ticket .th{width:44px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--line);margin-top:6px}
.bkg{display:flex;gap:12px;align-items:flex-start}
.bkg .em{font-size:28px;width:46px;height:46px;border-radius:12px;background:#f3e6c8;display:flex;align-items:center;justify-content:center;flex:none}
.code{font-family:var(--type);background:#f3e6c8;border:1px dashed var(--gold);border-radius:6px;padding:1px 8px;letter-spacing:1.5px}
.lnk{display:flex;gap:10px;align-items:flex-start}
.lnk img{width:30px;height:30px;border-radius:8px;background:#f3e6c8;flex:none;margin-top:2px}
.stt{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;background:#fff8e8;white-space:nowrap}
.stt.fui{background:var(--green);color:#fff;border-color:var(--green)}
.bar{height:10px;background:#e8dcc2;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--tc);border-radius:99px}
.chk{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dotted var(--line)}
.chk:last-child{border-bottom:none}
.chk.done span.tx{text-decoration:line-through;color:var(--soft)}
.chk .x{border:none;background:none;color:var(--soft);font-size:16px;padding:2px 6px}
.phr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dotted var(--line)}
.phr .es{font-size:14px;color:var(--soft)}
.phr .tr{font-size:19px;font-weight:600}
.phr .pr{font-family:var(--type);font-size:13px;color:var(--tc)}
.phr.hide .tr,.phr.hide .pr{filter:blur(7px);cursor:pointer}
.wish .im{height:140px;background:var(--paper2) center/cover;border-radius:10px;margin:-4px -4px 10px;filter:sepia(.3)}
.wish.done{opacity:.7}
.note{background:#fff3cd;border:1px dashed #d9b75c;border-radius:10px;padding:10px 12px;font-size:14px;color:#6b5420}

/* mapa */
.mapbox{position:relative;background:#e9dcbd;border:1px solid var(--line);border-radius:16px;overflow:hidden;touch-action:none;box-shadow:inset 0 0 40px rgba(120,80,30,.18);margin-top:12px}
.mapbox svg{display:block;width:100%;height:auto;aspect-ratio:2/1;cursor:grab}
.mapbox .land{fill:#d8c39a;stroke:#b39b6f;stroke-width:.4;vector-effect:non-scaling-stroke}
.mapbox .land.vis{fill:var(--acc);fill-opacity:.55}
.mapbox .ctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mapbox .ctl button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:20px}
.mapbox .legend{position:absolute;left:10px;bottom:10px;background:rgba(251,245,230,.92);border-radius:10px;padding:6px 10px;font-size:12px;font-family:var(--type)}
.mapbox .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 60px;font-family:var(--type);color:var(--soft)}
.pop{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;box-shadow:var(--shadow);font-size:14px;transform:translate(-50%,-115%);white-space:nowrap;z-index:3}

/* álbum (scrapbook) */
.sbwrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.sbbar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:100%}
.page{position:relative;width:min(100%,640px);aspect-ratio:3/4;border-radius:6px;box-shadow:0 4px 18px rgba(60,40,20,.25);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.bg-antiguo{background:#f4e9cf;background-image:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.5),transparent 60%),radial-gradient(ellipse at 80% 90%,rgba(150,100,40,.18),transparent 60%)}
.bg-kraft{background:#c9a878;background-image:repeating-linear-gradient(17deg,rgba(90,60,20,.05) 0 2px,transparent 2px 5px),radial-gradient(ellipse at 50% 50%,rgba(255,255,255,.15),transparent 70%)}
.bg-cuadricula{background:#f7efdc;background-image:linear-gradient(rgba(80,110,150,.15) 1px,transparent 1px),linear-gradient(90deg,rgba(80,110,150,.15) 1px,transparent 1px);background-size:4% 3%}
.bg-rayas{background:#f7efdc;background-image:repeating-linear-gradient(180deg,transparent 0 calc(3.2% - 1px),rgba(80,110,150,.2) calc(3.2% - 1px) 3.2%)}
.bg-negro{background:#2b2723;background-image:radial-gradient(ellipse at 50% 30%,rgba(255,255,255,.06),transparent 70%)}
.bg-azul{background:#d9e2e4;background-image:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.5),transparent 60%)}
.el{position:absolute;transform-origin:50% 50%;touch-action:none}
.el.sel{outline:1.5px dashed #3a6ea5;outline-offset:4px}
.el .hd{position:absolute;right:-16px;bottom:-16px;width:28px;height:28px;border-radius:50%;background:#3a6ea5;color:#fff;display:none;align-items:center;justify-content:center;font-size:15px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.el.sel .hd{display:flex}
.el.photo{background:#fffdf7;padding:4% 4% 14%;box-shadow:0 .3em .8em rgba(40,25,10,.3)}
.el.photo img{width:100%;display:block;pointer-events:none;filter:sepia(.08)}
.el.photo .pc{position:absolute;left:3%;right:3%;bottom:1%;font-family:var(--hand);text-align:center;line-height:1.1;white-space:nowrap;overflow:hidden}
.el.photo.plain{padding:0;background:none}
.el.photo.plain .pc{display:none}
.el.sticker{line-height:1;text-align:center;filter:drop-shadow(0 .08em .12em rgba(0,0,0,.25))}
.el.washi{opacity:.82;box-shadow:0 .05em .2em rgba(0,0,0,.12);clip-path:polygon(0 8%,3% 0,6% 10%,9% 0,12% 8%,15% 0,100% 0,100% 100%,97% 92%,94% 100%,91% 90%,88% 100%,0 100%,3% 50%)}
.el.text{line-height:1.25;white-space:pre-wrap;word-break:break-word}
.el.text.t-hand{font-family:var(--hand)}
.el.text.t-type{font-family:var(--type)}
.el.text.t-serif{font-family:var(--serif)}
.el.text.n-label{background:#fbf3dc;border:.08em solid #8b6b45;padding:.3em .6em;box-shadow:0 .1em .3em rgba(0,0,0,.15)}
.el.text.n-note{background:#fff2a8;padding:.6em .7em;box-shadow:0 .2em .5em rgba(0,0,0,.2)}
.el.text.n-torn{background:#fffdf5;padding:.6em .7em;box-shadow:0 .1em .4em rgba(0,0,0,.15);clip-path:polygon(0 3%,8% 0,15% 4%,25% 1%,38% 4%,50% 0,62% 3%,75% 0,88% 4%,100% 1%,100% 97%,90% 100%,78% 96%,64% 100%,50% 97%,36% 100%,22% 96%,10% 100%,0 97%)}
.el.label{font-family:var(--type);text-align:center;border:.12em solid currentColor;border-radius:.25em;padding:.2em .4em;letter-spacing:.12em;font-weight:700;opacity:.85;white-space:nowrap}
.el.label.dbl{outline:.06em solid currentColor;outline-offset:.12em}

  clearTimeout(saveT);
  try{ const d=await openDB(DBN,'kv'); await new Promise((res,rej)=>{ const tx=d.transaction('kv','readwrite'); tx.objectStore('kv').put(JSON.parse(JSON.stringify(S)),'state'); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); }
  catch(e){ toast('No se pudo guardar: inténtalo de nuevo'); }
}
window.addEventListener('pagehide',()=>{ if(saveT) saveNow(); });
async function fileOp(mode,key,val){ const d=await openDB(FDB,'files'); return new Promise((res,rej)=>{ const tx=d.transaction('files',mode==='get'?'readonly':'readwrite'); const st=tx.objectStore('files');
  const q= mode==='get'?st.get(key): mode==='put'?st.put(val,key): st.delete(key);
  if(mode==='get'){ q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); } else { tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); } }); }
const urlCache={};
async function blobURL(key){ if(!key) return null; if(urlCache[key]) return urlCache[key]; try{ const b=await fileOp('get',key); if(b){ urlCache[key]=URL.createObjectURL(b); return urlCache[key]; } }catch(e){} return null; }
function dropURL(key){ if(urlCache[key]){ URL.revokeObjectURL(urlCache[key]); delete urlCache[key]; } }
async function delFile(key){ dropURL(key); try{ await fileOp('del',key); }catch(e){} }
function hydrate(root){ (root||document).querySelectorAll('[data-k]').forEach(async el=>{ const u=await blobURL(el.dataset.k);
  if(!u){ if(el.dataset.k2){ const u2=await blobURL(el.dataset.k2); if(u2){ setImg(el,u2); return; } } el.classList.add('noimg'); return; } setImg(el,u); }); }
function setImg(el,u){ if(el.tagName==='IMG') el.src=u; else el.style.backgroundImage=`url("${u}")`; }

/* ---------- imágenes (se comprimen al subirlas) ---------- */
function loadImg(file){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(file); const im=new Image(); im.onload=()=>res({im,u}); im.onerror=()=>{ URL.revokeObjectURL(u); rej(new Error('img')); }; im.src=u; }); }
function scaled(im,max,q){ const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)); const cv=document.createElement('canvas');
  cv.width=Math.max(1,Math.round(im.naturalWidth*k)); cv.height=Math.max(1,Math.round(im.naturalHeight*k));
  const c=cv.getContext('2d'); c.fillStyle='#fff'; c.fillRect(0,0,cv.width,cv.height); c.drawImage(im,0,0,cv.width,cv.height);
  return new Promise(r=>cv.toBlob(b=>r(b),'image/jpeg',q)); }
async function storeImage(file,id,big){ // guarda 'o:'+id (grande) y 't:'+id (miniatura)
  const {im,u}=await loadImg(file);
  try{ const o=await scaled(im,big||2048,.84), t=await scaled(im,520,.8);
    await fileOp('put','o:'+id,o); await fileOp('put','t:'+id,t);
    return {w:im.naturalWidth,h:im.naturalHeight,kb:Math.round((o.size+t.size)/1024)};
  } finally{ URL.revokeObjectURL(u); } }

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromYmd=s=>{ const [y,m,d]=String(s).split('-').map(Number); return new Date(y,(m||1)-1,d||1); };
const today=()=>ymd(new Date());
const daysBetween=(a,b)=>Math.round((fromYmd(b)-fromYmd(a))/864e5);
const addDays=(s,n)=>{ const d=fromYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const fmtD=s=>{ if(!s) return ''; const d=fromYmd(s); return d.getDate()+' '+MES[d.getMonth()]+' '+d.getFullYear(); };
const fmtDs=s=>{ if(!s) return ''; const d=fromYmd(s); return DSEM[d.getDay()]+' '+d.getDate()+' '+MES[d.getMonth()]; };
function fmtRange(a,b){ if(!a) return 'Sin fechas'; if(!b||a===b) return fmtD(a); const A=fromYmd(a),B=fromYmd(b);
  if(A.getFullYear()===B.getFullYear()){ if(A.getMonth()===B.getMonth()) return A.getDate()+'–'+B.getDate()+' '+MES[A.getMonth()]+' '+A.getFullYear(); return A.getDate()+' '+MES[A.getMonth()]+' – '+B.getDate()+' '+MES[B.getMonth()]+' '+A.getFullYear(); }
  return fmtD(a)+' – '+fmtD(b); }
function toast(t,ms){ const e=$('#toast'); e.textContent=t; e.classList.add('on'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('on'),ms||2200); }
function ask(t,yes){ return new Promise(r=>{ $('#cfTx').textContent=t; $('#cfYes').textContent=yes||'Sí'; $('#cf').classList.add('on');
  const done=v=>{ $('#cf').classList.remove('on'); $('#cfYes').onclick=$('#cfNo').onclick=null; r(v); };
  $('#cfYes').onclick=()=>done(true); $('#cfNo').onclick=()=>done(false); }); }
function fixUrl(u){ u=String(u||'').trim(); if(!u) return ''; const m=u.match(/https?:\/\/[^\s<>"']+/i); if(m) return m[0]; if(/^[\w-]+(\.[\w-]+)+(\/|$)/.test(u)) return 'https://'+u; return u; }
function hostOf(u){ try{ return new URL(u).hostname.replace(/^www\.|^m\./,''); }catch(e){ return ''; } }
const fav=h=>h?`https://www.google.com/s2/favicons?domain=${encodeURIComponent(h)}&sz=64`:'';
function starsHtml(n,ed){ n=n||0; let h=''; for(let i=1;i<=5;i++) h+=`<span data-s="${i}" class="${i<=n?'':'off'}">★</span>`; return `<span class="stars${ed?' ed':''}">${h}</span>`; }
function hash(s){ let h=0; for(const c of String(s)) h=(h*31+c.charCodeAt(0))|0; return Math.abs(h); }
const tilt=id=>((hash(id)%9)-4)*.9;
function money(v,cur){ cur=cur||S.base; const n=Number(v)||0; try{ return new Intl.NumberFormat('es-ES',{style:'currency',currency:cur,maximumFractionDigits:cur==='JPY'||cur==='KRW'?0:2}).format(n); }catch(e){ return n.toFixed(2)+' '+cur; } }
function toBase(v,cur){ const r=S.rates[cur]; if(!cur||cur===S.base) return Number(v)||0; return r?(Number(v)||0)/r:(Number(v)||0); }
function dl(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.append(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500); }
function pickFile(accept,multi){ return new Promise(r=>{ const i=multi?$('#fPhotos'):$('#fOne'); i.accept=accept||''; i.value=''; i.onchange=()=>r([...i.files]); i.click(); }); }
function hav(a,b){ const R=6371,t=x=>x*Math.PI/180; const dLa=t(b.lat-a.lat),dLo=t(b.lon-a.lon); const h=Math.sin(dLa/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }

/* ---------- modelo de viaje ---------- */
function newTrip(o){ return Object.assign({id:uid(),name:'',countries:[],cities:[],start:'',end:'',color:THEMES[0][0],cover:null,rating:0,notes:'',
  photos:[],days:{},tickets:[],bookings:[],links:[],pack:[],budget:0,cur:'EUR',expenses:[],lang:'',phrases:[],docs:DEFDOCS.map(n=>({id:uid(),name:n,done:false,exp:'',na:false})),pages:[],created:Date.now()},o||{}); }
const tripById=id=>S.trips.find(t=>t.id===id);
function tripStatus(t){ const td=today(); if(!t.start) return 'idea'; const e=t.end||t.start; if(td<t.start) return 'next'; if(td>e) return 'past'; return 'now'; }
const STLBL={idea:'💭 Idea',next:'⏳ Próximo',now:'🧭 En curso',past:'📔 Recuerdo'};
function tripDays(t){ if(!t.start) return Object.keys(t.days).sort(); const e=t.end&&t.end>=t.start?t.end:t.start; const n=Math.min(daysBetween(t.start,e),120); const a=[]; for(let i=0;i<=n;i++) a.push(addDays(t.start,i));
  Object.keys(t.days).forEach(k=>{ if(!a.includes(k)&&hasDayContent(t.days[k])) a.push(k); }); return a.sort(); }
function hasDayContent(d){ return d&&((d.plan&&d.plan.length)||d.moment||d.text||d.food||d.mood); }
const dayOf=(t,k)=>t.days[k]||(t.days[k]={plan:[],moment:'',text:'',mood:0,food:'',weather:''});
function tripKm(t){ const c=t.cities.filter(x=>x.lat!=null); let k=0; for(let i=1;i<c.length;i++) k+=hav(c[i-1],c[i]); return Math.round(k); }
function spent(t){ return t.expenses.reduce((s,e)=>s+toBase(e.amount,e.cur),0); }
function tripLen(t){ if(!t.start) return 0; return daysBetween(t.start,t.end&&t.end>=t.start?t.end:t.start)+1; }
</script>

/* ---------- sello postal ---------- */
function pmSVG(top,bot,mid,col,id,wavy){
  const W=wavy?230:120; const t=esc(String(top||'').toUpperCase().slice(0,18)), b=esc(String(bot||'').toUpperCase().slice(0,20)), m=esc(mid||'');
  let lines=''; if(wavy){ for(let i=0;i<5;i++){ const y=36+i*12; lines+=`<path d="M122 ${y} q9 -6 18 0 t18 0 t18 0 t18 0 t18 0 t18 0" />`; } }
  return `<svg viewBox="0 0 ${W} 120" xmlns="http://www.w3.org/2000/svg"><defs><path id="pa${id}" d="M19 60 A41 41 0 0 1 101 60"/><path id="pb${id}" d="M11 60 A49 49 0 0 0 109 60"/></defs>
  <g fill="none" stroke="${col}" stroke-width="2.6"><circle cx="60" cy="60" r="55"/><circle cx="60" cy="60" r="35" stroke-width="1.5"/>${lines}</g>
  <g fill="${col}" font-family="Special Elite,Courier New,monospace"><text font-size="12.5" letter-spacing="1.5"><textPath href="#pa${id}" startOffset="50%" text-anchor="middle">${t}</textPath></text>
  <text font-size="11" letter-spacing="1.5"><textPath href="#pb${id}" startOffset="50%" text-anchor="middle">${b}</textPath></text>
  <text x="60" y="56" text-anchor="middle" font-size="11">${m.split('|')[0]||''}</text><text x="60" y="72" text-anchor="middle" font-size="13" font-weight="bold">${m.split('|')[1]||''}</text></g></svg>`;
}

/* ---------- PASAPORTE (inicio) ---------- */
function visitedTrips(){ return S.trips.filter(t=>['past','now'].includes(tripStatus(t))); }
function globalStats(){ const vt=visitedTrips(); const cs=new Set(), ci=new Set(); let d=0,km=0;
  vt.forEach(t=>{ t.countries.forEach(c=>cs.add(c)); t.cities.forEach(c=>ci.add(c.name.toLowerCase())); d+=tripLen(t); km+=tripKm(t); });
  return {countries:cs.size,cities:ci.size,trips:vt.length,days:d,km,photos:S.trips.reduce((s,t)=>s+t.photos.length,0)}; }
function memoryOfToday(){
  const td=new Date(), md=pad(td.getMonth()+1)+'-'+pad(td.getDate()), y=td.getFullYear(); const out=[];
  S.trips.forEach(t=>{ if(!t.start||tripStatus(t)!=='past') return;
    tripDays(t).forEach(k=>{ if(k.slice(5)===md&&+k.slice(0,4)<y){ out.push({t,k,years:y-+k.slice(0,4)}); } }); });
  return out.sort((a,b)=>a.years-b.years)[0]||null;
}
function tripCard(t){
  const st=tripStatus(t), c=t.cities[0];
  const pm=pmSVG(c?c.name:(t.countries[0]?cName(t.countries[0]):t.name), t.countries.map(cName).join(' · ')||'BON VOYAGE', (t.start?MES[fromYmd(t.start).getMonth()].toUpperCase():'')+'|'+(t.start?fromYmd(t.start).getFullYear():'✈'), INKS[hash(t.id)%3], 'c'+t.id);
  return `<div class="trip" data-act="openTrip" data-id="${t.id}" style="--c:${t.color}">
    <div class="cv${t.cover?'':' noimg'}" ${t.cover?`data-k="t:${t.cover}"`:''}>${t.cover?'':(t.countries[0]?flag(t.countries[0]):'🧳')}</div>
    <span class="tag">${STLBL[st]}</span>
    <div class="pm">${pm}</div>
    <div class="bd"><div class="nm">${esc(t.name||'Viaje sin nombre')}</div>
    <div class="fl">${t.countries.map(flag).join(' ')}</div>
    <div class="dt">${fmtRange(t.start,t.end)}${t.start?` · ${tripLen(t)} días`:''}</div>
    ${t.rating?starsHtml(t.rating):''}</div></div>`;
}
function renderHome(app){
  const g=globalStats(); const now=S.trips.filter(t=>tripStatus(t)==='now'); const next=S.trips.filter(t=>tripStatus(t)==='next').sort((a,b)=>a.start.localeCompare(b.start));
  const past=S.trips.filter(t=>tripStatus(t)==='past').sort((a,b)=>b.start.localeCompare(a.start)); const ideas=S.trips.filter(t=>tripStatus(t)==='idea');
  let h=`<div class="passport"><div class="globe">🌍</div><div><div class="pt">PASAPORTE · 旅券 · PASSPORT</div><div class="pn">${esc(S.name||'Mis Viajes')}</div>
    <div class="ps">${g.countries} país${g.countries===1?'':'es'} · ${g.cities} ciudad${g.cities===1?'':'es'} · ${g.trips} viaje${g.trips===1?'':'s'}</div></div></div>`;
  now.forEach(t=>{ const n=daysBetween(t.start,today())+1; h+=`<div class="card countdown" data-act="openTrip" data-id="${t.id}"><div class="num">${n}</div><div><div class="lb">DÍA ${n} DE ${tripLen(t)}</div><div style="font-family:var(--serif);font-size:20px;font-weight:700">${esc(t.name)} ${t.countries.map(flag).join('')}</div><div class="muted">¡Disfruta! Apunta el momento de hoy en el diario ✍️</div></div></div>`; });
  if(next[0]){ const t=next[0], n=daysBetween(today(),t.start); h+=`<div class="card countdown" data-act="openTrip" data-id="${t.id}"><div class="num">${n}</div><div><div class="lb">${n===1?'DÍA':'DÍAS'} PARA TU PRÓXIMO VIAJE</div><div style="font-family:var(--serif);font-size:20px;font-weight:700">${esc(t.name)} ${t.countries.map(flag).join('')}</div><div class="muted">${fmtRange(t.start,t.end)}${t.pack.length?` · maleta ${t.pack.filter(p=>p.done).length}/${t.pack.length}`:''}</div></div></div>`; }
  const m=memoryOfToday();
  if(m){ const d=m.t.days[m.k]||{}; const ph=m.t.photos.filter(p=>p.day===m.k).slice(0,6);
    h+=`<div class="card memory" data-act="openTrip" data-id="${m.t.id}" data-tab="diario"><div class="jp">HACE ${m.years} AÑO${m.years>1?'S':''} · ${fmtD(m.k).toUpperCase()}</div><div class="mh">Hoy hace ${m.years} año${m.years>1?'s':''} estabas en ${esc(m.t.name)} ${m.t.countries.map(flag).join('')}</div>
    ${d.moment?`<div style="margin-top:4px">«${esc(d.moment)}»</div>`:''}${ph.length?`<div class="ph">${ph.map(p=>`<img data-k="t:${p.id}" alt="">`).join('')}</div>`:''}</div>`; }
  h+=`<div class="stats"><div class="stat"><b>${g.countries}</b><span>PAÍSES</span></div><div class="stat"><b>${g.cities}</b><span>CIUDADES</span></div><div class="stat"><b>${g.trips}</b><span>VIAJES</span></div><div class="stat"><b>${g.days}</b><span>DÍAS</span></div><div class="stat"><b>${g.photos}</b><span>FOTOS</span></div><div class="stat"><b>${g.km.toLocaleString('es-ES')}</b><span>KM</span></div></div>`;
  const favs=[]; S.trips.forEach(t=>t.photos.forEach(p=>{ if(p.fav) favs.push([t,p]); }));
  if(favs.length){ h+=`<h2>⭐ Mis mejores fotos <span class="jp">BEST SHOTS</span></h2><div class="favstrip">${favs.slice(-30).reverse().map(([t,p])=>`<div class="pol" style="transform:rotate(${tilt(p.id)}deg)" data-act="lbOpen" data-trip="${t.id}" data-id="${p.id}"><img data-k="t:${p.id}" alt=""><div class="cap">${esc(p.cap||t.name)}</div></div>`).join('')}</div>`; }
  const sec=(tt,jp,arr,addNew)=>{ if(!arr.length&&!addNew) return ''; return `<h2>${tt} <span class="jp">${jp}</span></h2><div class="grid g3">${arr.map(tripCard).join('')}${addNew?`<button class="newtrip" data-act="newTrip"><b>+</b>Nuevo viaje</button>`:''}</div>`; };
  h+=sec('🧭 En curso','NOW',now,false)+sec('⏳ Próximos viajes','NEXT',next,true)+sec('💭 Ideas sin fecha','IDEAS',ideas,false)+sec('📔 Mis recuerdos','MEMORIES',past,false);
  app.innerHTML=h;
}

/* ---------- formulario de viaje ---------- */
function openModal(html,onOpen){ $('#mdBody').innerHTML=html; $('#md').classList.add('on'); if(onOpen) onOpen($('#mdBody')); }
function closeModal(){ $('#md').classList.remove('on'); $('#mdBody').innerHTML=''; }
$('#md').addEventListener('click',e=>{ if(e.target.id==='md') closeModal(); });
function countryPicker(sel){ return `<select id="fCountry"><option value="">+ Añadir país…</option>${COUNTRIES.map(([c,n])=>`<option value="${c}">${flag(c)} ${esc(n)}</option>`).join('')}</select><div id="fCList" class="row" style="margin-top:6px">${sel.map(c=>`<span class="chip" data-c="${c}">${flag(c)} ${esc(cName(c))} ✕</span>`).join('')}</div>`; }
function bindCountryPicker(root,arr){ const draw=()=>{ root.querySelector('#fCList').innerHTML=arr.map(c=>`<span class="chip" data-c="${c}">${flag(c)} ${esc(cName(c))} ✕</span>`).join(''); };

  <div class="f2"><div><label class="f">MONEDA DEL DESTINO</label><select id="fCur">${CURS.map(c=>`<option ${c===t.cur?'selected':''}>${c}</option>`).join('')}</select></div>
  <div><label class="f">IDIOMA (FRASES)</label><select id="fLang"><option value="">—</option>${Object.entries(LANGS).map(([k,l])=>`<option value="${k}" ${k===t.lang?'selected':''}>${l.f} ${l.n}</option>`).join('')}</select></div></div>
  <div class="acts">${isNew?'':'<button class="btn danger" id="fDel" style="margin-right:auto">Borrar viaje</button>'}<button class="btn" id="fNo">Cancelar</button><button class="btn pri" id="fOk">${isNew?'Crear viaje':'Guardar'}</button></div>`,
  r=>{ bindCountryPicker(r,cs); let col=t.color; let curTouched=!isNew;
    r.querySelector('#fCur').onchange=()=>curTouched=true;

      Object.assign(t,{name:n,countries:cs,start:s,end:e||s,color:col,cur:r.querySelector('#fCur').value,lang:r.querySelector('#fLang').value});
      if(isNew){ S.trips.push(t); if(fromWish) fromWish.done=true; } save(); closeModal(); if(isNew) go('#viaje/'+t.id); else rerender(); }; });

async function delTrip(t){
  if(!await ask(`¿Borrar «${t.name}» con todas sus fotos, tickets y recuerdos? No se puede deshacer.`,'Borrar')) return;
  for(const p of t.photos){ await delFile('o:'+p.id); await delFile('t:'+p.id); }
  for(const k of t.tickets){ if(k.file){ await delFile('f:'+k.id); await delFile('o:'+k.id); await delFile('t:'+k.id); } }
  S.trips=S.trips.filter(x=>x!==t); save(); closeModal(); go('#home'); toast('Viaje borrado');
}

async function geocode(q){
  const u='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&addressdetails=1&accept-language=es&q='+encodeURIComponent(q);
  const r=await fetch(u,{headers:{'Accept':'application/json'}}); if(!r.ok) throw new Error('geo'); return r.json();
}

      <label class="f">✨ EL MOMENTO DEL DÍA</label><input data-dfield="moment" data-day="${k}" value="${esc(d.moment||'')}" placeholder="Una frase que resuma el día" class="hand" style="font-size:22px;padding:4px 10px">

      <div><label class="f">CÓMO ME SENTÍ</label><div class="moods">${MOODS.map((m,j)=>`<button class="${d.mood===j+1?'on':''}" data-act="dMood" data-day="${k}" data-v="${j+1}">${m}</button>`).join('')}</div></div></div>

<script>
/* Fotos */
TABF.fotos=(t,b)=>{

   <div class="chips" style="margin-top:8px"><button class="chip ${V.pf==='all'?'on':''}" data-act="pf" data-id="all">Todas</button><button class="chip ${V.pf==='fav'?'on':''}" data-act="pf" data-id="fav">⭐ Favoritas</button>
   ${ds.map((k,i)=>t.photos.some(p=>p.day===k)?`<button class="chip ${V.pf===k?'on':''}" data-act="pf" data-id="${k}">Día ${i+1}</button>`:'').join('')}${t.photos.some(p=>!p.day)?`<button class="chip ${V.pf==='none'?'on':''}" data-act="pf" data-id="none">Sin día</button>`:''}</div>

   :`<div class="empty">${t.photos.length?'No hay fotos con este filtro.':'Sube tus fotos más bonitas del viaje 📸'}</div>`}`;

async function addPhotos(t,day){
  const files=await pickFile('image/*',true); if(!files.length) return;
  if(day===undefined){ const ds=tripDays(t); day=ds.includes(today())?today():''; if(ds.length){ day=await new Promise(r=>{ openModal(`<h3>📷 ${files.length} foto${files.length>1?'s':''}</h3><label class="f">¿DE QUÉ DÍA SON?</label><select id="phD"><option value="">Sin día concreto</option>${ds.map((k,i)=>`<option value="${k}" ${k===day?'selected':''}>Día ${i+1} · ${fmtDs(k)}</option>`).join('')}</select><div class="acts"><button class="btn pri" id="phOk">Subir</button></div>`,
    m=>{ m.querySelector('#phOk').onclick=()=>{ const v=m.querySelector('#phD').value; closeModal(); r(v); }; }); }); } }
  let n=0;
  for(const f of files){ n++; toast(`Guardando foto ${n} de ${files.length}…`,60000);
    try{ const id=uid(); const info=await storeImage(f,id); t.photos.push({id,cap:'',day:day||'',fav:false,w:info.w,h:info.h,added:Date.now()}); if(!t.cover) t.cover=id; }
    catch(e){ toast('Una foto no se pudo leer'); } }
  await saveNow(); toast(`✓ ${files.length} foto${files.length>1?'s':''} guardada${files.length>1?'s':''}`); rerender();
}

  $('#lbSv').onclick=async()=>{ const bl=await fileOp('get','o:'+p.id); if(bl) dl(bl,(p.cap||t.name||'foto').replace(/[^\w\-áéíóúñ ]/gi,'')+'.jpg'); };
  $('#lbDel').onclick=async()=>{ if(!await ask('¿Borrar esta foto? También desaparecerá del álbum.','Borrar')) return;

async function updateRates(){
  toast('Buscando el tipo de cambio…',8000);
  for(const host of ['https://api.frankfurter.dev/v1','https://api.frankfurter.app']){
    try{ const r=await fetch(`${host}/latest?base=${S.base}`); if(!r.ok) continue; const j=await r.json(); if(j&&j.rates){ S.rates=Object.assign({},S.rates,j.rates,{[S.base]:1}); S.ratesDate=Date.now(); save(); toast('✓ Tipo de cambio actualizado'); rerender(); return; } }catch(e){}

  toast('No se pudo actualizar; puedes escribirlo tú');
}

let sbSel=null, sbRO=null;
const SBDEF={photo:{w:40,fs:3.2},sticker:{w:16,fs:13},washi:{w:34,fs:3},text:{w:40,fs:4},label:{w:0,fs:3.4},postage:{w:18,fs:2.4},pmk:{w:34,fs:3},tk:{w:38,fs:4}};
function curPage(t){ if(!t.pages.length) t.pages.push({id:uid(),bg:'antiguo',els:[]}); if(V.page>=t.pages.length) V.page=t.pages.length-1; if(V.page<0) V.page=0; return t.pages[V.page]; }
function elStyle(e){ let s=`left:calc(var(--u)*${e.cx});top:calc(var(--u)*${e.cy});font-size:calc(var(--u)*${e.fs});transform:translate(-50%,-50%) rotate(${e.r||0}deg);z-index:${e.z||1};`;

function bindPage(t,pg,P){
  let mode=null, st=null; const pts=new Map();
  const select=id=>{ sbSel=id; P.querySelectorAll('.el').forEach(x=>x.classList.toggle('sel',x.dataset.el===id)); sbToolbar(t,pg); };
  P.onpointerdown=ev=>{
    const node=ev.target.closest('.el'); pts.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
    if(!node){ select(null); return; }
    const e=pg.els.find(x=>x.id===node.dataset.el); if(!e) return;
    if(sbSel!==e.id) select(e.id);
    P.setPointerCapture(ev.pointerId); ev.preventDefault();
    const u=P.clientWidth/100;
    if(ev.target.closest('.hd')||pts.size===2){
      const r=node.getBoundingClientRect(); const c={x:r.left+r.width/2,y:r.top+r.height/2};
      const p=pts.size===2?[...pts.values()]:[{x:ev.clientX,y:ev.clientY}];
      const v=pts.size===2?{x:p[1].x-p[0].x,y:p[1].y-p[0].y}:{x:ev.clientX-c.x,y:ev.clientY-c.y};
      mode='rs'; st={e,node,c,d0:Math.hypot(v.x,v.y)||1,a0:Math.atan2(v.y,v.x),w0:e.w,fs0:e.fs,r0:e.r||0,two:pts.size===2};
    } else { mode='mv'; st={e,node,x0:ev.clientX,y0:ev.clientY,cx0:e.cx,cy0:e.cy,u}; }
  };
  P.onpointermove=ev=>{
    if(!pts.has(ev.pointerId)) return; pts.set(ev.pointerId,{x:ev.clientX,y:ev.clientY}); if(!mode) return;
    const {e,node}=st;
    if(mode==='mv'){ e.cx=Math.round((st.cx0+(ev.clientX-st.x0)/st.u)*10)/10; e.cy=Math.round((st.cy0+(ev.clientY-st.y0)/st.u)*10)/10; e.cx=Math.max(-10,Math.min(110,e.cx)); e.cy=Math.max(-10,Math.min(143,e.cy)); }
    else { let v; if(st.two){ const p=[...pts.values()]; if(p.length<2) return; v={x:p[1].x-p[0].x,y:p[1].y-p[0].y}; } else v={x:ev.clientX-st.c.x,y:ev.clientY-st.c.y};
      const k=Math.max(.15,Math.min(8,Math.hypot(v.x,v.y)/st.d0)); e.fs=Math.round(st.fs0*k*100)/100; if(st.w0) e.w=Math.round(st.w0*k*10)/10;
      let r=st.r0+(Math.atan2(v.y,v.x)-st.a0)*180/Math.PI; const rs=Math.round(r/90)*90; if(Math.abs(r-rs)<3) r=rs; e.r=Math.round(r*10)/10; }
    node.style.cssText=elStyle(e);

}

const MAPW=1000, MAPH=500; let WORLD=null, MV={x:0,y:0,w:MAPW,h:MAPH}, mapFilter='all';
const ALIAS={US:'United States of America',CD:'Dem. Rep. Congo',CG:'Congo',CI:"Côte d'Ivoire",MM:'Myanmar',BA:'Bosnia and Herz.',DO:'Dominican Rep.',SZ:'eSwatini',MK:'Macedonia',SS:'S. Sudan',GQ:'Eq. Guinea',SB:'Solomon Is.',CF:'Central African Rep.',PS:'Palestine',TR:'Turkey',CZ:'Czechia',KR:'South Korea',KP:'North Korea',LA:'Laos',VN:'Vietnam',RU:'Russia',SY:'Syria',IR:'Iran',TZ:'Tanzania',BO:'Bolivia',VE:'Venezuela',MD:'Moldova',TW:'Taiwan',BN:'Brunei',FK:'Falkland Is.',TL:'Timor-Leste',XK:'Kosovo',GB:'United Kingdom',CV:'Cabo Verde'};
const mapName=c=>(ALIAS[c]||(DNen?DNen.of(c):c)||'').toLowerCase();
async function getWorld(){
  if(WORLD) return WORLD; const URLW='https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json'; let j=null;
  try{ const c=await caches.open('mis-viajes-mapa'); let r=await c.match(URLW); if(!r){ r=await fetch(URLW); if(r.ok) await c.put(URLW,r.clone()); } if(r&&r.ok) j=await r.json(); }
  catch(e){ try{ const r=await fetch(URLW); if(r.ok) j=await r.json(); }catch(_){} }
  if(!j) return null;
  const {scale:[sx,sy],translate:[tx,ty]}=j.transform;
  const arcs=j.arcs.map(a=>{ let x=0,y=0; return a.map(([dx,dy])=>{ x+=dx; y+=dy; return [x*sx+tx,y*sy+ty]; }); });
  const arc=i=>i>=0?arcs[i]:arcs[~i].slice().reverse();
  const ring=r=>{ const pts=[]; r.forEach((i,k)=>{ const a=arc(i); pts.push(...(k?a.slice(1):a)); }); return pts; };
  WORLD=j.objects.countries.geometries.map(g=>{ const polys=g.type==='Polygon'?[g.arcs]:g.type==='MultiPolygon'?g.arcs:[];
    let d=''; polys.forEach(p=>p.forEach(rr=>{ const pts=ring(rr); let prev=null; pts.forEach((q,k)=>{ const X=((q[0]+180)*MAPW/360).toFixed(1), Y=((90-q[1])*MAPH/180).toFixed(1);
      d+=(k===0||(prev&&Math.abs(q[0]-prev[0])>180))?`M${X} ${Y}`:`L${X} ${Y}`; prev=q; }); d+='Z'; }));
    return {name:(g.properties&&g.properties.name||'').toLowerCase(),d}; });
  return WORLD;
}
const proj=(lat,lon)=>[(lon+180)*MAPW/360,(90-lat)*MAPH/180];
function renderMap(app){
  $('#hTitle').innerHTML='Mi mapa <small>世界地図</small>';
  const vis=new Set(); visitedTrips().forEach(t=>t.countries.forEach(c=>vis.add(c)));
  const g=globalStats();
  app.innerHTML=`<div class="chips" style="margin-top:12px"><button class="chip ${mapFilter==='all'?'on':''}" data-act="mf" data-id="all">Todo</button><button class="chip ${mapFilter==='vis'?'on':''}" data-act="mf" data-id="vis">📍 Donde he estado</button><button class="chip ${mapFilter==='next'?'on':''}" data-act="mf" data-id="next">⏳ Próximos</button><button class="chip ${mapFilter==='wish'?'on':''}" data-act="mf" data-id="wish">✨ Deseos</button></div>
  <div class="mapbox" id="mapbox"><svg id="msvg" viewBox="0 0 ${MAPW} ${MAPH}"><g id="mland"></g><g id="mpins"></g></svg><div class="msg" id="mmsg">Cargando el mapa…</div>
   <div class="ctl"><button data-act="mz" data-id="1.6">+</button><button data-act="mz" data-id="0.625">−</button><button data-act="mz" data-id="0">⌂</button></div>
   <div class="legend">● visitado · ○ próximo · ✦ deseo</div></div>

  <h2>🌍 Países visitados <span class="jp">COUNTRIES</span></h2><div class="row">${[...vis].sort((a,b)=>cName(a).localeCompare(cName(b),'es')).map(c=>`<span class="chip">${flag(c)} ${esc(cName(c))}</span>`).join('')||'<span class="muted">Cuando tengas viajes con fecha pasada, aparecerán aquí.</span>'}</div>
  <p class="muted" style="margin-top:14px">Para que una ciudad salga en el mapa, búscala en 📋 Resumen del viaje (o en tus deseos).</p>`;

async function drawMap(vis){
  const w=await getWorld(); const land=$('#mland'); if(!land) return;
  if(!w){ $('#mmsg').textContent='No se pudo cargar el mapa (necesita internet la primera vez).'; }
  else { $('#mmsg').remove(); const names=new Set([...vis].map(mapName)); const show=mapFilter==='all'||mapFilter==='vis';
    land.innerHTML=w.map(f=>`<path class="land${show&&names.has(f.name)?' vis':''}" d="${f.d}"/>`).join(''); }
  drawPins(); setVB();
}
function pinList(){ const out=[];
  if(mapFilter!=='wish') S.trips.forEach(t=>{ const st=tripStatus(t); if(mapFilter==='vis'&&!['past','now'].includes(st)) return; if(mapFilter==='next'&&!['next','idea'].includes(st)) return;
    t.cities.forEach(c=>{ if(c.lat!=null) out.push({lat:c.lat,lon:c.lon,col:t.color,fill:['past','now'].includes(st),name:c.name,sub:t.name,trip:t.id}); }); });
  if(mapFilter==='all'||mapFilter==='wish') S.wishes.forEach(w=>{ if(w.lat!=null&&!w.done) out.push({lat:w.lat,lon:w.lon,col:'#b08d45',star:true,name:w.place,sub:'✨ Deseo'}); });
  return out; }
function drawPins(){ const g=$('#mpins'); if(!g) return; const k=MAPW/MV.w; const r=5/Math.sqrt(k);
  g.innerHTML=pinList().map((p,i)=>{ const [x,y]=proj(p.lat,p.lon);
    return p.star?`<text x="${x}" y="${y}" font-size="${r*5}" text-anchor="middle" dominant-baseline="central" fill="${p.col}" stroke="#fff" stroke-width="${r*.25}" data-pin="${i}" style="cursor:pointer">✦</text>`
     :`<circle cx="${x}" cy="${y}" r="${r}" fill="${p.fill?p.col:'#fbf5e6'}" stroke="${p.fill?'#fff':p.col}" stroke-width="${r*.45}" data-pin="${i}" style="cursor:pointer"/>`; }).join(''); }
function setVB(){ const s=$('#msvg'); if(!s) return; MV.w=Math.max(40,Math.min(MAPW,MV.w)); MV.h=MV.w/2; MV.x=Math.max(0,Math.min(MAPW-MV.w,MV.x)); MV.y=Math.max(0,Math.min(MAPH-MV.h,MV.y)); s.setAttribute('viewBox',`${MV.x} ${MV.y} ${MV.w} ${MV.h}`); drawPins(); }
function mapZoom(f,cx,cy){ if(!f){ MV={x:0,y:0,w:MAPW,h:MAPH}; setVB(); return; } cx=cx??MV.x+MV.w/2; cy=cy??MV.y+MV.h/2; const nw=Math.max(40,Math.min(MAPW,MV.w/f)); MV.x=cx-(cx-MV.x)*nw/MV.w; MV.y=cy-(cy-MV.y)*nw/MV.w; MV.w=nw; setVB(); }
function bindMap(){
  const s=$('#msvg'), box=$('#mapbox'); const pts=new Map(); let st=null, moved=false;
  const toMap=(px,py)=>{ const r=s.getBoundingClientRect(); return [MV.x+(px-r.left)/r.width*MV.w, MV.y+(py-r.top)/r.height*MV.h]; };
  s.onpointerdown=e=>{ s.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=false;
    if(pts.size===1) st={mode:'pan',x:e.clientX,y:e.clientY,vx:MV.x,vy:MV.y}; else { const p=[...pts.values()]; st={mode:'pinch',d:Math.hypot(p[1].x-p[0].x,p[1].y-p[0].y),w:MV.w,c:toMap((p[0].x+p[1].x)/2,(p[0].y+p[1].y)/2)}; } };
  s.onpointermove=e=>{ if(!pts.has(e.pointerId)||!st) return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); const r=s.getBoundingClientRect();
    if(st.mode==='pan'&&pts.size===1){ const dx=e.clientX-st.x, dy=e.clientY-st.y; if(Math.abs(dx)+Math.abs(dy)>4) moved=true; MV.x=st.vx-dx/r.width*MV.w; MV.y=st.vy-dy/r.height*MV.h; setVB(); }
    else if(st.mode==='pinch'&&pts.size===2){ moved=true; const p=[...pts.values()]; const d=Math.hypot(p[1].x-p[0].x,p[1].y-p[0].y); const nw=Math.max(40,Math.min(MAPW,st.w*st.d/d)); MV.x=st.c[0]-(st.c[0]-MV.x)*nw/MV.w; MV.y=st.c[1]-(st.c[1]-MV.y)*nw/MV.w; MV.w=nw; setVB(); } };
  const up=e=>{ pts.delete(e.pointerId); if(pts.size===0){ if(!moved){ const pin=e.target.closest&&e.target.closest('[data-pin]'); showPop(pin?pinList()[+pin.dataset.pin]:null,e); } st=null; } else if(pts.size===1){ const p=[...pts.values()][0]; st={mode:'pan',x:p.x,y:p.y,vx:MV.x,vy:MV.y}; } };
  s.onpointerup=up; s.onpointercancel=up;
  s.addEventListener('wheel',e=>{ e.preventDefault(); const [mx,my]=toMap(e.clientX,e.clientY); mapZoom(e.deltaY<0?1.25:.8,mx,my); },{passive:false});
  function showPop(p,e){ box.querySelectorAll('.pop').forEach(x=>x.remove()); if(!p) return; const r=box.getBoundingClientRect(); const d=document.createElement('div'); d.className='pop';
    d.style.left=(e.clientX-r.left)+'px'; d.style.top=(e.clientY-r.top)+'px'; d.innerHTML=`<b>${esc(p.name)}</b><div class="muted">${esc(p.sub)}</div>${p.trip?`<button class="btn sm" style="margin-top:4px" data-act="openTrip" data-id="${p.trip}">Abrir viaje</button>`:''}`; box.append(d); }
}

async function backupOut(){
  toast('Preparando la copia…',60000); const files={}; const keys=[];
  S.trips.forEach(t=>{ t.photos.forEach(p=>keys.push('o:'+p.id,'t:'+p.id)); t.tickets.forEach(k=>{ if(k.file) keys.push(...(k.file.img?['o:'+k.id,'t:'+k.id]:['f:'+k.id])); }); });
  S.wishes.forEach(w=>{ if(w.img) keys.push('o:'+w.img,'t:'+w.img); });
  for(const k of keys){ const b=await fileOp('get',k); if(b) files[k]=await new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(b); }); }
  const blob=new Blob([JSON.stringify({app:'mis-viajes',ver:1,date:Date.now(),state:S,files})],{type:'application/json'});
  const name='mis-viajes-'+today()+'.json'; const f=new File([blob],name,{type:'application/json'});
  try{ if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:'Copia de Mis Viajes'}); toast('✓ Copia lista'); return; } }catch(e){ if(e.name==='AbortError'){ toast('Cancelado'); return; } }
  dl(blob,name); toast('✓ Copia descargada');
}
async function backupIn(){
  const f=(await pickFile('application/json,.json'))[0]; if(!f) return;
  let j; try{ j=JSON.parse(await f.text()); }catch(e){ toast('Ese archivo no es una copia válida'); return; }
  if(!j||j.app!=='mis-viajes'||!j.state){ toast('Ese archivo no es una copia de Mis Viajes'); return; }
  if(!await ask('¿Restaurar esta copia? Sustituirá lo que tienes ahora en Mis Viajes.','Restaurar')) return;
  toast('Restaurando…',60000);
  for(const [k,d] of Object.entries(j.files||{})){ try{ const b=await (await fetch(d)).blob(); await fileOp('put',k,b); }catch(e){} }
  S=Object.assign(blank(),j.state); Object.keys(urlCache).forEach(dropURL); await saveNow(); toast('✓ Copia restaurada'); go('#home');
}

async function printTrip(t){
  toast('Preparando el álbum…',30000);
  const P=$('#print'); const ds=tripDays(t);
  const ph=async id=>(await blobURL('o:'+id))||(await blobURL('t:'+id))||'';
  let h=`<div class="pp cover"><div style="font-family:var(--type);letter-spacing:4px;color:#7d6b58">CUADERNO DE VIAJE</div><h1>${esc(t.name)}</h1><div style="font-size:26px">${t.countries.map(flag).join(' ')}</div>
   <p>${t.countries.map(cName).join(' · ')}<br>${fmtRange(t.start,t.end)}</p>${t.cover?`<img src="${await ph(t.cover)}">`:''}
   <p style="margin-top:24px">${tripLen(t)} días · ${t.cities.length} ciudades · ${t.photos.length} fotos · ${tripKm(t).toLocaleString('es-ES')} km</p>${t.rating?`<p style="color:#b08d45;font-size:22px">${'★'.repeat(t.rating)}</p>`:''}
   ${t.cities.length?`<p>${t.cities.map(c=>esc(c.name)).join(' → ')}</p>`:''}${t.notes?`<p style="white-space:pre-wrap;max-width:520px;margin:12px auto;font-style:italic">${esc(t.notes)}</p>`:''}</div>`;
  const dd=ds.filter(k=>hasDayContent(t.days[k])||t.photos.some(p=>p.day===k));
  if(dd.length){ h+='<div class="pp"><h2>✍️ Diario</h2>'; for(const k of dd){ const d=t.days[k]||{}; const pp=t.photos.filter(p=>p.day===k).slice(0,6);
    h+=`<div class="pday"><h3 style="font-family:var(--serif)">Día ${ds.indexOf(k)+1} · ${fmtDs(k)} ${d.weather||''} ${d.mood?MOODS[d.mood-1]:''}</h3>${d.moment?`<p style="font-family:var(--hand);font-size:22px;margin:4px 0">«${esc(d.moment)}»</p>`:''}
     ${d.text?`<p style="white-space:pre-wrap">${esc(d.text)}</p>`:''}${d.food?`<p>🍽️ ${esc(d.food)}</p>`:''}${pp.length?`<div class="pgrid">${(await Promise.all(pp.map(async p=>`<figure><img src="${await ph(p.id)}"><figcaption>${esc(p.cap||'')}</figcaption></figure>`))).join('')}</div>`:''}</div>`; } h+='</div>'; }
  const fv=t.photos.filter(p=>p.fav).length?t.photos.filter(p=>p.fav):t.photos.slice(0,12);
  if(fv.length) h+=`<div class="pp"><h2>📷 ${t.photos.some(p=>p.fav)?'Mis mejores fotos':'Fotos'}</h2><div class="pgrid">${(await Promise.all(fv.map(async p=>`<figure><img src="${await ph(p.id)}"><figcaption>${esc(p.cap||'')}</figcaption></figure>`))).join('')}</div></div>`;
  if(t.tickets.length) h+=`<div class="pp"><h2>🎟️ Tickets</h2>${t.tickets.map(k=>`<p>${tkType(k.type)[1]} <b>${esc(k.title||tkType(k.type)[2])}</b> ${k.from||k.to?`· ${esc(k.from)} → ${esc(k.to)}`:''} · ${fmtD(k.date)}</p>`).join('')}</div>`;
  t.pages.filter(pg=>pg.els.length).forEach((pg,i)=>{ h+=`<div class="pp"><div class="page bg-${pg.bg}" style="--u:6.4px;width:640px">${pageHTML(pg,'p'+i)}</div></div>`; });
  P.innerHTML=h; P.querySelectorAll('.hd').forEach(x=>x.remove()); hydrate(P);
  await new Promise(r=>setTimeout(r,400)); await Promise.all([...P.querySelectorAll('img')].map(im=>im.complete?1:new Promise(r=>{ im.onload=im.onerror=r; setTimeout(r,4000); })));
  toast('En la ventana de imprimir elige «Guardar como PDF» 📄',4000);
  document.body.classList.add('printing'); setTimeout(()=>{ window.print(); },300);
}
window.addEventListener('afterprint',()=>{ document.body.classList.remove('printing'); $('#print').innerHTML=''; });
</script>
<script>
/* =========================================================
   ACCIONES (botones con data-act)
   ========================================================= */
const T=()=>tripById(V.trip);
const ACT={
  openTrip:el=>{ go('#viaje/'+el.dataset.id+(el.dataset.tab?'/'+el.dataset.tab:'')); },
  newTrip:()=>tripForm(newTrip({cur:S.base}),true),
  editTrip:()=>tripForm(T(),false),
  tab:el=>go('#viaje/'+V.trip+'/'+el.dataset.id),
  citySearch:async()=>{ const q=$('#cityQ').value.trim(); if(!q) return; const box=$('#cityRes'); box.innerHTML='<p class="muted">Buscando…</p>';
    try{ const res=await geocode(q); box.innerHTML=(res.length?`<div class="res">${res.map((x,i)=>`<button data-i="${i}">${esc(x.display_name)}</button>`).join('')}</div>`:'<p class="muted">Sin resultados.</p>')+`<button class="btn sm" style="margin-top:6px" id="cityPlain">Añadir «${esc(q)}» sin mapa</button>`;
      box.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{ const x=res[+b.dataset.i]; const t=T(); const cc=(x.address&&x.address.country_code||'').toUpperCase();
        const nm=x.address&&(x.address.city||x.address.town||x.address.village||x.address.municipality)||x.name||q;
        t.cities.push({id:uid(),name:nm,lat:+x.lat,lon:+x.lon,cc}); if(cc&&!t.countries.includes(cc)) t.countries.push(cc); save(); rerender(); });
      $('#cityPlain').onclick=()=>{ T().cities.push({id:uid(),name:q,lat:null,lon:null,cc:''}); save(); rerender(); }; }
    catch(e){ box.innerHTML=`<p class="muted">No se pudo buscar (¿sin internet?).</p><button class="btn sm" id="cityPlain">Añadir «${esc(q)}» sin mapa</button>`; $('#cityPlain').onclick=()=>{ T().cities.push({id:uid(),name:q,lat:null,lon:null,cc:''}); save(); rerender(); }; } },
  cityUp:el=>{ const c=T().cities, i=c.findIndex(x=>x.id===el.dataset.id); if(i>0){ [c[i-1],c[i]]=[c[i],c[i-1]]; save(); rerender(); } },
  cityDel:el=>{ const t=T(); t.cities=t.cities.filter(x=>x.id!==el.dataset.id); save(); rerender(); },
  planAdd:el=>planForm(T(),el.dataset.day),
  planEdit:el=>{ const t=T(); const p=(t.days[el.dataset.day]||{plan:[]}).plan.find(x=>x.id===el.dataset.id); if(p) planForm(t,el.dataset.day,p); },
  planDone:el=>{ const p=dayOf(T(),el.dataset.day).plan.find(x=>x.id===el.dataset.id); if(p){ p.done=el.checked; save(); el.closest('.plan').classList.toggle('done',p.done); } },
  dWeather:el=>{ const d=dayOf(T(),el.dataset.day); d.weather=d.weather===el.dataset.v?'':el.dataset.v; save(); rerender(); },
  dMood:el=>{ const d=dayOf(T(),el.dataset.day); d.mood=d.mood===+el.dataset.v?0:+el.dataset.v; save(); el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.v===d.mood)); },
  addPhotos:el=>addPhotos(T(),el.dataset.day),
  pf:el=>{ V.pf=el.dataset.id; rerender(); },
  lbOpen:el=>{ const t=tripById(el.dataset.trip); if(!t) return; let list=t.photos; if(V.view==='home') list=t.photos.filter(p=>p.fav); else if(V.view==='trip'&&V.tab==='fotos'){ if(V.pf==='fav') list=t.photos.filter(p=>p.fav); else if(V.pf==='none') list=t.photos.filter(p=>!p.day); else if(V.pf!=='all') list=t.photos.filter(p=>p.day===V.pf); } else if(V.tab==='diario'){ const p=t.photos.find(x=>x.id===el.dataset.id); list=t.photos.filter(x=>x.day===(p&&p.day)); } lbOpen(t,el.dataset.id,list); },
  tkAdd:()=>tkForm(T()),
  tkOpen:el=>{ const t=T(); tkForm(t,t.tickets.find(x=>x.id===el.dataset.id)); },
  bkAdd:()=>bkForm(T()),
  bkEdit:el=>{ const t=T(); bkForm(t,t.bookings.find(x=>x.id===el.dataset.id)); },
  copy:async el=>{ try{ await navigator.clipboard.writeText(el.dataset.v); toast('✓ Copiado'); }catch(e){ toast(el.dataset.v); } },
  lnAdd:()=>lnForm(T()),
  lnEdit:el=>{ const t=T(); lnForm(t,t.links.find(x=>x.id===el.dataset.id)); },
  lnSt:el=>{ const l=T().links.find(x=>x.id===el.dataset.id); l.status=l.status==='fui'?'quiero':'fui'; save(); rerender(); },
  lnStar:(el,ev)=>{ const s=ev.target.closest('[data-s]'); if(!s) return; const l=T().links.find(x=>x.id===el.dataset.id); l.stars=l.stars===+s.dataset.s?0:+s.dataset.s; save(); el.innerHTML=starsHtml(l.stars,true); },
  lf:el=>{ V.lf=el.dataset.id; rerender(); }, ls:el=>{ V.ls=el.dataset.id; rerender(); },
  packLoad:()=>{ const t=T(); let n=0; S.packTpl.forEach(p=>{ if(!t.pack.some(x=>x.text.toLowerCase()===p.text.toLowerCase())){ t.pack.push({id:uid(),cat:p.cat,text:p.text,done:false}); n++; } }); save(); rerender(); toast(n?`✓ ${n} cosas añadidas`:'Ya tenías toda la plantilla'); },
  packReset:async()=>{ if(!await ask('¿Desmarcar todas las cosas de la maleta?','Desmarcar')) return; T().pack.forEach(p=>p.done=false); save(); rerender(); },
  packAdd:()=>{ const x=$('#pkX').value.trim(); if(!x) return; T().pack.push({id:uid(),cat:$('#pkC').value,text:x,done:false}); save(); rerender(); setTimeout(()=>$('#pkX')&&$('#pkX').focus(),50); },
  packChk:el=>{ const p=T().pack.find(x=>x.id===el.dataset.id); p.done=el.checked; save(); rerender(); },
  packDel:(el,ev)=>{ ev.preventDefault(); const t=T(); t.pack=t.pack.filter(x=>x.id!==el.dataset.id); save(); rerender(); },
  exAdd:()=>{ const a=+$('#gA').value; if(!(a>0)){ toast('Escribe el importe'); return; } T().expenses.push({id:uid(),date:$('#gD').value||today(),cat:$('#gC').value,amount:a,cur:$('#gCu').value,text:$('#gX').value.trim()}); save(); rerender(); toast('✓ Gasto añadido'); },
  exDel:async el=>{ if(!await ask('¿Borrar este gasto?','Borrar')) return; const t=T(); t.expenses=t.expenses.filter(x=>x.id!==el.dataset.id); save(); rerender(); },
  ratesUpd:()=>updateRates(),
  frHide:()=>{ V.hideTr=!V.hideTr; rerender(); },
  frRev:el=>{ if(V.hideTr) el.classList.remove('hide'); },
  say:(el,ev)=>{ ev.stopPropagation(); say(el.dataset.v,el.dataset.l); },
  frAdd:()=>{ const e=$('#frE').value.trim(), tr=$('#frT').value.trim(); if(!e||!tr){ toast('Escribe la frase y su traducción'); return; } T().phrases.push({id:uid(),es:e,tr,pr:$('#frP').value.trim()}); save(); rerender(); },
  frDel:el=>{ const t=T(); t.phrases=t.phrases.filter(x=>x.id!==el.dataset.id); save(); rerender(); },
  docChk:el=>{ const d=T().docs.find(x=>x.id===el.dataset.id); d.done=el.checked; save(); el.closest('.chk').classList.toggle('done',d.done); },
  docNa:el=>{ const d=T().docs.find(x=>x.id===el.dataset.id); d.na=!d.na; save(); rerender(); },
  docDel:el=>{ const t=T(); t.docs=t.docs.filter(x=>x.id!==el.dataset.id); save(); rerender(); },
  docAdd:()=>{ const x=$('#docX').value.trim(); if(!x) return; T().docs.push({id:uid(),name:x,done:false,exp:'',na:false}); save(); rerender(); },
  printTrip:()=>printTrip(T()),
  /* álbum */
  sbPrev:()=>{ V.page--; sbSel=null; rerender(); }, sbNext:()=>{ V.page++; sbSel=null; rerender(); },
  sbNewPage:()=>{ const t=T(); t.pages.splice(V.page+1,0,{id:uid(),bg:curPage(t).bg,els:[]}); V.page++; sbSel=null; save(); rerender(); },
  sbDelPage:async()=>{ const t=T(); const pg=curPage(t); if(pg.els.length&&!await ask('¿Borrar esta página del álbum? (Las fotos siguen en 📷 Fotos)','Borrar')) return; t.pages.splice(V.page,1); if(V.page>0) V.page--; sbSel=null; save(); rerender(); },
  sbAdd:el=>sbAddPicker(T(),el.dataset.id),
  sbEdit:()=>{ const t=T(); const e=curPage(t).els.find(x=>x.id===sbSel); if(e) sbEditForm(t,e); },
  sbDup:()=>{ const t=T(); const e=curPage(t).els.find(x=>x.id===sbSel); if(!e) return; const c=JSON.parse(JSON.stringify(e)); delete c.id; c.cx+=5; c.cy+=5; sbPush(t,c); },
  sbUp:()=>{ const t=T(), pg=curPage(t), e=pg.els.find(x=>x.id===sbSel); if(!e) return; e.z=pg.els.reduce((m,x)=>Math.max(m,x.z||1),0)+1; save(); sbRedraw(t); },
  sbDown:()=>{ const t=T(), pg=curPage(t), e=pg.els.find(x=>x.id===sbSel); if(!e) return; pg.els.forEach(x=>x.z=(x.z||1)+1); e.z=1; save(); sbRedraw(t); },
  sbStraight:()=>{ const t=T(), e=curPage(t).els.find(x=>x.id===sbSel); if(!e) return; e.r=0; save(); sbRedraw(t); },
  sbDel:()=>{ const t=T(), pg=curPage(t); pg.els=pg.els.filter(x=>x.id!==sbSel); sbSel=null; save(); sbRedraw(t); },
  sbDone:()=>{ sbSel=null; sbRedraw(T()); },
  /* mapa */
  mf:el=>{ mapFilter=el.dataset.id; rerender(); },
  mz:el=>mapZoom(+el.dataset.id),
  /* deseos */
  wAdd:()=>wishForm(), wEdit:el=>wishForm(S.wishes.find(x=>x.id===el.dataset.id)), wf:el=>{ V.wf=el.dataset.id; rerender(); },
  wDone:async el=>{ const w=S.wishes.find(x=>x.id===el.dataset.id);
    if(await ask(`¡Qué ilusión! ¿Quieres crear el viaje a «${w.place}» en tu pasaporte?`,'Crear viaje')){ tripForm(newTrip({name:w.place,countries:w.cc?[w.cc]:[],cities:w.lat!=null?[{id:uid(),name:w.place,lat:w.lat,lon:w.lon,cc:w.cc}]:[],cur:S.base}),true,w); }
    else { w.done=true; save(); rerender(); } },
  /* plantilla de maleta */
  ptAdd:()=>{ const x=$('#ptX').value.trim(); if(!x) return; S.packTpl.push({id:uid(),cat:$('#ptC').value,text:x}); save(); rerender(); setTimeout(()=>$('#ptX')&&$('#ptX').focus(),50); },
  ptDel:el=>{ S.packTpl=S.packTpl.filter(x=>x.id!==el.dataset.id); save(); rerender(); },
  /* más */
  syncPanel:()=>{ try{ window.MiAgendaSync.openPanel(); }catch(e){} },
  bkpOut:()=>backupOut(), bkpIn:()=>backupIn()
};
document.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(!el) return; if(el.tagName==='INPUT'&&el.type!=='checkbox') return; const f=ACT[el.dataset.act]; if(f) f(el,e); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if($('#lb').classList.contains('on')) lbClose(); else if($('#md').classList.contains('on')) closeModal(); }
  if($('#lb').classList.contains('on')&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){ if(e.key==='ArrowLeft') $('#lbPrev').click(); if(e.key==='ArrowRight') $('#lbNext').click(); } });

/* ---------- arranque ---------- */
(async()=>{
  await load();
  route();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
