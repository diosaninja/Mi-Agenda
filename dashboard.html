<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<script src="sync.js" data-boton="si"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mi Dashboard · Mi Agenda</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi Agenda">
<meta name="theme-color" content="#F8F4ED">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Klee+One:wght@400;600&family=Caveat:wght@500;700&display=swap">
<style>
:root{
  --ivory:#F8F4ED; --paper:#FFFDF8; --sand:#EDE5D8; --beige:#DCCDB7; --sage:#A3B19B; --sage-d:#6F8068;
  --rose:#D9B5AE; --rose-d:#B98A82; --stone:#8F8A83; --stone-l:#C9C4BC; --ink:#38332E; --ink-2:#5E5750;
  --desk:#E9E2D6; --line:rgba(56,51,46,.12); --card:rgba(255,253,248,.92); --soft:rgba(255,255,255,.6);
  --shadow:0 10px 30px rgba(60,45,30,.10),0 2px 6px rgba(60,45,30,.06);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#2b8a82;
  --t-cita:#B98A82; --t-evento:#C99A4B; --t-tarea:#6F8068; --t-nota:#8F8A83;
  --warn:#A65E55;
  --r:16px; --ui:"DM Sans",-apple-system,"Helvetica Neue",sans-serif; --display:"Cormorant Garamond","Didot",Georgia,serif;
  --jp:"Klee One","Hiragino Mincho ProN","Hiragino Sans",serif; --hand:"Caveat",cursive;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px); --safe-l:env(safe-area-inset-left,0px);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --ivory:#24211E; --paper:#2A2622; --sand:#35302B; --beige:#4A423A; --sage:#7F927A; --sage-d:#9DB596;
  --rose:#8E6A63; --rose-d:#D9A79E; --stone:#A39C93; --stone-l:#625B53; --ink:#EFE8DE; --ink-2:#CFC6BA;
  --desk:#1C1A17; --line:rgba(239,232,222,.13); --card:rgba(42,38,34,.95); --soft:rgba(255,255,255,.05);
  --shadow:0 10px 30px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.25);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#3fa89e;
  --t-cita:#D9A79E; --t-evento:#D9B26A; --t-tarea:#9DB596; --t-nota:#A39C93; --warn:#E08A80;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--desk);color:var(--ink);font-family:var(--ui);font-size:15px;
  -webkit-text-size-adjust:100%;overscroll-behavior:none;touch-action:manipulation}
body{-webkit-user-select:none;user-select:none}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;font:inherit;color:inherit}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
a{color:inherit}
.hidden{display:none!important}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- estructura ---------- */
#app{display:flex;height:100%;background:radial-gradient(1200px 600px at 20% -10%,var(--ivory) 0%,var(--desk) 62%)}
#rail{width:232px;flex:none;display:flex;flex-direction:column;gap:2px;padding:calc(20px + var(--safe-t)) 14px calc(16px + var(--safe-b)) calc(14px + var(--safe-l));
  border-right:1px solid var(--line);overflow-y:auto}
.brand{font-family:var(--display);font-size:32px;font-weight:600;line-height:1;padding:0 10px 18px}
.brand small{display:block;font-family:var(--ui);font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--stone);font-weight:500;margin-top:6px}
.nav{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:12px;font-weight:500;color:var(--ink-2);text-align:left;width:100%}
.nav.on{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.nav .jp{margin-left:auto;font-family:var(--jp);font-size:13px;color:var(--stone)}
.rail-sep{height:1px;background:var(--line);margin:10px 8px}
#main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
#top{display:flex;align-items:center;gap:10px;padding:calc(16px + var(--safe-t)) 28px 8px;flex-wrap:wrap}
#top h1{font-family:var(--display);font-weight:600;font-size:34px;margin:0;line-height:1.05;margin-right:auto}
#top h1 small{display:block;font-family:var(--ui);font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--stone);font-weight:500;margin-top:4px}
#view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 28px calc(28px + var(--safe-b))}
#tabbar{display:none}

/* ---------- componentes ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:15px;font-weight:500;white-space:nowrap;text-decoration:none}
.btn:active,.nav:active,.chip:active{transform:scale(.97)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.sage{background:var(--sage-d);color:#fff;border-color:var(--sage-d)}
.btn.danger{background:var(--warn);color:#fff;border-color:var(--warn)}
.btn.small{height:34px;padding:0 13px;font-size:14px}
.btn.icon{width:42px;padding:0}
.btn.small.icon{width:34px}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;gap:16px;grid-template-columns:repeat(12,minmax(0,1fr))}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}.c3{grid-column:span 3}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 18px 16px;min-width:0}
.card h3{margin:0 0 12px;font-family:var(--display);font-size:22px;font-weight:600;display:flex;align-items:center;gap:4px 8px;flex-wrap:wrap;line-height:1.15}
.card h3 .more{margin-left:auto;text-decoration:none;white-space:nowrap;font-family:var(--ui);font-size:13px;font-weight:500;color:var(--sage-d)}
.card h3 .jp{font-family:var(--jp);font-size:14px;color:var(--stone);font-weight:400}
.muted{color:var(--stone)}
.small{font-size:13px}
.empty{color:var(--stone);font-size:14px;padding:6px 0;font-style:italic}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.sp{flex:1}
.seg{display:inline-flex;background:var(--sand);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{height:34px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:500;color:var(--ink-2)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--soft);font-size:14px}
.chip.on{background:var(--sage-d);color:#fff;border-color:var(--sage-d)}
.chip.rose.on{background:var(--rose-d);border-color:var(--rose-d)}
.bar{height:8px;border-radius:99px;background:var(--sand);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--sage-d);transition:width .4s}
a.pill{text-decoration:none}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--sand);color:var(--ink-2);white-space:nowrap}
.pill.w{background:rgba(166,94,85,.14);color:var(--warn)}
.pill.g{background:rgba(111,128,104,.16);color:var(--sage-d)}
input.f,textarea.f,select.f{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px;font-size:16px;outline:none}
textarea.f{min-height:90px;resize:vertical;line-height:1.45}
input.f:focus,textarea.f:focus,select.f:focus{border-color:var(--sage-d)}
label.l{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--stone);margin:12px 0 5px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* listas */
.list{display:flex;flex-direction:column}
.it{display:flex;align-items:flex-start;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it .tx{flex:1;min-width:0}
.it .t{font-weight:500;line-height:1.3;word-wrap:break-word}
.it .m{font-size:12.5px;color:var(--stone);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.it.done .t{text-decoration:line-through;color:var(--stone)}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--stone-l);flex:none;display:grid;place-items:center;margin-top:-1px}
.ck svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.ck.on{background:var(--sage-d);border-color:var(--sage-d)}
.ck.on svg{opacity:1}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.time{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;min-width:44px;color:var(--ink-2);padding-top:2px}
.prio1{color:#C99A4B}.prio2{color:var(--warn)}

/* inicio */
.hero{display:flex;gap:18px;align-items:stretch;flex-wrap:wrap}
.hello{font-family:var(--display);font-size:40px;font-weight:600;line-height:1.05;margin:0}
.date-jp{font-family:var(--jp);color:var(--stone);font-size:16px;margin-top:6px}
.kd{display:flex;gap:14px;align-items:center}
.kd .k{font-family:var(--jp);font-size:64px;line-height:1;width:84px;height:84px;display:grid;place-items:center;border-radius:14px;background:var(--sand)}
.prov{font-family:var(--jp);font-size:20px;line-height:1.4}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:700}
.ring b small{display:block;font-size:11px;font-weight:500;color:var(--stone);text-align:center;margin-top:-28px}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:14px;background:var(--soft);border:1px solid var(--line);text-decoration:none;font-size:13px;font-weight:500;text-align:center}
.app .e{font-size:24px;line-height:1;font-family:var(--jp)}
.habits{display:flex;flex-wrap:wrap;gap:8px}
.hab{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:4px 14px 4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--soft);font-size:14px}
.hab.on{background:rgba(111,128,104,.18);border-color:var(--sage-d)}
.hab .n{font-size:12px;color:var(--stone);font-variant-numeric:tabular-nums}
.moods{display:flex;gap:6px;flex-wrap:wrap}
.mood{width:48px;height:48px;border-radius:14px;font-size:26px;display:grid;place-items:center;border:2px solid transparent;background:var(--soft)}
.mood.on{border-color:var(--ink);background:var(--sand)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12.5px;color:var(--stone)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}

/* agenda */
.agenda-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.agenda-bar .ttl{font-family:var(--display);font-size:24px;font-weight:600;margin:0 6px}
.tl{position:relative;border-left:1px solid var(--line);margin-left:52px}
.tl .h{position:relative;height:56px;border-top:1px dashed var(--line)}
.tl .h span{position:absolute;left:-52px;top:-9px;font-size:12px;color:var(--stone);width:44px;text-align:right;font-variant-numeric:tabular-nums}
.tl .ev{position:absolute;left:8px;right:8px;border-radius:10px;padding:5px 10px;font-size:13px;overflow:hidden;background:var(--sand);border-left:4px solid var(--tc,var(--sage-d));line-height:1.25}
.tl .ev b{display:block;font-weight:600}
.tl .free{position:absolute;left:8px;right:8px;border-radius:10px;border:1.5px dashed var(--sage);color:var(--sage-d);font-size:12px;padding:4px 10px;background:rgba(163,177,155,.08)}
.tl .now{position:absolute;left:-5px;right:0;height:2px;background:var(--warn)}
.tl .now:before{content:"";position:absolute;left:-1px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--warn)}
.week{display:grid;grid-template-columns:repeat(7,minmax(118px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.wd{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:200px}
.wd.today{border-color:var(--sage-d);box-shadow:0 0 0 2px rgba(111,128,104,.25)}
.wd h4{margin:0 0 8px;font-size:13px;text-transform:capitalize;display:flex;justify-content:space-between;align-items:baseline}
.wd h4 b{font-size:20px;font-family:var(--display)}
.wi{font-size:13px;padding:6px 8px;border-radius:9px;background:var(--sand);margin-bottom:5px;border-left:3px solid var(--tc,var(--sage-d));line-height:1.25;word-wrap:break-word;text-align:left;width:100%;display:block}
.wi.done{opacity:.5;text-decoration:line-through}
.hdots{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px}
.hdots i{width:8px;height:8px;border-radius:50%;background:var(--sand);border:1px solid var(--stone-l)}
.hdots i.on{background:var(--sage-d);border-color:var(--sage-d)}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.month .wh{font-size:12px;color:var(--stone);text-align:center;padding:4px 0;font-weight:600;text-transform:uppercase}
.md{min-height:84px;border-radius:12px;padding:6px;border:1px solid var(--line);background:var(--card);text-align:left;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.md .hl{position:absolute;inset:0;background:var(--sage-d);pointer-events:none}
.md>*{position:relative}
.md .n{font-weight:600;font-size:14px}
.md.out{opacity:.35}
.md.today .n{background:var(--ink);color:var(--paper);border-radius:99px;width:26px;height:26px;display:grid;place-items:center;margin:-2px}
.md .dots{display:flex;gap:3px;flex-wrap:wrap}
.md .lbl{font-size:11px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-top:12px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.heat{display:inline-flex;gap:3px;align-items:center}
.heat i{width:14px;height:14px;border-radius:4px;background:var(--sage-d);border:1px solid var(--line)}

/* objetivos */
.goal{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--soft);margin-bottom:12px}
.goal .gt{display:flex;align-items:center;gap:10px}
.goal .gt .e{font-size:28px}
.goal .gt b{font-size:17px}
.goal.ach{border-color:var(--sage-d)}
.sub{margin:10px 0 0 4px;padding-left:12px;border-left:2px solid var(--sand)}
.sub h5{margin:10px 0 4px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--stone)}
.vision{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.vision figure{margin:0;border-radius:14px;overflow:hidden;background:var(--sand);position:relative;aspect-ratio:1}
.vision img{width:100%;height:100%;object-fit:cover;display:block}
.vision figcaption{position:absolute;left:0;right:0;bottom:0;padding:16px 10px 8px;color:#fff;font-family:var(--hand);font-size:20px;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.vision .add{display:grid;place-items:center;font-size:32px;color:var(--stone);border:2px dashed var(--stone-l);background:transparent}

/* aprender */
.kana{display:flex;gap:14px;flex-wrap:wrap}
.kana .kb{flex:1;min-width:140px}
.kana .big{font-family:var(--jp);font-size:30px}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.part{height:64px;border-radius:14px;border:1px solid var(--line);background:var(--soft);font-family:var(--jp);font-size:28px;position:relative}
.part.on{background:rgba(111,128,104,.18);border-color:var(--sage-d)}
.part.on:after{content:"✓";position:absolute;top:3px;right:7px;font-size:12px;color:var(--sage-d);font-family:var(--ui)}
.ex{font-family:var(--jp);font-size:17px;line-height:1.5}
.ex small{display:block;font-family:var(--ui);font-size:13px;color:var(--stone)}
.timer{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.timer .clock{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px;min-width:150px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.gal figure{margin:0;border-radius:12px;overflow:hidden;background:var(--sand);aspect-ratio:3/4;position:relative}
.gal img{width:100%;height:100%;object-fit:cover}
.gal figcaption{position:absolute;bottom:0;left:0;right:0;font-size:11px;padding:10px 6px 4px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.book{display:flex;gap:12px;align-items:center;padding:8px 0}
.book .cv{width:48px;height:70px;border-radius:6px;background:var(--sand) center/cover;flex:none;display:grid;place-items:center;font-size:22px}
.qopt{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin-top:10px}
.qopt button{height:54px;border-radius:12px;border:1px solid var(--line);background:var(--soft);font-family:var(--jp);font-size:24px}
.qopt button.ok{background:rgba(111,128,104,.25);border-color:var(--sage-d)}
.qopt button.ko{background:rgba(166,94,85,.2);border-color:var(--warn)}

/* diario */
.lockbox{max-width:340px;margin:30px auto;text-align:center}
.pin-dots{display:flex;gap:14px;justify-content:center;margin:18px 0}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink-2)}
.pin-dots i.on{background:var(--ink-2)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;justify-content:center}
.pad button{width:72px;height:72px;border-radius:50%;background:var(--soft);border:1px solid var(--line);font-size:26px;font-weight:500}
.prompt{font-family:var(--display);font-size:22px;font-style:italic;line-height:1.3}
.grat{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.grat span{font-family:var(--hand);font-size:24px;color:var(--rose-d);width:22px}
.jar{position:relative;width:120px;height:150px;flex:none}
.jar svg{width:100%;height:100%}
.ink{width:100%;height:340px;border:1px solid var(--line);border-radius:12px;background:var(--paper) repeating-linear-gradient(transparent 0 33px,var(--line) 33px 34px);touch-action:none;display:block}
.ago{border-left:3px solid var(--rose);padding:4px 0 4px 12px;margin:8px 0}
.emos{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

/* gráficos */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--ui);font-size:11px;fill:var(--stone)}
.chart .grid line{stroke:var(--line)}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12.5px;padding:7px 10px;border-radius:9px;line-height:1.35;box-shadow:var(--shadow);max-width:220px}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}
table.tbl th,table.tbl td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
table.tbl td.n,table.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
details.tv summary{cursor:pointer;color:var(--sage-d);font-size:13px;margin-top:10px}

/* hojas y avisos */

'use strict';
/* =========================================================
   Mi Dashboard · portada de Mi Agenda
   Datos propios: localStorage "midashboard.v1" + IndexedDB "midashboard-img" (fotos)
   Comparte con Mi Calendario: "micalendario.v1" (citas, tareas, recordatorios y hábitos)
   Lee (sin cambiar): kanji-v1, silabarios-v1, planJapones.v1, mi-estanteria
   ========================================================= */
const $=(s,el=document)=>el.querySelector(s), $$=(s,el=document)=>[...el.querySelectorAll(s)];
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromYmd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=fromYmd(s);d.setDate(d.getDate()+n);return ymd(d);};
const todayStr=()=>ymd(new Date());
const monthKey=s=>(s||todayStr()).slice(0,7);
const addMonths=(mk,n)=>{const [y,m]=mk.split('-').map(Number);const d=new Date(y,m-1+n,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;};
const mondayOf=s=>{const d=fromYmd(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return ymd(d);};
const daysBetween=(a,b)=>Math.round((fromYmd(b)-fromYmd(a))/864e5);
const newId=(p='i_')=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DIAS3=['dom','lun','mar','mié','jue','vie','sáb'];
const KDIAS=['日','月','火','水','木','金','土'];
const fmtLong=s=>{const d=fromYmd(s);return `${DIAS[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]}`;};
const fmtShort=s=>{const d=fromYmd(s);return `${d.getDate()} ${MESES[d.getMonth()].slice(0,3)}`;};
const fmtJp=s=>{const d=fromYmd(s);return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${KDIAS[d.getDay()]}）`;};
const fmtMonth=mk=>{const [y,m]=mk.split('-').map(Number);return `${MESES[m-1]} ${y}`;};
const fmtMin=m=>{m=Math.round(m);if(m<60)return m+' min';const h=Math.floor(m/60),r=m%60;return h+' h'+(r?' '+r+' min':'');};
const relDay=s=>{const n=daysBetween(todayStr(),s);if(n===0)return'Hoy';if(n===1)return'Mañana';if(n===-1)return'Ayer';return cap(fmtLong(s));};

 hoy:'<path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/><circle cx="12" cy="12" r="4"/>',

 plus:'<path d="M12 5v14M5 12h14"/>', left:'<path d="m15 5-7 7 7 7"/>', right:'<path d="m9 5 7 7-7 7"/>',

 face:'<path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><path d="M9 9.5v1M15 9.5v1M12 9.5v3.5h-1M9.5 15.5a3.5 3.5 0 0 0 5 0"/>',
 eraser:'<path d="M15.5 4.5 20 9l-9.5 9.5H6L3.5 16z"/><path d="M9 11l4.5 4.5M10.5 18.5H20"/>'
};
const ico=(n,cls='i')=>`<svg class="${cls}" viewBox="0 0 24 24">${IC[n]||''}</svg>`;
const CHECK='<svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';

/* ---------- datos del dashboard ---------- */
const DK='midashboard.v1';
const DEF=()=>({v:1,inbox:[],goals:[],reviews:{},vision:[],focus:{},journal:{},
  learn:{sessions:[],log:[],projects:[],particles:{},dailyGoal:90,readGoal:12},
  settings:{theme:'auto',name:'Diosa',pin:'',face:[],rollover:true,notif:false,portada:true},
  health:{goals:{steps:8000,sleep:8},days:{},last:0},
  timer:null,quizBest:0});
const isObj=o=>o&&typeof o==='object'&&!Array.isArray(o);
function merge(a,b){if(!isObj(b))return a;for(const k of Object.keys(b)){if(isObj(a[k])&&isObj(b[k]))merge(a[k],b[k]);else a[k]=b[k];}return a;}
let D;
function loadD(){try{D=merge(DEF(),JSON.parse(localStorage.getItem(DK)||'null')||{});}catch(e){D=DEF();}}
function saveD(){try{localStorage.setItem(DK,JSON.stringify(D));}catch(e){toast('No se pudo guardar: la memoria del navegador está llena');}}

/* ---------- datos de Mi Calendario (compartidos) ---------- */
const CK='micalendario.v1';
let C;
const ITEM_DEF={type:'tarea',title:'',date:'',allDay:true,time:'',endTime:'',location:'',category:'',priority:0,repeat:'none',until:'',reminder:'',subtasks:[],notes:'',pinned:false,done:false,doneDates:{},subDone:{},exDates:[],shared:false,doneBy:{}};
const TYPES={tarea:{label:'Tarea',emoji:'✅'},evento:{label:'Evento',emoji:'🎉'},cita:{label:'Cita',emoji:'📍'},nota:{label:'Nota',emoji:'📝'}};
const CATS=['','Personal','Trabajo','Salud','Casa','Estudio','Familia','Ocio'];
const REPEATS=[['none','No se repite'],['daily','Cada día'],['weekdays','De lunes a viernes'],['weekly','Cada semana'],['biweekly','Cada 2 semanas'],['monthly','Cada mes'],['yearly','Cada año']];
const REMIND=[['','Sin aviso'],['0','A la hora'],['10','10 min antes'],['30','30 min antes'],['60','1 hora antes'],['1440','1 día antes']];
function loadC(){
  let s=null;try{s=JSON.parse(localStorage.getItem(CK)||'null');}catch(e){}
  C=isObj(s)?s:{};
  if(!isObj(C.items))C.items={};
  const h=isObj(C.habits)?C.habits:{};
  C.habits={list:Array.isArray(h.list)?h.list.filter(x=>x&&x.id):[],checks:isObj(h.checks)?h.checks:{},counts:isObj(h.counts)?h.counts:{}};
  for(const [k,it] of Object.entries(C.items)){
    if(!isObj(it)){delete C.items[k];continue;}
    for(const [f,v] of Object.entries(ITEM_DEF))if(it[f]===undefined)it[f]=clone(v);
    it.id=k;if(!TYPES[it.type])it.type='tarea';
    if(!Array.isArray(it.subtasks))it.subtasks=[];if(!Array.isArray(it.exDates))it.exDates=[];
    if(!isObj(it.doneDates))it.doneDates={};if(!isObj(it.subDone))it.subDone={};
  }
}
function saveC(){try{localStorage.setItem(CK,JSON.stringify(C));}catch(e){toast('No se pudo guardar en el calendario');}}
function newItem(o){const now=Date.now();return Object.assign(clone(ITEM_DEF),{id:newId('i_'),date:todayStr(),created:now,updated:now},o||{});}
function putItem(it){it.updated=Date.now();it.allDay=!it.time;C.items[it.id]=it;saveC();}
const isRec=it=>it.repeat&&it.repeat!=='none';
function occursOn(it,ds){
  if(!it.date)return false;
  if(it.exDates&&it.exDates.includes(ds))return false;
  if(!isRec(it))return it.date===ds;
  if(ds<it.date)return false;
  if(it.until&&ds>it.until)return false;
  const a=fromYmd(it.date),b=fromYmd(ds);
  switch(it.repeat){
    case'daily':return true;
    case'weekdays':return b.getDay()>=1&&b.getDay()<=5;
    case'weekly':return a.getDay()===b.getDay();
    case'biweekly':return a.getDay()===b.getDay()&&Math.round((b-a)/864e5)%14===0;
    case'monthly':return a.getDate()===b.getDate();
    case'yearly':return a.getDate()===b.getDate()&&a.getMonth()===b.getMonth();
  }return false;
}
const isDone=(it,ds)=>isRec(it)?!!(it.doneDates&&it.doneDates[ds]):!!it.done;
const subKey=(it,ds)=>isRec(it)?ds:'_';
const subIsDone=(it,ds,sid)=>{const m=it.subDone&&it.subDone[subKey(it,ds)];return!!(m&&m[sid]);};
const ORDER={cita:0,evento:1,tarea:2,nota:3};
function cmpItems(a,b){
  const ta=a.time||'',tb=b.time||'';
  if(ta!==tb){if(!ta)return-1;if(!tb)return 1;return ta<tb?-1:1;}
  return(ORDER[a.type]-ORDER[b.type])||((b.priority||0)-(a.priority||0))||a.title.localeCompare(b.title,'es');
}
function itemsOn(ds,type){return Object.values(C.items).filter(it=>(!type||(Array.isArray(type)?type.includes(it.type):it.type===type))&&occursOn(it,ds)).sort(cmpItems);}
function toggleDone(id,ds){
  const it=C.items[id];if(!it)return;
  if(isRec(it)){if(it.doneDates[ds])delete it.doneDates[ds];else it.doneDates[ds]=true;}
  else{it.done=!it.done;if(it.done)it.doneAt=todayStr();else delete it.doneAt;}
  putItem(it);
  if(isDone(it,ds))celebrate();
}
function toggleSub(id,ds,sid){
  const it=C.items[id];if(!it)return;const k=subKey(it,ds);
  it.subDone[k]=Object.assign({},it.subDone[k]);
  if(it.subDone[k][sid])delete it.subDone[k][sid];else it.subDone[k][sid]=true;
  const all=it.subtasks.length&&it.subtasks.every(s=>it.subDone[k][s.id]);
  if(all&&!isDone(it,ds)){if(isRec(it))it.doneDates[ds]=true;else{it.done=true;it.doneAt=todayStr();}toast('Checklist completo ✓');}
  putItem(it);
}
const typeColor=t=>`var(--t-${t})`;
const startMin=it=>{if(!it.time)return null;const [h,m]=it.time.split(':').map(Number);return h*60+(m||0);};
const endMin=it=>{const s=startMin(it);if(s==null)return null;if(it.endTime){const [h,m]=it.endTime.split(':').map(Number);const e=h*60+(m||0);if(e>s)return e;}return s+60;};

/* pasar tareas pendientes al día siguiente */
function rollover(){
  if(!D.settings.rollover)return;
  const t=todayStr();let n=0;
  for(const it of Object.values(C.items)){
    if(it.type==='tarea'&&!isRec(it)&&it.date&&it.date<t&&!it.done){
      it.rolled=(it.rolled||0)+daysBetween(it.date,t);it.date=t;it.updated=Date.now();n++;
    }
  }
  if(n){saveC();setTimeout(()=>toast(`↪ ${n} ${n===1?'tarea pendiente pasada':'tareas pendientes pasadas'} a hoy`),600);}
}

/* ---------- hábitos (los mismos de Mi Calendario) ---------- */
const hGoal=h=>Math.max(1,+h.goal||1);
function hCount(h,ds){const c=C.habits.counts[ds];if(c&&c[h.id]!=null)return +c[h.id]||0;return(C.habits.checks[ds]||[]).includes(h.id)?hGoal(h):0;}
function setCount(h,ds,n){
  n=clamp(n,0,99);const H=C.habits;
  const arr=(H.checks[ds]||[]).filter(x=>x!==h.id);if(arr.length)H.checks[ds]=arr;else delete H.checks[ds];
  H.counts[ds]=Object.assign({},H.counts[ds]);if(n)H.counts[ds][h.id]=n;else delete H.counts[ds][h.id];
  if(!Object.keys(H.counts[ds]).length)delete H.counts[ds];
}
const hDone=(h,ds)=>hCount(h,ds)>=hGoal(h);
function hStreak(h){let n=0,ds=todayStr();if(!hDone(h,ds))ds=addDays(ds,-1);while(hDone(h,ds)&&n<2000){n++;ds=addDays(ds,-1);}return n;}
function hBest(h){let best=0,cur=0;for(let i=400;i>=0;i--){const ds=addDays(todayStr(),-i);if(hDone(h,ds)){cur++;best=Math.max(best,cur);}else cur=0;}return best;}
function tapHabit(hid,ds){
  const h=C.habits.list.find(x=>x.id===hid);if(!h)return;
  const g=hGoal(h),c=hCount(h,ds);const n=g===1?(c?0:1):(c>=g?0:c+1);
  setCount(h,ds,n);saveC();
  if(n>=g&&c<g){toast(`${h.emoji||'⭐'} ¡${esc(h.name)} cumplido!`);celebrate();}
}

/* ---------- datos de otras apps (solo lectura) ---------- */
function readJSON(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}}
function streakDays(days){const set=new Set(days||[]);let ds=todayStr();if(!set.has(ds))ds=addDays(ds,-1);let n=0;while(set.has(ds)&&n<5000){n++;ds=addDays(ds,-1);}return n;}
function kanjiInfo(){
  const S=readJSON('kanji-v1');if(!S)return null;const srs=S.srs||{};
  const ks=Object.keys(srs);
  return{started:ks.length,dom:ks.filter(k=>srs[k]&&srs[k].iv>=21).length,streak:streakDays(S.days),today:(S.days||[]).includes(todayStr()),
    month:((S.month||{})[monthKey()]||[]).length};
}
function docsCard(){

  let w=im.naturalWidth,h=im.naturalHeight;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);

const SECS=[['hoy','Hoy','今日'],['agenda','Agenda','予定'],['tareas','Tareas','仕事'],['objetivos','Objetivos','目標'],['aprender','Aprendizaje','学習'],['diario','Diario','日記'],['stats','Estadísticas','統計'],['habitos','Hábitos','習慣'],['ajustes','Ajustes','設定']];
const TABS=[['hoy','Hoy'],['agenda','Agenda'],['tareas','Tareas'],['aprender','Aprender'],['mas','Más']];
const ui={sec:'hoy',agView:'dia',agDate:todayStr(),taskTab:'hoy',learnTab:'resumen',jDate:todayStr(),statRange:'semana',unlocked:false,pin:'',part:null,quiz:null,goalOpen:{},ink:false,today:todayStr()};
function go(sec){if(sec!=='diario')ui.unlocked=false;ui.sec=sec;try{history.replaceState(null,'','#'+sec);}catch(e){}render();$('#view').scrollTop=0;}
function renderNav(){
  $('#railNav').innerHTML=SECS.map(([k,n,j])=>`<button class="nav${ui.sec===k?' on':''}" data-a="go" data-s="${k}">${ico(k)}${n}<span class="jp">${j}</span></button>`).join('');
  const inMas=!['hoy','agenda','tareas','aprender'].includes(ui.sec);
  $('#tabbar').innerHTML=TABS.map(([k,n])=>`<button class="${(ui.sec===k||(k==='mas'&&inMas))?'on':''}" data-a="${k==='mas'?'mas':'go'}" data-s="${k}">${ico(k)}${n}</button>`).join('');
}
const VIEWS={};const AFTER={};
function render(){
  if(ui.today!==todayStr()){ui.today=todayStr();loadC();rollover();}
  renderNav();
  const s=SECS.find(x=>x[0]===ui.sec)||SECS[0];
  $('#ttl').innerHTML=ui.sec==='hoy'?`Mi Dashboard<small>${esc(fmtLong(todayStr()))}</small>`:`${s[1]}<small>${s[2]}</small>`;
  $('#topActs').innerHTML=topActs();
  $('#view').innerHTML=(VIEWS[ui.sec]||VIEWS.hoy)();
  hydrateImgs();
  if(AFTER[ui.sec])AFTER[ui.sec]();
}
function topActs(){
  const t=D.timer?`<button class="btn small" data-a="go" data-s="aprender" title="Cronómetro en marcha">${ico(D.timer.run?'play':'pause')}<span data-clock>${fmtClock(timerMs())}</span></button>`:'';
  if(ui.sec==='hoy'||ui.sec==='agenda'||ui.sec==='tareas')return t+`<button class="btn small primary" data-a="newItem">${ico('plus')}Añadir</button>`;
  return t;
}

/* ---------- HOY ---------- */
function greeting(){const h=new Date().getHours();return h<6?'Buenas noches':h<13?'Buenos días':h<21?'Buenas tardes':'Buenas noches';}
function dayProgress(ds){
  const ts=itemsOn(ds,'tarea');const hs=C.habits.list;
  const total=ts.length+hs.length;const done=ts.filter(t=>isDone(t,ds)).length+hs.filter(h=>hDone(h,ds)).length;
  return{total,done,pct:total?Math.round(done/total*100):0};
}
function ringSVG(pct,size=96,stroke=9,color='var(--sage-d)'){
  const r=(size-stroke)/2,c=2*Math.PI*r;
  return`<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--sand)" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-clamp(pct,0,100)/100)}"/></svg>`;
}
function itemRow(it,ds,opt={}){
  const done=isDone(it,ds);const subs=it.subtasks||[];const sd=subs.filter(s=>subIsDone(it,ds,s.id)).length;
  const m=[];
  if(it.time)m.push(`<span>${esc(it.time)}${it.endTime?'–'+esc(it.endTime):''}</span>`);
  if(opt.date)m.push(`<span>${esc(relDay(ds))}</span>`);
  if(it.type!=='tarea')m.push(`<span>${TYPES[it.type].emoji} ${TYPES[it.type].label}</span>`);
  if(it.priority>0)m.push(`<span class="prio${it.priority}">${it.priority>1?'‼ Urgente':'! Importante'}</span>`);
  if(it.category)m.push(`<span class="pill">${esc(it.category)}</span>`);
  if(subs.length)m.push(`<span>☑ ${sd}/${subs.length}</span>`);
  if(isRec(it))m.push(`<span title="Se repite">🔁</span>`);
  if(it.reminder!=='')m.push(`<span title="Con aviso">🔔</span>`);
  if(it.rolled&&!done)m.push(`<span class="pill w">↪ ${it.rolled} ${it.rolled===1?'día':'días'} pasándose</span>`);
  if(it.location)m.push(`<span>📍 ${esc(it.location)}</span>`);
  const ck=it.type==='nota'?`<span class="dot" style="background:${typeColor(it.type)};margin:8px"></span>`:`<button class="ck${done?' on':''}" data-a="tog" data-id="${it.id}" data-d="${ds}" aria-label="Hecho">${CHECK}</button>`;
  const subHTML=opt.subs&&subs.length?`<div style="margin-top:6px">${subs.map(s=>`<button class="row small" style="padding:3px 0" data-a="sub" data-id="${it.id}" data-d="${ds}" data-sid="${s.id}"><span class="ck${subIsDone(it,ds,s.id)?' on':''}" style="width:20px;height:20px">${CHECK}</span><span${subIsDone(it,ds,s.id)?' style="text-decoration:line-through;color:var(--stone)"':''}>${esc(s.text)}</span></button>`).join('')}</div>`:'';
  return`<div class="it${done?' done':''}">${ck}<div class="tx"><button class="t" style="text-align:left" data-a="edit" data-id="${it.id}" data-d="${ds}">${esc(it.title||'(sin título)')}</button>${m.length?`<div class="m">${m.join('')}</div>`:''}${subHTML}</div></div>`;
}
function habitChips(ds){
  const hs=C.habits.list;
  if(!hs.length)return`<p class="empty">Aún no tienes hábitos. <button class="btn small" data-a="go" data-s="habitos">${ico('plus')}Crear hábitos</button></p>`;
  return`<div class="habits">${hs.map(h=>{const c=hCount(h,ds),g=hGoal(h),on=c>=g;const st=hStreak(h);
    return`<button class="hab${on?' on':''}" data-a="hab" data-id="${h.id}" data-d="${ds}"><span>${esc(h.emoji||'⭐')}</span>${esc(h.name)}${g>1?` <span class="n">${c}/${g}${h.unit?' '+esc(h.unit):''}</span>`:''}${st>1?` <span class="n">🔥${st}</span>`:''}</button>`;}).join('')}</div>`;
}
function freeSlots(ds,from=8*60,to=22*60){
  const ev=itemsOn(ds,['cita','evento','tarea']).filter(i=>i.time).map(i=>[startMin(i),endMin(i)]).sort((a,b)=>a[0]-b[0]);
  const out=[];let cur=from;
  if(ds===todayStr()){const n=new Date();cur=Math.max(from,Math.ceil((n.getHours()*60+n.getMinutes())/15)*15);}
  for(const [s,e] of ev){if(s-cur>=60)out.push([cur,s]);cur=Math.max(cur,e);}
  if(to-cur>=60)out.push([cur,to]);return out;
}
const hm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
VIEWS.hoy=()=>{
  const t=todayStr();const pr=dayProgress(t);
  const kd=KDD[dayIndex(t,KDD.length)];const pv=PROV[dayIndex(t,PROV.length)];
  const citas=itemsOn(t,['cita','evento','nota']);
  const tareas=itemsOn(t,'tarea').sort((a,b)=>(isDone(a,t)-isDone(b,t))||((b.priority||0)-(a.priority||0))||((b.rolled||0)-(a.rolled||0)));
  const top=tareas.filter(x=>!isDone(x,t)).slice(0,3);const pend=tareas.filter(x=>!isDone(x,t)).length;
  const rem=remindersUpcoming(1).filter(r=>r.ds===t);
  const mn=minutesOn(t);const goal=D.learn.dailyGoal||90;
  const pj=planDay(t),ki=kanjiInfo(),ka=kanaInfo(),pa=patoInfo();
  const j=D.journal[t]||{};
  const free=freeSlots(t);
  const firstName=esc(D.settings.name||'');
  return`<div class="grid">
  <section class="card c8"><div class="hero"><div style="flex:1;min-width:220px">
    <p class="hello">${greeting()}${firstName?', '+firstName:''}</p>
    <div class="date-jp">${fmtJp(t)}</div>
    <p class="muted" style="margin:12px 0 0">${pr.total?`Llevas <b style="color:var(--ink)">${pr.done} de ${pr.total}</b> entre tareas y hábitos.`:'Hoy no tienes tareas ni hábitos marcados.'}${D.inbox.length?` · <button data-a="taskTab" data-t="bandeja" style="color:var(--sage-d);font-weight:600">${D.inbox.length} en la bandeja</button>`:''}</p>
    <div class="bar" style="margin-top:10px"><i style="width:${pr.pct}%"></i></div>
  </div><div class="ring">${ringSVG(pr.pct)}<b>${pr.pct}%</b></div></div></section>
  <section class="card c4"><h3>Kanji del día <span class="jp">今日の漢字</span><a class="more" href="kanji.html">Practicar ›</a></h3>
    <div class="kd"><div class="k">${kd[0]}</div><div><div style="font-weight:600;font-size:17px">${esc(kd[2])}</div><div class="muted" style="font-family:var(--jp);margin-top:4px">${esc(kd[1])}</div></div></div></section>

  <section class="card c6"><h3>Agenda de hoy<button class="more" data-a="agendaDay" data-d="${t}">Ver día ›</button></h3>
    ${citas.length?`<div class="list">${citas.map(i=>itemRow(i,t)).join('')}</div>`:'<p class="empty">Sin citas ni eventos hoy.</p>'}
    ${free.length?`<p class="small muted" style="margin:10px 0 0">🕊️ Tiempo libre: ${free.slice(0,3).map(([a,b])=>`${hm(a)}–${hm(b)}`).join(' · ')}</p>`:''}
  </section>
  <section class="card c6"><h3>Lo importante <span class="jp">大事</span><button class="more" data-a="taskTab" data-t="hoy">Todas (${pend}) ›</button></h3>
    ${top.length?`<div class="list">${top.map(i=>itemRow(i,t)).join('')}</div>`:`<p class="empty">${tareas.length?'¡Todo hecho por hoy! 🎉':'No hay tareas para hoy.'}</p>`}
    <form class="row" data-f="quick" style="margin-top:10px"><input class="f" name="t" placeholder="Nueva tarea para hoy…" autocomplete="off"><button class="btn icon sage" aria-label="Añadir">${ico('plus')}</button></form>
  </section>

  ${docsCard()}
  <section class="card c6"><h3>Hábitos <span class="jp">習慣</span><button class="more" data-a="go" data-s="habitos">Gestionar ›</button></h3>${habitChips(t)}</section>
  <section class="card c6"><h3>Aprendizaje de hoy<button class="more" data-a="go" data-s="aprender">Abrir ›</button></h3>
    <div class="row"><b style="font-size:24px">${fmtMin(mn.total)}</b><span class="muted">de ${fmtMin(goal)}</span><span class="sp"></span>${timerMini()}</div>
    <div class="bar" style="margin:8px 0 12px"><i style="width:${clamp(mn.total/goal*100,0,100)}%"></i></div>
    <div class="row wrap small" style="gap:6px">
      ${pj?`<a class="pill${pj.pct===100?' g':''}" href="japones.html">日 Plan ${pj.rest?'(descanso) ':''}${pj.pct}%</a>`:''}<a class="pill" href="libreta-japones.html">練 Lección de hoy</a>
      ${ki?`<a class="pill${ki.today?' g':''}" href="kanji.html">漢 🔥${ki.streak} · ${ki.started} kanji</a>`:''}
      ${ka?`<a class="pill${ka.today?' g':''}" href="silabarios.html">あ 🔥${ka.streak} · ${ka.h}/46 · ${ka.k}/46</a>`:''}
      ${pa?`<a class="pill${pa.today?' g':''}" href="patologias.html#repaso">🩺 ${pa.due?pa.due+' por repasar':'repaso al día'}${pa.streak?' · 🔥'+pa.streak:''}</a>`:''}
      ${(()=>{const lt=letteringInfo();return lt?`<a class="pill${lt.today?' g':''}" href="lettering.html" title="Lettering: reto del día">🖌️ ${lt.retoDone?'Reto ✓':'Reto'+(lt.reto?': '+esc(lt.reto):' pendiente')} · 🔥${lt.retoStreak}</a>`:'';})()}
      <span class="pill">✒️ ${CALI[dayIndex(t,CALI.length)]}</span>
    </div></section>

  ${healthCard()}
  <section class="card c6"><h3>Recordatorios <span class="jp">お知らせ</span><button class="more" data-a="taskTab" data-t="avisos">Ver ›</button></h3>
    ${rem.length?`<div class="list">${rem.map(r=>itemRow(r.it,r.ds)).join('')}</div>`:'<p class="empty">Ningún recordatorio para hoy.</p>'}</section>
  <section class="card c6"><h3>¿Cómo te sientes? <span class="jp">気分</span><button class="more" data-a="go" data-s="diario">Diario ›</button></h3>
    <div class="moods">${MOODS.map(([v,e,l])=>`<button class="mood${j.mood===v?' on':''}" data-a="mood" data-v="${v}" data-d="${t}" title="${l}">${e}</button>`).join('')}</div>
    <p class="small muted" style="margin:10px 0 0">${(j.grat||[]).filter(Boolean).length?`🙏 ${(j.grat||[]).filter(Boolean).length} agradecimientos hoy`:'Apunta 3 cosas por las que estás agradecida.'}</p></section>

  <section class="card c12"><div class="row wrap" style="gap:14px"><span style="font-size:26px">🎋</span><div style="flex:1;min-width:200px"><div class="prov">${pv[0]}</div><div class="small muted" style="font-family:var(--jp)">${pv[1]}</div><div style="margin-top:4px">${esc(pv[2])}</div></div></div></section>
  <section class="card c12"><h3>Mis apps</h3><div class="apps">${APPS.map(([h,e,n])=>`<a class="app" href="${h}"><span class="e">${e}</span>${n}</a>`).join('')}</div></section>
  </div>`;
};
function timerMini(){
  if(D.timer)return`<button class="btn small" data-a="tStop">${ico('stop')}<span data-clock>${fmtClock(timerMs())}</span></button>`;
  return`<button class="btn small sage" data-a="tStart" data-area="japones">${ico('play')}Cronómetro</button>`;
}

/* ---------- AGENDA ---------- */
VIEWS.agenda=()=>{
  const v=ui.agView,d=ui.agDate;let ttl='';
  if(v==='dia')ttl=fmtLong(d);
  else if(v==='semana'){const m=mondayOf(d);ttl=`${fmtShort(m)} – ${fmtShort(addDays(m,6))}`;}
  else ttl=fmtMonth(monthKey(d));
  return`<div class="agenda-bar"><div class="seg">${[['dia','Día'],['semana','Semana'],['mes','Mes']].map(([k,n])=>`<button class="${v===k?'on':''}" data-a="agView" data-v="${k}">${n}</button>`).join('')}</div>
  <button class="btn small icon" data-a="agMove" data-n="-1" aria-label="Anterior">${ico('left')}</button><button class="btn small" data-a="agToday">Hoy</button><button class="btn small icon" data-a="agMove" data-n="1" aria-label="Siguiente">${ico('right')}</button>
  <span class="ttl">${esc(cap(ttl))}</span></div><div id="agBody">${v==='dia'?agDay(d):v==='semana'?agWeek(d):agMonth(d)}</div>`;
};
function agDay(ds){
  const H0=6,H1=24,PX=56;
  const all=itemsOn(ds);const timed=all.filter(i=>i.time&&i.type!=='nota'),untimed=all.filter(i=>!i.time||i.type==='nota');
  const lanes=[];const pos=timed.map(it=>{const s=startMin(it),e=endMin(it);let L=lanes.findIndex(end=>end<=s);if(L<0){L=lanes.length;lanes.push(e);}else lanes[L]=e;return{it,s,e,L};});
  const nL=Math.max(1,lanes.length);
  let h='';for(let x=H0;x<H1;x++)h+=`<div class="h"><span>${pad(x)}:00</span></div>`;
  const evs=pos.map(({it,s,e,L})=>{const top=Math.max(0,(s-H0*60)/60*PX),ht=Math.max(28,(e-s)/60*PX-3);const w=100/nL;
    return`<button class="ev" style="top:${top}px;height:${ht}px;left:calc(8px + ${L*w}%);right:auto;width:calc(${w}% - 12px);--tc:${typeColor(it.type)};text-align:left${isDone(it,ds)?';opacity:.55':''}" data-a="edit" data-id="${it.id}" data-d="${ds}"><b>${esc(it.title||'(sin título)')}</b>${esc(it.time)}${it.endTime?'–'+esc(it.endTime):''}${it.location?' · '+esc(it.location):''}</button>`;}).join('');
  const fr=freeSlots(ds).map(([a,b])=>`<div class="free" style="top:${(a-H0*60)/60*PX+2}px;height:${(b-a)/60*PX-4}px;${nL>1||timed.length?'left:auto;width:120px':''}">Libre ${hm(a)}–${hm(b)}</div>`).join('');
  let now='';if(ds===todayStr()){const n=new Date(),m=n.getHours()*60+n.getMinutes();if(m>=H0*60)now=`<div class="now" style="top:${(m-H0*60)/60*PX}px"></div>`;}
  const hb=C.habits.list.length?`<section class="card" style="margin-bottom:14px"><h3>Hábitos del día</h3>${habitChips(ds)}</section>`:'';
  return`<div class="grid"><div class="c8"><section class="card"><div class="tl" style="height:${(H1-H0)*PX}px">${h}${fr}${evs}${now}</div></section></div>
  <div class="c4"><section class="card" style="margin-bottom:14px"><h3>Todo el día</h3>${untimed.length?`<div class="list">${untimed.map(i=>itemRow(i,ds,{subs:true})).join('')}</div>`:'<p class="empty">Nada sin hora.</p>'}
  <button class="btn small" style="margin-top:10px" data-a="newItem" data-d="${ds}">${ico('plus')}Añadir a este día</button></section>${hb}
  ${timed.length?`<section class="card"><h3>Con hora</h3><div class="list">${timed.map(i=>itemRow(i,ds,{subs:true})).join('')}</div></section>`:''}</div></div>`;
}
function agWeek(ds){
  const m=mondayOf(ds);const t=todayStr();
  const days=[...Array(7)].map((_,i)=>addDays(m,i));
  const cols=days.map(d=>{const its=itemsOn(d);const dd=fromYmd(d);
    return`<div class="wd${d===t?' today':''}"><h4><button data-a="agendaDay" data-d="${d}">${DIAS3[dd.getDay()]} <b>${dd.getDate()}</b></button><span class="muted" style="font-family:var(--jp)">${KDIAS[dd.getDay()]}</span></h4>
    ${its.map(it=>`<button class="wi${isDone(it,d)?' done':''}" style="--tc:${typeColor(it.type)}" data-a="edit" data-id="${it.id}" data-d="${d}">${it.time?`<b>${esc(it.time)}</b> `:''}${esc(it.title||'(sin título)')}</button>`).join('')||'<p class="empty small">—</p>'}
    ${C.habits.list.length?`<div class="hdots" title="Hábitos">${C.habits.list.map(h=>`<i class="${hDone(h,d)?'on':''}" title="${esc(h.name)}"></i>`).join('')}</div>`:''}
    <button class="btn small icon" style="margin-top:8px" data-a="newItem" data-d="${d}" aria-label="Añadir">${ico('plus')}</button></div>`;}).join('');
  return`<section class="card" style="margin-bottom:14px"><h3>🎯 Foco de la semana</h3><input class="f" data-in="focus" data-k="${m}" value="${esc(D.focus[m]||'')}" placeholder="¿En qué te quieres centrar esta semana?"></section>
  <div class="week">${cols}</div>${legendTypes()}`;
}
function legendTypes(){return`<div class="legend">${Object.entries(TYPES).map(([k,v])=>`<span><i class="dot" style="background:${typeColor(k)}"></i>${v.label}</span>`).join('')}</div>`;}
function activity(ds){
  let n=itemsOn(ds,'tarea').filter(i=>isDone(i,ds)).length+C.habits.list.filter(h=>hDone(h,ds)).length;
  n+=minutesOn(ds).total/30;if(D.journal[ds]&&(D.journal[ds].text||D.journal[ds].mood))n+=1;return n;
}
function agMonth(ds){
  const mk=monthKey(ds);const first=fromYmd(mk+'-01');const start=addDays(mk+'-01',-((first.getDay()+6)%7));
  const days=[...Array(42)].map((_,i)=>addDays(start,i));const t=todayStr();
  const acts=days.map(d=>d.slice(0,7)===mk&&d<=t?activity(d):0);const mx=Math.max(1,...acts);
  const cells=days.map((d,i)=>{const its=itemsOn(d);const types=[...new Set(its.map(x=>x.type))];const a=acts[i]/mx;
    return`<button class="md${d.slice(0,7)!==mk?' out':''}${d===t?' today':''}" data-a="agendaDay" data-d="${d}">${a>0?`<span class="hl" style="opacity:${(.05+a*.28).toFixed(2)}"></span>`:''}<span class="n">${fromYmd(d).getDate()}</span>
    <span class="dots">${types.map(x=>`<i class="dot" style="background:${typeColor(x)}"></i>`).join('')}</span>${its.slice(0,2).map(x=>`<span class="lbl">${esc(x.title)}</span>`).join('')}</button>`;}).join('');
  return`<section class="card"><div class="month">${['lun','mar','mié','jue','vie','sáb','dom'].map(x=>`<div class="wh">${x}</div>`).join('')}${cells}</div>
  ${legendTypes().replace('</div>',`<span class="sp"></span><span>Actividad: menos</span><span class="heat">${[.08,.15,.24,.33].map(o=>`<i style="opacity:${o}"></i>`).join('')}</span><span>más</span></div>`)}</section>`;
}

/* ---------- TAREAS ---------- */
function remindersUpcoming(days=14){
  const out=[];const t=todayStr();
  for(let i=0;i<days;i++){const ds=addDays(t,i);for(const it of Object.values(C.items))if(it.reminder!==''&&it.reminder!=null&&occursOn(it,ds))out.push({it,ds});}
  return out.sort((a,b)=>a.ds<b.ds?-1:a.ds>b.ds?1:cmpItems(a.it,b.it));
}
VIEWS.tareas=()=>{
  const tab=ui.taskTab,t=todayStr();
  const segs=[['hoy','Hoy'],['proximas','Próximas'],['bandeja',`Bandeja${D.inbox.length?' ('+D.inbox.length+')':''}`],['avisos','Recordatorios'],['hechas','Hechas']];
  let body='';
  if(tab==='hoy'){
    const ts=itemsOn(t,'tarea');const pend=ts.filter(i=>!isDone(i,t)),done=ts.filter(i=>isDone(i,t));
    const late=D.settings.rollover?[]:Object.values(C.items).filter(i=>i.type==='tarea'&&!isRec(i)&&i.date&&i.date<t&&!i.done).sort((a,b)=>a.date<b.date?-1:1);

    ${done.length?`<h3 style="margin-top:16px;font-size:18px">Hechas hoy (${done.length})</h3><div class="list">${done.map(i=>itemRow(i,t)).join('')}</div>`:''}</section>`;
  }else if(tab==='proximas'){

  }else if(tab==='bandeja'){
    body=`<section class="card"><h3>${ico('inbox')} Bandeja de entrada</h3><p class="small muted" style="margin-top:-6px">Apunta aquí lo que se te ocurra y ordénalo después.</p>
    <form class="row" data-f="inbox" style="margin-bottom:8px"><input class="f" name="t" placeholder="Apuntar algo rápido…" autocomplete="off"><button class="btn icon sage" aria-label="Añadir">${ico('plus')}</button></form>
    ${D.inbox.length?`<div class="list">${D.inbox.map(x=>`<div class="it"><span style="font-size:18px">📥</span><div class="tx"><div class="t">${esc(x.t)}</div><div class="m">${fmtShort(x.d||t)}</div></div>
      <div class="row" style="gap:6px"><button class="btn small" data-a="inTo" data-id="${x.id}" data-n="0">Hoy</button><button class="btn small" data-a="inTo" data-id="${x.id}" data-n="1">Mañana</button><button class="btn small icon" data-a="inEdit" data-id="${x.id}" aria-label="Programar">${ico('agenda')}</button><button class="btn small icon" data-a="inDel" data-id="${x.id}" aria-label="Borrar">${ico('trash')}</button></div></div>`).join('')}</div>`:'<p class="empty">La bandeja está vacía.</p>'}</section>`;
  }else if(tab==='avisos'){
    const r=remindersUpcoming(14);const perm=('Notification' in window)?Notification.permission:'na';
    body=`<section class="card"><div class="row wrap" style="margin-bottom:8px"><h3 style="margin:0">${ico('bell')} Próximos 14 días</h3><span class="sp"></span><button class="btn small primary" data-a="newRem">${ico('plus')}Nuevo recordatorio</button></div>
    ${perm!=='granted'&&perm!=='na'?`<p class="small" style="background:var(--sand);padding:10px 12px;border-radius:12px">🔔 Activa los avisos para que el iPhone o el iPad te avise. <button class="btn small" data-a="notif">Activar avisos</button></p>`:''}
    ${r.length?`<div class="list">${r.map(x=>itemRow(x.it,x.ds,{date:true})).join('')}</div>`:'<p class="empty">No hay recordatorios. Crea uno o añade un aviso a cualquier tarea o cita.</p>'}</section>`;
  }else{
    const done=Object.values(C.items).filter(i=>i.type==='tarea'&&!isRec(i)&&i.done).sort((a,b)=>(b.updated||0)-(a.updated||0)).slice(0,60);
    body=`<section class="card"><h3>Completadas</h3>${done.length?`<div class="list">${done.map(i=>itemRow(i,i.date)).join('')}</div>`:'<p class="empty">Aún no hay tareas completadas.</p>'}</section>`;
  }
  return`<div class="row wrap" style="margin-bottom:14px"><div class="seg">${segs.map(([k,n])=>`<button class="${tab===k?'on':''}" data-a="taskTab" data-t="${k}">${n}</button>`).join('')}</div></div>
  ${tab!=='bandeja'?`<form class="row" data-f="quick" style="margin-bottom:14px"><input class="f" name="t" placeholder="Añadir tarea rápida para hoy…" autocomplete="off"><button class="btn icon sage" aria-label="Añadir">${ico('plus')}</button></form>`:''}${body}`;
};

function editItem(id,ds,preset){
  const ex=id&&C.items[id];const it=ex?clone(C.items[id]):newItem(Object.assign({date:ds||todayStr()},preset||{}));
  const sub=it.subtasks.map(s=>`<div class="row" style="margin-bottom:6px"><input class="f" data-sub="${s.id}" value="${esc(s.text)}"><button type="button" class="btn small icon" data-a="rmSub" aria-label="Quitar">${ico('trash')}</button></div>`).join('');
  const GEN={tarea:'Nueva tarea',evento:'Nuevo evento',cita:'Nueva cita',nota:'Nueva nota'};
  openSheet(`<h2>${ex?'Editar '+TYPES[it.type].label.toLowerCase():GEN[it.type]}</h2>
  <form id="itForm">
    <div class="seg" style="margin:6px 0 4px">${Object.entries(TYPES).map(([k,v])=>`<button type="button" class="${it.type===k?'on':''}" data-type="${k}">${v.emoji} ${v.label}</button>`).join('')}</div>
    <label class="l">Título</label><input class="f" name="title" value="${esc(it.title)}" required autocomplete="off">
    <div class="three"><div><label class="l">Fecha</label><input class="f" type="date" name="date" value="${esc(it.date)}"></div>
      <div><label class="l">Hora</label><input class="f" type="time" name="time" value="${esc(it.time)}"></div>
      <div><label class="l">Hasta</label><input class="f" type="time" name="endTime" value="${esc(it.endTime)}"></div></div>
    <div class="two"><div><label class="l">Prioridad</label><select class="f" name="priority">${opts([['0','Normal'],['1','! Importante'],['2','‼ Urgente']],it.priority)}</select></div>
      <div><label class="l">Categoría</label><select class="f" name="category">${opts(CATS.map(c=>[c,c||'Sin categoría']),it.category)}</select></div></div>
    <div class="two"><div><label class="l">Repetir</label><select class="f" name="repeat">${opts(REPEATS,it.repeat)}</select></div>
      <div><label class="l">Aviso</label><select class="f" name="reminder">${opts(REMIND,it.reminder)}</select></div></div>
    <label class="l">Lugar</label><input class="f" name="location" value="${esc(it.location)}" autocomplete="off">
    <label class="l">Checklist</label><div id="subs">${sub}</div><div class="row"><input class="f" id="newSub" placeholder="Añadir paso…" autocomplete="off"><button type="button" class="btn small icon" id="addSub" aria-label="Añadir paso">${ico('plus')}</button></div>
    <label class="l">Notas</label><textarea class="f" name="notes">${esc(it.notes)}</textarea>
    <div class="acts">${ex?`<button type="button" class="btn danger" id="itDel">${ico('trash')}Borrar</button><span class="sp"></span>`:''}<button type="button" class="btn" data-a="close">Cancelar</button><button class="btn primary">Guardar</button></div>
  </form>`,s=>{
    let type=it.type;
    $$('[data-type]',s).forEach(b=>b.onclick=()=>{type=b.dataset.type;$$('[data-type]',s).forEach(x=>x.classList.toggle('on',x===b));});
    const addSub=()=>{const v=$('#newSub',s).value.trim();if(!v)return;const d=document.createElement('div');d.className='row';d.style.marginBottom='6px';d.innerHTML=`<input class="f" data-sub="${newId('s_')}" value="${esc(v)}"><button type="button" class="btn small icon" data-a="rmSub" aria-label="Quitar">${ico('trash')}</button>`;$('#subs',s).appendChild(d);$('#newSub',s).value='';};
    $('#addSub',s).onclick=addSub;$('#newSub',s).onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addSub();}};
    $('#itForm',s).onsubmit=e=>{e.preventDefault();const f=e.target;const pend=$('#newSub',s).value.trim();if(pend)addSub();
      Object.assign(it,{type,title:f.title.value.trim(),date:f.date.value||todayStr(),time:f.time.value,endTime:f.time.value?f.endTime.value:'',priority:+f.priority.value||0,category:f.category.value,
        repeat:f.repeat.value,reminder:f.reminder.value,location:f.location.value.trim(),notes:f.notes.value,subtasks:$$('[data-sub]',s).map(x=>({id:x.dataset.sub,text:x.value.trim()})).filter(x=>x.text)});
      if(!it.title){toast('Escribe un título');return;}
      if(ex&&ex.date!==it.date)delete it.rolled;
      putItem(it);closeSheet();render();toast('Guardado ✓');};
    if(ex)$('#itDel',s).onclick=()=>{
      if(isRec(ex)&&ds){openSheet(`<h2>Borrar «${esc(ex.title)}»</h2><p class="muted">Se repite. ¿Qué quieres borrar?</p><div class="acts"><button class="btn" data-a="close">Cancelar</button><button class="btn" id="d1">Solo este día</button><button class="btn danger" id="dAll">Todas</button></div>`,
        s2=>{$('#d1',s2).onclick=()=>{ex.exDates=[...(ex.exDates||[]),ds];putItem(ex);closeSheet();render();};$('#dAll',s2).onclick=()=>{delete C.items[ex.id];saveC();closeSheet();render();};});}
      else ask('Borrar',`¿Borrar «${esc(ex.title)}»? También desaparecerá de Mi Calendario.`,'Borrar',()=>{delete C.items[ex.id];saveC();render();},true);
    };
  });
}

<script>
/* ---------- OBJETIVOS ---------- */
function goalProgress(g){
  if(g.done)return 100;const all=[...(g.metas||[]),...(g.pasos||[])];
  if(!all.length)return g.manual||0;return Math.round(all.filter(x=>x.done).length/all.length*100);
}
VIEWS.objetivos=()=>{
  const mk=monthKey(),wk=mondayOf(todayStr());
  const act=D.goals.filter(g=>!g.done),ach=D.goals.filter(g=>g.done);
  const rv=D.reviews[mk]||{};const prevMk=addMonths(mk,-1);const prv=D.reviews[prevMk];
  const goalCard=g=>{const p=goalProgress(g);const open=ui.goalOpen[g.id];
    const metas=(g.metas||[]).slice().sort((a,b)=>a.month<b.month?-1:1);const pasos=(g.pasos||[]).filter(x=>x.week===wk);
    const left=g.due?daysBetween(todayStr(),g.due):null;
    return`<div class="goal${g.done?' ach':''}"><div class="gt"><span class="e">${esc(g.emoji||'🎯')}</span><div style="flex:1;min-width:0"><b>${esc(g.title)}</b>
      <div class="small muted">${g.due?`Para el ${fmtShort(g.due)} ${g.due.slice(0,4)}${!g.done&&left!=null?` · ${left>=0?'quedan '+left+' días':'fecha pasada'}`:''}`:'Sin fecha'}${g.done?' · 🏆 ¡Conseguido!':''}</div></div>
      <b style="font-variant-numeric:tabular-nums">${p}%</b><button class="btn small icon" data-a="gOpen" data-id="${g.id}" aria-label="Detalles">${ico(open?'left':'right')}</button></div>
      <div class="bar" style="margin-top:10px"><i style="width:${p}%"></i></div>
      ${open?`<div class="sub">${g.why?`<p style="margin:8px 0;font-style:italic">«${esc(g.why)}»</p>`:''}
        <h5>Metas mensuales</h5>${metas.map(x=>`<div class="it"><button class="ck${x.done?' on':''}" data-a="gTog" data-id="${g.id}" data-k="metas" data-x="${x.id}">${CHECK}</button><div class="tx"><div class="t">${esc(x.t)}</div><div class="m">${esc(cap(fmtMonth(x.month)))}</div></div><button class="btn small icon" data-a="gRm" data-id="${g.id}" data-k="metas" data-x="${x.id}" aria-label="Quitar">${ico('trash')}</button></div>`).join('')||'<p class="empty small">Divide el objetivo en metas para cada mes.</p>'}
        <form class="row" data-f="gAdd" data-id="${g.id}" data-k="metas"><input type="month" class="f" name="m" value="${mk}" style="max-width:170px"><input class="f" name="t" placeholder="Nueva meta del mes…"><button class="btn icon" aria-label="Añadir">${ico('plus')}</button></form>
        <h5>Pasos de esta semana</h5>${pasos.map(x=>`<div class="it"><button class="ck${x.done?' on':''}" data-a="gTog" data-id="${g.id}" data-k="pasos" data-x="${x.id}">${CHECK}</button><div class="tx"><div class="t">${esc(x.t)}</div></div><button class="btn small icon" data-a="gRm" data-id="${g.id}" data-k="pasos" data-x="${x.id}" aria-label="Quitar">${ico('trash')}</button></div>`).join('')||'<p class="empty small">¿Qué paso pequeño puedes dar esta semana?</p>'}
        <form class="row" data-f="gAdd" data-id="${g.id}" data-k="pasos"><input class="f" name="t" placeholder="Nuevo paso para esta semana…"><button class="btn icon" aria-label="Añadir">${ico('plus')}</button></form>
        <div class="row wrap" style="margin-top:12px"><button class="btn small ${g.done?'':'sage'}" data-a="gDone" data-id="${g.id}">${g.done?'Marcar como no conseguido':'🏆 ¡Lo he conseguido!'}</button><button class="btn small" data-a="gEdit" data-id="${g.id}">${ico('edit')}Editar</button></div></div>`:''}</div>`;};
  return`<div class="grid">
  <section class="card c7"><h3>Mis objetivos <span class="jp">目標</span><button class="more" data-a="gEdit">+ Nuevo</button></h3>

  <section class="card c5"><h3>Revisión de ${esc(fmtMonth(mk))}</h3>
    <label class="l">¿Qué ha salido bien?</label><textarea class="f" data-in="review" data-k="good" placeholder="Lo que te ha salido bien este mes…">${esc(rv.good||'')}</textarea>
    <label class="l">¿Qué cambiarías?</label><textarea class="f" data-in="review" data-k="change">${esc(rv.change||'')}</textarea>
    <label class="l">¿Qué toca el mes que viene?</label><textarea class="f" data-in="review" data-k="next">${esc(rv.next||'')}</textarea>
    ${prv&&prv.next?`<div class="ago"><div class="small muted">El mes pasado te propusiste:</div>${esc(prv.next)}</div>`:''}</section>
  <section class="card c12"><h3>Tablero de visión <span class="jp">夢</span></h3>
    <div class="vision">${D.vision.map(v=>`<figure data-a="visEdit" data-id="${v.id}"><img data-img="${v.img}" alt="">${v.cap?`<figcaption>${esc(v.cap)}</figcaption>`:''}</figure>`).join('')}<figure class="add" data-a="visAdd">＋</figure></div>
    <p class="small muted">Sube imágenes que te inspiren. Toca una para cambiar la frase o quitarla.</p></section></div>`;
};
function editGoal(id){

    $('#gf',s).onsubmit=e=>{e.preventDefault();const f=e.target;const o=g||{id:newId('g_'),metas:[],pasos:[],done:false,created:todayStr()};

  <section class="card c6"><h3>Japonés hoy <span class="jp">日本語</span></h3><div class="list">
    ${pj?`<a class="it" href="japones.html" style="text-decoration:none"><span>日</span><div class="tx"><div class="t">Plan de japonés</div><div class="m">${pj.done}/${pj.total} tareas · ${pj.pct}%</div></div></a>`:''}
    ${ka?`<a class="it" href="silabarios.html" style="text-decoration:none"><span>あ</span><div class="tx"><div class="t">Silabarios ${ka.today?'✓':''}</div><div class="m">🔥 ${ka.streak} días · hiragana ${ka.h}/46 · katakana ${ka.k}/46</div></div></a>`:''}
    ${ki?`<a class="it" href="kanji.html" style="text-decoration:none"><span>漢</span><div class="tx"><div class="t">Kanji ${ki.today?'✓':''}</div><div class="m">🔥 ${ki.streak} días · ${ki.started} empezados · ${ki.dom} dominados</div></div></a>`:''}
    ${!pj&&!ka&&!ki?'<p class="empty">Cuando uses Kanji, Silabarios y el Plan de japonés, verás aquí tu progreso.</p>':''}</div></section>

    ${pa?`<div class="list">
      <a class="it" href="patologias.html#repaso" style="text-decoration:none"><span>🃏</span><div class="tx"><div class="t">${pa.due?pa.due+' tarjetas para repasar hoy':'Repaso al día ✓'}</div><div class="m">${pa.cards} tarjetas${pa.fail?' · '+pa.fail+' falladas':''}${pa.streak?' · 🔥 '+pa.streak+' días':''}</div></div></a>

function jarSVG(n){

  return`<div class="jar" title="Tarro de logros"><svg viewBox="0 0 120 150"><rect x="34" y="6" width="52" height="12" rx="4" fill="var(--beige)"/><path d="M30 20h60c6 0 10 6 10 12v100c0 8-6 14-14 14H34c-8 0-14-6-14-14V32c0-6 4-12 10-12z" fill="var(--soft)" stroke="var(--stone-l)" stroke-width="2"/>${stars.join('')}</svg></div>`;
}
let inkCtx=null,inkErase=false;
AFTER.diario=()=>{
  const cv=$('#ink');if(!cv)return;const ds=ui.jDate;inkErase=false;
  const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);ctx.lineCap='round';ctx.lineJoin='round';inkCtx=ctx;
  const j=D.journal[ds];
  if(j&&j.ink)imgGet(j.ink).then(v=>{if(!v)return;const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height);im.src=v;});
  const er=$('#inkEr');if(er)er.onclick=()=>{inkErase=!inkErase;er.classList.toggle('primary',inkErase);};
  let drawing=false,last=null,saveT=null;
  const pt=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top,e.pressure||.5];};
  cv.onpointerdown=e=>{drawing=true;cv.setPointerCapture(e.pointerId);last=pt(e);};
  cv.onpointermove=e=>{if(!drawing)return;const p=pt(e);ctx.globalCompositeOperation=inkErase?'destination-out':'source-over';
    ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#38332E';
    ctx.lineWidth=inkErase?22:(e.pointerType==='pen'?1.2+p[2]*2.6:2.4);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p;};
  const end=()=>{if(!drawing)return;drawing=false;clearTimeout(saveT);saveT=setTimeout(()=>saveInk(cv,ds),400);};
  cv.onpointerup=end;cv.onpointercancel=end;
};

function stackChart(days){
  const data=days.map(d=>({d,m:minutesOn(d)}));const keys=Object.keys(AREAS);
  const mx=Math.max(30,...data.map(x=>x.m.total));const step=mx>240?60:mx>90?30:15;const top=Math.ceil(mx/step)*step;
  const W=640,H=200,L=34,B=22,cw=(W-L)/days.length,bw=Math.min(34,cw*.62);
  let g='';for(let v=0;v<=top;v+=step){const y=H-B-(v/top)*(H-B-8);g+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${v}</text>`;}
  let bars='';
  data.forEach((x,i)=>{let y=H-B;const cx=L+cw*i+cw/2;
    keys.forEach(k=>{const v=x.m[k];if(v<=0)return;const h=(v/top)*(H-B-8);const hh=Math.max(1,h-2);y-=h;bars+=`<rect x="${cx-bw/2}" y="${y+2}" width="${bw}" height="${hh}" rx="3" fill="${AREAS[k].c}"/>`;});
    const tip=`${fmtShort(x.d)}: ${fmtMin(x.m.total)}`+keys.filter(k=>x.m[k]>0).map(k=>`<br>${AREAS[k].n}: ${fmtMin(x.m[k])}`).join('');
    bars+=`<rect x="${L+cw*i}" y="0" width="${cw}" height="${H-B}" fill="transparent" data-tip="${esc(tip)}"/>`;
    if(days.length<=7||i%Math.ceil(days.length/10)===0||i===days.length-1)bars+=`<text x="${cx}" y="${H-6}" text-anchor="middle">${days.length<=7?DIAS3[fromYmd(x.d).getDay()]:+x.d.slice(8)}</text>`;});
  const tot=k=>data.reduce((a,x)=>a+x.m[k],0);
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Minutos de aprendizaje por día"><g class="grid">${g}</g>${bars}</svg>
  <div class="legend">${keys.map(k=>`<span><i class="dot" style="background:${AREAS[k].c}"></i>${AREAS[k].n} · <b style="color:var(--ink)">${fmtMin(tot(k))}</b></span>`).join('')}</div>
  <details class="tv"><summary>Ver como tabla</summary><table class="tbl"><tr><th>Día</th>${keys.map(k=>`<th class="n">${AREAS[k].n}</th>`).join('')}<th class="n">Total</th></tr>${data.map(x=>`<tr><td>${fmtShort(x.d)}</td>${keys.map(k=>`<td class="n">${Math.round(x.m[k])}</td>`).join('')}<td class="n">${Math.round(x.m.total)}</td></tr>`).join('')}</table></details>`;
}
function moodChart(days){

  if(pts.length<2)return'<p class="empty">Marca cómo te sientes cada día para ver tu evolución.</p>';
  const W=640,H=150,L=34,B=20,cw=(W-L)/Math.max(1,days.length-1);const y=v=>H-B-((v-1)/4)*(H-B-12);const x=i=>days.length===1?L:L+cw*i;
  let g='';for(let v=1;v<=5;v++)g+=`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+5}" text-anchor="end" style="font-size:13px">${MOODS[v-1][1]}</text>`;
  const path=pts.map((p,k)=>`${k?'L':'M'}${x(p[0]).toFixed(1)} ${y(p[1]).toFixed(1)}`).join(' ');

function tasksStats(days){let tot=0,done=0;for(const d of days)for(const it of itemsOn(d,'tarea')){tot++;if(isDone(it,d))done++;}return{tot,done,pct:tot?Math.round(done/tot*100):0};}
function moodHabit(){
  const t=todayStr();const out=[];
  for(const h of C.habits.list){const a=[],b=[];for(let i=0;i<60;i++){const d=addDays(t,-i);const m=(D.journal[d]||{}).mood;if(!m)continue;(hDone(h,d)?a:b).push(m);}
    if(a.length>=3&&b.length>=3){const av=x=>x.reduce((s,v)=>s+v,0)/x.length;out.push({h,diff:av(a)-av(b),a:av(a),b:av(b)});}}
  return out.sort((x,y)=>y.diff-x.diff);
}
function monthSummary(mk){
  const t=todayStr();const n=new Date(+mk.slice(0,4),+mk.slice(5),0).getDate();
  const days=[...Array(n)].map((_,i)=>mk+'-'+pad(i+1)).filter(d=>d<=t);
  const min=days.reduce((a,d)=>a+minutesOn(d).total,0);const ts=tasksStats(days);
  const moods=days.map(d=>(D.journal[d]||{}).mood).filter(Boolean);const avg=moods.length?moods.reduce((a,b)=>a+b,0)/moods.length:0;
  const wins=days.reduce((a,d)=>a+((D.journal[d]||{}).wins||[]).length,0);const jd=days.filter(d=>D.journal[d]&&(D.journal[d].text||D.journal[d].ink||D.journal[d].mood)).length;
  let hb=0;for(const d of days)hb+=C.habits.list.filter(h=>hDone(h,d)).length;
  const learned=D.learn.log.filter(x=>x.date.slice(0,7)===mk).length;
  const books=BOOKS.filter(b=>b.status==='terminado'&&(b.end||'').slice(0,7)===mk).length;
  const goals=D.goals.filter(g=>g.done&&(g.doneAt||'').slice(0,7)===mk).length;
  return{days,min,ts,avg,wins,jd,hb,learned,books,goals,steps:healthAvg(days,'steps'),sleep:healthAvg(days,'sleep')};
}

<script>
/* ---------- SALUD: pasos y sueño (desde la app Salud con un atajo, o a mano) ---------- */
const hd=ds=>(D.health.days||{})[ds]||null;
const fmtSleep=m=>{if(m==null||isNaN(m))return'–';m=Math.round(m);return Math.floor(m/60)+' h '+pad(m%60)+' min';};
const fmtSteps=n=>n==null||isNaN(n)?'–':String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
function parseNum(s){
  s=String(s??'').replace(/[\s  ]/g,'').replace(/[^\d.,-]/g,'');if(!s)return NaN;
  if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s))s=s.replace(/,/g,'');
  else s=s.replace(',','.');
  return parseFloat(s);
}
function parseLocalDT(s){const m=String(s).trim().match(/^(\d{4})-(\d{1,2})-(\d{1,2})[T ](\d{1,2}):(\d{2})(?::(\d{2}))?/);if(!m)return null;return new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0));}
function importHealth(text){
  const steps={},iv=[];
  for(const raw of String(text||'').split(/\r?\n|\|/)){
    const l=raw.trim();let m;
    if((m=l.match(/^P\s*;\s*(\d{4}-\d{1,2}-\d{1,2})\s*;\s*(.+)$/i))){
      const d=m[1].replace(/-(\d)(?!\d)/g,'-0$1');const v=Math.round(parseNum(m[2]));if(v>=0&&v<300000)steps[d]=(steps[d]||0)+v;
    }else if((m=l.match(/^S\s*;\s*([^;]+?)\s*;\s*([^;]+?)\s*$/i))){
      const a=parseLocalDT(m[1]),b=parseLocalDT(m[2]);if(a&&b&&b>a&&b-a<20*3600e3)iv.push([a.getTime(),b.getTime()]);
    }
  }
  /* une los tramos de sueño que se solapan y los asigna al día en que te despiertas */
  iv.sort((x,y)=>x[0]-y[0]);const merged=[];
  for(const x of iv){const last=merged[merged.length-1];if(last&&x[0]<=last[1])last[1]=Math.max(last[1],x[1]);else merged.push([x[0],x[1]]);}
  const nights={};for(const [a,b] of merged){const k=ymd(new Date(b+6*3600e3));nights[k]=(nights[k]||0)+(b-a)/60000;}
  const days=D.health.days;
  for(const [d,v] of Object.entries(steps)){days[d]=Object.assign({},days[d],{steps:v,src:'salud'});}
  for(const [d,v] of Object.entries(nights)){days[d]=Object.assign({},days[d],{sleep:Math.round(v),src:'salud'});}
  const n=Object.keys(steps).length+Object.keys(nights).length;
  if(n){D.health.last=Date.now();saveD();}
  return{steps:Object.keys(steps).length,nights:Object.keys(nights).length,ok:n>0};
}
const looksHealth=t=>/(^|\n|\|)\s*[PS]\s*;\s*\d{4}-/.test(String(t||''));

}

function healthBars(days,key){
  const g=D.health.goals;const goal=key==='steps'?g.steps:g.sleep*60;const col=key==='steps'?'var(--s3)':'var(--s1)';

  const mx=Math.max(goal*1.15,...vals.map(v=>v||0));
  const W=420,H=170,L=key==='steps'?38:30,B=22,cw=(W-L)/days.length,bw=Math.min(30,cw*.62);const y=v=>H-B-(v/mx)*(H-B-8);
  const ticks=key==='steps'?[0,Math.round(mx/2/1000)*1000,Math.floor(mx/1000)*1000]:[0,240,480,720].filter(v=>v<=mx);

  let bars='';vals.forEach((v,i)=>{const cx=L+cw*i+cw/2;
    if(v!=null&&v>0)bars+=`<rect x="${cx-bw/2}" y="${y(v)}" width="${bw}" height="${Math.max(1,H-B-y(v))}" rx="4" fill="${col}" opacity="${v>=goal?1:.55}"/>`;

  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${key==='steps'?'Pasos':'Sueño'} por día"><g class="grid">${gr}</g>${bars}${gl}</svg>`;
}
function healthAvg(days,key){const v=days.map(d=>hd(d)).filter(e=>e&&e[key]!=null).map(e=>e[key]);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;}

  const a=[],b=[];for(let i=0;i<60;i++){const d=addDays(todayStr(),-i);const m=(D.journal[d]||{}).mood,s=(hd(d)||{}).sleep;if(!m||s==null)continue;(s>=7*60?a:b).push(m);}

document.addEventListener('click',e=>{
  if(e.target===$('#overlay')){closeSheet();return;}

/* formularios */
const FORMS={
  quick:f=>{const t=f.t.value.trim();if(!t)return;putItem(newItem({title:t,date:todayStr()}));toast('Tarea añadida ✓');},
  inbox:f=>{const t=f.t.value.trim();if(!t)return;D.inbox.unshift({id:newId('n_'),t,d:todayStr()});saveD();},

    g[k].push(k==='metas'?{id:newId('m_'),t,month:(f.m&&f.m.value)||monthKey(),done:false}:{id:newId('w_'),t,week:mondayOf(todayStr()),done:false});saveD();},

  log:f=>{const t=f.t.value.trim();if(!t)return;D.learn.log.push({id:newId('l_'),t,area:f.area.value,date:todayStr(),rev:[false,false,false]});saveD();toast('Guardado. Te lo recordaré para repasar ✓');},

document.addEventListener('submit',e=>{const f=e.target.closest('[data-f]');if(!f)return;e.preventDefault();const fn=FORMS[f.dataset.f];if(fn){fn(f);render();}});
/* campos que se guardan solos */
let inT=null;
function onInput(el){
  const k=el.dataset.in;const v=el.type==='checkbox'?el.checked:el.value;
  switch(k){
    case'focus':D.focus[el.dataset.k]=v;if(!v)delete D.focus[el.dataset.k];break;
    case'review':{const mk=monthKey();D.reviews[mk]=Object.assign({},D.reviews[mk],{[el.dataset.k]:v});break;}
    case'readGoal':D.learn.readGoal=clamp(parseInt(v)||12,1,365);break;
    case'dailyGoal':D.learn.dailyGoal=clamp(parseInt(v)||90,5,600);break;
    case'jText':jEntry(ui.jDate).text=v;jClean(ui.jDate);break;
    case'jIdeas':jEntry(ui.jDate).ideas=v;jClean(ui.jDate);break;
    case'jGrat':{const e=jEntry(ui.jDate);e.grat=e.grat||['','',''];e.grat[+el.dataset.i]=v;jClean(ui.jDate);break;}
    case'name':D.settings.name=v.trim();break;
    case'hdSteps':case'hdSleepH':case'hdSleepM':saveHealthInline();break;
    case'hSteps':D.health.goals.steps=clamp(parseInt(v)||8000,500,50000);break;
    case'hSleep':D.health.goals.sleep=clamp(parseNum(v)||8,4,12);break;
    case'rollover':D.settings.rollover=!!v;if(v)rollover();break;
  }
  saveD();
}
document.addEventListener('input',e=>{const el=e.target.closest('[data-in]');if(!el)return;clearTimeout(inT);inT=setTimeout(()=>onInput(el),350);});
