$('#fileIn').addEventListener('change',e=>{const f=e.target.files[0];if(f&&pickCb){const cb=pickCb;pickCb=null;cb(f).catch?.(()=>toast('No se pudo leer la imagen'));}});
$('#jsonIn').addEventListener('change',e=>{const f=e.target.files[0];if(f)doImport(f);});

/* tooltips de los gráficos */
function showTip(el,x,y){const t=$('#tip');t.innerHTML=el.dataset.tip;t.classList.remove('hidden');const w=t.offsetWidth;t.style.left=clamp(x-w/2,8,innerWidth-w-8)+'px';t.style.top=Math.max(8,y-t.offsetHeight-14)+'px';}
document.addEventListener('pointerover',e=>{const el=e.target.closest('[data-tip]');if(el&&e.pointerType==='mouse')showTip(el,e.clientX,e.clientY);});
document.addEventListener('pointermove',e=>{const el=e.target.closest('[data-tip]');if(el&&e.pointerType==='mouse')showTip(el,e.clientX,e.clientY);else if(e.pointerType==='mouse')$('#tip').classList.add('hidden');});
document.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-tip]');if(el)showTip(el,e.clientX,e.clientY);else $('#tip').classList.add('hidden');});

/* deslizar para cambiar de día/semana/mes */
let sw=null;
$('#view').addEventListener('touchstart',e=>{if(ui.sec!=='agenda'||e.touches.length!==1||e.target.closest('.week'))return;sw=[e.touches[0].clientX,e.touches[0].clientY];},{passive:true});
$('#view').addEventListener('touchend',e=>{if(!sw)return;const t=e.changedTouches[0];const dx=t.clientX-sw[0],dy=t.clientY-sw[1];sw=null;if(Math.abs(dx)>70&&Math.abs(dy)<45)ACT.agMove({dataset:{n:dx<0?1:-1}});},{passive:true});

/* ---------- copias ---------- */
async function doExport(){
  const ids=new Set([...D.vision.map(v=>v.img),...D.learn.sessions.map(s=>s.img).filter(Boolean),...Object.values(D.journal).map(j=>j.ink).filter(Boolean)]);
  const images={};for(const id of ids){const v=await imgGet(id);if(v)images[id]=v;}
  const data={app:'mi-dashboard',v:1,fecha:new Date().toISOString(),dashboard:D,calendario:readJSON(CK),images};
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=`mi-dashboard-${todayStr()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000);
  toast('Copia descargada ✓');
}
function doImport(file){
  const fr=new FileReader();fr.onload=()=>{let d;try{d=JSON.parse(fr.result);}catch(e){toast('El archivo no es una copia válida');return;}
    if(!d||d.app!=='mi-dashboard'||!isObj(d.dashboard)){toast('El archivo no es una copia del Dashboard');return;}
    ask('Restaurar copia',`Se sustituirán los datos actuales del Dashboard${d.calendario?' y de Mi Calendario':''} por los de la copia del ${esc((d.fecha||'').slice(0,10))}.`,'Restaurar',async()=>{
      localStorage.setItem(DK,JSON.stringify(d.dashboard));if(d.calendario)localStorage.setItem(CK,JSON.stringify(d.calendario));
      for(const [id,v] of Object.entries(d.images||{}))await imgPut(id,v);location.reload();},true);};
  fr.readAsText(file);
}

/* ---------- avisos ---------- */
const fired=new Set((()=>{try{return JSON.parse(sessionStorage.getItem('dash-fired')||'[]');}catch(e){return[];}})());
function checkReminders(){
  const now=new Date();const t=todayStr();
  for(const ds of [t,addDays(t,1)])for(const it of Object.values(C.items)){
    if(it.reminder===''||it.reminder==null||!occursOn(it,ds)||isDone(it,ds))continue;
    const s=startMin(it);const base=fromYmd(ds);base.setMinutes(s==null?9*60:s);const at=base.getTime()-(+it.reminder||0)*60000;
    const key=it.id+'|'+ds;if(fired.has(key))continue;
    if(now.getTime()>=at&&now.getTime()-at<3*3600e3){fired.add(key);try{sessionStorage.setItem('dash-fired',JSON.stringify([...fired]));}catch(e){}alertItem(it,ds);}
  }
}
function alertItem(it,ds){
  const when=(ds===todayStr()?'Hoy':'Mañana')+(it.time?' a las '+it.time:'');
  const b=document.createElement('div');b.className='banner';b.innerHTML=`<span style="font-size:26px">🔔</span><div style="flex:1;min-width:0"><b>${esc(it.title)}</b><span class="small muted">${esc(when)}${it.location?' · '+esc(it.location):''}</span></div><button class="btn small">Vale</button>`;
  b.querySelector('button').onclick=()=>b.remove();document.body.appendChild(b);setTimeout(()=>b.remove(),20000);
  if(D.settings.notif&&'Notification' in window&&Notification.permission==='granted'){
    const opt={body:when+(it.location?' · '+it.location:''),tag:it.id+ds,icon:'icon-192.png'};
    (navigator.serviceWorker&&navigator.serviceWorker.getRegistration?navigator.serviceWorker.getRegistration():Promise.resolve(null))
      .then(r=>{if(r&&r.showNotification)return r.showNotification('🔔 '+it.title,opt);try{new Notification('🔔 '+it.title,opt);}catch(e){}}).catch(()=>{});
  }
}

/* ---------- tema ---------- */
const mq=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
function applyTheme(){const t=D.settings.theme;const dark=t==='dark'||(t==='auto'&&mq&&mq.matches);document.documentElement.dataset.theme=dark?'dark':'light';
  const m=$('meta[name=theme-color]');if(m)m.content=dark?'#24211E':'#F8F4ED';}
if(mq&&mq.addEventListener)mq.addEventListener('change',applyTheme);

/* ---------- inicio ---------- */
function init(){
  try{sessionStorage.setItem('ma-portada','1');}catch(e){}
  loadD();loadC();PJ=readJSON('planJapones.v1');applyTheme();rollover();
  try{const q=new URLSearchParams(location.search).get('salud');if(q){const r=importHealth(q);history.replaceState(null,'',location.pathname+location.hash);if(r.ok)setTimeout(()=>toast(`💚 Salud: ${r.steps} días de pasos y ${r.nights} noches de sueño`),500);}}catch(e){}
  const h=(location.hash||'').slice(1);if(SECS.some(s=>s[0]===h))ui.sec=h;
  render();loadBooks();checkReminders();
  setInterval(()=>{const c=$$('[data-clock]');if(D.timer)c.forEach(el=>el.textContent=fmtClock(timerMs()));},1000);
  setInterval(checkReminders,30000);
  setInterval(()=>{const a=document.activeElement;const typing=a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName);if(!typing&&$('#overlay').classList.contains('hidden')&&(ui.today!==todayStr()||ui.sec==='hoy'||ui.sec==='agenda'))render();},60000);
  document.addEventListener('visibilitychange',()=>{if(document.hidden){if(ui.sec==='diario'&&hasLock()){ui.unlocked=false;}}else{loadC();PJ=readJSON('planJapones.v1');if($('#overlay').classList.contains('hidden'))render();checkReminders();}});
  window.addEventListener('hashchange',()=>{const h=(location.hash||'').slice(1);if(SECS.some(s=>s[0]===h)&&h!==ui.sec)go(h);});
  window.addEventListener('storage',e=>{if(e.key===CK||e.key===DK){loadD();loadC();render();}});
  try{if('serviceWorker' in navigator&&location.protocol==='https:'&&window.top===window.self)navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}
}
init();
</script>
