<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Colorear">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.png">
<link rel="icon" type="image/png" href="./icon.png">
<title>Colorear</title>
<link rel="stylesheet" href="./style.css">
<script defer src="./art.js"></script>
<script defer src="./extras.js"></script>
<script defer src="./io.js"></script>
<script defer src="./app.js"></script>
</head>
<body>

<!-- ============ GALERÍA ============ -->
<header class="top">
  <div class="top-inner">
    <span class="brand"><img src="./icon.png" alt="" class="brand-icon"> Colorear</span>
    <button id="import" class="primary pill" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Añadir dibujo
    </button>
    <input id="files" type="file" accept=".jpg,.jpeg,.png,image/jpeg,image/png" multiple hidden>
    <input id="camera" type="file" accept="image/*" capture="environment" hidden>
  </div>
</header>

<main id="gallery">
  <section id="library">
    <div class="large-title">
      <h1>Mis dibujos</h1>
      <span id="count"></span>
    </div>
    <div id="tabs" class="segmented" role="group" aria-label="Filtrar por estado"></div>
    <div class="filters">
      <select id="category" aria-label="Categoría"></select>
      <select id="collectionFilter" aria-label="Colección personalizada"></select>
      <button id="manageCollections" type="button" class="plain">Gestionar colecciones</button>
    </div>
    <div id="cards" class="cards"></div>
  </section>
</main>

<!-- ============ MESA DE DIBUJO ============ -->
<section id="editor" hidden aria-label="Mesa de dibujo">

  <div class="editor-top">
    <button id="back" type="button" class="plain back">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      Galería
    </button>
    <div class="title-block">
      <strong id="drawingName"></strong>
      <span id="saved" role="status"></span>
    </div>
    <div class="top-actions">
      <button id="undo" type="button" class="icon" title="Deshacer (dos dedos)" aria-label="Deshacer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      </button>
      <button id="redo" type="button" class="icon" title="Rehacer (tres dedos)" aria-label="Rehacer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
      </button>
      <span class="divider" aria-hidden="true"></span>
      <button id="png" type="button" class="icon export-trigger" title="Exportar" aria-label="Exportar" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M7 10H6a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1h-1"/></svg>
      </button>
      <button id="moreBtn" type="button" class="icon" title="Más opciones" aria-label="Más opciones" aria-haspopup="true" aria-expanded="false" data-popover="morePop">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.3" class="dot"/><circle cx="12" cy="12" r="1.3" class="dot"/><circle cx="18.5" cy="12" r="1.3" class="dot"/></svg>
      </button>
    </div>
  </div>

  <div id="comparisonControls" class="comparison-controls" hidden>
    <label for="comparisonSplit">Original</label>
    <input id="comparisonSplit" type="range" min="0" max="100" value="50" aria-label="Proporción de dibujo original">
    <span>Coloreado</span>
  </div>

  <div class="studio">
    <!-- Barra de herramientas -->
    <aside class="toolbar-wrap" aria-label="Herramientas">
      <div id="toolbar" class="toolbar">
        <button type="button" data-tool="pencil" aria-label="Lápiz" title="Lápiz">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.2-4.4L16.3 4.5a2.1 2.1 0 0 1 3 3L8.2 18.6z"/><path d="M14.5 6.3l3.2 3.2"/></svg>
        </button>
        <button type="button" data-tool="marker" aria-label="Rotulador" title="Rotulador">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21h5"/><path d="M6.5 18.5l1-4.5 8.8-8.8a2 2 0 0 1 2.8 0l.7.7a2 2 0 0 1 0 2.8L11 17.5z"/><path d="M7.5 14l3.5 3.5"/></svg>
        </button>
        <button type="button" data-tool="wash" aria-label="Acuarela" title="Acuarela">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5s6 6.4 6 10.8a6 6 0 0 1-12 0C6 9.9 12 3.5 12 3.5z"/><path d="M9.5 15a2.6 2.6 0 0 0 2.5 2.5"/></svg>
        </button>
        <button type="button" data-tool="air" aria-label="Aerógrafo" title="Aerógrafo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="10" width="8" height="11" rx="2"/><path d="M6.5 10V7h4v3"/><circle cx="16" cy="7" r=".9" class="dot"/><circle cx="19.5" cy="5" r=".9" class="dot"/><circle cx="19.5" cy="9" r=".9" class="dot"/><circle cx="17" cy="11.5" r=".9" class="dot"/></svg>
        </button>
        <button type="button" data-tool="detail" aria-label="Detalle" title="Detalle (punta fina)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.5V18"/><path d="M9 18h6l-1.2-7.5h-3.6z"/><path d="M10.2 10.5V3.5h3.6v7"/></svg>
        </button>
        <button type="button" id="effectsBtn" aria-label="Efectos" title="Efectos" aria-haspopup="true" aria-expanded="false" data-popover="effectsPop">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 3l1.9 5.1L18 10l-5.1 1.9L11 17l-1.9-5.1L4 10l5.1-1.9z"/><path d="M18.5 14.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></svg>
        </button>
        <span class="sep" aria-hidden="true"></span>
        <button type="button" data-tool="bucket" aria-label="Relleno" title="Relleno">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 11.5L11 5l7 7-6.5 6.5a1.4 1.4 0 0 1-2 0l-5-5a1.4 1.4 0 0 1 0-2z"/><path d="M4.5 12.5h13.5"/><path d="M8.5 3l3 3"/><path d="M20.5 15.5s1.6 2 1.6 3.2a1.6 1.6 0 0 1-3.2 0c0-1.2 1.6-3.2 1.6-3.2z"/></svg>
        </button>
        <button type="button" id="gradient" data-tool="gradient" aria-label="Degradado" title="Relleno con degradado">
          <svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="gradIcon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".9"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs><rect x="4" y="4" width="16" height="16" rx="4" fill="url(#gradIcon)"/><rect x="4" y="4" width="16" height="16" rx="4"/></svg>
        </button>
        <span class="sep" aria-hidden="true"></span>
        <button type="button" data-tool="eraser" aria-label="Borrador" title="Borrador">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 20h11"/><path d="M4.6 15.4l9.2-9.2a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L11.5 18.5H7.7z"/><path d="M9.5 10.5l5 5"/></svg>
        </button>
        <button type="button" id="eyedrop" data-tool="eyedrop" aria-label="Cuentagotas" title="Cuentagotas">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 6.5l4 4"/><path d="M15.2 4.8a2.3 2.3 0 0 1 3.3 0l.7.7a2.3 2.3 0 0 1 0 3.3l-2 2-4-4z"/><path d="M13.2 8.8L5.6 16.4 5 19l2.6-.6 7.6-7.6"/></svg>
        </button>
        <button type="button" data-tool="pan" aria-label="Mover" title="Mover el dibujo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18"/><path d="M9.5 5.5L12 3l2.5 2.5M9.5 18.5L12 21l2.5-2.5M5.5 9.5L3 12l2.5 2.5M18.5 9.5L21 12l-2.5 2.5"/></svg>
        </button>
      </div>
    </aside>

    <!-- Lienzo -->
    <div class="desk" id="desk">
      <div class="stage">
        <div id="frame" class="frame">
          <canvas id="fills"></canvas>
          <canvas id="paint"></canvas>
          <canvas id="ink"></canvas>
          <canvas id="decoration" aria-hidden="true"></canvas>
          <canvas id="gesture" aria-label="Lienzo"></canvas>
        </div>
      </div>
      <div id="cursorRing" class="cursor-ring" hidden aria-hidden="true"></div>
      <div id="zoomBadge" class="zoom-badge" hidden aria-live="polite"></div>
    </div>
  </div>

  <!-- Dock inferior -->
  <div class="dock">
    <div class="pill-panel sliders">
      <span id="sizePreview" class="size-preview" aria-hidden="true"><i></i></span>
      <label class="slider">
        <span>Tamaño <output id="sizeValue">18</output></span>
        <input id="size" type="range" min="1" max="100" value="18">
      </label>
      <label class="slider">
        <span>Opacidad <output id="opacityValue">100 %</output></span>
        <input id="opacity" type="range" min="5" max="100" value="100">
      </label>
      <label class="slider" id="intensityControl" hidden>
        <span>Efecto <output id="intensityValue">100 %</output></span>
        <input id="intensity" type="range" min="0" max="100" value="100">
      </label>
    </div>
    <div class="pill-panel colors">
      <label class="color-well" title="Elegir cualquier color">
        <input id="color" type="color" value="#b25370" aria-label="Color actual">
      </label>
      <div id="swatches" class="swatch-row"></div>
      <span id="recentDivider" class="vdivider" hidden aria-hidden="true"></span>
      <div id="recents" class="swatch-row" aria-label="Colores recientes"></div>
      <button id="saveColor" type="button" class="icon small" title="Guardar color en una paleta" aria-label="Guardar color en una paleta">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <select id="palette" aria-label="Paleta"></select>
    </div>
  </div>
</section>

<!-- Menú «Más» -->
<div id="morePop" class="popover" hidden role="menu" aria-label="Más opciones">
  <button id="clearDrawing" type="button" class="row danger">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/></svg>
    Limpiar dibujo
  </button>
  <button id="compare" type="button" class="row" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M12 3v18"/></svg>
    <span>Comparar con el original</span>
  </button>
  <button id="chooseFrame" type="button" class="row">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/><rect x="7" y="7" width="10" height="10" rx="1"/></svg>
    Marco
  </button>
  <button id="managePalettes" type="button" class="row">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5a8.5 8.5 0 0 0 0 17c1.2 0 1.8-.8 1.8-1.7 0-1.3-1-1.6-1-2.6 0-.9.7-1.5 1.6-1.5h2.1a4 4 0 0 0 4-4c0-4-3.8-7.2-8.5-7.2z"/><circle cx="7.8" cy="11" r="1.1" class="dot"/><circle cx="10.5" cy="7.4" r="1.1" class="dot"/><circle cx="15" cy="7.6" r="1.1" class="dot"/></svg>
    Mis paletas
  </button>
  <button id="fitScreen" type="button" class="row">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    Ajustar a la pantalla
  </button>
  <hr>
  <label class="row field">
    <span>Capa</span>
    <select id="layer" aria-label="Capa activa"><option value="paint">Pincel</option><option value="fills">Relleno</option></select>
  </label>
  <label class="row field switch">
    <span>Solo Apple Pencil</span>
    <input id="pencilOnly" type="checkbox" role="switch">
  </label>
  <p class="pop-hint">Con «Solo Apple Pencil», un dedo mueve el dibujo. Pellizca para hacer zoom. Toca con dos dedos para deshacer y con tres para rehacer.</p>
</div>

<!-- Menú de efectos -->
<div id="effectsPop" class="popover" hidden role="menu" aria-label="Efectos"></div>

<dialog id="dialog"><form id="dialogForm"><h2 id="dialogTitle"></h2><div id="dialogBody"></div><div class="actions"><button type="button" id="cancelDialog">Cancelar</button><button class="primary" id="confirmDialog">Guardar</button></div></form></dialog>
<div id="toast" role="status" hidden></div>
</body>
</html>
