<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<script src="sync.js" data-boton="si"></script>
<script>/* Portada: al abrir Mi Agenda se muestra el Dashboard (dashboard.html) */
(function(){try{if(/[?&]biblioteca/.test(location.search))return;if(sessionStorage.getItem('ma-portada'))return;sessionStorage.setItem('ma-portada','1');
var d=JSON.parse(localStorage.getItem('midashboard.v1')||'null');if(d&&d.settings&&d.settings.portada===false)return;location.replace('dashboard.html');}catch(e){}})();</script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mi Agenda</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi Agenda">
<meta name="theme-color" content="#F8F4ED">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,700;1,400&family=Josefin+Sans:ital,wght@0,300;0,400;0,700;1,400&family=Montserrat:ital,wght@0,400;0,700;1,400&family=Caveat:wght@400;700&family=Dancing+Script:wght@400;700&family=Great+Vibes&family=Kalam:wght@400;700&family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@400;700&family=Noto+Serif+JP:wght@400;700&family=Italiana&family=Marcellus&display=swap">
<style>:root{
  --ivory:#F8F4ED; --paper:#FFFDF8; --sand:#EDE5D8; --beige:#DCCDB7; --sage:#A3B19B; --sage-d:#6F8068;
  --rose:#D9B5AE; --rose-d:#B98A82; --stone:#8F8A83; --stone-l:#C9C4BC; --ink:#38332E; --ink-2:#5E5750;
  --desk:#E9E2D6; --line:rgba(56,51,46,.12); --shadow:0 10px 30px rgba(60,45,30,.14),0 2px 6px rgba(60,45,30,.08);
  --r:14px; --ui:"DM Sans",-apple-system,"Helvetica Neue",sans-serif; --display:"Cormorant Garamond","Didot",Georgia,serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--desk);color:var(--ink);font-family:var(--ui);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;touch-action:manipulation}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.hidden{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column}

/* ---------- Biblioteca ---------- */
#library{background:radial-gradient(1200px 600px at 20% -10%,#F6F1E8 0%,var(--desk) 60%);overflow:hidden}
.lib-head{display:flex;align-items:center;gap:14px;padding:calc(18px + var(--safe-t)) 28px 10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:38px;font-weight:600;letter-spacing:.5px;margin-right:auto;line-height:1}
.brand small{display:block;font-family:var(--ui);font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--stone);font-weight:500;margin-top:6px}
.search{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:999px;padding:0 14px;height:44px;min-width:220px}
.search input{border:0;background:none;outline:none;font:inherit;font-size:15px;width:100%;color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;background:rgba(255,255,255,.75);border:1px solid var(--line);font-size:15px;font-weight:500;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.sage{background:var(--sage-d);color:#fff;border-color:var(--sage-d)}
.btn.danger{background:#A65E55;color:#fff;border-color:#A65E55}
.btn.small{height:36px;padding:0 14px;font-size:14px}
.btn.icon{width:44px;padding:0}
.btn svg,.tb svg,.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.lib-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 28px calc(40px + var(--safe-b));touch-action:pan-y}
.lib-section-title{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--stone);margin:22px 0 14px;font-weight:600;display:flex;align-items:center;gap:12px}
.lib-section-title::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:30px 26px}
.card{display:flex;flex-direction:column;align-items:center;gap:10px;position:relative}
.card .cover-wrap{position:relative;width:100%;aspect-ratio:1000/1414;border-radius:6px 12px 12px 6px;box-shadow:var(--shadow);overflow:hidden;transition:transform .25s ease}
.card .cover-wrap.land{aspect-ratio:1414/1000}
.card .cover-wrap:active{transform:scale(.97)}
.card canvas{width:100%;height:100%;display:block}
.card-meta{width:100%;display:flex;align-items:flex-start;gap:6px}
.card-meta .t{flex:1;min-width:0}
.card-meta .t b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta .t span{font-size:12px;color:var(--stone)}
.card-meta .more{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
.card-meta .more:active{background:rgba(0,0,0,.06)}
.empty{padding:60px 20px;text-align:center;color:var(--stone)}
.empty h3{font-family:var(--display);font-size:30px;color:var(--ink);margin:0 0 8px;font-weight:600}
.recent-row{display:flex;gap:24px;overflow-x:auto;padding-bottom:8px;touch-action:pan-x}
.recent-row .card{width:130px;flex:none}

/* ---------- Editor ---------- */
#editor{background:var(--desk)}
.topbar{height:calc(54px + var(--safe-t));padding:var(--safe-t) 10px 0;display:flex;align-items:center;gap:4px;background:rgba(248,244,237,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);z-index:20;position:relative}
.ib{min-width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);gap:6px;padding:0 6px;font-size:14px}
.ib:active,.ib.on{background:rgba(56,51,46,.08)}
.ib[disabled]{opacity:.3;pointer-events:none}
.topbar .title{font-family:var(--display);font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:26vw;padding:0 6px}
.topbar .spacer{flex:1}
.save-status{font-size:12px;color:var(--stone);display:flex;align-items:center;gap:5px;padding:0 6px;white-space:nowrap}
.save-status i{width:7px;height:7px;border-radius:50%;background:var(--sage);display:inline-block}
.save-status.saving i{background:#D7B46A}
.save-status.error{color:#A65E55}.save-status.error i{background:#A65E55}
.sep{width:1px;height:26px;background:var(--line);margin:0 4px}

#toolbar{position:absolute;left:50%;transform:translateX(-50%);top:calc(64px + var(--safe-t));z-index:15;display:flex;align-items:center;gap:2px;background:rgba(255,253,248,.95);border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 20px rgba(60,45,30,.12);padding:5px 8px;max-width:calc(100vw - 20px);overflow-x:auto;scrollbar-width:none}
#toolbar::-webkit-scrollbar{display:none}
#toolbar.bottom{top:auto;bottom:calc(64px + var(--safe-b))}
#toolbar.left{left:10px;transform:none;top:calc(70px + var(--safe-t));flex-direction:column;max-height:calc(100vh - 160px);overflow-y:auto;overflow-x:hidden}
#toolbar.left .tsep{width:26px;height:1px}
.tb{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink-2);position:relative}
.tb.on{background:var(--ink);color:#fff}
.tb.on::after{content:"";position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--tool-color,transparent)}
.tb.toggle.on{background:var(--sage);color:#fff}
.tsep{width:1px;height:26px;background:var(--line);margin:0 5px;flex:none}
.sw{width:28px;height:28px;border-radius:50%;flex:none;margin:0 3px;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.wdot{width:34px;height:42px;display:flex;align-items:center;justify-content:center;flex:none;border-radius:10px}
.wdot span{background:var(--ink-2);border-radius:50%;display:block}
.wdot.on{background:rgba(56,51,46,.09)}

#stage{position:relative;flex:1;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#stage canvas{position:absolute;left:0;top:0;touch-action:none}
#live.mult{mix-blend-mode:multiply}
#pageShadow{position:absolute;background:transparent;box-shadow:0 18px 40px rgba(70,50,30,.16),0 3px 8px rgba(70,50,30,.10);pointer-events:none;border-radius:8px}
#rings{position:absolute;pointer-events:none;z-index:3}
#rings .ring{position:absolute;left:0;border-radius:999px}
#tabs{position:absolute;z-index:4;display:flex;flex-direction:column;gap:6px}
.tab{writing-mode:vertical-rl;text-orientation:mixed;font-size:13px;font-weight:600;letter-spacing:.5px;color:rgba(40,35,30,.82);border-radius:0 10px 10px 0;padding:10px 0;width:32px;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;box-shadow:2px 2px 6px rgba(60,45,30,.12);transition:width .2s ease,transform .2s;position:relative}
.tab.on{width:40px;box-shadow:3px 3px 10px rgba(60,45,30,.2)}
.tab.add{background:rgba(255,255,255,.65);color:var(--stone);font-size:20px;writing-mode:horizontal-tb;padding:4px 0;height:36px;flex:none}
#ribbon{position:absolute;width:22px;height:46px;background:#B98A82;pointer-events:none;z-index:3;clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)}
#pager{position:absolute;bottom:calc(12px + var(--safe-b));left:50%;transform:translateX(-50%);z-index:15;display:flex;align-items:center;gap:2px;background:rgba(255,253,248,.92);border:1px solid var(--line);border-radius:999px;padding:3px 6px;box-shadow:0 4px 14px rgba(60,45,30,.1)}
#pager .pi{font-size:13px;color:var(--ink-2);min-width:76px;text-align:center;font-variant-numeric:tabular-nums}
#flip{position:absolute;pointer-events:none;z-index:6;transform-origin:left center;backface-visibility:hidden;border-radius:8px;overflow:hidden}
#textEditor{position:absolute;z-index:8;border:1.5px dashed rgba(111,128,104,.8);background:rgba(255,255,255,.35);outline:none;resize:none;overflow:hidden;padding:0;margin:0;white-space:pre-wrap;word-wrap:break-word;transform-origin:center center;border-radius:4px}
#selBar{position:absolute;z-index:9;display:flex;gap:2px;background:var(--ink);color:#fff;border-radius:12px;padding:4px;box-shadow:0 6px 18px rgba(0,0,0,.2);transform:translateX(-50%);white-space:nowrap}
#selBar button{height:38px;padding:0 10px;border-radius:9px;font-size:13px;font-weight:500;color:#fff;display:flex;align-items:center;gap:4px}
#selBar button:active{background:rgba(255,255,255,.15)}
#banner{position:fixed;left:50%;top:calc(10px + var(--safe-t));transform:translateX(-50%);z-index:100;background:#A65E55;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);max-width:90vw;display:flex;gap:12px;align-items:center}
#banner button{color:#fff;text-decoration:underline}

/* ---------- Popovers & modales ---------- */
#popover{position:fixed;z-index:80;background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 16px 40px rgba(50,40,30,.2);padding:16px;width:330px;max-width:calc(100vw - 20px);max-height:calc(100vh - 120px);overflow-y:auto;touch-action:pan-y}
.pop-scrim{position:fixed;inset:0;z-index:79}
.pop h4,.modal h4{margin:12px 0 8px;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--stone);font-weight:600}
.pop h4:first-child,.modal h4:first-child{margin-top:0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.swatches{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.swatches .sw{width:30px;height:30px;margin:0}
.slider{display:flex;align-items:center;gap:10px;margin:6px 0}
.slider label{font-size:13px;min-width:80px;color:var(--ink-2)}
.slider input[type=range]{flex:1;accent-color:var(--sage-d);height:30px}
.slider output{font-size:12px;color:var(--stone);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--sand);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;height:36px;border-radius:9px;font-size:13px;font-weight:500;padding:0 8px;color:var(--ink-2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.chk{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;font-size:15px;border-bottom:1px solid var(--line)}
.chk input{width:22px;height:22px;accent-color:var(--sage-d)}
.menu{display:flex;flex-direction:column}
.menu button{text-align:left;padding:12px 10px;border-radius:10px;font-size:15px;display:flex;align-items:center;gap:12px}
.menu button:active{background:var(--sand)}
.menu button.danger{color:#A65E55}
.menu button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
input.txt,select.txt{height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:15px;background:#fff;color:var(--ink);width:100%;outline:none}
input.txt:focus{border-color:var(--sage-d)}
input[type=color]{-webkit-appearance:none;appearance:none;width:30px;height:30px;border:0;padding:0;background:none;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.15);flex:none}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}input[type=color]::-webkit-color-swatch{border:none;border-radius:50%}
.papers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.papers button{border:1.5px solid var(--line);border-radius:10px;padding:4px;background:#fff;font-size:11px;color:var(--ink-2)}
.papers button.on{border-color:var(--ink)}
.papers canvas{width:100%;aspect-ratio:1/1.1;display:block;border-radius:6px;margin-bottom:2px}
.fontlist{display:flex;flex-direction:column;max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:10px}
.fontlist button{padding:9px 12px;text-align:left;font-size:18px;border-bottom:1px solid var(--line)}
.fontlist button.on{background:var(--sand)}
.stickers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stickers button{aspect-ratio:1;border-radius:10px;background:var(--ivory);display:flex;align-items:center;justify-content:center;padding:6px}
.stickers img{max-width:100%;max-height:100%}

.modal-scrim{position:fixed;inset:0;background:rgba(40,32,25,.32);z-index:70;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .2s ease}
.modal{background:var(--paper);border-radius:22px;box-shadow:0 30px 80px rgba(40,30,20,.3);width:560px;max-width:100%;max-height:calc(100vh - 40px);display:flex;flex-direction:column;animation:rise .25s ease;overflow:hidden}
.modal.wide{width:900px}
.modal-head{display:flex;align-items:center;padding:18px 20px 10px;gap:10px}
.modal-head h3{margin:0;font-family:var(--display);font-size:28px;font-weight:600;flex:1}
.modal-body{padding:6px 20px 16px;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.modal-foot{padding:12px 20px 18px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--line);flex-wrap:wrap}
.modal p{line-height:1.5;color:var(--ink-2);margin:4px 0 10px}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}}

.cover-editor{display:grid;grid-template-columns:260px 1fr;gap:22px}
.cover-editor .prev{position:sticky;top:0;align-self:start}
.cover-editor .prev canvas{width:100%;border-radius:6px 12px 12px 6px;box-shadow:var(--shadow);display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
@media (max-width:760px){.cover-editor{grid-template-columns:1fr}.cover-editor .prev{position:static;width:200px;margin:0 auto}}

.pages-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:16px}
.pthumb{display:flex;flex-direction:column;gap:5px;align-items:stretch;position:relative}
.pthumb .img{background:#fff;border-radius:6px;box-shadow:0 2px 8px rgba(60,45,30,.15);aspect-ratio:1000/1414;overflow:hidden;border:2px solid transparent;position:relative}
.pthumb.land .img{aspect-ratio:1414/1000}
.pthumb.cur .img{border-color:var(--sage-d)}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.pthumb .info{display:flex;align-items:center;font-size:12px;color:var(--ink-2);gap:2px}
.pthumb .info span{flex:1}
.pthumb .star{position:absolute;top:4px;right:6px;color:#B98A82;font-size:16px}
.pthumb .info button{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.pthumb .info button:active{background:var(--sand)}
.sec-head{display:flex;align-items:center;gap:8px;margin:18px 0 10px;font-weight:600}
.sec-head i{width:14px;height:14px;border-radius:4px;display:inline-block}
.sec-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.sec-row .cdot{width:34px;height:34px;border-radius:10px;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sec-row input{flex:1}
.sec-row small{color:var(--stone);white-space:nowrap}

#toast{position:fixed;left:50%;bottom:calc(80px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;z-index:120;opacity:0;transition:all .3s ease;pointer-events:none;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.crop-box{position:relative;margin:0 auto;touch-action:none;background:#eee}
.crop-box img{display:block;width:100%;height:100%;pointer-events:none}
.crop-rect{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.45)}
.crop-rect .h{position:absolute;width:26px;height:26px;background:#fff;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.help-list{line-height:1.6;color:var(--ink-2);padding-left:18px}
.help-list li{margin-bottom:6px}
.kbd{display:inline-block;background:var(--sand);border-radius:6px;padding:0 6px;font-size:13px}
</style>
</head>
<body>
<div id="app">
  <section id="library" class="screen">
    <div class="lib-head">

    foot: (f, close) => f.append(el('button', { class: 'btn', onclick: close }, 'Cancelar'), el('button', { class: 'btn primary', onclick: async () => {

}
async function createStarterNotebook() {
  const { nb, pages } = newNotebook({ title: 'Mi agenda', subtitle: today().slice(0, 4), sectionTitle: 'Notas', cover: { style: 'leather', color: '#A3B19B' } });
  const add = (title, color, paper) => { const s = { id: uid('s'), title, color, pages: [] }; const p = newPage(nb.id, s.id, paper); s.pages.push(p.id); nb.sections.push(s); pages.push(p); };

async function openLibrarySettings() {

    title: 'Ajustes y copias', wide: false, body: b => {
      b.append(el('h4', {}, 'Copias de seguridad'));

      b.append(el('div', { class: 'row' }, el('button', { class: 'btn sage', onclick: exportAllBackup }, 'Exportar copia completa'), el('button', { class: 'btn', onclick: importFile }, 'Restaurar o importar…')));

      drawFonts(); b.append(fl, el('button', { class: 'btn small', style: { marginTop: '8px' }, onclick: async () => { const f = await pickFile('.ttf,.otf,.woff,.woff2'); if (await importFontFile(f)) drawFonts(); } }, '+ Importar tipografía'));
      b.append(el('h4', {}, 'Escritura'), el('button', { class: 'btn small', onclick: openPrefs }, 'Preferencias de Apple Pencil y barra…'));
      b.append(el('h4', {}, 'Almacenamiento'));
      b.append(el('p', {}, (Store.ok ? 'Guardado local activo (IndexedDB). ' : 'Almacenamiento no disponible: los datos solo están en memoria. ') + (Store.persisted ? 'Protegido contra borrado automático.' : 'El navegador podría liberar espacio si el dispositivo se queda sin memoria: haz copias periódicas.') + (est && est.usage ? ` Uso: ${(est.usage / 1048576).toFixed(1)} MB.` : '')));
      b.append(el('p', { style: { fontSize: '13px' } }, 'No hay sincronización automática entre dispositivos: usa las copias para mover tus agendas.'));

async function init() {

  try { const p = await Store.get('meta', 'prefs'); if (p) { prefs = Object.assign(deepClone(DEFAULT_PREFS), p); prefs.tools = Object.assign(deepClone(DEFAULT_PREFS.tools), p.tools || {}); for (const k in DEFAULT_PREFS.tools) prefs.tools[k] = Object.assign(deepClone(DEFAULT_PREFS.tools[k]), prefs.tools[k]); prefs.widths = Object.assign(deepClone(DEFAULT_PREFS.widths), p.widths || {}); } } catch (e) { console.warn(e); }

  try { const first = await Store.get('meta', 'firstRun'); if (!first) { const all = await Store.all('notebooks'); if (!all.length) await createStarterNotebook(); await Store.put('meta', { key: 'firstRun', t: Date.now() }); } } catch (e) { console.warn(e); }

  $('#libImport').onclick = importFile;
  $('#libSettings').onclick = openLibrarySettings;
  $('#libSearch').addEventListener('input', debounce(renderLibrary, 150));
  $('#btnBack').onclick = closeEditor;

  $('#btnPrev').onclick = prevPage; $('#btnNext').onclick = nextPage;
  $('#btnPaper').onclick = e => openPaperPanel(e.currentTarget);
  $('#btnAddPage').onclick = e => openAddPagePopover(e.currentTarget);
  $('#btnPages').onclick = openPagesOverview;
  $('#btnBookmark').onclick = toggleBookmark;
  $('#btnExport').onclick = e => openExportMenu(e.currentTarget);
  $('#btnMore').onclick = e => openMoreMenu(e.currentTarget);
  $('#btnZoomIn').onclick = () => zoomAt(1.25, Ed.stageW / 2, Ed.stageH / 2);
  $('#btnZoomOut').onclick = () => zoomAt(.8, Ed.stageW / 2, Ed.stageH / 2);
  $('#btnFit').onclick = () => { if (Math.abs(Ed.view.s / Ed.view.fit - 1) < .02) fitWidth(); else fitView(); };
  const ta = $('#textEditor');
  ta.addEventListener('input', () => { if (Ed.editing) { Ed.editing.item.text = ta.value; positionTextEditor(); } });
  ta.addEventListener('keydown', e => { if (e.key === 'Escape') { commitText(); } e.stopPropagation(); });
  let rt; const onResize = () => { clearTimeout(rt); rt = setTimeout(() => { if (Ed.nb) resizeStage(false); }, 120); };
  window.addEventListener('resize', onResize); window.addEventListener('orientationchange', onResize);
  if (window.visualViewport) visualViewport.addEventListener('resize', () => { if (Ed.editing) positionTextEditor(); });
  document.addEventListener('keydown', e => {
    if (!Ed.nb || e.target.closest && e.target.closest('input,textarea,select')) return;
    const mod = e.metaKey || e.ctrlKey;
    if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
    else if (mod && e.key.toLowerCase() === 'c' && Ed.sel) { copySel(); toast('Copiado'); }
    else if (mod && e.key.toLowerCase() === 'v' && Ed.clip) { e.preventDefault(); if (prefs.tool !== 'lasso') { prefs.tool = 'lasso'; buildToolbar(); } pasteClip(); }
    else if ((e.key === 'Delete' || e.key === 'Backspace') && Ed.sel) { e.preventDefault(); deleteSel(); }

  });

  window.__MA = { Ed, Store, Saver, curPage, pageOrder, get prefs() { return prefs; }, setTool: t => { prefs.tool = t; buildToolbar(); }, goPage, undo, redo, exportPDF, addPageAfter };
  window.__ready = true;
}
